name: Auto Scan & Telegram Alert

# Runs the scanner on fresh daily data and pushes a market summary + any ENTER
# setups to Telegram — fully hands-off. Daily timeframe is used because it has
# the strongest net-of-fees edge (~+0.20R/trade) and is low-noise.
#
# Setup (one time):
#   Repo Settings -> Secrets and variables -> Actions -> add:
#     TELEGRAM_BOT_TOKEN   (from @BotFather)
#     TELEGRAM_CHAT_ID     (your chat id)
#   Without the secrets the job still runs and logs the message (dry-run).
#
# Update your portfolio value any time by messaging the bot:  /port 150
# Verify the connection: Run workflow with test_notify = true.
# Preview an ENTER alert: Run workflow with sample_signal = true.

on:
  workflow_dispatch:
    inputs:
      htf:
        description: "Higher timeframe resample rule"
        default: "W"
      test_notify:
        description: "Send a test message to confirm Telegram works"
        default: "false"
      sample_signal:
        description: "Send a SAMPLE ENTER signal (preview, not a real signal)"
        default: "false"
  schedule:
    - cron: '0 1 * * *'    # daily 01:00 UTC (08:00 Thailand), after the daily close

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/crypto-signal-system-kcf8vq
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy pyyaml rich yfinance feedparser matplotlib

      - name: Send Telegram test message
        if: ${{ github.event.inputs.test_notify == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'EOF'
          import yaml
          from src.signal.notifier import TelegramNotifier
          tg = TelegramNotifier(yaml.safe_load(open('config/config.yaml')))
          ok = tg.send("✅ Crypto signal bot connected — alerts are live. (test)")
          print("configured & sent" if ok else "DRY-RUN: secrets not set (or send failed)")
          EOF

      - name: Send sample ENTER signal
        if: ${{ github.event.inputs.sample_signal == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python examples/sample_alert.py

      - name: Sync portfolio value from Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python examples/update_account.py

      - name: Fetch fresh daily data
        run: |
          python - <<'EOF'
          import pathlib
          import yfinance as yf
          import pandas as pd

          out = pathlib.Path('data/real/crypto'); out.mkdir(parents=True, exist_ok=True)
          uni = pathlib.Path('data/crypto_universe.txt')
          tickers = [t.strip() for t in uni.read_text().splitlines() if t.strip()] \
              if uni.exists() else ['BTC-USD','ETH-USD','SOL-USD','XRP-USD','BNB-USD']
          for t in tickers:
              try:
                  df = yf.download(t, start='2018-01-01', interval='1d',
                                   auto_adjust=False, progress=False)
                  if isinstance(df.columns, pd.MultiIndex):
                      df.columns = df.columns.get_level_values(0)
                  df = df[['Open','High','Low','Close','Volume']].dropna()
                  if len(df) >= 250:
                      df.to_csv(out / f"{t.replace('-USD','USDT')}.csv")
                      print(f"  {t}: {len(df)} rows")
              except Exception as e:
                  print(f"  {t}: SKIP ({e})")
          EOF

      - name: Scan, summary and alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HTF: ${{ github.event.inputs.htf || 'W' }}
        run: |
          python signal_scan.py --csv-dir data/real/crypto --htf "$HTF" \
            --portfolio --summary --notify --charts --top 10

      - name: Persist portfolio value
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add data/account.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update portfolio value from Telegram"
            git push origin HEAD:claude/crypto-signal-system-kcf8vq
          else
            echo "No account change to persist."
          fi
