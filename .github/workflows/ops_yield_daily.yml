name: ops-yield-daily

# Builds the production-yield workbook from the LINE messages that collector.gs
# logs into the spreadsheet's "Messages" tab, then publishes every sheet
# (Daily/Weekly Yield, Issue Log, …) back to the same Google Sheet — preserving
# the Action/Status the team typed in the Issue Log.
#
# NOTE: schedule + workflow_dispatch only fire when this file is on the repo's
# DEFAULT branch. Code is checked out from the feature branch via `ref` below.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICE_ACCOUNT_JSON — full contents of the service-account JSON key
#                                 (the sheet must be Shared with that account as Editor)
#   OPS_YIELD_GSHEET_URL        — the Google Sheet URL (Messages tab in, dashboards out)

on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC = 20:00 Thailand (end of day)
  workflow_dispatch:
    inputs:
      ref:
        description: branch holding the ops_yield code
        default: claude/line-group-chat-patterns-xclbtr

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'claude/line-group-chat-patterns-xclbtr' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet openpyxl gspread

      - name: Write service-account key
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Build workbook and publish to Google Sheets
        env:
          OPS_YIELD_GSHEET_URL: ${{ secrets.OPS_YIELD_GSHEET_URL }}
        run: |
          python ops_yield_cli.py \
            --gsheet-source \
            --gsheet-url "$OPS_YIELD_GSHEET_URL" \
            --gsheet-creds service_account.json \
            --out yield.xlsx

      - name: Keep service-account key out of any artifact
        if: always()
        run: rm -f service_account.json

      - uses: actions/upload-artifact@v4
        with:
          name: yield-workbook
          path: yield.xlsx
          if-no-files-found: warn
