# TPAT1 วิชาเฉพาะ กสพท — เชาวน์ปัญญา / จริยธรรมแพทย์ / ความคิดเชื่อมโยง
#
# หมายเหตุ: ข้อจริยธรรมของ กสพท มักไม่มีคำตอบ "ถูก 100%" แบบวิชาคำนวณ
# แต่วัดว่าเลือกการกระทำที่สอดคล้องกับหลักจริยธรรมทางการแพทย์มากที่สุดหรือไม่
# คำอธิบายจึงบอกด้วยว่ายึดหลักข้อใด
subject: tpat1
questions:
  - qid: tpat1_series_001
    topic: tpat1_series
    stem: "อนุกรม 2, 6, 12, 20, 30, ? จำนวนถัดไปคือข้อใด"
    choices:
      - "42"
      - "40"
      - "38"
      - "44"
    answer: 0
    explanation: "ผลต่างคือ 4, 6, 8, 10 เพิ่มทีละ 2 ผลต่างถัดไปคือ 12 ดังนั้น 30 + 12 = 42 (อีกมุมคือ n(n+1): 1·2, 2·3, 3·4, ... , 6·7 = 42)"
    difficulty: 2

  - qid: tpat1_series_002
    topic: tpat1_series
    stem: "อนุกรม 1, 1, 2, 3, 5, 8, ? จำนวนถัดไปคือข้อใด"
    choices:
      - "11"
      - "13"
      - "12"
      - "16"
    answer: 1
    explanation: "ลำดับฟีโบนักชี — แต่ละพจน์คือผลบวกของสองพจน์ก่อนหน้า 5 + 8 = 13"
    difficulty: 1

  - qid: tpat1_series_003
    topic: tpat1_series
    stem: "อนุกรมตัวอักษร A, C, F, J, ? ตัวถัดไปคือข้อใด"
    choices:
      - "M"
      - "N"
      - "O"
      - "P"
    answer: 2
    explanation: "ระยะห่างคือ +2, +3, +4 ถัดไปคือ +5 นับจาก J (ตัวที่ 10) ไป 5 ได้ตัวที่ 15 คือ O"
    difficulty: 2

  - qid: tpat1_logic_001
    topic: tpat1_logic
    stem: "กำหนดให้ 'นักเรียนทุกคนในห้องนี้สอบผ่าน' และ 'สมชายสอบไม่ผ่าน' ข้อสรุปใดถูกต้องแน่นอน"
    choices:
      - "สมชายเป็นนักเรียนในห้องนี้"
      - "สรุปไม่ได้จากข้อมูลที่ให้"
      - "สมชายอาจเป็นนักเรียนในห้องนี้ก็ได้"
      - "สมชายไม่ได้เป็นนักเรียนในห้องนี้"
    answer: 3
    explanation: "แบบ modus tollens: ถ้าอยู่ในห้องนี้ → สอบผ่าน เมื่อสมชายไม่ผ่าน จึงสรุปได้แน่นอนว่าเขาไม่อยู่ในห้องนี้"
    difficulty: 2

  - qid: tpat1_logic_002
    topic: tpat1_logic
    stem: "A สูงกว่า B, C เตี้ยกว่า B, D สูงกว่า A ใครเตี้ยที่สุด"
    choices:
      - "C"
      - "B"
      - "A"
      - "D"
    answer: 0
    explanation: "เรียงได้ D > A > B > C ดังนั้น C เตี้ยที่สุด"
    difficulty: 1

  - qid: tpat1_quant_001
    topic: tpat1_quant
    stem: "สินค้าราคา 800 บาท ลด 25% แล้วลดเพิ่มอีก 20% จากราคาที่ลดแล้ว ราคาสุดท้ายเท่าใด"
    choices:
      - "440 บาท"
      - "480 บาท"
      - "460 บาท"
      - "560 บาท"
    answer: 1
    explanation: "800 × 0.75 = 600 แล้ว 600 × 0.80 = 480 บาท (ไม่ใช่ลดรวม 45% ซึ่งจะได้ 440 — เป็นกับดักที่ออกบ่อย)"
    difficulty: 2

  - qid: tpat1_ethics_p_001
    topic: tpat1_ethics_principle
    stem: "การที่แพทย์อธิบายทางเลือกการรักษาให้ครบถ้วนแล้วให้ผู้ป่วยตัดสินใจเอง สอดคล้องกับหลักจริยธรรมข้อใดมากที่สุด"
    choices:
      - "การไม่ทำอันตราย (non-maleficence)"
      - "การทำสิ่งที่เป็นประโยชน์ต่อผู้ป่วย (beneficence)"
      - "การเคารพในสิทธิการตัดสินใจของผู้ป่วย (autonomy)"
      - "ความยุติธรรม (justice)"
    answer: 2
    explanation: "หลักจริยธรรมทางการแพทย์ 4 ข้อ การให้ข้อมูลครบแล้วให้ผู้ป่วยเลือกเองคือแก่นของ autonomy และเป็นที่มาของ informed consent"
    difficulty: 1

  - qid: tpat1_ethics_p_002
    topic: tpat1_ethics_principle
    stem: "โรงพยาบาลมีเตียง ICU ว่าง 1 เตียง แต่มีผู้ป่วยหนัก 3 ราย การจัดสรรโดยพิจารณาจากโอกาสรอดและความจำเป็นทางการแพทย์ ยึดหลักข้อใดเป็นหลัก"
    choices:
      - "autonomy"
      - "beneficence"
      - "non-maleficence"
      - "justice"
    answer: 3
    explanation: "การกระจายทรัพยากรที่มีจำกัดอย่างเป็นธรรมด้วยเกณฑ์ที่ชอบธรรม คือหลัก justice (distributive justice)"
    difficulty: 2

  - qid: tpat1_ethics_c_001
    topic: tpat1_ethics_case
    stem: "ผู้ป่วยผู้ใหญ่ที่มีสติสัมปชัญญะสมบูรณ์ ปฏิเสธการผ่าตัดที่แพทย์เห็นว่าจำเป็น หลังได้รับข้อมูลครบถ้วนแล้ว แพทย์ควรทำอย่างไร"
    choices: ["เคารพการตัดสินใจ บันทึกไว้ อธิบายผลที่ตามมา และเสนอทางเลือกอื่นที่ผู้ป่วยรับได้", "ให้ญาติสายตรงเซ็นยินยอมแทนแล้วผ่าตัด เพราะญาติย่อมต้องการสิ่งที่ดีที่สุด", "ผ่าตัดทันทีเพราะเป็นประโยชน์สูงสุดต่อผู้ป่วย และแพทย์เป็นผู้รู้ข้อมูลดีที่สุด", "ปฏิเสธการดูแลผู้ป่วยรายนี้ต่อ แล้วส่งต่อให้แพทย์ท่านอื่นเป็นผู้รับผิดชอบแทน"]
    answer: 0
    explanation: "ผู้ป่วยที่มีความสามารถในการตัดสินใจมีสิทธิปฏิเสธการรักษา แพทย์ต้องเคารพ (autonomy) แต่ยังคงหน้าที่ดูแลต่อและให้ข้อมูลผลที่ตามมา — การผ่าตัดโดยไม่ยินยอมถือเป็นการทำร้ายร่างกาย"
    difficulty: 2

  - qid: tpat1_ethics_c_002
    topic: tpat1_ethics_case
    stem: "นักเรียนแพทย์พบว่าเพื่อนร่วมชั้นลอกข้อสอบ ข้อใดเป็นการกระทำที่เหมาะสมที่สุด"
    choices: ["เพิกเฉย เพราะการรายงานเพื่อนร่วมชั้นอาจทำลายความไว้ใจกันในรุ่นโดยไม่จำเป็น", "พูดคุยกับเพื่อนโดยตรง และถ้าไม่แก้ไขจึงแจ้งอาจารย์ตามช่องทางที่เหมาะสม", "บอกเพื่อนคนอื่นให้รับรู้ทั่วกัน เพื่อใช้แรงกดดันทางสังคมให้เจ้าตัวหยุดเอง", "แจ้งความดำเนินคดีทันที เพราะการทุจริตในการสอบเป็นความผิดที่ต้องใช้กฎหมายจัดการ"]
    answer: 1
    explanation: "วิชาชีพแพทย์ต้องการความซื่อสัตย์เพราะเกี่ยวข้องกับชีวิตคน การนิ่งเฉยจึงไม่เหมาะสม แต่ควรเริ่มจากวิธีที่ให้โอกาสแก้ไขก่อน แล้วจึงยกระดับตามลำดับขั้น"
    difficulty: 3

  - qid: tpat1_connect_001
    topic: tpat1_connect_drill
    stem: "จากข้อความ 'การนอนดึกทำให้ภูมิคุ้มกันลดลง ส่งผลให้ติดเชื้อง่ายขึ้น และการติดเชื้อบ่อยทำให้ผลการเรียนตกต่ำ' ข้อใดคือความสัมพันธ์ที่ถูกต้อง"
    choices:
      - "ผลการเรียนตกต่ำเป็นสาเหตุของการนอนดึก"
      - "ภูมิคุ้มกันลดลงเป็นผลมาจากการติดเชื้อ"
      - "การนอนดึกเป็นสาเหตุทางอ้อมของผลการเรียนตกต่ำ"
      - "การติดเชื้อง่ายเป็นสาเหตุของการนอนดึก"
    answer: 2
    explanation: "โซ่เหตุผลคือ นอนดึก → ภูมิคุ้มกันลด → ติดเชื้อง่าย → ผลการเรียนตก การนอนดึกจึงเป็นสาเหตุทางอ้อมของข้อสุดท้าย ตัวเลือกอื่นกลับทิศทางเหตุ-ผลทั้งหมด"
    difficulty: 2

  - qid: tpat1_spatial_001
    topic: tpat1_spatial
    stem: "ลูกบาศก์ทึบขนาด 3×3×3 ถูกทาสีทั้ง 6 หน้า แล้วตัดเป็นลูกบาศก์ย่อยขนาด 1×1×1 จะมีลูกบาศก์ย่อยที่ไม่มีสีเลยกี่ก้อน"
    choices:
      - "0 ก้อน"
      - "8 ก้อน"
      - "6 ก้อน"
      - "1 ก้อน"
    answer: 3
    explanation: "ก้อนที่ไม่โดนสีคือก้อนที่อยู่ใจกลาง ไม่ติดผิวนอกเลย = (3−2)³ = 1 ก้อน"
    difficulty: 2

  - qid: tpat1_analogy_001
    topic: tpat1_analogy
    stem: "แพทย์ : โรงพยาบาล เปรียบได้กับ ครู : ?"
    choices:
      - "โรงเรียน"
      - "นักเรียน"
      - "หนังสือ"
      - "การสอน"
    answer: 0
    explanation: "ความสัมพันธ์คือ 'อาชีพ : สถานที่ทำงาน' แพทย์ทำงานที่โรงพยาบาล ครูจึงคู่กับโรงเรียน ส่วนนักเรียนคือผู้รับบริการ (คู่กับผู้ป่วย)"
    difficulty: 1

  - qid: tpat1_analogy_002
    topic: tpat1_analogy
    stem: "หู : ได้ยิน เปรียบได้กับ ลิ้น : ?"
    choices:
      - "พูด"
      - "รับรส"
      - "อาหาร"
      - "ปาก"
    answer: 1
    explanation: "ความสัมพันธ์คือ 'อวัยวะรับสัมผัส : ประสาทสัมผัสที่ทำหน้าที่' หูใช้ได้ยิน ลิ้นใช้รับรส — 'พูด' เป็นหน้าที่รอง ไม่ใช่การรับสัมผัส"
    difficulty: 2

  - qid: tpat1_ethics_prof_001
    topic: tpat1_ethics_prof
    stem: "แพทย์นำประวัติการรักษาของผู้ป่วยไปเล่าให้เพื่อนที่ไม่เกี่ยวข้องฟัง ถือว่าละเมิดหลักใด"
    choices:
      - "การขอความยินยอมก่อนรักษา"
      - "การกระจายทรัพยากรอย่างเป็นธรรม"
      - "การรักษาความลับของผู้ป่วย"
      - "การไม่เลือกปฏิบัติ"
    answer: 2
    explanation: "ความลับของผู้ป่วยเป็นหน้าที่ตามจรรยาบรรณและกฎหมาย เปิดเผยได้เฉพาะเมื่อผู้ป่วยยินยอม หรือมีเหตุตามกฎหมายบังคับเท่านั้น"
    difficulty: 1

  - qid: tpat1_connect_basic_001
    topic: tpat1_connect_basic
    stem: "ในข้อสอบความคิดเชื่อมโยง เมื่ออ่านพบว่า 'A ทำให้ B เพิ่มขึ้น และ B ทำให้ C ลดลง' ข้อใดสรุปได้"
    choices:
      - "A ทำให้ C เพิ่มขึ้น"
      - "A และ C ไม่มีความสัมพันธ์กัน"
      - "C ทำให้ A ลดลง"
      - "A ส่งผลทางอ้อมให้ C ลดลง"
    answer: 3
    explanation: "ไล่โซ่ตามทิศทาง: A → B (เพิ่ม) → C (ลด) ดังนั้น A ส่งผลทางอ้อมให้ C ลดลง หัวใจของข้อสอบส่วนนี้คือจับทิศทางของลูกศรให้ถูก ไม่ใช่จำเนื้อหา"
    difficulty: 2
