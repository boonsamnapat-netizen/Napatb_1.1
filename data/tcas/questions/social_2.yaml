questions:
  # ───────────────────────── ศาสนา
  - qid: soc_religion_002
    topic: soc_religion
    stem: "อริยสัจ 4 ประกอบด้วยอะไรบ้าง ตามลำดับ"
    choices:
      - "ทุกข์ สมุทัย นิโรธ มรรค"
      - "ทุกข์ นิโรธ สมุทัย มรรค"
      - "มรรค ทุกข์ สมุทัย นิโรธ"
      - "สมุทัย ทุกข์ มรรค นิโรธ"
    answer: 0
    explanation: "ลำดับคือ ทุกข์ (ปัญหา) สมุทัย (เหตุแห่งทุกข์) นิโรธ (ความดับทุกข์) และมรรค (ทางปฏิบัติให้ถึงความดับทุกข์)"
    difficulty: 1

  - qid: soc_religion_003
    topic: soc_religion
    stem: "หลักไตรลักษณ์ในพระพุทธศาสนาหมายถึงข้อใด"
    choices:
      - "ศีล สมาธิ ปัญญา"
      - "อนิจจัง ทุกขัง อนัตตา"
      - "ทาน ศีล ภาวนา"
      - "โลภ โกรธ หลง"
    answer: 1
    explanation: "ไตรลักษณ์คือลักษณะสามประการของสรรพสิ่ง ได้แก่ ความไม่เที่ยง ความเป็นทุกข์ และความไม่มีตัวตนที่แท้จริง"
    difficulty: 1

  - qid: soc_religion_004
    topic: soc_religion
    stem: "หลักการสำคัญของศาสนาอิสลามที่เรียกว่า 'หลักศรัทธา' ข้อแรกคืออะไร"
    choices:
      - "การถือศีลอด"
      - "การละหมาดวันละห้าเวลา"
      - "ศรัทธาต่อพระผู้เป็นเจ้าองค์เดียว"
      - "การบริจาคซะกาต"
    answer: 2
    explanation: "การศรัทธาในเอกภาพของอัลลอฮ์เป็นรากฐานของหลักศรัทธา ส่วนการละหมาดและถือศีลอดเป็นหลักปฏิบัติซึ่งเป็นคนละหมวด"
    difficulty: 2

  - qid: soc_religion_005
    topic: soc_religion
    stem: "จริยธรรมกับกฎหมายต่างกันอย่างไร"
    choices:
      - "เหมือนกันทุกประการ"
      - "จริยธรรมบังคับใช้โดยศาล"
      - "กฎหมายไม่เกี่ยวกับความถูกผิด"
      - "จริยธรรมเป็นมาตรฐานทางความประพฤติที่ไม่มีบทลงโทษทางกฎหมายบังคับ"
    answer: 3
    explanation: "กฎหมายมีสภาพบังคับจากรัฐ ส่วนจริยธรรมอาศัยมโนธรรมและแรงกดดันทางสังคม สิ่งที่ผิดจริยธรรมอาจไม่ผิดกฎหมาย และในทางกลับกันก็มี"
    difficulty: 2

  - qid: soc_religion_006
    topic: soc_religion
    stem: "หลักพรหมวิหาร 4 ประกอบด้วยข้อใด"
    choices:
      - "เมตตา กรุณา มุทิตา อุเบกขา"
      - "ทาน ศีล ภาวนา ปัญญา"
      - "สติ สมาธิ ปัญญา วิริยะ"
      - "ขันติ โสรัจจะ สัจจะ ทมะ"
    answer: 0
    explanation: "พรหมวิหาร 4 คือธรรมประจำใจของผู้ใหญ่ ได้แก่ ความรักปรารถนาดี ความสงสาร ความยินดีเมื่อผู้อื่นได้ดี และการวางใจเป็นกลาง"
    difficulty: 1

  # ───────────────────────── หน้าที่พลเมือง
  - qid: soc_civic_002
    topic: soc_civic
    stem: "อำนาจอธิปไตยตามระบอบประชาธิปไตยแบ่งออกเป็นกี่ฝ่าย อะไรบ้าง"
    choices:
      - "2 ฝ่าย คือ นิติบัญญัติและบริหาร"
      - "3 ฝ่าย คือ นิติบัญญัติ บริหาร และตุลาการ"
      - "4 ฝ่าย รวมสื่อมวลชนด้วย"
      - "1 ฝ่าย คือรัฐบาล"
    answer: 1
    explanation: "หลักการแบ่งแยกอำนาจให้ทั้งสามฝ่ายถ่วงดุลและตรวจสอบซึ่งกันและกัน เพื่อไม่ให้อำนาจกระจุกอยู่ที่คนกลุ่มเดียว"
    difficulty: 1

  - qid: soc_civic_003
    topic: soc_civic
    stem: "การปกครองระบอบประชาธิปไตยอันมีพระมหากษัตริย์ทรงเป็นประมุขมีลักษณะใด"
    choices:
      - "พระมหากษัตริย์ทรงใช้อำนาจบริหารโดยตรง"
      - "ไม่มีรัฐธรรมนูญ"
      - "พระมหากษัตริย์ทรงเป็นประมุขของรัฐ โดยทรงใช้อำนาจผ่านองค์กรตามรัฐธรรมนูญ"
      - "ประชาชนไม่มีสิทธิเลือกตั้ง"
    answer: 2
    explanation: "เป็นระบอบที่พระมหากษัตริย์ทรงอยู่ภายใต้รัฐธรรมนูญ ทรงใช้อำนาจนิติบัญญัติผ่านรัฐสภา อำนาจบริหารผ่านคณะรัฐมนตรี และอำนาจตุลาการผ่านศาล"
    difficulty: 2

  - qid: soc_civic_004
    topic: soc_civic
    stem: "สิทธิมนุษยชนมีลักษณะสำคัญอย่างไร"
    choices:
      - "ได้มาเมื่อบรรลุนิติภาวะ"
      - "มีเฉพาะพลเมืองของประเทศนั้น"
      - "รัฐเป็นผู้มอบให้และเรียกคืนได้"
      - "ติดตัวมาแต่กำเนิด เป็นสากล และโอนให้กันไม่ได้"
    answer: 3
    explanation: "สิทธิมนุษยชนเป็นของทุกคนโดยความเป็นมนุษย์ ไม่ขึ้นกับสัญชาติ เชื้อชาติ หรือการมอบให้จากรัฐ รัฐมีหน้าที่คุ้มครองไม่ใช่ประทานให้"
    difficulty: 2

  - qid: soc_civic_005
    topic: soc_civic
    stem: "วัฒนธรรมประเภทใดที่เรียกว่าวัฒนธรรมทางวัตถุ"
    choices:
      - "เครื่องมือ เครื่องใช้ สถาปัตยกรรม"
      - "ความเชื่อและค่านิยม"
      - "ภาษาและวรรณกรรม"
      - "ประเพณีและพิธีกรรม"
    answer: 0
    explanation: "วัฒนธรรมทางวัตถุคือสิ่งที่จับต้องได้ ส่วนความเชื่อ ภาษา และประเพณีจัดเป็นวัฒนธรรมที่ไม่ใช่วัตถุ"
    difficulty: 1

  - qid: soc_civic_006
    topic: soc_civic
    stem: "การมีส่วนร่วมทางการเมืองของประชาชนในระดับที่ลึกที่สุดคือข้อใด"
    choices:
      - "ติดตามข่าวสารการเมือง"
      - "รวมกลุ่มเสนอนโยบายและตรวจสอบการทำงานของรัฐอย่างต่อเนื่อง"
      - "ไปใช้สิทธิเลือกตั้ง"
      - "พูดคุยเรื่องการเมืองกับเพื่อน"
    answer: 1
    explanation: "การมีส่วนร่วมมีหลายระดับ จากการรับรู้ข้อมูล ไปสู่การออกเสียง จนถึงการรวมกลุ่มผลักดันและตรวจสอบ ซึ่งเป็นระดับที่ใช้พลังพลเมืองมากที่สุด"
    difficulty: 2

  # ───────────────────────── กฎหมาย
  - qid: soc_law_002
    topic: soc_law
    stem: "กฎหมายอาญาต่างจากกฎหมายแพ่งอย่างไร"
    choices:
      - "อาญาเป็นเรื่องระหว่างเอกชน แพ่งเป็นเรื่องของรัฐ"
      - "ทั้งสองมีโทษจำคุกเหมือนกัน"
      - "อาญาคุ้มครองความสงบเรียบร้อยของสังคมและมีโทษ เช่น จำคุก ส่วนแพ่งเป็นข้อพิพาทระหว่างเอกชนและมุ่งชดใช้"
      - "แพ่งร้ายแรงกว่าอาญาเสมอ"
    answer: 2
    explanation: "คดีอาญารัฐเป็นผู้เสียหายในนามสังคม โทษคือปรับ จำคุก ประหารชีวิต ส่วนคดีแพ่งมุ่งเยียวยาความเสียหายด้วยการชดใช้ ไม่มีโทษจำคุก"
    difficulty: 2

  - qid: soc_law_003
    topic: soc_law
    stem: "บุคคลบรรลุนิติภาวะตามประมวลกฎหมายแพ่งและพาณิชย์ของไทยเมื่อใด"
    choices:
      - "เมื่อจบการศึกษาภาคบังคับ"
      - "อายุ 15 ปีบริบูรณ์"
      - "อายุ 18 ปีบริบูรณ์เท่านั้น"
      - "อายุ 20 ปีบริบูรณ์ หรือเมื่อทำการสมรสตามเงื่อนไขที่กฎหมายกำหนด"
    answer: 3
    explanation: "ประมวลกฎหมายแพ่งและพาณิชย์ มาตรา 19 กำหนดอายุ 20 ปีบริบูรณ์ และมาตรา 20 ให้การสมรสตามเงื่อนไขทำให้บรรลุนิติภาวะได้เช่นกัน อย่าสับสนกับอายุ 18 ปีซึ่งเป็นเกณฑ์สิทธิเลือกตั้ง"
    difficulty: 3

  - qid: soc_law_004
    topic: soc_law
    stem: "หลัก 'ไม่มีความผิด ไม่มีโทษ โดยไม่มีกฎหมาย' หมายความว่าอย่างไร"
    choices:
      - "การกระทำจะเป็นความผิดและถูกลงโทษได้ ต้องมีกฎหมายบัญญัติไว้ก่อนแล้วในขณะกระทำ"
      - "ศาลตัดสินได้ตามดุลยพินิจเสมอ"
      - "กฎหมายย้อนหลังลงโทษได้"
      - "ทุกการกระทำที่ไม่ดีถือเป็นความผิดอาญา"
    answer: 0
    explanation: "เป็นหลักประกันเสรีภาพขั้นพื้นฐาน ป้องกันไม่ให้รัฐออกกฎหมายย้อนหลังมาลงโทษการกระทำที่ตอนทำยังไม่ผิด"
    difficulty: 2

  - qid: soc_law_005
    topic: soc_law
    stem: "สิทธิของผู้ต้องหาในคดีอาญาข้อใดถูกต้อง"
    choices:
      - "ต้องพิสูจน์ความบริสุทธิ์ของตนเอง"
      - "ได้รับการสันนิษฐานว่าเป็นผู้บริสุทธิ์จนกว่าจะมีคำพิพากษาถึงที่สุด"
      - "ไม่มีสิทธิพบทนายความ"
      - "ต้องให้การเสมอ"
    answer: 1
    explanation: "หลักสันนิษฐานว่าบริสุทธิ์วางภาระการพิสูจน์ไว้ที่ฝ่ายโจทก์ ผู้ต้องหายังมีสิทธิพบทนายและสิทธิที่จะไม่ให้การอันเป็นผลร้ายแก่ตน"
    difficulty: 2

  # ───────────────────────── เศรษฐศาสตร์
  - qid: soc_econ_003
    topic: soc_econ
    stem: "ค่าเสียโอกาส (opportunity cost) หมายถึงอะไร"
    choices:
      - "ต้นทุนที่จ่ายเป็นเงินสด"
      - "กำไรที่ได้รับ"
      - "มูลค่าของทางเลือกที่ดีที่สุดที่ต้องสละไปเมื่อเลือกอีกทางหนึ่ง"
      - "ค่าใช้จ่ายคงที่"
    answer: 2
    explanation: "เมื่อทรัพยากรมีจำกัด การเลือกอย่างหนึ่งย่อมหมายถึงการสละอีกอย่าง ค่าเสียโอกาสจึงเป็นแนวคิดแกนกลางของเศรษฐศาสตร์"
    difficulty: 2

  - qid: soc_econ_004
    topic: soc_econ
    stem: "เมื่อราคาสินค้าสูงขึ้น ปริมาณเสนอซื้อและปริมาณเสนอขายจะเปลี่ยนอย่างไร"
    choices:
      - "เสนอซื้อเพิ่ม เสนอขายลด"
      - "ทั้งคู่ลด"
      - "ทั้งคู่เพิ่ม"
      - "เสนอซื้อลด เสนอขายเพิ่ม"
    answer: 3
    explanation: "กฎอุปสงค์ระบุว่าราคาสูงขึ้นคนซื้อน้อยลง ส่วนกฎอุปทานระบุว่าราคาสูงขึ้นผู้ผลิตอยากขายมากขึ้น จุดที่ทั้งสองเท่ากันคือดุลยภาพ"
    difficulty: 1

  - qid: soc_econ_005
    topic: soc_econ
    stem: "ภาวะเงินเฟ้อส่งผลอย่างไรต่อผู้มีรายได้ประจำ"
    choices:
      - "อำนาจซื้อลดลง เพราะเงินจำนวนเท่าเดิมซื้อของได้น้อยลง"
      - "อำนาจซื้อเพิ่มขึ้น"
      - "ไม่มีผลกระทบ"
      - "ทำให้เงินออมมีค่ามากขึ้น"
    answer: 0
    explanation: "เงินเฟ้อคือระดับราคาทั่วไปสูงขึ้น เงินเดือนที่คงที่จึงซื้อของได้น้อยลง และผู้ถือเงินสดหรือเงินออมดอกเบี้ยต่ำเสียเปรียบที่สุด"
    difficulty: 2

  - qid: soc_econ_006
    topic: soc_econ
    stem: "GDP วัดอะไร"
    choices:
      - "รายได้เฉลี่ยของประชากร"
      - "มูลค่าสินค้าและบริการขั้นสุดท้ายที่ผลิตได้ภายในประเทศในช่วงเวลาหนึ่ง"
      - "ปริมาณเงินในระบบ"
      - "ความสุขของประชาชน"
    answer: 1
    explanation: "GDP นับเฉพาะสินค้าขั้นสุดท้ายเพื่อเลี่ยงการนับซ้ำ และวัดตามพื้นที่ประเทศไม่ว่าผู้ผลิตจะสัญชาติใด ต่างจาก GNP ที่วัดตามสัญชาติ"
    difficulty: 2

