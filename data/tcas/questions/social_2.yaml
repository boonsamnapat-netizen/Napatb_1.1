  - qid: soc_history_th_002
    topic: soc_history_th
    stem: "การเปลี่ยนแปลงการปกครองของไทยจากระบอบสมบูรณาญาสิทธิราชย์เป็นประชาธิปไตยเกิดขึ้นในปีใด"
    choices: ["พ.ศ. 2411", "พ.ศ. 2489", "พ.ศ. 2475", "พ.ศ. 2500"]
    answer: 2
