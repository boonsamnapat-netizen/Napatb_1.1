# ชุดที่ 3 — ข้อสอบจริง A-Level 81 ภาษาไทย 50 ข้อ ปรนัย 5 ตัวเลือก
# คลังเดิม 41 ข้อ ชุดนี้เติมอีก 18 เน้นการอ่านจับใจความซึ่งเป็นด้านที่ออกมากที่สุด
#
# หมายเหตุ: ข้อในไฟล์นี้ใช้ 4 ตัวเลือกตามรูปแบบเดิมของคลัง
# (ข้อสอบจริงเป็น 5 ตัวเลือก — ถ้าจะปรับทั้งคลังให้ตรงต้องแก้ทุกไฟล์พร้อมกัน)
subject: thai
questions:

  # ── การอ่านจับใจความ ─────────────────────────────────────────
  - qid: thai_reading_101
    topic: thai_reading
    stem: "\"ความรู้ที่ท่องจำมาโดยไม่เข้าใจ เปรียบเหมือนเงินที่ยืมเขามา ใช้ได้ชั่วคราวแต่ไม่เคยเป็นของเราจริง\" ข้อความนี้มีจุดมุ่งหมายสำคัญที่สุดตามข้อใด"
    choices:
    - ชี้ให้เห็นว่าการท่องจำโดยไม่เข้าใจนั้นไม่ยั่งยืน
    - ตำหนิผู้ที่ชอบยืมเงินผู้อื่น
    - เปรียบเทียบความรู้กับทรัพย์สิน
    - แนะนำวิธีเก็บออมเงิน
    answer: 0
    explanation: "ข้อความใช้การเปรียบเทียบเงินยืมเป็นเครื่องมือ ไม่ใช่สาระ สาระคือความรู้แบบท่องจำไม่ติดตัวถาวร 'เปรียบเทียบความรู้กับทรัพย์สิน' บอกแค่ 'วิธีการ' ที่ผู้เขียนใช้ ไม่ใช่จุดมุ่งหมาย"
    difficulty: 2

  - qid: thai_reading_102
    topic: thai_reading
    stem: "\"แม้ผลการทดลองจะยังไม่ชัดเจน แต่แนวทางนี้ก็ยังน่าจับตามองอยู่มาก\" ผู้เขียนมีท่าทีอย่างไรต่อแนวทางดังกล่าว"
    choices:
    - ปฏิเสธอย่างสิ้นเชิง
    - ไม่แสดงความเห็นใด ๆ
    - เชื่อมั่นเต็มที่
    - สงวนท่าทีแต่เห็นว่ามีความหวัง
    answer: 3
    explanation: "คำว่า 'แม้...แต่' แสดงการยอมรับข้อจำกัดก่อนแล้วจึงให้น้ำหนักด้านบวก จึงเป็นการสงวนท่าทีแต่ยังเห็นแง่ดี ไม่ใช่การเชื่อมั่นเต็มที่หรือปฏิเสธ"
    difficulty: 2

  - qid: thai_reading_103
    topic: thai_reading
    stem: "\"เมืองนี้เติบโตเร็วจนระบบระบายน้ำตามไม่ทัน ฝนตกหนักครั้งใดจึงท่วมทุกครั้ง\" ข้อใดคือความสัมพันธ์ของข้อความนี้"
    choices:
    - การให้คำนิยาม
    - เปรียบเทียบข้อดีข้อเสีย
    - เหตุและผล
    - ลำดับเหตุการณ์ตามเวลา
    answer: 2
    explanation: "ประโยคแรกเป็นเหตุ (เมืองโตเร็วเกินระบบระบายน้ำ) ประโยคหลังเป็นผล (ฝนตกแล้วท่วม) โดยมีคำว่า 'จึง' เป็นตัวชี้ความสัมพันธ์"
    difficulty: 1

  - qid: thai_reading_104
    topic: thai_reading
    stem: "\"งานวิจัยชิ้นนี้ดีพอสมควร\" ข้อความนี้แฝงนัยใด"
    choices:
    - ตำหนิอย่างรุนแรง
    - ชมเชยแบบมีข้อสงวน
    - ยกย่องอย่างสูง
    - ไม่มีนัยใด ๆ
    answer: 1
    explanation: "คำว่า 'พอสมควร' จำกัดระดับคำชมให้อยู่แค่ระดับกลาง เป็นการชมแบบกั๊ก ไม่ใช่การยกย่องเต็มที่และไม่ถึงขั้นตำหนิ"
    difficulty: 2

  - qid: thai_reading_105
    topic: thai_reading
    stem: "\"ผู้ที่อ่านหนังสือมากย่อมมีคลังคำมาก ผู้มีคลังคำมากย่อมเขียนได้ดี ดังนั้นผู้ที่อ่านมากย่อมเขียนได้ดี\" การให้เหตุผลข้างต้นเป็นแบบใด"
    choices:
    - การอ้างผู้เชี่ยวชาญ
    - นิรนัยแบบโยงต่อเนื่อง
    - อุปมาอุปไมย
    - อุปนัยจากตัวอย่าง
    answer: 1
    explanation: "เป็นการโยงข้อความทั่วไปสองข้อเข้าด้วยกันแล้วสรุป (ก→ข, ข→ค จึง ก→ค) เป็นการให้เหตุผลแบบนิรนัย ไม่ได้ยกตัวอย่างเฉพาะรายมาสรุปทั่วไปแบบอุปนัย"
    difficulty: 3

  # ── หลักภาษา ─────────────────────────────────────────────────
  - qid: thai_grammar_101
    topic: thai_grammar
    stem: "ข้อใดใช้ลักษณนามถูกต้องทุกคำ"
    choices:
    - ช้างบ้าน 3 เชือก · พระสงฆ์ 2 รูป · เรือ 1 ลำ
    - ช้างบ้าน 3 ตัว · พระสงฆ์ 2 คน · เรือ 1 ลำ
    - ช้างบ้าน 3 เชือก · พระสงฆ์ 2 คน · เรือ 1 ตัว
    - ช้างบ้าน 3 ตัว · พระสงฆ์ 2 รูป · เรือ 1 อัน
    answer: 0
    explanation: "ช้างบ้านใช้ 'เชือก' (ช้างป่าใช้ 'ตัว' ช้างขึ้นระวางใช้ 'ช้าง' — โจทย์จึงต้องระบุว่าช้างบ้าน) พระสงฆ์ใช้ 'รูป' หรือ 'องค์' ก็ได้ แต่ไม่ใช่ 'คน' และเรือใช้ 'ลำ' ไม่ใช่ 'ตัว' หรือ 'อัน'"
    difficulty: 2

  - qid: thai_grammar_102
    topic: thai_grammar
    stem: "ข้อใดเป็นประโยคความซ้อน"
    choices:
    - เขาอ่านหนังสือที่ครูแนะนำ
    - ฝนตกและลมแรง
    - ฉันชอบสีฟ้า แต่เขาชอบสีแดง
    - เธอเดินไปโรงเรียน
    answer: 0
    explanation: "ประโยคความซ้อนมีประโยคย่อยทำหน้าที่เป็นส่วนขยาย — 'ที่ครูแนะนำ' ขยาย 'หนังสือ' ส่วน 'ฝนตกและลมแรง' กับ 'ฉันชอบสีฟ้า แต่เขาชอบสีแดง' เป็นประโยคความรวม (เชื่อมด้วย และ/แต่) และ 'เธอเดินไปโรงเรียน' เป็นประโยคความเดียว"
    difficulty: 2

  - qid: thai_grammar_103
    topic: thai_grammar
    stem: "คำในข้อใดเป็นคำสมาสทั้งหมด"
    choices:
    - คอมพิวเตอร์ · ฟุตบอล
    - โรงเรียน · แม่น้ำ
    - กินข้าว · นอนหลับ
    - ราชการ · วิทยาศาสตร์
    answer: 3
    explanation: "คำสมาสเกิดจากการรวมคำบาลี-สันสกฤตตั้งแต่สองคำขึ้นไป 'ราช+การ' และ 'วิทยา+ศาสตร์' เข้าเกณฑ์ ส่วน 'โรงเรียน · แม่น้ำ' เป็นคำประสมภาษาไทย 'คอมพิวเตอร์ · ฟุตบอล' เป็นคำทับศัพท์ และ 'กินข้าว · นอนหลับ' เป็นกลุ่มคำกริยา"
    difficulty: 2

  # ── การใช้ภาษาให้เหมาะกับระดับภาษา ──────────────────────────
  - qid: thai_usage_101
    topic: thai_usage
    stem: "ข้อใดเหมาะสมที่สุดสำหรับใช้ในหนังสือราชการ"
    choices:
    - เรื่องนี้เคลียร์แล้วจ้า
    - บอกไว้แค่นี้แหละ
    - จึงเรียนมาเพื่อโปรดทราบ
    - ขอแจ้งให้ทราบว่าเรื่องนี้จบแล้วนะครับ
    answer: 2
    explanation: "'จึงเรียนมาเพื่อโปรดทราบ' เป็นรูปแบบภาษาระดับทางการที่ใช้ปิดหนังสือราชการ ส่วนตัวเลือกอื่นใช้ภาษาระดับกันเองหรือกึ่งทางการ"
    difficulty: 1

  - qid: thai_usage_102
    topic: thai_usage
    stem: "ข้อใดใช้คำฟุ่มเฟือย"
    choices:
    - เขาเดินทางกลับบ้าน
    - ฝนตกหนักเมื่อคืน
    - แพทย์ตรวจคนไข้
    - ผลลัพธ์ที่ได้ออกมาเป็นที่น่าพอใจ
    answer: 3
    explanation: "'ผลลัพธ์' มีความหมายว่าสิ่งที่ได้อยู่แล้ว การเติม 'ที่ได้ออกมา' จึงซ้ำความ ควรเขียนว่า 'ผลลัพธ์เป็นที่น่าพอใจ'"
    difficulty: 2

  - qid: thai_usage_103
    topic: thai_usage
    stem: "ข้อใดใช้คำราชาศัพท์ถูกต้อง"
    choices:
    - พระบาทสมเด็จพระเจ้าอยู่หัวทรงเสด็จพระราชดำเนินไปเปิดงาน
    - พระบาทสมเด็จพระเจ้าอยู่หัวเสด็จพระราชดำเนินไปทรงเปิดงาน
    - พระบาทสมเด็จพระเจ้าอยู่หัวไปเปิดงาน
    - พระบาทสมเด็จพระเจ้าอยู่หัวเสด็จไปทรงเปิดงานพระราชดำเนิน
    answer: 1
    explanation: "'เสด็จพระราชดำเนิน' เป็นคำกริยาสำเร็จรูปแปลว่าเดินทางไป ไม่ต้องเติม 'ทรง' นำหน้าอีก (ข้อที่เขียน 'ทรงเสด็จพระราชดำเนิน' ผิดเพราะซ้อน 'ทรง') และ 'พระราชดำเนิน' ต้องอยู่ติดกับ 'เสด็จ' ไม่ใช่ท้ายประโยค"
    difficulty: 3

  # ── การใช้เหตุผล ─────────────────────────────────────────────
  - qid: thai_reason_101
    topic: thai_reason
    stem: "\"คนที่กินมังสวิรัติมีสุขภาพดี เพราะคนสุขภาพดีส่วนใหญ่กินมังสวิรัติ\" ข้อบกพร่องของการให้เหตุผลนี้คือข้อใด"
    choices:
    - สลับทิศทางของความสัมพันธ์ (เอาบทกลับมาเป็นเหตุผล)
    - อ้างบุคคลผู้มีชื่อเสียง
    - ใช้ภาษากำกวม
    - ยกตัวอย่างมากเกินไป
    answer: 0
    explanation: "'คนสุขภาพดีส่วนใหญ่กินมังสวิรัติ' เป็นบทกลับของ 'คนกินมังสวิรัติมีสุขภาพดี' ซึ่งเป็นคนละข้อความและไม่ได้ยืนยันกันเอง (เทียบ: หมาส่วนใหญ่มีสี่ขา ไม่ได้แปลว่าสัตว์สี่ขาส่วนใหญ่เป็นหมา) — ไม่ใช่การวนกลับ เพราะการวนกลับต้องเอาข้อความ*เดิม*มาเป็นเหตุผลของตัวเอง"
    difficulty: 3

  - qid: thai_reason_102
    topic: thai_reason
    stem: "\"ถ้าไม่เห็นด้วยกับโครงการนี้ แสดงว่าไม่รักบ้านเมือง\" ข้อความนี้ใช้เหตุผลบกพร่องแบบใด"
    choices:
    - เปรียบเทียบไม่สมเหตุสมผล
    - อ้างความนิยม
    - แบ่งขั้วเพียงสองทางเลือก
    - สรุปเกินข้อมูล
    answer: 2
    explanation: "ข้อความบีบให้เหลือแค่ 'เห็นด้วย' หรือ 'ไม่รักบ้านเมือง' ทั้งที่คนอาจไม่เห็นด้วยด้วยเหตุผลอื่นได้อีกมาก เป็นการแบ่งขั้วเทียม (false dilemma)"
    difficulty: 2

  - qid: thai_reason_103
    topic: thai_reason
    stem: "\"ยาสมุนไพรชนิดนี้ต้องดี เพราะคนใช้กันเป็นล้าน\" ข้อบกพร่องคือข้อใด"
    choices:
    - สับสนเหตุกับผล
    - อ้างความนิยมแทนหลักฐาน
    - อ้างอำนาจ
    - ใช้เหตุผลวนกลับ
    answer: 1
    explanation: "จำนวนผู้ใช้ไม่ได้พิสูจน์ประสิทธิภาพ สิ่งที่คนจำนวนมากเชื่ออาจผิดก็ได้ การอ้างความนิยมจึงไม่ใช่หลักฐานทางวิชาการ"
    difficulty: 1

  # ── การเขียน ─────────────────────────────────────────────────
  - qid: thai_writing_101
    topic: thai_writing
    stem: "ข้อใดเรียงลำดับข้อความได้เหมาะสมที่สุด (1) จึงควรเริ่มจากการนอนให้พอ (2) การอดนอนสะสมส่งผลต่อความจำ (3) นักเรียนหลายคนอ่านหนังสือดึกทุกคืน (4) แต่ผลกลับไม่ดีเท่าที่ควร"
    choices:
    - 2 – 3 – 4 – 1
    - 1 – 3 – 2 – 4
    - 3 – 2 – 1 – 4
    - 3 – 4 – 2 – 1
    answer: 3
    explanation: "เริ่มจากสถานการณ์ (3) → ผลที่ขัดกับความคาดหมาย (4 ขึ้นต้นด้วย 'แต่' จึงต้องตามหลังข้อความบวก) → คำอธิบายสาเหตุ (2) → ข้อเสนอแนะ (1 ขึ้นต้นด้วย 'จึง' จึงต้องอยู่ท้าย)"
    difficulty: 2

  - qid: thai_writing_102
    topic: thai_writing
    stem: "ข้อใดเป็นการเขียนย่อความที่ดีที่สุดของข้อความ \"โรงพยาบาลประกาศงดเยี่ยมผู้ป่วยชั่วคราวตั้งแต่วันจันทร์ เนื่องจากพบการระบาดของไข้หวัดใหญ่ในหอผู้ป่วยสองแห่ง โดยจะประเมินสถานการณ์ใหม่ในอีกสองสัปดาห์\""
    choices:
    - โรงพยาบาลงดเยี่ยมชั่วคราวจากการระบาดของไข้หวัดใหญ่ และจะประเมินใหม่ใน 2 สัปดาห์
    - ห้ามเข้าโรงพยาบาลเด็ดขาด
    - โรงพยาบาลมีคนไข้ไข้หวัดใหญ่เยอะมาก
    - ไข้หวัดใหญ่ระบาดหนักทั่วประเทศ
    answer: 0
    explanation: "ย่อความที่ดีต้องเก็บสาระครบ (มาตรการ เหตุผล ระยะเวลา) โดยไม่เติมสิ่งที่ไม่มีในต้นฉบับ 'ห้ามเข้าโรงพยาบาลเด็ดขาด' กับ 'ไข้หวัดใหญ่ระบาดหนักทั่วประเทศ' ขยายความเกินจริง ส่วน 'มีคนไข้ไข้หวัดใหญ่เยอะมาก' ตกสาระเรื่องมาตรการ"
    difficulty: 2

  # ── โวหารและภาพพจน์ ──────────────────────────────────────────
  - qid: thai_rhetoric_101
    topic: thai_rhetoric
    stem: "\"เสียงไอของคนไข้ดังก้องไปทั้งวอร์ดราวกับฆ้องลั่น\" ข้อความนี้ใช้ภาพพจน์ชนิดใด"
    choices:
    - อุปลักษณ์
    - อุปมา
    - บุคคลวัต
    - อติพจน์
    answer: 1
    explanation: "มีคำว่า 'ราวกับ' เชื่อมสิ่งที่นำมาเปรียบสองสิ่งอย่างชัดเจน จึงเป็นอุปมา ถ้าเป็นอุปลักษณ์จะเปรียบตรง ๆ ว่า 'เสียงไอคือฆ้อง' โดยไม่มีคำเชื่อม"
    difficulty: 2

  # ── วรรณคดี ──────────────────────────────────────────────────
