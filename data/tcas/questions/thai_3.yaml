# ชุดที่ 3 — ข้อสอบจริง A-Level 81 ภาษาไทย 50 ข้อ ปรนัย 5 ตัวเลือก
# คลังเดิม 41 ข้อ ชุดนี้เติมอีก 18 เน้นการอ่านจับใจความซึ่งเป็นด้านที่ออกมากที่สุด
#
# หมายเหตุ: ข้อในไฟล์นี้ใช้ 4 ตัวเลือกตามรูปแบบเดิมของคลัง
# (ข้อสอบจริงเป็น 5 ตัวเลือก — ถ้าจะปรับทั้งคลังให้ตรงต้องแก้ทุกไฟล์พร้อมกัน)
subject: thai
questions:

  # ── การอ่านจับใจความ ─────────────────────────────────────────
  - qid: thai_reading_101
    topic: thai_reading
    stem: "\"ความรู้ที่ท่องจำมาโดยไม่เข้าใจ เปรียบเหมือนเงินที่ยืมเขามา ใช้ได้ชั่วคราวแต่ไม่เคยเป็นของเราจริง\" ข้อความนี้มีจุดมุ่งหมายสำคัญที่สุดตามข้อใด"
    choices: ["ตำหนิผู้ที่ชอบยืมเงินผู้อื่น", "ชี้ให้เห็นว่าการท่องจำโดยไม่เข้าใจนั้นไม่ยั่งยืน", "แนะนำวิธีเก็บออมเงิน", "เปรียบเทียบความรู้กับทรัพย์สิน"]
    answer: 1
    explanation: "ข้อความใช้การเปรียบเทียบเงินยืมเป็นเครื่องมือ ไม่ใช่สาระ สาระคือความรู้แบบท่องจำไม่ติดตัวถาวร ตัวเลือก 4 บอกแค่ 'วิธีการ' ที่ผู้เขียนใช้ ไม่ใช่จุดมุ่งหมาย"
    difficulty: 2

  - qid: thai_reading_102
    topic: thai_reading
    stem: "\"แม้ผลการทดลองจะยังไม่ชัดเจน แต่แนวทางนี้ก็ยังน่าจับตามองอยู่มาก\" ผู้เขียนมีท่าทีอย่างไรต่อแนวทางดังกล่าว"
    choices: ["ปฏิเสธอย่างสิ้นเชิง", "เชื่อมั่นเต็มที่", "สงวนท่าทีแต่เห็นว่ามีความหวัง", "ไม่แสดงความเห็นใด ๆ"]
    answer: 2
    explanation: "คำว่า 'แม้...แต่' แสดงการยอมรับข้อจำกัดก่อนแล้วจึงให้น้ำหนักด้านบวก จึงเป็นการสงวนท่าทีแต่ยังเห็นแง่ดี ไม่ใช่การเชื่อมั่นเต็มที่หรือปฏิเสธ"
    difficulty: 2

  - qid: thai_reading_103
    topic: thai_reading
    stem: "\"เมืองนี้เติบโตเร็วจนระบบระบายน้ำตามไม่ทัน ฝนตกหนักครั้งใดจึงท่วมทุกครั้ง\" ข้อใดคือความสัมพันธ์ของข้อความนี้"
    choices: ["เหตุและผล", "เปรียบเทียบข้อดีข้อเสีย", "ลำดับเหตุการณ์ตามเวลา", "การให้คำนิยาม"]
    answer: 0
    explanation: "ประโยคแรกเป็นเหตุ (เมืองโตเร็วเกินระบบระบายน้ำ) ประโยคหลังเป็นผล (ฝนตกแล้วท่วม) โดยมีคำว่า 'จึง' เป็นตัวชี้ความสัมพันธ์"
    difficulty: 1

  - qid: thai_reading_104
    topic: thai_reading
    stem: "\"งานวิจัยชิ้นนี้ดีพอสมควร\" ข้อความนี้แฝงนัยใด"
    choices: ["ยกย่องอย่างสูง", "ชมเชยแบบมีข้อสงวน", "ตำหนิอย่างรุนแรง", "ไม่มีนัยใด ๆ"]
    answer: 1
    explanation: "คำว่า 'พอสมควร' จำกัดระดับคำชมให้อยู่แค่ระดับกลาง เป็นการชมแบบกั๊ก ไม่ใช่การยกย่องเต็มที่และไม่ถึงขั้นตำหนิ"
    difficulty: 2

  - qid: thai_reading_105
    topic: thai_reading
    stem: "\"ผู้ที่อ่านหนังสือมากย่อมมีคลังคำมาก ผู้มีคลังคำมากย่อมเขียนได้ดี ดังนั้นผู้ที่อ่านมากย่อมเขียนได้ดี\" การให้เหตุผลข้างต้นเป็นแบบใด"
    choices: ["อุปมาอุปไมย", "นิรนัยแบบโยงต่อเนื่อง", "อุปนัยจากตัวอย่าง", "การอ้างผู้เชี่ยวชาญ"]
    answer: 1
    explanation: "เป็นการโยงข้อความทั่วไปสองข้อเข้าด้วยกันแล้วสรุป (ก→ข, ข→ค จึง ก→ค) เป็นการให้เหตุผลแบบนิรนัย ไม่ได้ยกตัวอย่างเฉพาะรายมาสรุปทั่วไปแบบอุปนัย"
    difficulty: 3

  # ── หลักภาษา ─────────────────────────────────────────────────
  - qid: thai_grammar_101
    topic: thai_grammar
    stem: "ข้อใดใช้ลักษณนามถูกต้องทุกคำ"
    choices: ["ช้าง 3 ตัว · พระสงฆ์ 2 รูป · เรือ 1 ลำ", "ช้าง 3 เชือก · พระสงฆ์ 2 รูป · เรือ 1 ลำ", "ช้าง 3 เชือก · พระสงฆ์ 2 คน · เรือ 1 ตัว", "ช้าง 3 ตัว · พระสงฆ์ 2 องค์ · เรือ 1 อัน"]
    answer: 1
    explanation: "ช้างบ้านใช้ 'เชือก' พระสงฆ์ใช้ 'รูป' เรือใช้ 'ลำ' ส่วน 'องค์' ใช้กับพระพุทธรูปหรือเจ้านาย ไม่ใช่พระสงฆ์ทั่วไป"
    difficulty: 2

  - qid: thai_grammar_102
    topic: thai_grammar
    stem: "ข้อใดเป็นประโยคความซ้อน"
    choices: ["ฝนตกและลมแรง", "เขาอ่านหนังสือที่ครูแนะนำ", "เธอเดินไปโรงเรียน", "ฉันชอบสีฟ้า แต่เขาชอบสีแดง"]
    answer: 1
    explanation: "ประโยคความซ้อนมีประโยคย่อยทำหน้าที่เป็นส่วนขยาย — 'ที่ครูแนะนำ' ขยาย 'หนังสือ' ส่วนตัวเลือก 1 และ 4 เป็นประโยคความรวม (เชื่อมด้วย และ/แต่) ตัวเลือก 3 เป็นประโยคความเดียว"
    difficulty: 2

  - qid: thai_grammar_103
    topic: thai_grammar
    stem: "คำในข้อใดเป็นคำสมาสทั้งหมด"
    choices: ["ราชการ · วิทยาศาสตร์", "โรงเรียน · แม่น้ำ", "คอมพิวเตอร์ · ฟุตบอล", "กินข้าว · นอนหลับ"]
    answer: 0
    explanation: "คำสมาสเกิดจากการรวมคำบาลี-สันสกฤตตั้งแต่สองคำขึ้นไป 'ราช+การ' และ 'วิทยา+ศาสตร์' เข้าเกณฑ์ ส่วนตัวเลือก 2 เป็นคำประสมภาษาไทย ตัวเลือก 3 เป็นคำทับศัพท์ ตัวเลือก 4 เป็นกลุ่มคำกริยา"
    difficulty: 2

  # ── การใช้ภาษาให้เหมาะกับระดับภาษา ──────────────────────────
  - qid: thai_usage_101
    topic: thai_usage
    stem: "ข้อใดเหมาะสมที่สุดสำหรับใช้ในหนังสือราชการ"
    choices: ["ขอแจ้งให้ทราบว่าเรื่องนี้จบแล้วนะครับ", "จึงเรียนมาเพื่อโปรดทราบ", "บอกไว้แค่นี้แหละ", "เรื่องนี้เคลียร์แล้วจ้า"]
    answer: 1
    explanation: "'จึงเรียนมาเพื่อโปรดทราบ' เป็นรูปแบบภาษาระดับทางการที่ใช้ปิดหนังสือราชการ ส่วนตัวเลือกอื่นใช้ภาษาระดับกันเองหรือกึ่งทางการ"
    difficulty: 1

  - qid: thai_usage_102
    topic: thai_usage
    stem: "ข้อใดใช้คำฟุ่มเฟือย"
    choices: ["เขาเดินทางกลับบ้าน", "ผลลัพธ์ที่ได้ออกมาเป็นที่น่าพอใจ", "แพทย์ตรวจคนไข้", "ฝนตกหนักเมื่อคืน"]
    answer: 1
    explanation: "'ผลลัพธ์' มีความหมายว่าสิ่งที่ได้อยู่แล้ว การเติม 'ที่ได้ออกมา' จึงซ้ำความ ควรเขียนว่า 'ผลลัพธ์เป็นที่น่าพอใจ'"
    difficulty: 2

  - qid: thai_usage_103
    topic: thai_usage
    stem: "ข้อใดใช้คำราชาศัพท์ถูกต้อง"
    choices: ["พระบาทสมเด็จพระเจ้าอยู่หัวเสด็จพระราชดำเนินไปทรงเปิดงาน", "พระบาทสมเด็จพระเจ้าอยู่หัวไปเปิดงาน", "พระบาทสมเด็จพระเจ้าอยู่หัวเสด็จไปทรงเปิดงานพระราชดำเนิน", "พระบาทสมเด็จพระเจ้าอยู่หัวทรงเสด็จพระราชดำเนินไปเปิดงาน"]
    answer: 0
    explanation: "'เสด็จพระราชดำเนิน' เป็นคำกริยาสำเร็จรูปแปลว่าเดินทางไป ไม่ต้องเติม 'ทรง' นำหน้าอีก (ตัวเลือก 4 ผิดเพราะซ้อน 'ทรง') และ 'พระราชดำเนิน' ต้องอยู่ติดกับ 'เสด็จ' ไม่ใช่ท้ายประโยค"
    difficulty: 3

  # ── การใช้เหตุผล ─────────────────────────────────────────────
  - qid: thai_reason_101
    topic: thai_reason
    stem: "\"คนที่กินมังสวิรัติมีสุขภาพดี เพราะคนสุขภาพดีส่วนใหญ่กินมังสวิรัติ\" ข้อบกพร่องของการให้เหตุผลนี้คือข้อใด"
    choices: ["ใช้ข้อสรุปมาเป็นเหตุผล (ให้เหตุผลวนกลับ)", "อ้างบุคคลผู้มีชื่อเสียง", "ใช้ภาษากำกวม", "ยกตัวอย่างมากเกินไป"]
    answer: 0
    explanation: "ประโยคหลังกลับด้านความสัมพันธ์ของประโยคแรกแล้วเอามาเป็นเหตุผลยืนยันประโยคแรก เป็นการวนกลับ ไม่ได้เพิ่มหลักฐานใหม่"
    difficulty: 3

  - qid: thai_reason_102
    topic: thai_reason
    stem: "\"ถ้าไม่เห็นด้วยกับโครงการนี้ แสดงว่าไม่รักบ้านเมือง\" ข้อความนี้ใช้เหตุผลบกพร่องแบบใด"
    choices: ["สรุปเกินข้อมูล", "แบ่งขั้วเพียงสองทางเลือก", "อ้างความนิยม", "เปรียบเทียบไม่สมเหตุสมผล"]
    answer: 1
    explanation: "ข้อความบีบให้เหลือแค่ 'เห็นด้วย' หรือ 'ไม่รักบ้านเมือง' ทั้งที่คนอาจไม่เห็นด้วยด้วยเหตุผลอื่นได้อีกมาก เป็นการแบ่งขั้วเทียม (false dilemma)"
    difficulty: 2

  - qid: thai_reason_103
    topic: thai_reason
    stem: "\"ยาสมุนไพรชนิดนี้ต้องดี เพราะคนใช้กันเป็นล้าน\" ข้อบกพร่องคือข้อใด"
    choices: ["อ้างความนิยมแทนหลักฐาน", "ใช้เหตุผลวนกลับ", "อ้างอำนาจ", "สับสนเหตุกับผล"]
    answer: 0
    explanation: "จำนวนผู้ใช้ไม่ได้พิสูจน์ประสิทธิภาพ สิ่งที่คนจำนวนมากเชื่ออาจผิดก็ได้ การอ้างความนิยมจึงไม่ใช่หลักฐานทางวิชาการ"
    difficulty: 1

  # ── การเขียน ─────────────────────────────────────────────────
  - qid: thai_writing_101
    topic: thai_writing
    stem: "ข้อใดเรียงลำดับข้อความได้เหมาะสมที่สุด (1) จึงควรเริ่มจากการนอนให้พอ (2) การอดนอนสะสมส่งผลต่อความจำ (3) นักเรียนหลายคนอ่านหนังสือดึกทุกคืน (4) แต่ผลกลับไม่ดีเท่าที่ควร"
    choices: ["3 – 4 – 2 – 1", "2 – 3 – 4 – 1", "1 – 3 – 2 – 4", "3 – 2 – 1 – 4"]
    answer: 0
    explanation: "เริ่มจากสถานการณ์ (3) → ผลที่ขัดกับความคาดหมาย (4 ขึ้นต้นด้วย 'แต่' จึงต้องตามหลังข้อความบวก) → คำอธิบายสาเหตุ (2) → ข้อเสนอแนะ (1 ขึ้นต้นด้วย 'จึง' จึงต้องอยู่ท้าย)"
    difficulty: 2

  - qid: thai_writing_102
    topic: thai_writing
    stem: "ข้อใดเป็นการเขียนย่อความที่ดีที่สุดของข้อความ \"โรงพยาบาลประกาศงดเยี่ยมผู้ป่วยชั่วคราวตั้งแต่วันจันทร์ เนื่องจากพบการระบาดของไข้หวัดใหญ่ในหอผู้ป่วยสองแห่ง โดยจะประเมินสถานการณ์ใหม่ในอีกสองสัปดาห์\""
    choices: ["โรงพยาบาลมีคนไข้ไข้หวัดใหญ่เยอะมาก", "โรงพยาบาลงดเยี่ยมชั่วคราวจากการระบาดของไข้หวัดใหญ่ และจะประเมินใหม่ใน 2 สัปดาห์", "ห้ามเข้าโรงพยาบาลเด็ดขาด", "ไข้หวัดใหญ่ระบาดหนักทั่วประเทศ"]
    answer: 1
    explanation: "ย่อความที่ดีต้องเก็บสาระครบ (มาตรการ เหตุผล ระยะเวลา) โดยไม่เติมสิ่งที่ไม่มีในต้นฉบับ ตัวเลือก 3 และ 4 ขยายความเกินจริง ส่วน 1 ตกสาระเรื่องมาตรการ"
    difficulty: 2

  # ── โวหารและภาพพจน์ ──────────────────────────────────────────
  - qid: thai_rhetoric_101
    topic: thai_rhetoric
    stem: "\"เสียงไอของคนไข้ดังก้องไปทั้งวอร์ดราวกับฆ้องลั่น\" ข้อความนี้ใช้ภาพพจน์ชนิดใด"
    choices: ["อุปลักษณ์", "อุปมา", "บุคคลวัต", "อติพจน์"]
    answer: 1
    explanation: "มีคำว่า 'ราวกับ' เชื่อมสิ่งที่นำมาเปรียบสองสิ่งอย่างชัดเจน จึงเป็นอุปมา ถ้าเป็นอุปลักษณ์จะเปรียบตรง ๆ ว่า 'เสียงไอคือฆ้อง' โดยไม่มีคำเชื่อม"
    difficulty: 2

  # ── วรรณคดี ──────────────────────────────────────────────────
  - qid: thai_literature_101
    topic: thai_literature
    stem: "คำประพันธ์ประเภทกลอนสุภาพ 1 บท ประกอบด้วยกี่วรรค"
    choices: ["2 วรรค", "4 วรรค", "6 วรรค", "8 วรรค"]
    answer: 1
    explanation: "กลอนสุภาพ 1 บทมี 2 บาท บาทละ 2 วรรค รวมเป็น 4 วรรค (วรรคสดับ วรรครับ วรรครอง วรรคส่ง) วรรคละประมาณ 7-9 คำ"
    difficulty: 1
