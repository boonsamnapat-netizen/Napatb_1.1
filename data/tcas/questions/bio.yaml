# คลังข้อสอบ ชีววิทยา — ชุดตั้งต้น
# เพิ่มข้อใหม่ได้เลย: qid ห้ามซ้ำ, topic ต้องตรงกับรหัสใน src/tcas/syllabus.py,
# answer = index ของตัวเลือกที่ถูก (เริ่มที่ 0)
subject: bio
questions:
  - qid: bio_cell_001
    topic: bio_cell
    stem: "การลำเลียงสารผ่านเยื่อหุ้มเซลล์แบบใด ไม่ต้องใช้พลังงานจาก ATP"
    choices:
      - "แอกทีฟทรานสปอร์ต"
      - "พิโนไซโทซิส"
      - "ออสโมซิส"
      - "ฟาโกไซโทซิส"
    answer: 2
    explanation: "ออสโมซิสเป็นการแพร่ของน้ำตามความต่างของความเข้มข้น จัดเป็น passive transport ส่วนอีก 3 ข้อใช้พลังงานทั้งหมด"
    difficulty: 1

  - qid: bio_photo_001
    topic: bio_photo
    stem: "แก๊สออกซิเจนที่ปล่อยออกมาจากการสังเคราะห์ด้วยแสง มีต้นกำเนิดจากสารใด"
    choices:
      - "คาร์บอนไดออกไซด์"
      - "น้ำ"
      - "กลูโคส"
      - "ATP"
    answer: 1
    explanation: "ปฏิกิริยาแสงแยกน้ำ (photolysis) ได้ O2 ส่วน CO2 ถูกตรึงเป็นน้ำตาลในวัฏจักรคัลวิน"
    difficulty: 2

  - qid: bio_resp_001
    topic: bio_resp
    stem: "การหายใจระดับเซลล์แบบใช้ออกซิเจน กลูโคส 1 โมเลกุล ให้ ATP สุทธิประมาณเท่าใด"
    choices:
      - "2 ATP"
      - "4 ATP"
      - "18 ATP"
      - "30-32 ATP"
    answer: 3
    explanation: "ไกลโคไลซิส 2 + วัฏจักรเครบส์ 2 + ออกซิเดทีฟฟอสโฟรีเลชัน ~26-28 รวม 30-32 ATP"
    difficulty: 2

  - qid: bio_division_001
    topic: bio_division
    stem: "ไมโอซิสของเซลล์แม่ 1 เซลล์ ให้เซลล์ลูกจำนวนเท่าใด และมีจำนวนโครโมโซมอย่างไร"
    choices:
      - "2 เซลล์ ดิพลอยด์ (2n)"
      - "2 เซลล์ แฮพลอยด์ (n)"
      - "4 เซลล์ แฮพลอยด์ (n)"
      - "4 เซลล์ ดิพลอยด์ (2n)"
    answer: 2
    explanation: "ไมโอซิสแบ่ง 2 รอบต่อการจำลอง DNA 1 ครั้ง จึงได้ 4 เซลล์ที่มีโครโมโซมลดลงครึ่งหนึ่ง"
    difficulty: 1

  - qid: bio_mendel_001
    topic: bio_mendel
    stem: "ผสมพันธุ์ต้นถั่วจีโนไทป์ Aa × Aa เมื่อ A ข่ม a อย่างสมบูรณ์ อัตราส่วนฟีโนไทป์ของรุ่นลูกเป็นเท่าใด"
    choices:
      - "1 : 1"
      - "3 : 1"
      - "1 : 2 : 1"
      - "9 : 3 : 3 : 1"
    answer: 1
    explanation: "จีโนไทป์ได้ 1AA : 2Aa : 1aa แต่ AA และ Aa แสดงลักษณะเหมือนกัน จึงได้ฟีโนไทป์ 3 : 1"
    difficulty: 1

  - qid: bio_molgen_001
    topic: bio_molgen
    stem: "รหัสพันธุกรรม (codon) หนึ่งรหัสบน mRNA ประกอบด้วยเบสกี่ตัว และกำหนดอะไร"
    choices:
      - "2 ตัว กำหนดกรดอะมิโน 1 ชนิด"
      - "3 ตัว กำหนดกรดอะมิโน 1 ชนิด"
      - "3 ตัว กำหนดโปรตีน 1 ชนิด"
      - "4 ตัว กำหนดกรดอะมิโน 1 ชนิด"
    answer: 1
    explanation: "เบส 3 ตัวเรียกว่า 1 โคดอน กำหนดกรดอะมิโน 1 ชนิด (มี 64 โคดอน สำหรับกรดอะมิโน 20 ชนิด + stop)"
    difficulty: 1

  - qid: bio_circ_001
    topic: bio_circ
    stem: "เลือดที่สูบออกจากหัวใจห้องล่างซ้าย จะเข้าสู่หลอดเลือดใดเป็นอันดับแรก"
    choices:
      - "พัลโมนารีอาร์เทอรี"
      - "เอออร์ตา"
      - "เวนาคาวา"
      - "พัลโมนารีเวน"
    answer: 1
    explanation: "ห้องล่างซ้ายสูบเลือดแดงเข้าเอออร์ตาไปเลี้ยงทั่วร่างกาย ส่วนห้องล่างขวาสูบเข้าพัลโมนารีอาร์เทอรีไปปอด"
    difficulty: 1

  - qid: bio_nerve_001
    topic: bio_nerve
    stem: "สมองส่วนใดทำหน้าที่ควบคุมการทรงตัวและประสานการเคลื่อนไหวของกล้ามเนื้อ"
    choices:
      - "ซีรีบรัม"
      - "ซีรีเบลลัม"
      - "ไฮโพทาลามัส"
      - "เมดัลลาออบลองกาตา"
    answer: 1
    explanation: "ซีรีเบลลัม (สมองน้อย) คุมการทรงตัวและความแม่นยำของการเคลื่อนไหว ส่วนเมดัลลาคุมการหายใจและการเต้นของหัวใจ"
    difficulty: 1

  - qid: bio_endocrine_001
    topic: bio_endocrine
    stem: "ฮอร์โมนใดทำหน้าที่ลดระดับน้ำตาลในเลือด และสร้างจากอวัยวะใด"
    choices:
      - "กลูคากอน จากตับอ่อน"
      - "อินซูลิน จากตับอ่อน"
      - "อินซูลิน จากต่อมหมวกไต"
      - "ไทรอกซิน จากต่อมไทรอยด์"
    answer: 1
    explanation: "เบตาเซลล์ในไอส์เลตออฟแลงเกอร์ฮานส์ของตับอ่อนหลั่งอินซูลิน ส่วนแอลฟาเซลล์หลั่งกลูคากอนซึ่งเพิ่มน้ำตาล"
    difficulty: 1

  - qid: bio_excrete_001
    topic: bio_excrete
    stem: "หน่วยที่เล็กที่สุดที่ทำหน้าที่กรองและสร้างปัสสาวะในไตคือข้อใด"
    choices:
      - "ท่อไต"
      - "หน่วยไต (เนฟรอน)"
      - "กรวยไต"
      - "โกลเมอรูลัส"
    answer: 1
    explanation: "เนฟรอนคือหน่วยทำงานของไต ประกอบด้วยโกลเมอรูลัส โบว์แมนแคปซูล และท่อหน่วยไต — โกลเมอรูลัสเป็นเพียงส่วนหนึ่ง"
    difficulty: 2

  - qid: bio_immune_001
    topic: bio_immune
    stem: "เซลล์ใดทำหน้าที่สร้างแอนติบอดีในการตอบสนองทางภูมิคุ้มกันแบบจำเพาะ"
    choices:
      - "เซลล์ทีชนิดพิฆาต"
      - "แมโครฟาจ"
      - "พลาสมาเซลล์ที่เจริญจากเซลล์บี"
      - "นิวโทรฟิล"
    answer: 2
    explanation: "เซลล์บีที่ถูกกระตุ้นจะเจริญเป็นพลาสมาเซลล์ซึ่งหลั่งแอนติบอดี ส่วนเซลล์ทีพิฆาตทำลายเซลล์ติดเชื้อโดยตรง"
    difficulty: 2

  - qid: bio_plant_001
    topic: bio_plant_struct
    stem: "เนื้อเยื่อใดทำหน้าที่ลำเลียงน้ำและแร่ธาตุจากรากขึ้นสู่ใบ"
    choices:
      - "โฟลเอ็ม"
      - "ไซเล็ม"
      - "แคมเบียม"
      - "เอพิเดอร์มิส"
    answer: 1
    explanation: "ไซเล็มลำเลียงน้ำและแร่ธาตุขึ้นทางเดียว ส่วนโฟลเอ็มลำเลียงอาหารได้ทั้งขึ้นและลง"
    difficulty: 1
