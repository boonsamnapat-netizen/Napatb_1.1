subject: phys
questions:
  - qid: phys_kine_001
    topic: phys_kinematics
    stem: "ปล่อยวัตถุตกอย่างอิสระจากหยุดนิ่ง หลังจาก 2 วินาที วัตถุมีความเร็วเท่าใด (g = 10 m/s², ไม่คิดแรงต้านอากาศ)"
    choices:
      - "10 m/s"
      - "20 m/s"
      - "20 m"
      - "40 m/s"
    answer: 1
    explanation: "v = u + at = 0 + (10)(2) = 20 m/s (ระยะทางที่ตกได้คือ 20 m ซึ่งเป็นคนละปริมาณ)"
    difficulty: 1

  - qid: phys_newton_001
    topic: phys_newton
    stem: "ออกแรง 12 N ผลักวัตถุมวล 4 kg บนพื้นลื่น วัตถุมีความเร่งเท่าใด"
    choices:
      - "0.33 m/s²"
      - "3 m/s²"
      - "16 m/s²"
      - "48 m/s²"
    answer: 1
    explanation: "จาก ΣF = ma ได้ a = F/m = 12/4 = 3 m/s²"
    difficulty: 1

  - qid: phys_ecurrent_001
    topic: phys_ecurrent
    stem: "ตัวต้านทาน 3 Ω และ 6 Ω ต่อขนานกัน ความต้านทานรวมเท่ากับเท่าใด"
    choices:
      - "2 Ω"
      - "4.5 Ω"
      - "9 Ω"
      - "18 Ω"
    answer: 0
    explanation: "1/R = 1/3 + 1/6 = 1/2 ดังนั้น R = 2 Ω — ต่อขนานความต้านทานรวมต้องน้อยกว่าตัวที่น้อยที่สุดเสมอ"
    difficulty: 2

  - qid: phys_work_001
    topic: phys_work
    stem: "ถือกระเป๋าเดินในแนวราบด้วยความเร็วคงที่ แรงที่มือยกกระเป๋าทำงานเท่าใด"
    choices:
      - "เท่ากับน้ำหนักกระเป๋าคูณระยะทาง"
      - "เป็นศูนย์ เพราะแรงตั้งฉากกับการกระจัด"
      - "เป็นลบ เพราะแรงต้านการเคลื่อนที่"
      - "หาไม่ได้ ถ้าไม่รู้มวลกระเป๋า"
    answer: 1
    explanation: "W = F·s·cos θ เมื่อแรงยกอยู่ในแนวดิ่งแต่การกระจัดอยู่ในแนวราบ θ = 90° ทำให้ cos θ = 0"
    difficulty: 2

  - qid: phys_momentum_001
    topic: phys_momentum
    stem: "หน่วยของโมเมนตัมในระบบ SI คือข้อใด"
    choices:
      - "N/s"
      - "kg·m/s"
      - "kg·m/s²"
      - "J·s"
    answer: 1
    explanation: "p = mv จึงมีหน่วย kg·m/s ซึ่งเท่ากับ N·s (หน่วยของการดล) ส่วน kg·m/s² คือนิวตัน"
    difficulty: 1

  - qid: phys_wave_001
    topic: phys_wave
    stem: "คลื่นเสียงในอากาศจัดเป็นคลื่นชนิดใด"
    choices:
      - "คลื่นตามขวาง ต้องใช้ตัวกลาง"
      - "คลื่นตามยาว ต้องใช้ตัวกลาง"
      - "คลื่นตามยาว ไม่ต้องใช้ตัวกลาง"
      - "คลื่นแม่เหล็กไฟฟ้า"
    answer: 1
    explanation: "อนุภาคอากาศสั่นขนานกับทิศการเคลื่อนที่ของคลื่น (อัด-ขยาย) จึงเป็นคลื่นตามยาว และเป็นคลื่นกลที่ต้องมีตัวกลาง"
    difficulty: 1

  - qid: phys_light_001
    topic: phys_light
    stem: "คนสายตายาว (hyperopia) ต้องใช้เลนส์ชนิดใดในการแก้ไข"
    choices:
      - "เลนส์เว้า เพราะต้องถ่างลำแสง"
      - "เลนส์นูน เพราะต้องรวมแสงให้ตกบนเรตินา"
      - "เลนส์ทรงกระบอก"
      - "ไม่ต้องใช้เลนส์"
    answer: 1
    explanation: "สายตายาวรวมแสงไม่พอ ภาพตกหลังเรตินา จึงใช้เลนส์นูนช่วยรวมแสง ส่วนสายตาสั้นใช้เลนส์เว้า"
    difficulty: 2

  - qid: phys_estatic_001
    topic: phys_estatic
    stem: "ตามกฎของคูลอมบ์ ถ้าเพิ่มระยะระหว่างประจุสองตัวเป็น 2 เท่า แรงระหว่างประจุจะเป็นอย่างไร"
    choices:
      - "ลดลงเหลือครึ่งหนึ่ง"
      - "ลดลงเหลือหนึ่งในสี่"
      - "เพิ่มเป็น 2 เท่า"
      - "เพิ่มเป็น 4 เท่า"
    answer: 1
    explanation: "F ∝ 1/r² เมื่อ r เพิ่ม 2 เท่า F จะลดลงเป็น 1/2² = 1/4 ของเดิม"
    difficulty: 2

  - qid: phys_heat_001
    topic: phys_heat
    stem: "ความร้อนจากดวงอาทิตย์เดินทางผ่านอวกาศมายังโลกด้วยวิธีใด"
    choices:
      - "การนำความร้อน"
      - "การพาความร้อน"
      - "การแผ่รังสี"
      - "การพาและการนำร่วมกัน"
    answer: 2
    explanation: "อวกาศเป็นสุญญากาศ ไม่มีตัวกลาง การนำและการพาจึงเกิดไม่ได้ เหลือเพียงการแผ่รังสีคลื่นแม่เหล็กไฟฟ้า"
    difficulty: 1

  - qid: phys_shm_001
    topic: phys_shm
    stem: "คาบการแกว่งของลูกตุ้มอย่างง่าย (มุมเล็ก) ขึ้นอยู่กับปริมาณใด"
    choices:
      - "มวลของลูกตุ้มและความยาวเชือก"
      - "ความยาวเชือกและความเร่งโน้มถ่วง"
      - "แอมพลิจูดและมวล"
      - "มวลเพียงอย่างเดียว"
    answer: 1
    explanation: "T = 2π√(L/g) — ไม่ขึ้นกับมวลและ (ที่มุมเล็ก) ไม่ขึ้นกับแอมพลิจูด"
    difficulty: 2

  - qid: phys_equil_001
    topic: phys_equilibrium
    stem: "คานสม่ำเสมอยาว 4 m วางบนจุดหมุนที่กึ่งกลาง แขวนน้ำหนัก 20 N ที่ปลายซ้าย ต้องแขวนน้ำหนักเท่าใดที่ปลายขวาจึงจะสมดุล"
    choices:
      - "10 N"
      - "20 N"
      - "40 N"
      - "80 N"
    answer: 1
    explanation: "โมเมนต์ทวนเข็ม = โมเมนต์ตามเข็ม: 20 × 2 = F × 2 ดังนั้น F = 20 N (ระยะเท่ากันทั้งสองข้าง น้ำหนักจึงต้องเท่ากัน)"
    difficulty: 2

  - qid: phys_circular_001
    topic: phys_circular
    stem: "วัตถุเคลื่อนที่เป็นวงกลมด้วยอัตราเร็วคงที่ ข้อใดถูกต้อง"
    choices:
      - "ความเร็วคงที่ ความเร่งเป็นศูนย์"
      - "ความเร็วเปลี่ยนทิศตลอดเวลา มีความเร่งเข้าสู่ศูนย์กลาง"
      - "มีความเร่งในทิศเดียวกับการเคลื่อนที่"
      - "แรงลัพธ์เป็นศูนย์เพราะอัตราเร็วไม่เปลี่ยน"
    answer: 1
    explanation: "อัตราเร็วคงที่แต่ทิศเปลี่ยนตลอด ความเร็วจึงเปลี่ยน เกิดความเร่งสู่ศูนย์กลาง a = v²/r ซึ่งตั้งฉากกับความเร็ว"
    difficulty: 2

  - qid: phys_sound_001
    topic: phys_sound
    stem: "รถพยาบาลเปิดไซเรนวิ่งเข้าหาผู้สังเกต ผู้สังเกตจะได้ยินเสียงเป็นอย่างไร"
    choices:
      - "ความถี่สูงขึ้นกว่าความถี่จริง"
      - "ความถี่ต่ำลงกว่าความถี่จริง"
      - "ความถี่เท่าเดิมแต่ดังขึ้น"
      - "ความถี่เท่าเดิมแต่ค่อยลง"
    answer: 0
    explanation: "ปรากฏการณ์ดอปเพลอร์ — แหล่งกำเนิดวิ่งเข้าหา หน้าคลื่นถูกอัดให้ชิดกัน ความยาวคลื่นสั้นลง ความถี่ที่ได้ยินจึงสูงขึ้น"
    difficulty: 2

  - qid: phys_fluid_001
    topic: phys_fluid
    stem: "วัตถุลอยนิ่งในน้ำโดยจมลงไป 60% ของปริมาตร ความหนาแน่นของวัตถุเป็นเท่าใด (น้ำ = 1000 kg/m³)"
    choices:
      - "400 kg/m³"
      - "600 kg/m³"
      - "1000 kg/m³"
      - "1600 kg/m³"
    answer: 1
    explanation: "วัตถุลอยนิ่ง แรงลอยตัว = น้ำหนัก จึงได้ ρวัตถุ/ρน้ำ = สัดส่วนที่จม = 0.6 ดังนั้น ρ = 600 kg/m³"
    difficulty: 3

  - qid: phys_magnet_001
    topic: phys_magnet
    stem: "เมื่อเคลื่อนแท่งแม่เหล็กเข้าหาขดลวดตัวนำ จะเกิดอะไรขึ้น"
    choices:
      - "ไม่เกิดอะไร เพราะไม่มีแหล่งจ่ายไฟ"
      - "เกิดกระแสไฟฟ้าเหนี่ยวนำในขดลวด"
      - "ขดลวดกลายเป็นแม่เหล็กถาวร"
      - "เกิดประจุไฟฟ้าสถิตบนขดลวด"
    answer: 1
    explanation: "กฎการเหนี่ยวนำของฟาราเดย์ — ฟลักซ์แม่เหล็กที่ผ่านขดลวดเปลี่ยน จึงเกิดแรงเคลื่อนไฟฟ้าเหนี่ยวนำและกระแสไหล"
    difficulty: 2

  - qid: phys_modern_001
    topic: phys_modern
    stem: "ธาตุกัมมันตรังสีมีครึ่งชีวิต 10 วัน เริ่มต้นมี 80 g หลังผ่านไป 30 วันจะเหลือเท่าใด"
    choices:
      - "5 g"
      - "10 g"
      - "20 g"
      - "40 g"
    answer: 1
    explanation: "30 วัน = 3 ครึ่งชีวิต เหลือ 80 → 40 → 20 → 10 g"
    difficulty: 2
