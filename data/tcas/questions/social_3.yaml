# ชุดที่ 3 — ข้อสอบจริง A-Level 70 สังคมศึกษา 50 ข้อ แบ่ง 5 หมวด หมวดละ 10 ข้อ
# (ศาสนา · หน้าที่พลเมือง · เศรษฐศาสตร์ · ประวัติศาสตร์ · ภูมิศาสตร์)
# คลังเดิมมีศาสนาแค่ 6 ข้อ ชุดนี้จึงเติมศาสนามากที่สุด
subject: social
questions:

  # ── ศาสนา ศีลธรรม จริยธรรม (ส่วนที่ใหญ่ที่สุดในข้อสอบจริง) ──
  - qid: soc_religion_101
    topic: soc_religion
    stem: "อริยสัจ 4 ข้อใดที่หมายถึง 'หนทางดับทุกข์'"
    choices:
    - มรรค
    - ทุกข์
    - นิโรธ
    - สมุทัย
    answer: 0
    explanation: "อริยสัจ 4 คือ ทุกข์ (ปัญหา) · สมุทัย (เหตุแห่งทุกข์) · นิโรธ (ภาวะที่ทุกข์ดับ) · มรรค (ข้อปฏิบัติให้ถึงความดับทุกข์) — นิโรธคือ 'ผล' ส่วนมรรคคือ 'หนทาง'"
    difficulty: 1

  - qid: soc_religion_102
    topic: soc_religion
    stem: "หลักธรรม 'พรหมวิหาร 4' ประกอบด้วยข้อใด"
    choices:
    - ฉันทะ วิริยะ จิตตะ วิมังสา
    - ทาน ศีล ภาวนา ปัญญา
    - สติ สมาธิ ปัญญา วิริยะ
    - เมตตา กรุณา มุทิตา อุเบกขา
    answer: 3
    explanation: "พรหมวิหาร 4 คือธรรมประจำใจของผู้ใหญ่ — เมตตา (ปรารถนาให้เป็นสุข) กรุณา (ช่วยให้พ้นทุกข์) มุทิตา (ยินดีเมื่อเขาได้ดี) อุเบกขา (วางใจเป็นกลาง) ส่วน ฉันทะ วิริยะ จิตตะ วิมังสา คืออิทธิบาท 4"
    difficulty: 1

  - qid: soc_religion_103
    topic: soc_religion
    stem: "อิทธิบาท 4 เป็นหลักธรรมที่ใช้เพื่อจุดประสงค์ใด"
    choices:
    - การอยู่ร่วมกันในสังคม
    - ความสำเร็จในการทำงานหรือการศึกษา
    - การละกิเลสขั้นสูงสุด
    - การปกครองบ้านเมือง
    answer: 1
    explanation: "อิทธิบาท 4 (ฉันทะ วิริยะ จิตตะ วิมังสา) คือธรรมที่นำไปสู่ความสำเร็จ — รักในสิ่งที่ทำ เพียรทำ เอาใจใส่ และใคร่ครวญปรับปรุง จึงเหมาะกับการเรียนและการทำงาน"
    difficulty: 2

  - qid: soc_religion_104
    topic: soc_religion
    stem: "ศาสนาอิสลามกำหนดหลักปฏิบัติที่เรียกว่า 'หลักปฏิบัติ 5 ประการ' ข้อใด **ไม่ใช่** หนึ่งในนั้น"
    choices:
    - การบวชเรียนก่อนแต่งงาน
    - การปฏิญาณตน (ชะฮาดะฮ์)
    - การถือศีลอดในเดือนรอมฎอน
    - การละหมาด
    answer: 0
    explanation: "หลักปฏิบัติ 5 ประการของอิสลามคือ ปฏิญาณตน ละหมาด ถือศีลอด บริจาคซะกาต และประกอบพิธีฮัจญ์ ส่วนการบวชเรียนเป็นธรรมเนียมของพุทธศาสนาในไทย ไม่ใช่ของอิสลาม"
    difficulty: 1

  - qid: soc_religion_105
    topic: soc_religion
    stem: "แนวคิด 'ทางสายกลาง' (มัชฌิมาปฏิปทา) ในพุทธศาสนาหมายถึงข้อใด"
    choices:
    - การแบ่งทรัพย์สินให้เท่ากันทุกคน
    - การทำทุกอย่างครึ่ง ๆ กลาง ๆ
    - การหลีกเลี่ยงทั้งการหมกมุ่นในกามและการทรมานตน
    - การไม่แสดงความคิดเห็นใด ๆ
    answer: 2
    explanation: "ทางสายกลางคือการปฏิเสธที่สุดโต่งสองด้าน คือกามสุขัลลิกานุโยค (หมกมุ่นในความสุขทางกาย) และอัตตกิลมถานุโยค (ทรมานตนเอง) ไม่ได้แปลว่าทำอะไรแบบครึ่ง ๆ กลาง ๆ"
    difficulty: 2

  # ── กฎหมาย ───────────────────────────────────────────────────
  - qid: soc_law_101
    topic: soc_law
    stem: "กฎหมายใดมีศักดิ์สูงที่สุดในระบบกฎหมายไทย"
    choices:
    - กฎกระทรวง
    - รัฐธรรมนูญ
    - พระราชบัญญัติ
    - พระราชกำหนด
    answer: 1
    explanation: "รัฐธรรมนูญเป็นกฎหมายสูงสุด กฎหมายอื่นที่ขัดหรือแย้งกับรัฐธรรมนูญย่อมใช้บังคับไม่ได้ ลำดับรองลงมาคือ พ.ร.บ./พ.ร.ก. แล้วจึงเป็นพระราชกฤษฎีกาและกฎกระทรวง"
    difficulty: 1

  - qid: soc_law_102
    topic: soc_law
    stem: "ข้อใดเป็นความผิดทางอาญาที่ยอมความได้"
    choices:
    - ฆ่าผู้อื่นโดยเจตนา
    - ลักทรัพย์
    - หมิ่นประมาท
    - ปล้นทรัพย์
    answer: 2
    explanation: "หมิ่นประมาทเป็นความผิดต่อส่วนตัวซึ่งยอมความได้ ส่วนฆ่าคน ลักทรัพย์ และปล้นทรัพย์เป็นความผิดต่อแผ่นดิน แม้ผู้เสียหายไม่ติดใจ รัฐก็ยังดำเนินคดีต่อได้"
    difficulty: 2

  - qid: soc_law_103
    topic: soc_law
    stem: "หลัก 'บุคคลย่อมได้รับการสันนิษฐานว่าเป็นผู้บริสุทธิ์จนกว่าจะมีคำพิพากษาถึงที่สุด' มีความหมายอย่างไร"
    choices:
    - ผู้ต้องหาต้องถูกคุมขังระหว่างพิจารณาคดีเสมอ
    - ตำรวจมีอำนาจตัดสินความผิดได้เอง
    - ผู้ถูกกล่าวหาต้องพิสูจน์ว่าตนบริสุทธิ์
    - ภาระการพิสูจน์ความผิดตกอยู่กับฝ่ายที่กล่าวหา
    answer: 3
    explanation: "หลักนี้กำหนดให้ผู้กล่าวหา (รัฐ) เป็นฝ่ายพิสูจน์ความผิดจนสิ้นสงสัย ไม่ใช่ให้ผู้ถูกกล่าวหาพิสูจน์ความบริสุทธิ์ของตน และเป็นเหตุผลรองรับสิทธิในการได้รับการปล่อยชั่วคราว"
    difficulty: 2

  # ── หน้าที่พลเมือง ───────────────────────────────────────────
  - qid: soc_civic_101
    topic: soc_civic
    stem: "ลักษณะสำคัญที่สุดของการปกครองระบอบประชาธิปไตยคือข้อใด"
    choices:
    - มีการเลือกตั้งเป็นระยะ
    - มีพรรคการเมืองหลายพรรค
    - มีรัฐธรรมนูญเป็นลายลักษณ์อักษร
    - อำนาจสูงสุดเป็นของประชาชน
    answer: 3
    explanation: "หัวใจของประชาธิปไตยคืออำนาจอธิปไตยเป็นของประชาชน ส่วนการเลือกตั้ง ระบบหลายพรรค และรัฐธรรมนูญ เป็นกลไกหรือรูปแบบที่ใช้แสดงออกซึ่งหลักการนั้น — บางประเทศมีการเลือกตั้งแต่ไม่เป็นประชาธิปไตยจริง"
    difficulty: 2

  - qid: soc_civic_102
    topic: soc_civic
    stem: "การแบ่งแยกอำนาจอธิปไตยออกเป็นสามฝ่ายมีจุดประสงค์หลักตามข้อใด"
    choices:
    - เพื่อลดจำนวนข้าราชการ
    - เพื่อให้แต่ละฝ่ายทำงานเป็นอิสระโดยไม่ต้องเกี่ยวข้องกัน
    - เพื่อให้การบริหารรวดเร็วขึ้น
    - เพื่อถ่วงดุลและตรวจสอบไม่ให้อำนาจกระจุกอยู่ที่เดียว
    answer: 3
    explanation: "หลักแบ่งแยกอำนาจมีขึ้นเพื่อคานอำนาจกันเอง (checks and balances) ไม่ใช่เพื่อความรวดเร็ว และไม่ได้แปลว่าทั้งสามฝ่ายไม่เกี่ยวข้องกันเลย — การตรวจสอบกันเองคือการเกี่ยวข้องอย่างหนึ่ง"
    difficulty: 2

  # ── เศรษฐศาสตร์ ──────────────────────────────────────────────
  - qid: soc_econ_101
    topic: soc_econ
    stem: "ถ้ารัฐบาลกำหนดราคาขั้นสูง (price ceiling) ของสินค้าให้ต่ำกว่าราคาดุลยภาพ ผลที่ตามมาคือข้อใด"
    choices:
    - เกิดภาวะขาดแคลนสินค้า
    - ราคาดุลยภาพสูงขึ้น
    - อุปทานเพิ่มขึ้นทันที
    - สินค้าล้นตลาด
    answer: 0
    explanation: "ราคาที่ถูกกดให้ต่ำกว่าดุลยภาพทำให้ผู้บริโภคต้องการซื้อมากขึ้นแต่ผู้ผลิตอยากขายน้อยลง ปริมาณเสนอซื้อจึงมากกว่าเสนอขาย = ขาดแคลน (ตรงข้ามกับ price floor ที่ทำให้สินค้าล้นตลาด)"
    difficulty: 2

  - qid: soc_econ_102
    topic: soc_econ
    stem: "'ค่าเสียโอกาส' (opportunity cost) ของการเลือกอ่านหนังสือแทนการไปทำงานพิเศษคือข้อใด"
    choices:
    - คะแนนสอบที่จะได้
    - รายได้จากงานพิเศษที่เสียไป
    - เวลาที่ใช้อ่านหนังสือ
    - ค่าหนังสือที่ซื้อ
    answer: 1
    explanation: "ค่าเสียโอกาสคือมูลค่าของทางเลือกที่ดีที่สุดที่ต้องสละไป ในที่นี้คือรายได้จากงานพิเศษ ไม่ใช่ต้นทุนที่จ่ายจริง (ค่าหนังสือ) หรือผลที่ได้จากทางเลือกที่เลือก"
    difficulty: 2

  # ── ภูมิศาสตร์ ───────────────────────────────────────────────
  - qid: soc_geo_101
    topic: soc_geo
    stem: "ปรากฏการณ์เอลนีโญส่งผลต่อประเทศไทยอย่างไรเป็นหลัก"
    choices:
    - แห้งแล้งกว่าปกติ
    - เกิดพายุหิมะ
    - ฝนตกชุกกว่าปกติ
    - อุณหภูมิลดต่ำผิดปกติ
    answer: 0
    explanation: "เอลนีโญคือการที่น้ำผิวหน้าในมหาสมุทรแปซิฟิกตะวันออกอุ่นผิดปกติ ทำให้แนวฝนเลื่อนออกจากภูมิภาคเอเชียตะวันออกเฉียงใต้ ไทยจึงมักเผชิญภัยแล้งและฝนน้อยกว่าปกติ ส่วนลานีญาให้ผลตรงข้าม"
    difficulty: 2

  - qid: soc_geo_102
    topic: soc_geo
    stem: "แผนที่มาตราส่วน 1 : 50,000 หมายความว่าอย่างไร"
    choices:
    - แผนที่ย่อจากของจริง 50,000 เท่าเฉพาะแนวตั้ง
    - ระยะ 1 ซม. บนแผนที่เท่ากับ 50,000 เมตรจริง
    - ระยะ 1 ซม. บนแผนที่เท่ากับ 50,000 ซม. ในภูมิประเทศจริง
    - พื้นที่บนแผนที่เล็กกว่าจริง 50,000 เท่า
    answer: 2
    explanation: "มาตราส่วนเป็นอัตราส่วนของระยะทาง (ไม่ใช่พื้นที่) และใช้หน่วยเดียวกันทั้งสองข้าง 1 ซม. บนแผนที่จึงเท่ากับ 50,000 ซม. = 500 เมตรจริง ถ้าคิดพื้นที่ต้องยกกำลังสอง"
    difficulty: 2

  # ── ประวัติศาสตร์ ────────────────────────────────────────────
  - qid: soc_history_th_101
    topic: soc_history_th
    stem: "การเปลี่ยนแปลงการปกครองของไทย พ.ศ. 2475 ทำให้ระบอบการปกครองเปลี่ยนไปอย่างไร"
    choices:
    - จากระบอบศักดินาเป็นสมบูรณาญาสิทธิราชย์
    - จากสาธารณรัฐเป็นราชาธิปไตย
    - จากสมบูรณาญาสิทธิราชย์เป็นระบอบประชาธิปไตยอันมีพระมหากษัตริย์ทรงเป็นประมุข
    - จากรัฐรวมเป็นรัฐเดี่ยว
    answer: 2
    explanation: "คณะราษฎรเปลี่ยนแปลงการปกครองเมื่อ 24 มิถุนายน 2475 จากสมบูรณาญาสิทธิราชย์ (พระมหากษัตริย์ทรงมีอำนาจสูงสุด) มาเป็นระบอบที่มีรัฐธรรมนูญและพระมหากษัตริย์ทรงอยู่ภายใต้รัฐธรรมนูญ"
    difficulty: 1

  - qid: soc_history_world_101
    topic: soc_history_world
    stem: "การปฏิวัติอุตสาหกรรมเริ่มต้นขึ้นครั้งแรกที่ประเทศใด"
    choices:
    - ฝรั่งเศส
    - อังกฤษ
    - เยอรมนี
    - สหรัฐอเมริกา
    answer: 1
    explanation: "การปฏิวัติอุตสาหกรรมเริ่มในอังกฤษช่วงปลายคริสต์ศตวรรษที่ 18 ด้วยปัจจัยพร้อมหลายด้าน ทั้งถ่านหิน เหล็ก ทุน อาณานิคมเป็นตลาด และการพัฒนาเครื่องจักรไอน้ำ ก่อนแพร่ไปยุโรปภาคพื้นทวีปและอเมริกา"
    difficulty: 1
