# ชุดที่ 3 — เติมเฉพาะหัวข้อที่เดิมมีน้อยกว่า 5 ข้อ หัวข้อละ 3 ข้อ
# ทำให้ทุกหัวข้อในคลังมีอย่างน้อย 7 ข้อ พอสำหรับสุ่มชุดทดสอบโดยไม่เจอข้อซ้ำเร็วเกินไป
subject: chem
questions:
  # ── เคมี: พอลิเมอร์ ──────────────────────────────────────────
  - qid: chem_polymer_101
    topic: chem_polymer
    stem: "พอลิเมอร์ชนิดใดเกิดจากปฏิกิริยาพอลิเมอไรเซชันแบบควบแน่น"
    choices: ["พอลิเอทิลีน", "พอลิเอสเทอร์", "พอลิโพรพิลีน", "พอลิสไตรีน"]
    answer: 1
    explanation: "พอลิเอสเทอร์เกิดจากกรดคาร์บอกซิลิกรวมกับแอลกอฮอล์แล้วปล่อยน้ำออกมา จึงเป็นแบบควบแน่น ส่วนอีกสามชนิดเกิดจากมอนอเมอร์ที่มีพันธะคู่มาต่อกันโดยไม่มีสารใดหลุดออก = แบบเติม"
    difficulty: 2

  - qid: chem_polymer_102
    topic: chem_polymer
    stem: "พลาสติกชนิดเทอร์มอเซตมีสมบัติเด่นตามข้อใด"
    choices: ["หลอมแล้วขึ้นรูปใหม่ได้หลายครั้ง", "เมื่อขึ้นรูปแล้วหลอมใหม่ไม่ได้", "ละลายน้ำได้ดี", "นำไฟฟ้าได้ดี"]
    answer: 1
    explanation: "เทอร์มอเซตมีพันธะเชื่อมขวาง (cross-link) เป็นร่างแหสามมิติ เมื่อได้รับความร้อนซ้ำจะไหม้แทนที่จะหลอม จึงรีไซเคิลด้วยการหลอมไม่ได้ ต่างจากเทอร์มอพลาสติกที่สายโซ่แยกจากกัน"
    difficulty: 2

  - qid: chem_polymer_103
    topic: chem_polymer
    stem: "ยางธรรมชาติผ่านกระบวนการวัลคาไนเซชันเพื่อจุดประสงค์ใด"
    choices: ["ทำให้ยางละลายน้ำได้", "เพิ่มความยืดหยุ่นและความทนทานด้วยพันธะเชื่อมขวางของกำมะถัน", "เปลี่ยนสีของยาง", "ลดน้ำหนักของยาง"]
    answer: 1
    explanation: "วัลคาไนเซชันคือการเติมกำมะถันแล้วให้ความร้อน ทำให้เกิดพันธะเชื่อมขวางระหว่างสายพอลิเมอร์ ยางจึงไม่เหนียวเหนอะเมื่อร้อนและไม่เปราะเมื่อเย็น ทนทานขึ้นมาก"
    difficulty: 2

  # ── เคมี: อุตสาหกรรมและสิ่งแวดล้อม ──────────────────────────
  - qid: chem_industry_101
    topic: chem_industry
    stem: "กระบวนการฮาเบอร์ (Haber process) ใช้ผลิตสารใด"
    choices: ["กรดซัลฟิวริก", "แอมโมเนีย", "โซเดียมไฮดรอกไซด์", "เอทานอล"]
    answer: 1
    explanation: "กระบวนการฮาเบอร์สังเคราะห์แอมโมเนียจากไนโตรเจนและไฮโดรเจน (N₂ + 3H₂ ⇌ 2NH₃) ที่ความดันสูงและมีตัวเร่งปฏิกิริยาเหล็ก เป็นฐานของอุตสาหกรรมปุ๋ยไนโตรเจนทั่วโลก"
    difficulty: 1

  - qid: chem_industry_102
    topic: chem_industry
    stem: "การกลั่นลำดับส่วนของปิโตรเลียมแยกสารต่าง ๆ ออกจากกันโดยอาศัยสมบัติใด"
    choices: ["ความหนาแน่น", "จุดเดือดที่ต่างกัน", "ความสามารถในการละลายน้ำ", "สี"]
    answer: 1
    explanation: "สารที่มีสายคาร์บอนสั้นมีจุดเดือดต่ำจึงระเหยขึ้นไปควบแน่นที่ชั้นบนของหอกลั่น ส่วนสายยาวจุดเดือดสูงจะควบแน่นที่ชั้นล่าง การแยกจึงอาศัยความต่างของจุดเดือดเป็นหลัก"
    difficulty: 1

  - qid: chem_industry_103
    topic: chem_industry
    stem: "แก๊สชนิดใดเป็นสาเหตุหลักของฝนกรด"
    choices: ["คาร์บอนไดออกไซด์และมีเทน", "ซัลเฟอร์ไดออกไซด์และไนโตรเจนออกไซด์", "ออกซิเจนและไนโตรเจน", "ฮีเลียมและอาร์กอน"]
    answer: 1
    explanation: "SO₂ และ NOₓ จากการเผาเชื้อเพลิงฟอสซิลทำปฏิกิริยากับน้ำในบรรยากาศได้กรดซัลฟิวริกและกรดไนตริก ซึ่งมีความเป็นกรดสูงกว่าคาร์บอนิกที่เกิดจาก CO₂ มาก — CO₂ กับมีเทนเป็นแก๊สเรือนกระจก คนละปัญหากัน"
    difficulty: 2

  # ── เคมี: ปฏิบัติการและความปลอดภัย ──────────────────────────
  - qid: chem_lab_101
    topic: chem_lab
    stem: "การเจือจางกรดซัลฟิวริกเข้มข้นต้องทำอย่างไรจึงปลอดภัย"
    choices: ["เทน้ำลงในกรดอย่างช้า ๆ", "เทกรดลงในน้ำอย่างช้า ๆ พร้อมคน", "ผสมทั้งสองพร้อมกันอย่างรวดเร็ว", "อุ่นกรดก่อนแล้วจึงเติมน้ำ"]
    answer: 1
    explanation: "การละลายกรดซัลฟิวริกคายความร้อนมาก ถ้าเทน้ำลงในกรด น้ำปริมาณน้อยจะร้อนจัดจนเดือดกระเด็นพากรดออกมาด้วย จึงต้องเทกรดลงในน้ำปริมาณมากเพื่อให้น้ำดูดซับความร้อนไว้"
    difficulty: 1

  - qid: chem_lab_102
    topic: chem_lab
    stem: "ผลการชั่งมวล 3 ครั้งได้ 2.51, 2.52, 2.51 กรัม แต่ค่าจริงคือ 2.80 กรัม ข้อสรุปใดถูกต้อง"
    choices: ["แม่นยำสูงและเที่ยงตรงสูง", "แม่นยำสูงแต่เที่ยงตรงต่ำ", "แม่นยำต่ำแต่เที่ยงตรงสูง", "แม่นยำต่ำและเที่ยงตรงต่ำ"]
    answer: 1
    explanation: "ค่าที่วัดได้ใกล้เคียงกันมาก = ความแม่นยำ (precision) สูง แต่ห่างจากค่าจริงถึง 0.29 กรัม = ความเที่ยงตรง (accuracy) ต่ำ มักเกิดจากความคลาดเคลื่อนเชิงระบบ เช่น ลืมปรับศูนย์เครื่องชั่ง"
    difficulty: 2

  - qid: chem_lab_103
    topic: chem_lab
    stem: "ในการไทเทรตกรด-เบส จุดใดคือ 'จุดยุติ' (end point)"
    choices: ["จุดที่กรดและเบสทำปฏิกิริยาพอดีกันตามสมการ", "จุดที่อินดิเคเตอร์เปลี่ยนสีและผู้ทดลองหยุดหยดสาร", "จุดที่สารละลายมี pH เท่ากับ 7 เสมอ", "จุดที่เริ่มหยดสารจากบิวเรตต์"]
    answer: 1
    explanation: "จุดยุติคือจุดที่ 'สังเกตเห็น' การเปลี่ยนสีแล้วหยุด ส่วนจุดที่ทำปฏิกิริยาพอดีตามสมการเรียกจุดสมมูล (equivalence point) ทั้งสองจุดใกล้กันแต่ไม่ใช่จุดเดียวกัน และ pH ที่จุดสมมูลไม่จำเป็นต้องเป็น 7 ถ้าเป็นกรดอ่อนหรือเบสอ่อน"
    difficulty: 3
