subject: social
questions:
  - qid: soc_civic_001
    topic: soc_civic
    stem: "ประเทศไทยปกครองด้วยระบอบใด"
    choices:
      - "ประชาธิปไตยอันมีพระมหากษัตริย์ทรงเป็นประมุข"
      - "ประชาธิปไตยระบบประธานาธิบดี"
      - "สมบูรณาญาสิทธิราชย์"
      - "สาธารณรัฐระบบรัฐสภา"
    answer: 0
    explanation: "รัฐธรรมนูญกำหนดให้ไทยปกครองระบอบประชาธิปไตยอันมีพระมหากษัตริย์ทรงเป็นประมุข ใช้ระบบรัฐสภา"
    difficulty: 1

  - qid: soc_law_001
    topic: soc_law
    stem: "บุคคลธรรมดาบรรลุนิติภาวะตามประมวลกฎหมายแพ่งและพาณิชย์เมื่อใด"
    choices:
      - "อายุ 15 ปีบริบูรณ์"
      - "อายุ 20 ปีบริบูรณ์ หรือเมื่อสมรสโดยชอบด้วยกฎหมาย"
      - "อายุ 18 ปีบริบูรณ์"
      - "อายุ 25 ปีบริบูรณ์"
    answer: 1
    explanation: "บรรลุนิติภาวะเมื่ออายุ 20 ปีบริบูรณ์ หรือโดยการสมรสที่ชอบด้วยกฎหมาย — คนละเรื่องกับสิทธิเลือกตั้งซึ่งเริ่มที่ 18 ปี"
    difficulty: 2

  - qid: soc_econ_001
    topic: soc_econ
    stem: "ถ้าอุปสงค์ (demand) ของสินค้าเพิ่มขึ้นขณะที่อุปทาน (supply) คงที่ ราคาดุลยภาพและปริมาณดุลยภาพจะเป็นอย่างไร"
    choices:
      - "ราคาลดลง ปริมาณเพิ่มขึ้น"
      - "ราคาสูงขึ้น ปริมาณลดลง"
      - "ราคาสูงขึ้น ปริมาณเพิ่มขึ้น"
      - "ราคาลดลง ปริมาณลดลง"
    answer: 2
    explanation: "เส้นอุปสงค์เลื่อนขวาโดยอุปทานคงที่ จุดตัดใหม่จึงอยู่สูงขึ้นและไปทางขวา — ทั้งราคาและปริมาณดุลยภาพเพิ่มขึ้น"
    difficulty: 2

  - qid: soc_econ_002
    topic: soc_econ
    stem: "ข้อใดคือความหมายของ 'ค่าเสียโอกาส' (opportunity cost)"
    choices:
      - "เงินที่จ่ายไปจริงในการซื้อสินค้า"
      - "ผลขาดทุนจากการลงทุนที่ผิดพลาด"
      - "ต้นทุนคงที่ที่ไม่เปลี่ยนตามปริมาณการผลิต"
      - "มูลค่าของทางเลือกที่ดีที่สุดที่ต้องสละไป"
    answer: 3
    explanation: "ค่าเสียโอกาสคือประโยชน์ของทางเลือกอันดับถัดไปที่ดีที่สุดซึ่งถูกสละ ไม่จำเป็นต้องเป็นตัวเงิน เช่น เวลาที่ใช้อ่านหนังสือแทนการทำงานพิเศษ"
    difficulty: 2

  - qid: soc_religion_001
    topic: soc_religion
    stem: "อริยสัจ 4 ข้อใดหมายถึง 'เหตุแห่งทุกข์'"
    choices:
      - "สมุทัย"
      - "ทุกข์"
      - "นิโรธ"
      - "มรรค"
    answer: 0
    explanation: "ทุกข์ = สภาพปัญหา, สมุทัย = เหตุแห่งทุกข์ (ตัณหา), นิโรธ = ความดับทุกข์, มรรค = ทางปฏิบัติให้ถึงความดับทุกข์"
    difficulty: 1

  - qid: soc_geo_001
    topic: soc_geo
    stem: "เส้นแบ่งเขตวันสากล (International Date Line) อยู่ใกล้เส้นใดมากที่สุด"
    choices:
      - "เส้นศูนย์สูตร"
      - "เส้นลองจิจูด 180°"
      - "เส้นเมริเดียนแรก (ลองจิจูด 0°)"
      - "เส้นทรอปิกออฟแคนเซอร์"
    answer: 1
    explanation: "เส้นแบ่งเขตวันสากลลากตามแนวลองจิจูด 180° โดยหักเลี่ยงแผ่นดินและเขตแดนประเทศบางช่วง"
    difficulty: 2

  - qid: soc_history_th_001
    topic: soc_history_th
    stem: "กรุงศรีอยุธยาเสียแก่พม่าครั้งที่ 2 ซึ่งเป็นการสิ้นสุดอาณาจักรอยุธยา ตรงกับปีใด"
    choices:
      - "พ.ศ. 2112"
      - "พ.ศ. 2325"
      - "พ.ศ. 2310"
      - "พ.ศ. 2475"
    answer: 2
    explanation: "เสียกรุงครั้งที่ 1 พ.ศ. 2112 ครั้งที่ 2 พ.ศ. 2310 ส่วน พ.ศ. 2325 คือการสถาปนากรุงรัตนโกสินทร์ และ พ.ศ. 2475 คือการเปลี่ยนแปลงการปกครอง"
    difficulty: 1

  - qid: soc_history_world_001
    topic: soc_history_world
    stem: "การปฏิวัติอุตสาหกรรมเริ่มต้นขึ้นในประเทศใดเป็นแห่งแรก"
    choices:
      - "ฝรั่งเศส"
      - "เยอรมนี"
      - "สหรัฐอเมริกา"
      - "อังกฤษ"
    answer: 3
    explanation: "เริ่มในอังกฤษช่วงกลางคริสต์ศตวรรษที่ 18 จากความพร้อมด้านถ่านหิน เหล็ก ทุน และเครื่องจักรไอน้ำ แล้วจึงแพร่สู่ยุโรปภาคพื้นทวีปและอเมริกา"
    difficulty: 1
