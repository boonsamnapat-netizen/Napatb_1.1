# คลังข้อสอบ TPAT1 ชุดที่ 2 — ขยายจากชุดตั้งต้นให้ครบเป้าหมายต่อหัวข้อ
#
# ⚠️ ข้อสอบทุกข้อในไฟล์นี้ **แต่งขึ้นใหม่** ให้ตรงแนวและระดับความยากของ TPAT1
#    ไม่ได้คัดลอกจากข้อสอบเก่าของ กสพท (ซึ่งมีลิขสิทธิ์และห้ามนำไปใช้ต่อ)
#    จึงยังไม่ได้สอบเทียบกับสถิติความยากจริง ใช้ฝึกได้ แต่คะแนนที่ได้ที่นี่
#    ไม่ใช่ตัวทำนายคะแนนสอบจริง
#
# ⚠️ พาร์ทมิติสัมพันธ์ของจริงเป็นรูปภาพ ที่นี่เป็นข้อความล้วน จึงฝึกได้แค่
#    การใช้เหตุผลเชิงพื้นที่ ไม่ได้ฝึกการอ่านรูปด้วยตา — ต้องฝึกจากหนังสือ
#    ที่มีรูปควบคู่ไปด้วยเสมอ
subject: tpat1
questions:
  # ───────────────────────────────── อนุกรม
  - qid: tpat1_series_201
    topic: tpat1_series
    stem: "1, 2, 6, 24, 120, ... จำนวนถัดไปคือข้อใด"
    choices: ["240", "600", "720", "840"]
    answer: 2
    explanation: "แต่ละพจน์ได้จากการคูณด้วยตัวเลขที่เพิ่มขึ้นทีละหนึ่ง (×2, ×3, ×4, ×5) ตัวถัดไปจึงคูณ 6 ได้ 120 × 6 = 720 (คือค่า n! นั่นเอง)"
    difficulty: 2

  - qid: tpat1_series_005
    topic: tpat1_series
    stem: "1, 4, 9, 16, 25, ... จำนวนถัดไปคือข้อใด"
    choices: ["30", "36", "34", "49"]
    answer: 1
    explanation: "เป็นกำลังสองของจำนวนนับ 1², 2², 3², 4², 5² ถัดไปคือ 6² = 36"
    difficulty: 1

  - qid: tpat1_series_006
    topic: tpat1_series
    stem: "3, 6, 18, 72, ... จำนวนถัดไปคือข้อใด"
    choices: ["216", "288", "360", "432"]
    answer: 2
    explanation: "ตัวคูณเพิ่มทีละ 1 คือ ×2, ×3, ×4 ถัดไป ×5 ดังนั้น 72 × 5 = 360"
    difficulty: 2

  - qid: tpat1_series_007
    topic: tpat1_series
    stem: "A, C, F, J, O, ... ตัวอักษรถัดไปคือข้อใด"
    choices: ["S", "T", "V", "U"]
    answer: 3
    explanation: "ระยะห่างเพิ่มทีละ 1 คือ +2, +3, +4, +5 ถัดไป +6 จาก O (ลำดับที่ 15) ไป U (ลำดับที่ 21)"
    difficulty: 2

  - qid: tpat1_series_008
    topic: tpat1_series
    stem: "1, 1, 2, 3, 5, 8, 13, ... จำนวนถัดไปคือข้อใด"
    choices: ["21", "20", "18", "26"]
    answer: 0
    explanation: "ลำดับฟีโบนักชี แต่ละพจน์คือผลบวกของสองพจน์ก่อนหน้า 8 + 13 = 21"
    difficulty: 1

  # ───────────────────────────────── อุปมาอุปไมย
  - qid: tpat1_analogy_003
    topic: tpat1_analogy
    stem: "หัวใจ : ปั๊มเลือด เปรียบได้กับ ไต : ?"
    choices: ["สร้างเม็ดเลือดแดง", "กรองของเสีย", "ย่อยอาหาร", "แลกเปลี่ยนแก๊ส"]
    answer: 1
    explanation: "ความสัมพันธ์คือ อวัยวะ : หน้าที่หลัก หน้าที่หลักของไตคือกรองของเสียออกจากเลือด ส่วนการสร้างอีริโทรโพอิทินเป็นหน้าที่รอง"
    difficulty: 1

  - qid: tpat1_analogy_004
    topic: tpat1_analogy
    stem: "วัคซีน : โรค เปรียบได้กับ ประกันภัย : ?"
    choices: ["เงิน", "บริษัท", "ความเสียหาย", "สัญญา"]
    answer: 2
    explanation: "ความสัมพันธ์คือ สิ่งที่เตรียมไว้ล่วงหน้า : สิ่งที่ต้องการป้องกัน วัคซีนป้องกันโรคฉันใด ประกันภัยป้องกันความเสียหายฉันนั้น"
    difficulty: 2

  - qid: tpat1_analogy_005
    topic: tpat1_analogy
    stem: "อาการ : โรค เปรียบได้กับ ควัน : ?"
    choices: ["ความร้อน", "อากาศ", "เถ้า", "ไฟ"]
    answer: 3
    explanation: "ความสัมพันธ์คือ สิ่งที่สังเกตเห็น : สาเหตุที่อยู่เบื้องหลัง อาการเป็นสัญญาณของโรค ควันเป็นสัญญาณของไฟ"
    difficulty: 1

  - qid: tpat1_analogy_006
    topic: tpat1_analogy
    stem: "แพทย์ : วินิจฉัย เปรียบได้กับ ผู้พิพากษา : ?"
    choices: ["ตัดสิน", "ฟ้องร้อง", "สืบสวน", "แก้ต่าง"]
    answer: 0
    explanation: "ความสัมพันธ์คือ ผู้เชี่ยวชาญ : การกระทำหลักที่ใช้ดุลยพินิจตัดสินชี้ขาด แพทย์วินิจฉัย ผู้พิพากษาตัดสิน ส่วนสืบสวนเป็นหน้าที่ตำรวจ"
    difficulty: 2

  # ───────────────────────────────── มิติสัมพันธ์
  - qid: tpat1_spatial_002
    topic: tpat1_spatial
    stem: "ลูกบาศก์ถูกคลี่ออกเป็นรูปกากบาท หน้าที่อยู่ตรงข้ามกับหน้ากลางของแถวยาว คือหน้าใด"
    choices: ["หน้าที่อยู่ติดกันทางซ้าย", "หน้าที่อยู่ปลายสุดอีกด้านของแถวยาว", "หน้าบนของแกนตั้ง", "หน้าล่างของแกนตั้ง"]
    answer: 1
    explanation: "ในแถวยาว 4 หน้าเรียงกัน หน้าที่ห่างกัน 2 ตำแหน่งจะอยู่ตรงข้ามกันเสมอเมื่อพับเป็นลูกบาศก์"
    difficulty: 3

  - qid: tpat1_spatial_003
    topic: tpat1_spatial
    stem: "ลูกบาศก์มีจุดสีแดงที่หน้าบน กลิ้งไปข้างหน้า 90 องศา แล้วหมุนตัวลูกบาศก์ไปทางขวารอบแกนตั้ง 90 องศา จุดสีแดงจะอยู่ที่หน้าใด"
    choices: ["หน้าหลัง", "หน้าขวา", "หน้าซ้าย", "หน้าล่าง"]
    answer: 2
    explanation: "หมุนไปข้างหน้า หน้าบนกลายเป็นหน้าหน้า จากนั้นหมุนไปทางขวา หน้าหน้ากลายเป็นหน้าซ้าย"
    difficulty: 3

  - qid: tpat1_spatial_004
    topic: tpat1_spatial
    stem: "ลูกบาศก์ 3×3×3 ทาสีรอบนอกทั้งหมดแล้วตัดเป็นลูกบาศก์เล็ก 27 ลูก มีกี่ลูกที่ถูกทาสีพอดี 2 หน้า"
    choices: ["6", "8", "18", "12"]
    answer: 3
    explanation: "ลูกที่ทาสี 2 หน้าคือลูกที่อยู่กลางขอบ ลูกบาศก์มี 12 ขอบ แต่ละขอบมี 1 ลูก จึงได้ 12 ลูก (มุม 8 ลูกทา 3 หน้า กลางหน้า 6 ลูกทา 1 หน้า แกนกลาง 1 ลูกไม่ถูกทา)"
    difficulty: 3

  - qid: tpat1_spatial_005
    topic: tpat1_spatial
    stem: "มองกล่องทรงสี่เหลี่ยมมุมฉากจากด้านบนเห็นเป็นสี่เหลี่ยมจัตุรัส มองจากด้านหน้าเห็นเป็นสี่เหลี่ยมผืนผ้าสูง กล่องนี้มีรูปร่างอย่างไร"
    choices: ["แท่งสูงฐานจัตุรัส", "ลูกบาศก์", "แผ่นบางแบน", "ทรงกระบอก"]
    answer: 0
    explanation: "ภาพบนเป็นจัตุรัสแปลว่ากว้างเท่าลึก ภาพหน้าสูงกว่ากว้างแปลว่าสูงมากกว่า จึงเป็นแท่งสูงที่มีฐานเป็นจัตุรัส"
    difficulty: 2

  - qid: tpat1_spatial_006
    topic: tpat1_spatial
    stem: "กระดาษพับครึ่งสองครั้งแล้วเจาะรู 1 รูตรงมุมที่เป็นจุดศูนย์กลางของการพับ เมื่อคลี่ออกจะมีรูทั้งหมดกี่รู"
    choices: ["2", "1", "3", "4"]
    answer: 1
    explanation: "รูที่อยู่ตรงจุดศูนย์กลางของการพับพอดีจะทับกันทุกชั้น เมื่อคลี่ออกจึงเหลือรูเดียว ต่างจากการเจาะที่ตำแหน่งอื่นซึ่งจะได้ 4 รู"
    difficulty: 3

  - qid: tpat1_spatial_007
    topic: tpat1_spatial
    stem: "รูปตัว L หมุนทวนเข็มนาฬิกา 90 องศา แล้วสะท้อนตามแนวตั้ง ผลลัพธ์เหมือนกับการทำอะไรกับรูปเดิม"
    choices: ["หมุนตามเข็ม 90 องศา", "สะท้อนตามแนวนอน", "สะท้อนตามแนวทแยง", "หมุน 180 องศา"]
    answer: 2
    explanation: "การหมุนแล้วสะท้อนหนึ่งครั้งให้ผลเป็นการสะท้อนเสมอ (เปลี่ยนความถนัดซ้ายขวา) และแกนสะท้อนที่ได้คือแนวทแยง"
    difficulty: 3

  - qid: tpat1_spatial_008
    topic: tpat1_spatial
    stem: "ลูกเต๋ามาตรฐานมีผลรวมของหน้าตรงข้ามเท่ากับ 7 ถ้าหน้า 2 อยู่ด้านบนและหน้า 3 อยู่ด้านหน้า หน้าขวาเป็นเลขใดได้บ้าง"
    choices: ["3 หรือ 4", "4 หรือ 5", "2 หรือ 5", "1 หรือ 6"]
    answer: 3
    explanation: "หน้าบน 2 จับคู่กับหน้าล่าง 5 และหน้าหน้า 3 จับคู่กับหน้าหลัง 4 เหลือคู่ 1 กับ 6 ให้ซ้ายและขวา ดังนั้นหน้าขวาเป็น 1 หรือ 6 (จะเป็นตัวไหนขึ้นกับว่าลูกเต๋าถนัดซ้ายหรือขวา)"
    difficulty: 2

  # ───────────────────────────────── ตรรกะและเงื่อนไข
  - qid: tpat1_logic_003
    topic: tpat1_logic
    stem: "ถ้า 'นักเรียนทุกคนที่สอบผ่านได้อ่านหนังสือ' และ 'สมชายไม่ได้อ่านหนังสือ' สรุปได้ว่าอย่างไร"
    choices: ["สมชายสอบไม่ผ่าน", "สมชายสอบผ่าน", "สมชายอาจสอบผ่านก็ได้", "สรุปไม่ได้"]
    answer: 0
    explanation: "รูปแบบ modus tollens: ถ้า P แล้ว Q, ไม่ Q, จึงไม่ P เมื่อสมชายไม่ได้อ่าน เขาจึงไม่อยู่ในกลุ่มที่สอบผ่าน"
    difficulty: 2

  - qid: tpat1_logic_004
    topic: tpat1_logic
    stem: "'ยาบางชนิดมีผลข้างเคียง' ข้อความใดต่อไปนี้ขัดแย้งกับประโยคนี้"
    choices: ["ยาทุกชนิดมีผลข้างเคียง", "ยาไม่มีชนิดใดมีผลข้างเคียง", "ยาบางชนิดไม่มีผลข้างเคียง", "ยาชนิดนี้มีผลข้างเคียง"]
    answer: 1
    explanation: "นิเสธของ 'บางตัวมี' คือ 'ไม่มีตัวไหนมีเลย' ส่วน 'ทุกชนิดมี' สอดคล้องกันได้ และ 'บางชนิดไม่มี' ก็อยู่ร่วมกันได้"
    difficulty: 2

  # เดิมข้อนี้เป็นโจทย์เดียวกับ tpat1_logic_002 เป๊ะ ๆ ต่างแค่ลำดับตัวเลือก
  - qid: tpat1_logic_005
    topic: tpat1_logic
    stem: "นักเรียน 5 คนสอบได้คะแนนไม่เท่ากัน: ก ได้มากกว่า ข, ค ได้น้อยกว่า ง, ข ได้มากกว่า ง, จ ได้มากกว่า ก ใครได้คะแนนอันดับที่ 3"
    choices: ["ก", "ข", "ค", "ง"]
    answer: 1
    explanation: "จาก จ > ก > ข > ง > ค เรียงได้ จ(1) ก(2) ข(3) ง(4) ค(5) อันดับที่ 3 คือ ข"
    difficulty: 2

  - qid: tpat1_logic_006
    topic: tpat1_logic
    stem: "หมอ 4 คนเข้าเวร จันทร์ถึงพฤหัสบดี วันละคน ก ไม่เข้าวันจันทร์ ข เข้าเวรก่อน ค ง เข้าวันพฤหัสบดี ถ้า ก เข้าวันอังคาร ค เข้าวันใด"
    choices: ["จันทร์", "อังคาร", "พฤหัสบดี", "พุธ"]
    answer: 3
    explanation: "ง อยู่พฤหัสบดี ก อยู่อังคาร เหลือวันจันทร์กับวันพุธให้ ข และ ค เงื่อนไข ข ก่อน ค บังคับให้ ข อยู่จันทร์ และ ค อยู่พุธ"
    difficulty: 3

  - qid: tpat1_logic_007
    topic: tpat1_logic
    stem: "ข้อความ 'ถ้าฝนตก ถนนจะเปียก' ข้อใดคือข้อความแย้งสลับที่ (contrapositive) ที่สมมูลกัน"
    choices: ["ถ้าถนนไม่เปียก แสดงว่าฝนไม่ตก", "ถ้าฝนไม่ตก ถนนจะไม่เปียก", "ถ้าถนนเปียก แสดงว่าฝนตก", "ถนนเปียกก็ต่อเมื่อฝนตก"]
    answer: 0
    explanation: "contrapositive ของ 'ถ้า P แล้ว Q' คือ 'ถ้าไม่ Q แล้วไม่ P' ซึ่งสมมูลกันเสมอ ส่วนอีกสองข้อคือบทกลับและการปฏิเสธ ซึ่งไม่สมมูล"
    difficulty: 2

  - qid: tpat1_logic_008
    topic: tpat1_logic
    stem: "ผู้ป่วย 100 คน มีไข้ 60 คน ไอ 50 คน มีทั้งไข้และไอ 30 คน มีกี่คนที่ไม่มีทั้งสองอาการ"
    choices: ["10", "20", "30", "40"]
    answer: 1
    explanation: "มีอย่างน้อยหนึ่งอาการ = 60 + 50 − 30 = 80 คน จึงเหลือคนที่ไม่มีอาการใดเลย 100 − 80 = 20 คน"
    difficulty: 2

  # ───────────────────────────────── คณิตคิดเร็ว
  - qid: tpat1_quant_002
    topic: tpat1_quant
    stem: "ยา 1 เม็ดมีตัวยา 250 มก. แพทย์สั่ง 1 กรัมต่อวัน แบ่ง 4 มื้อ ต้องกินมื้อละกี่เม็ด"
    choices: ["0.5", "2", "1", "4"]
    answer: 2
    explanation: "1 กรัม = 1000 มก. หาร 4 มื้อ ได้มื้อละ 250 มก. เท่ากับ 1 เม็ดพอดี"
    difficulty: 1

  - qid: tpat1_quant_003
    topic: tpat1_quant
    stem: "ผู้ป่วยหนัก 60 กก. ต้องได้ยา 5 มก. ต่อน้ำหนักตัว 1 กก. ยามีความเข้มข้น 50 มก./มล. ต้องฉีดกี่มิลลิลิตร"
    choices: ["3", "30", "12", "6"]
    answer: 3
    explanation: "ต้องการยา 60 × 5 = 300 มก. หารด้วยความเข้มข้น 50 มก./มล. ได้ 6 มล."
    difficulty: 2

  - qid: tpat1_quant_004
    topic: tpat1_quant
    stem: "อัตราการเต้นของหัวใจ 72 ครั้งต่อนาที ใน 1 ชั่วโมงหัวใจเต้นกี่ครั้ง"
    choices: ["4,320", "3,600", "4,800", "7,200"]
    answer: 0
    explanation: "72 × 60 = 4,320 ครั้ง"
    difficulty: 1

  - qid: tpat1_quant_005
    topic: tpat1_quant
    stem: "การตรวจคัดกรองมีความไว 90% ในกลุ่มผู้ป่วยจริง 200 คน จะตรวจพบกี่คน และพลาดกี่คน"
    choices: ["พบ 190 พลาด 10", "พบ 180 พลาด 20", "พบ 20 พลาด 180", "พบ 90 พลาด 110"]
    answer: 1
    explanation: "ความไวคือสัดส่วนผู้ป่วยจริงที่ตรวจพบ 200 × 0.90 = 180 คน เหลือผลลบลวง 20 คน"
    difficulty: 2

  - qid: tpat1_quant_006
    topic: tpat1_quant
    stem: "น้ำเกลือ 500 มล. ให้หยดหมดใน 4 ชั่วโมง ชุดให้สารน้ำ 20 หยดต่อมิลลิลิตร ต้องปรับกี่หยดต่อนาที"
    choices: ["21", "63", "42", "84"]
    answer: 2
    explanation: "500 มล. × 20 หยด/มล. = 10,000 หยด หารด้วย 240 นาที ได้ประมาณ 42 หยดต่อนาที"
    difficulty: 3

  # ───────────────────────────────── จริยธรรม: หลักการ
  - qid: tpat1_ethics_principle_003
    topic: tpat1_ethics_principle
    stem: "หลัก autonomy (การเคารพในการตัดสินใจของผู้ป่วย) หมายถึงข้อใด"
    choices: ["แพทย์ตัดสินใจแทนผู้ป่วยได้ เพราะเป็นผู้มีความรู้เรื่องโรคมากกว่าผู้ป่วยเอง", "โรงพยาบาลกำหนดแนวทางรักษาเป็นมาตรฐานเดียวกัน เพื่อความเป็นธรรมกับทุกคน", "ญาติเป็นผู้ตัดสินใจแทนเสมอ เพราะเป็นผู้ที่รู้จักผู้ป่วยดีที่สุดในทางปฏิบัติ", "ผู้ป่วยมีสิทธิ์ตัดสินใจเรื่องร่างกายตนเองหลังได้รับข้อมูลครบ"]
    answer: 3
    explanation: "autonomy คือสิทธิ์ของผู้ป่วยที่จะเลือกเองบนพื้นฐานของข้อมูลที่ครบถ้วน แพทย์มีหน้าที่ให้ข้อมูล ไม่ใช่เลือกแทน"
    difficulty: 1

  - qid: tpat1_ethics_principle_004
    topic: tpat1_ethics_principle
    stem: "หลัก non-maleficence ตรงกับสำนวนใดมากที่สุด"
    choices: ["อย่างน้อยอย่าทำให้แย่ลง", "ทำให้ดีที่สุด", "แบ่งปันอย่างเป็นธรรม", "เคารพการตัดสินใจ"]
    answer: 0
    explanation: "non-maleficence คือ 'ไม่ก่ออันตราย' (primum non nocere) ต่างจาก beneficence ที่เป็นการทำประโยชน์เชิงรุก"
    difficulty: 1

  - qid: tpat1_ethics_principle_005
    topic: tpat1_ethics_principle
    stem: "เตียง ICU เหลือ 1 เตียง มีผู้ป่วยหนัก 2 คนพร้อมกัน การตัดสินใจนี้เกี่ยวข้องกับหลักใดมากที่สุด"
    choices: ["autonomy", "justice", "non-maleficence", "beneficence"]
    answer: 1
    explanation: "justice คือการจัดสรรทรัพยากรที่มีจำกัดอย่างเป็นธรรม ซึ่งเป็นแก่นของสถานการณ์นี้"
    difficulty: 2

  - qid: tpat1_ethics_principle_006
    topic: tpat1_ethics_principle
    stem: "การให้ยาแก้ปวดขนาดสูงในผู้ป่วยระยะสุดท้าย ที่อาจกดการหายใจแต่ลดความทรมานได้ ขัดแย้งระหว่างหลักใดกับหลักใด"
    choices:
      - "autonomy กับ justice"
      - "justice กับ non-maleficence"
      - "beneficence กับ non-maleficence"
      - "autonomy กับ beneficence"
    answer: 2
    explanation: "ต้องการทำประโยชน์คือลดความทรมาน (beneficence) แต่เสี่ยงก่ออันตรายคือกดการหายใจ (non-maleficence) เป็นตัวอย่างคลาสสิกของหลักผลสองทาง"
    difficulty: 3

  - qid: tpat1_ethics_principle_007
    topic: tpat1_ethics_principle
    stem: "informed consent ที่สมบูรณ์ต้องมีองค์ประกอบใดครบ"
    choices: ["ผู้ป่วยลงลายมือชื่อในเอกสารยินยอมที่โรงพยาบาลจัดเตรียมไว้ให้ครบถ้วน", "แพทย์อธิบายขั้นตอนและความเสี่ยงให้ผู้ป่วยฟังอย่างละเอียดหนึ่งครั้ง", "ญาติสายตรงรับทราบแผนการรักษาและลงนามยินยอมร่วมกับผู้ป่วย", "ให้ข้อมูลครบ ผู้ป่วยเข้าใจ และตัดสินใจโดยสมัครใจ"]
    answer: 3
    explanation: "ลายเซ็นเป็นเพียงหลักฐาน แก่นจริงคือข้อมูลครบ (disclosure) ความเข้าใจ (comprehension) และความสมัครใจ (voluntariness) ครบทั้งสามจึงจะสมบูรณ์"
    difficulty: 2

  - qid: tpat1_ethics_principle_008
    topic: tpat1_ethics_principle
    stem: "ผู้ป่วยผู้ใหญ่ที่มีสติสัมปชัญญะสมบูรณ์ปฏิเสธการรักษาที่ช่วยชีวิตได้ แพทย์ควรทำอย่างไรตามหลักจริยธรรม"
    choices: ["ให้ข้อมูลผลที่ตามมาให้ครบ แล้วเคารพการตัดสินใจ", "รักษาไปเลยเพราะการช่วยชีวิตสำคัญกว่าความต้องการชั่วครู่ของผู้ป่วย", "ให้ญาติสายตรงเซ็นยินยอมแทน เพราะเป็นผู้รับผลกระทบร่วมกับผู้ป่วย", "ส่งต่อให้แพทย์ท่านอื่นเป็นผู้ตัดสินใจ เพื่อเลี่ยงความรับผิดทางกฎหมาย"]
    answer: 0
    explanation: "ผู้ป่วยที่มีความสามารถในการตัดสินใจมีสิทธิ์ปฏิเสธการรักษาได้แม้จะเสียชีวิต หน้าที่แพทย์คือทำให้แน่ใจว่าเขาเข้าใจผลที่ตามมาจริง ไม่ใช่ล้มการตัดสินใจนั้น"
    difficulty: 3

  # ───────────────────────────────── จริยธรรม: กรณีศึกษา
  - qid: tpat1_ethics_case_003
    topic: tpat1_ethics_case
    stem: "เพื่อนร่วมงานขอให้คุณช่วยเปิดดูผลตรวจของคนรู้จักในระบบ เพราะเป็นห่วง ควรทำอย่างไร"
    choices:
      - "เปิดให้ดูเพราะเป็นห่วงด้วยความหวังดี"
      - "ปฏิเสธ เพราะไม่ได้เป็นผู้ดูแลผู้ป่วยรายนั้น"
      - "เปิดดูเองแล้วเล่าปากเปล่า"
      - "ขออนุญาตหัวหน้าก่อนแล้วค่อยเปิด"
    answer: 1
    explanation: "การเข้าถึงข้อมูลผู้ป่วยทำได้เฉพาะเมื่อจำเป็นต่อการดูแลรักษาผู้ป่วยรายนั้นเท่านั้น ความหวังดีไม่ใช่เหตุผลที่รับได้ และการเล่าปากเปล่าก็ยังเป็นการเปิดเผยอยู่ดี"
    difficulty: 2

  - qid: tpat1_ethics_case_004
    topic: tpat1_ethics_case
    stem: "ผู้ป่วยเด็กอายุ 8 ขวบ ต้องผ่าตัดฉุกเฉิน พ่อแม่ติดต่อไม่ได้ ควรทำอย่างไร"
    choices: ["รอจนกว่าจะติดต่อพ่อแม่ได้ เพราะผู้เยาว์ยังให้ความยินยอมด้วยตนเองไม่ได้", "ให้เด็กเซ็นยินยอมเอง เพราะเป็นเจ้าของร่างกายและรับรู้เรื่องของตนได้แล้ว", "ดำเนินการรักษาตามหลักภาวะฉุกเฉินเพื่อรักษาชีวิต", "ให้พยาบาลหัวหน้าเวรเซ็นแทนไปก่อน แล้วให้พ่อแม่มาเซ็นย้อนหลังภายหลัง"]
    answer: 2
    explanation: "ในภาวะฉุกเฉินที่ชีวิตเป็นเดิมพันและไม่สามารถขอความยินยอมได้ทัน กฎหมายและจริยธรรมยอมให้รักษาไปก่อนตามหลักความยินยอมโดยปริยาย"
    difficulty: 2

  - qid: tpat1_ethics_case_005
    topic: tpat1_ethics_case
    stem: "ญาติขอร้องไม่ให้บอกผู้ป่วยว่าเป็นมะเร็ง เพราะกลัวเสียกำลังใจ แพทย์ควรยึดหลักใด"
    choices: ["ทำตามที่ญาติขอ เพราะญาติเป็นผู้ใกล้ชิดที่รู้สภาพจิตใจผู้ป่วยดีที่สุด", "บอกความจริงทั้งหมดทันทีต่อหน้าญาติ เพราะผู้ป่วยมีสิทธิรู้โรคของตนเอง", "ไม่บอกใครเลยจนกว่าการรักษาจะเสร็จสิ้น เพื่อไม่ให้กระทบกำลังใจระหว่างรักษา", "คุยกับผู้ป่วยว่าต้องการรู้แค่ไหน แล้วให้ข้อมูลตามนั้น"]
    answer: 3
    explanation: "สิทธิ์รับรู้เป็นของผู้ป่วย ไม่ใช่ญาติ แต่การบอกความจริงต้องคำนึงถึงจังหวะและความพร้อม การถามว่าเขาอยากรู้แค่ไหนจึงเคารพทั้ง autonomy และความละเอียดอ่อน"
    difficulty: 3

  - qid: tpat1_ethics_case_006
    topic: tpat1_ethics_case
    stem: "คุณเห็นรุ่นพี่แพทย์ทำหัตถการผิดขั้นตอนจนผู้ป่วยได้รับผลกระทบ ควรทำอย่างไรก่อนเป็นอันดับแรก"
    choices: ["แจ้งตามช่องทางรายงานเหตุการณ์ไม่พึงประสงค์ของโรงพยาบาล", "เงียบไว้เพราะเป็นรุ่นพี่ที่มีอาวุโสกว่า แล้วคอยระวังไม่ให้เกิดซ้ำด้วยตนเอง", "โพสต์เตือนในโซเชียลแบบไม่ระบุตัวตน เพื่อให้คนอื่นไม่ทำผิดแบบเดียวกัน", "บอกญาติผู้ป่วยโดยตรง เพราะเป็นผู้เสียหายที่มีสิทธิรู้ความจริงก่อนใคร"]
    answer: 0
    explanation: "ความปลอดภัยผู้ป่วยมาก่อนลำดับอาวุโส และช่องทางที่ถูกต้องคือระบบรายงานภายใน ซึ่งนำไปสู่การแก้ไขเชิงระบบ ส่วนการประจานในที่สาธารณะละเมิดทั้งความลับและกระบวนการ"
    difficulty: 2

  - qid: tpat1_ethics_case_007
    topic: tpat1_ethics_case
    stem: "บริษัทยาเชิญไปสัมมนาต่างประเทศฟรี พร้อมขอให้ช่วยสั่งใช้ยาของบริษัท ควรทำอย่างไร"
    choices: ["รับคำเชิญไว้ เพราะเป็นโอกาสเพิ่มพูนความรู้ทางวิชาการที่หาได้ยาก", "ปฏิเสธ เพราะเป็นผลประโยชน์ทับซ้อนที่กระทบการสั่งยา", "รับคำเชิญไว้แต่ตั้งใจว่าจะไม่สั่งยาของบริษัทนั้นเพิ่มขึ้นกว่าเดิม", "ให้เพื่อนร่วมงานที่ไม่ได้สั่งยากลุ่มนี้ไปร่วมสัมมนาแทนตัวเอง"]
    answer: 1
    explanation: "การรับผลประโยชน์ที่ผูกกับการสั่งใช้ยาคือ conflict of interest โดยตรง ซึ่งบั่นทอนหลักการตัดสินใจเพื่อประโยชน์ผู้ป่วยเป็นที่ตั้ง"
    difficulty: 2

  - qid: tpat1_ethics_case_008
    topic: tpat1_ethics_case
    stem: "ผู้ป่วยฉุกเฉินไม่มีเงินและไม่มีสิทธิ์การรักษา โรงพยาบาลควรทำอย่างไรตามหลักจริยธรรมและกฎหมายไทย"
    choices: ["ส่งต่อโรงพยาบาลรัฐทันทีโดยยังไม่เริ่มรักษา เพราะเป็นผู้รับผิดชอบสิทธิพื้นฐาน", "ให้ญาติวางเงินมัดจำก่อนจึงเริ่มรักษา เพื่อให้เป็นไปตามระเบียบการเงิน", "รักษาให้พ้นภาวะวิกฤตก่อน แล้วค่อยจัดการเรื่องสิทธิ์", "ปฏิเสธการรักษาแล้วแนะนำสถานพยาบาลอื่นที่รองรับผู้ป่วยไม่มีสิทธิ์ได้"]
    answer: 2
    explanation: "หลัก justice และกฎหมายเรื่องการแพทย์ฉุกเฉินกำหนดให้ช่วยผู้ป่วยวิกฤตก่อนเสมอ เรื่องค่าใช้จ่ายและสิทธิ์เป็นเรื่องที่ตามมาทีหลัง"
    difficulty: 2

  # ───────────────────────────────── จรรยาบรรณวิชาชีพ
  - qid: tpat1_ethics_prof_002
    topic: tpat1_ethics_prof
    stem: "แพทย์โพสต์ภาพแผลผู้ป่วยลงโซเชียลเพื่อให้ความรู้ โดยไม่เห็นหน้า แต่ระบุโรงพยาบาลและวันที่ ถือว่าอย่างไร"
    choices: ["ทำได้ เพราะไม่เห็นใบหน้าผู้ป่วยจึงไม่สามารถระบุตัวบุคคลได้อยู่แล้ว", "ทำได้ ถ้าไม่ได้ระบุชื่อและเลขประจำตัวผู้ป่วยลงไปพร้อมกับภาพนั้น", "ทำได้ ถ้าโพสต์ในกลุ่มปิดเฉพาะบุคลากรทางการแพทย์ที่มีการคัดกรองสมาชิก", "อาจละเมิดความลับ เพราะข้อมูลประกอบยังระบุตัวตนได้"]
    answer: 3
    explanation: "การระบุตัวตนไม่ได้เกิดจากใบหน้าอย่างเดียว สถานที่ วันที่ และลักษณะเฉพาะของโรครวมกันอาจชี้ตัวได้ ต้องขอความยินยอมเป็นลายลักษณ์อักษรเสมอ"
    difficulty: 2

  - qid: tpat1_ethics_prof_003
    topic: tpat1_ethics_prof
    stem: "ข้อใดคือหน้าที่ของแพทยสภาตามพระราชบัญญัติวิชาชีพเวชกรรม"
    choices: ["ควบคุมความประพฤติและออกใบอนุญาตประกอบวิชาชีพเวชกรรม", "กำหนดเพดานค่ารักษาพยาบาลของโรงพยาบาลเอกชนให้เป็นธรรมกับประชาชน", "จัดสรรงบประมาณด้านสาธารณสุขให้แก่สถานพยาบาลทั่วประเทศ", "ตรวจประเมินและรับรองคุณภาพมาตรฐานของโรงพยาบาลแต่ละแห่ง"]
    answer: 0
    explanation: "แพทยสภาเป็นองค์กรควบคุมวิชาชีพ ทำหน้าที่ออกและเพิกถอนใบอนุญาต และพิจารณาคดีจรรยาบรรณ ส่วนการรับรองคุณภาพโรงพยาบาลเป็นบทบาทของ สรพ."
    difficulty: 2

  - qid: tpat1_ethics_prof_004
    topic: tpat1_ethics_prof
    stem: "การเปิดเผยข้อมูลผู้ป่วยโดยไม่ต้องขอความยินยอม ทำได้ในกรณีใด"
    choices: ["เมื่อสื่อมวลชนร้องขอโดยอ้างประโยชน์สาธารณะในการรับรู้ข้อมูลข่าวสาร", "เมื่อกฎหมายกำหนด เช่น การรายงานโรคติดต่ออันตราย", "เมื่อผู้ป่วยเป็นบุคคลสาธารณะที่สังคมมีความสนใจในสุขภาพของเขาอยู่แล้ว", "เมื่อแพทย์ผู้รักษาพิจารณาแล้วเห็นว่าการเปิดเผยไม่ก่อความเสียหายแก่ผู้ป่วย"]
    answer: 1
    explanation: "ข้อยกเว้นของความลับผู้ป่วยต้องมีฐานทางกฎหมายรองรับ เช่น การแจ้งโรคติดต่ออันตรายหรือคำสั่งศาล ไม่ใช่ดุลยพินิจส่วนตัวหรือความสนใจของสาธารณะ"
    difficulty: 3

  - qid: tpat1_ethics_prof_005
    topic: tpat1_ethics_prof
    stem: "แพทย์รักษาคนไข้เกินขอบเขตความเชี่ยวชาญของตนจนเกิดความเสียหาย ถือเป็นความผิดฐานใดเป็นหลัก"
    choices: ["ละเมิดความลับผู้ป่วย เพราะนำข้อมูลไปใช้นอกขอบเขตที่ได้รับความยินยอมไว้", "ผลประโยชน์ทับซ้อน เพราะรับรักษาเองแทนที่จะส่งต่อให้ผู้เชี่ยวชาญกว่า", "ประกอบวิชาชีพโดยขาดความรับผิดชอบและไม่รักษามาตรฐาน", "โฆษณาเกินจริง เพราะแสดงตนว่ามีความสามารถเกินกว่าที่ได้รับการฝึกอบรมมา"]
    answer: 2
    explanation: "จรรยาบรรณกำหนดให้แพทย์ประกอบวิชาชีพภายในขอบเขตความรู้ความสามารถของตน และส่งต่อเมื่อเกินขีดความสามารถ การฝืนทำเองคือการไม่รักษามาตรฐานวิชาชีพ"
    difficulty: 2

  # ───────────────────────────────── เชื่อมโยง: หลักการ
  - qid: tpat1_connect_basic_002
    topic: tpat1_connect_basic
    stem: "ในผังเชื่อมโยง ความสัมพันธ์พื้นฐานที่ต้องแยกให้ออกมีกี่แบบ และคือแบบใดบ้าง"
    choices:
      - "2 แบบ — เกี่ยวข้องกับไม่เกี่ยวข้อง"
      - "5 แบบ — ตามจำนวนตัวเลือกในข้อสอบ"
      - "4 แบบ — เพิ่ม ลด คงที่ และสลับ"
      - "3 แบบ — เป็นเหตุ เป็นผล และเป็นทั้งเหตุและผลของกัน"
    answer: 3
    explanation: "แก่นของพาร์ทนี้คือแยกทิศทางของความสัมพันธ์: X ทำให้เกิด Y, X เป็นผลจาก Y, หรือทั้งสองทาง ส่วนตัวอักษรที่ใช้แทนแต่ละแบบให้ยึดตามที่ระบุในหัวข้อสอบปีนั้น ๆ เพราะสัญลักษณ์อาจปรับได้"
    difficulty: 1

  - qid: tpat1_connect_basic_003
    topic: tpat1_connect_basic
    stem: "ข้อความ X เป็นเหตุให้เกิด Y และ Y ก็ย้อนกลับมาเป็นเหตุให้เกิด X ด้วย ต้องบันทึกความสัมพันธ์นี้อย่างไร"
    choices:
      - "ใช้สัญลักษณ์ที่แทนความสัมพันธ์สองทาง"
      - "เลือกทิศทางที่แรงกว่าเพียงทิศเดียว"
      - "ไม่ต้องเชื่อม เพราะขัดแย้งกันเอง"
      - "เชื่อมสองเส้นแยกกัน"
    answer: 0
    explanation: "ความสัมพันธ์แบบวนกลับมีสัญลักษณ์เฉพาะสำหรับ 'เป็นทั้งเหตุและผลของกัน' การเลือกทิศเดียวคือทิ้งข้อมูลที่บทความให้มา"
    difficulty: 1

  - qid: tpat1_connect_basic_004
    topic: tpat1_connect_basic
    stem: "หลักสำคัญที่สุดในการทำพาร์ทเชื่อมโยงให้ได้คะแนนคือข้อใด"
    choices:
      - "เชื่อมให้ได้มากที่สุดเท่าที่จะทำได้"
      - "เชื่อมเฉพาะความสัมพันธ์ที่บทความระบุไว้จริง"
      - "ใช้ความรู้เดิมของตัวเองเสริมเข้าไป"
      - "เชื่อมเฉพาะข้อความที่อยู่ติดกัน"
    answer: 1
    explanation: "การให้คะแนนหักคะแนนสำหรับการเชื่อมที่บทความไม่ได้บอก การเดาหรือใช้ความรู้นอกบทความจึงทำให้เสียคะแนน ไม่ใช่ได้เพิ่ม"
    difficulty: 2

  - qid: tpat1_connect_basic_005
    topic: tpat1_connect_basic
    stem: "บทความระบุว่า 'ผู้ที่สูบบุหรี่มีความเสี่ยงมะเร็งปอดสูงขึ้น' ควรบันทึกความสัมพันธ์ระหว่างสองข้อความนี้อย่างไร"
    choices:
      - "มะเร็งปอดเป็นเหตุให้สูบบุหรี่"
      - "เป็นทั้งเหตุและผลของกันและกัน"
      - "การสูบบุหรี่เป็นเหตุให้เกิดมะเร็งปอด ทิศทางเดียว"
      - "ไม่เชื่อม เพราะเป็นแค่ความเสี่ยง"
    answer: 2
    explanation: "บทความระบุทิศทางเดียว การเชื่อมสองทางจะเป็นการเติมข้อมูลที่บทความไม่ได้บอก ส่วนคำว่า 'ความเสี่ยงสูงขึ้น' ก็ยังนับเป็นความสัมพันธ์เชิงเหตุผลที่บทความยืนยันแล้ว"
    difficulty: 1

  - qid: tpat1_connect_basic_006
    topic: tpat1_connect_basic
    stem: "ขั้นตอนแรกที่ควรทำเมื่อได้บทความเชื่อมโยงมาคือข้อใด"
    choices:
      - "เริ่มลากเส้นเชื่อมทันทีเพื่อประหยัดเวลา"
      - "ดูคำตอบตัวเลือกก่อน"
      - "อ่านบทความสองรอบให้เข้าใจก่อน"
      - "อ่านหาและวงข้อความที่กำหนดให้ก่อนทั้งหมด"
    answer: 3
    explanation: "ข้อความที่ต้องเชื่อมถูกกำหนดมาให้แล้ว การกวาดหาและทำเครื่องหมายก่อนช่วยให้อ่านรอบเดียวแล้วเก็บความสัมพันธ์ได้ครบ ประหยัดเวลากว่าการอ่านซ้ำหลายรอบ"
    difficulty: 1

  - qid: tpat1_connect_basic_007
    topic: tpat1_connect_basic
    stem: "ถ้าบทความกล่าวว่า 'ภาวะโลกร้อนทำให้ระดับน้ำทะเลสูงขึ้น และการละลายของน้ำแข็งขั้วโลกทำให้โลกร้อนขึ้นอีก' ความสัมพันธ์นี้เรียกว่าอะไร"
    choices: ["วงจรป้อนกลับเชิงบวก", "ความสัมพันธ์ทางเดียว", "ความสัมพันธ์แบบขนาน", "ความสัมพันธ์แบบสุ่ม"]
    answer: 0
    explanation: "เมื่อผลย้อนกลับไปเสริมเหตุเดิมให้แรงขึ้น เรียกว่าวงจรป้อนกลับเชิงบวก ในผังเชื่อมโยงจะปรากฏเป็นวงปิด"
    difficulty: 2

  - qid: tpat1_connect_basic_008
    topic: tpat1_connect_basic
    stem: "การเชื่อมผิดหนึ่งเส้นในพาร์ทเชื่อมโยงส่งผลอย่างไร"
    choices:
      - "ไม่มีผล ได้เท่าที่ถูก"
      - "ถูกหักคะแนน จึงไม่ควรเดา"
      - "ตัดคะแนนทั้งข้อ"
      - "ตัดคะแนนทั้งบทความ"
    answer: 1
    explanation: "เกณฑ์ให้คะแนนหักคะแนนสำหรับเส้นที่เชื่อมเกินหรือผิด กลยุทธ์ที่ถูกต้องคือเชื่อมเฉพาะที่มั่นใจ ไม่ใช่เชื่อมให้เยอะไว้ก่อน"
    difficulty: 1

  # ───────────────────────────────── เชื่อมโยง: ฝึกจับเวลา
  - qid: tpat1_connect_drill_002
    topic: tpat1_connect_drill
    stem: "พาร์ทเชื่อมโยงมี 20 ข้อความ ให้เวลา 60 นาที ควรแบ่งเวลาอ่านบทความไม่เกินกี่นาทีจึงจะเหลือเวลาลงคำตอบพอ"
    choices: ["5 นาที", "30 นาที", "15 นาที", "45 นาที"]
    answer: 2
    explanation: "ควรใช้เวลาอ่านและทำเครื่องหมายราว 15 นาที เหลือ 45 นาทีสำหรับลากผังและฝนคำตอบ ซึ่งเป็นส่วนที่กินเวลามากกว่าที่คนส่วนใหญ่ประเมินไว้"
    difficulty: 2

  - qid: tpat1_connect_drill_003
    topic: tpat1_connect_drill
    stem: "เมื่อฝึกทำเชื่อมโยงจับเวลา สิ่งที่ควรบันทึกไว้ทุกครั้งเพื่อพัฒนาคือข้อใด"
    choices:
      - "จำนวนข้อที่ทำได้"
      - "จำนวนหน้าที่อ่าน"
      - "ระยะเวลาที่ใช้ทั้งหมด"
      - "ประเภทของความสัมพันธ์ที่มักเชื่อมผิด"
    answer: 3
    explanation: "การรู้ว่าตัวเองพลาดแบบไหนซ้ำ ๆ เช่น สับสน A กับ D หรือเชื่อมเกินจากความรู้เดิม ทำให้แก้ได้ตรงจุด ต่างจากการรู้แค่คะแนนรวมซึ่งไม่บอกว่าต้องแก้อะไร"
    difficulty: 2

  - qid: tpat1_connect_drill_004
    topic: tpat1_connect_drill
    stem: "ถ้าอ่านบทความจบแล้วพบว่ามีข้อความที่หาความสัมพันธ์ไม่เจอเลย ควรทำอย่างไร"
    choices:
      - "ปล่อยว่างไว้ เพราะการเชื่อมผิดถูกหักคะแนน"
      - "เดาเชื่อมกับข้อความที่ใกล้ที่สุด"
      - "เชื่อมกับทุกข้อความเผื่อถูก"
      - "ข้ามทั้งบทความ"
    answer: 0
    explanation: "เมื่อการเชื่อมผิดถูกหักคะแนน ค่าคาดหวังของการเดาจะติดลบ การปล่อยว่างจึงดีกว่า ต่างจากข้อสอบปรนัยทั่วไปที่เดาแล้วไม่เสียอะไร"
    difficulty: 2

  - qid: tpat1_connect_drill_005
    topic: tpat1_connect_drill
    stem: "การฝึกพาร์ทเชื่อมโยงที่ได้ผลที่สุดตามหลักการเรียนรู้คือข้อใด"
    choices:
      - "อ่านเฉลยของบทความจำนวนมาก"
      - "ทำเองจับเวลา แล้วเทียบเฉลยทีละเส้นว่าพลาดตรงไหน"
      - "ท่องสัญลักษณ์ A D F H ให้แม่น"
      - "อ่านบทความวิชาการให้เยอะ"
    answer: 1
    explanation: "การดึงความรู้ออกมาใช้จริงแล้วได้ผลป้อนกลับทันที (retrieval practice + feedback) ให้ผลดีกว่าการอ่านเฉลยแบบรับข้อมูลอย่างเดียว"
    difficulty: 1

  - qid: tpat1_connect_drill_006
    topic: tpat1_connect_drill
    stem: "ข้อความ 2 ข้อความที่บทความกล่าวถึงคู่กันแต่ไม่ได้บอกว่าอันไหนทำให้เกิดอันไหน ควรทำอย่างไร"
    choices:
      - "เชื่อมด้วย A ไว้ก่อน"
      - "เชื่อมด้วย F"
      - "ไม่เชื่อม เพราะบทความไม่ได้ระบุความเป็นเหตุเป็นผล"
      - "เชื่อมด้วย D"
    answer: 2
    explanation: "การอยู่ด้วยกันไม่ใช่ความเป็นเหตุเป็นผล ถ้าบทความไม่ได้ระบุทิศทาง การเชื่อมจะกลายเป็นการเติมข้อมูลเอง ซึ่งถูกหักคะแนน"
    difficulty: 3

  - qid: tpat1_connect_drill_007
    topic: tpat1_connect_drill
    stem: "ในการฝึก ควรเริ่มจับเวลาเต็มรูปแบบเมื่อใด"
    choices:
      - "ตั้งแต่ครั้งแรกเสมอ"
      - "หลังอ่านทฤษฎีจบ"
      - "หนึ่งเดือนก่อนสอบ"
      - "หลังจากเชื่อมถูกอย่างแม่นยำโดยไม่จับเวลาได้แล้ว"
    answer: 3
    explanation: "ความเร็วที่สร้างบนความแม่นยำที่ยังไม่นิ่งจะกลายเป็นการฝึกทำผิดให้เร็วขึ้น ควรให้ความถูกต้องนิ่งก่อน แล้วค่อยบีบเวลาลงทีละขั้น"
    difficulty: 2

  - qid: tpat1_connect_drill_008
    topic: tpat1_connect_drill
    stem: "เวลาที่เหลือ 5 นาทีสุดท้ายของพาร์ทเชื่อมโยง ควรใช้ทำอะไรเป็นอันดับแรก"
    choices:
      - "ตรวจว่าฝนคำตอบตรงกับผังที่ลากไว้ครบทุกเส้น"
      - "ไล่เชื่อมข้อความที่ยังว่างอยู่ให้ครบ"
      - "อ่านบทความซ้ำอีกรอบ"
      - "ทบทวนสัญลักษณ์"
    answer: 0
    explanation: "ผังที่ถูกต้องแต่ฝนผิดตำแหน่งคือการเสียคะแนนฟรี ซึ่งเป็นความผิดพลาดที่พบบ่อยที่สุดในพาร์ทนี้ การตรวจทานการฝนจึงคุ้มค่าที่สุดในนาทีสุดท้าย"
    difficulty: 1
