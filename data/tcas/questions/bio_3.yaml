# ชุดที่ 3 — เติมเฉพาะหัวข้อที่เดิมมีน้อยกว่า 5 ข้อ หัวข้อละ 3 ข้อ
# ทำให้ทุกหัวข้อในคลังมีอย่างน้อย 7 ข้อ พอสำหรับสุ่มชุดทดสอบโดยไม่เจอข้อซ้ำเร็วเกินไป
subject: bio
questions:

  # ── ชีววิทยา: สารเคมีในสิ่งมีชีวิต ───────────────────────────
  - qid: bio_chem_101
    topic: bio_chem
    stem: "พันธะชนิดใดที่ยึดกรดอะมิโนเข้าด้วยกันเป็นสายพอลิเพปไทด์"
    choices:
    - พันธะเพปไทด์
    - พันธะไอออนิก
    - พันธะไฮโดรเจน
    - พันธะไดซัลไฟด์
    answer: 0
    explanation: "พันธะเพปไทด์เกิดจากปฏิกิริยาควบแน่นระหว่างหมู่คาร์บอกซิล (−COOH) ของกรดอะมิโนตัวหนึ่งกับหมู่อะมิโน (−NH₂) ของอีกตัว พร้อมปล่อยน้ำออกมา ส่วนพันธะไฮโดรเจนและไดซัลไฟด์เกี่ยวกับโครงสร้างระดับสูงกว่า ไม่ใช่การต่อสายหลัก"
    difficulty: 1

  - qid: bio_chem_102
    topic: bio_chem
    stem: "เอนไซม์เร่งปฏิกิริยาเคมีในเซลล์ด้วยกลไกใด"
    choices:
    - เปลี่ยนทิศทางสมดุลของปฏิกิริยา
    - ลดพลังงานกระตุ้นของปฏิกิริยา
    - เพิ่มอุณหภูมิภายในเซลล์
    - เพิ่มพลังงานให้แก่สารตั้งต้น
    answer: 1
    explanation: "เอนไซม์ลดพลังงานกระตุ้น (activation energy) ทำให้ปฏิกิริยาเกิดได้เร็วขึ้นที่อุณหภูมิร่างกาย แต่ไม่เปลี่ยนตำแหน่งสมดุลและไม่ได้เพิ่มพลังงานให้สารตั้งต้น — เอนไซม์เร่งทั้งปฏิกิริยาไปข้างหน้าและย้อนกลับเท่ากัน"
    difficulty: 2

  - qid: bio_chem_103
    topic: bio_chem
    stem: "เมื่อโปรตีนถูกความร้อนสูงจนเสียสภาพ (denature) สิ่งใดที่ **ยังคงเดิม**"
    choices:
    - โครงสร้างทุติยภูมิแบบเกลียวแอลฟา
    - ลำดับกรดอะมิโนในสายพอลิเพปไทด์
    - โครงสร้างตติยภูมิ
    - ความสามารถในการทำงานของเอนไซม์
    answer: 1
    explanation: "การเสียสภาพทำลายพันธะอ่อน (ไฮโดรเจน ไฮโดรโฟบิก) ที่ค้ำโครงสร้างระดับ 2-3-4 แต่ไม่ตัดพันธะเพปไทด์ ลำดับกรดอะมิโน (โครงสร้างปฐมภูมิ) จึงคงเดิม ส่วนการทำงานหายไปเพราะรูปร่างเปลี่ยน"
    difficulty: 2

  # ── ชีววิทยา: พฤติกรรมสัตว์ ──────────────────────────────────
  - qid: bio_behavior_101
    topic: bio_behavior
    stem: "การที่ลูกห่านเดินตามสิ่งเคลื่อนไหวชิ้นแรกที่เห็นหลังฟักออกจากไข่ เป็นพฤติกรรมแบบใด"
    choices:
    - การลองผิดลองถูก
    - รีเฟล็กซ์
    - การเรียนรู้แบบมีเงื่อนไข
    - การฝังใจ (imprinting)
    answer: 3
    explanation: "imprinting เป็นการเรียนรู้ที่เกิดได้เฉพาะในช่วงเวลาวิกฤต (critical period) สั้น ๆ หลังเกิด และเมื่อเกิดแล้วมักเปลี่ยนแปลงยาก ต่างจากการเรียนรู้แบบอื่นที่เกิดได้ตลอดชีวิต"
    difficulty: 1

  - qid: bio_behavior_102
    topic: bio_behavior
    stem: "การทดลองของพาฟลอฟที่สุนัขหลั่งน้ำลายเมื่อได้ยินเสียงกระดิ่ง เป็นตัวอย่างของอะไร"
    choices:
    - การเรียนรู้แบบฝังใจ
    - พฤติกรรมที่มีมาแต่กำเนิด
    - การวางเงื่อนไขแบบคลาสสิก
    - การวางเงื่อนไขแบบการกระทำ
    answer: 2
    explanation: "การวางเงื่อนไขแบบคลาสสิกคือการจับคู่สิ่งเร้าที่เป็นกลาง (เสียงกระดิ่ง) กับสิ่งเร้าที่ทำให้เกิดการตอบสนองอยู่แล้ว (อาหาร) จนสิ่งเร้าที่เป็นกลางกระตุ้นการตอบสนองได้เอง ต่างจากแบบการกระทำที่สัตว์เรียนรู้จากผลของพฤติกรรมตัวเอง"
    difficulty: 2

  - qid: bio_behavior_103
    topic: bio_behavior
    stem: "การเต้นรำของผึ้งงานเมื่อกลับถึงรัง ทำหน้าที่ใด"
    choices:
    - สื่อสารทิศทางและระยะทางของแหล่งอาหาร
    - ขับไล่ศัตรู
    - ควบคุมอุณหภูมิในรัง
    - เลือกคู่ผสมพันธุ์
    answer: 0
    explanation: "ผึ้งใช้การเต้นแบบส่ายท้อง (waggle dance) บอกทิศทางของแหล่งอาหารเทียบกับตำแหน่งดวงอาทิตย์ และบอกระยะทางด้วยความยาวของช่วงส่าย เป็นตัวอย่างคลาสสิกของการสื่อสารในสัตว์สังคม"
    difficulty: 2
