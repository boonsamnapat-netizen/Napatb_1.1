questions:
  # ───────────────────────── อะตอมและตารางธาตุ
  - qid: chem_atom_002
    topic: chem_atom
    stem: "ธาตุ X มีเลขอะตอม 17 การจัดเรียงอิเล็กตรอนเป็นอย่างไร และอยู่หมู่ใด"
    choices: ["2, 8, 7 หมู่ 7A", "2, 8, 7 หมู่ 5A", "2, 7, 8 หมู่ 7A", "2, 8, 8 หมู่ 8A"]
    answer: 0
    explanation: "17 อิเล็กตรอนจัดเป็น 2, 8, 7 มีเวเลนซ์อิเล็กตรอน 7 ตัวจึงอยู่หมู่ 7A (แฮโลเจน) และคาบที่ 3 เพราะมี 3 ระดับพลังงาน"
    difficulty: 1

  - qid: chem_atom_003
    topic: chem_atom
    stem: "ขนาดอะตอมของธาตุในคาบเดียวกันเปลี่ยนแปลงอย่างไรจากซ้ายไปขวา และเพราะเหตุใด"
    choices:
      - "ใหญ่ขึ้น เพราะมีอิเล็กตรอนมากขึ้น"
      - "เล็กลง เพราะประจุนิวเคลียสเพิ่มขึ้นแต่ระดับพลังงานเท่าเดิม"
      - "ไม่เปลี่ยน เพราะอยู่คาบเดียวกัน"
      - "ใหญ่ขึ้นแล้วเล็กลง"
    answer: 1
    explanation: "จำนวนโปรตอนเพิ่มขึ้นทำให้แรงดึงดูดต่อเวเลนซ์อิเล็กตรอนสูงขึ้น ขณะที่จำนวนชั้นเท่าเดิม อะตอมจึงหดเล็กลง"
    difficulty: 2

  - qid: chem_atom_004
    topic: chem_atom
    stem: "ไอโซโทปของธาตุเดียวกันต่างกันที่สิ่งใด"
    choices: ["จำนวนโปรตอน", "จำนวนอิเล็กตรอน", "จำนวนนิวตรอน", "ประจุไฟฟ้า"]
    answer: 2
    explanation: "ไอโซโทปมีเลขอะตอม (โปรตอน) เท่ากันจึงเป็นธาตุเดียวกัน แต่เลขมวลต่างกันเพราะจำนวนนิวตรอนไม่เท่ากัน สมบัติทางเคมีจึงเหมือนกันแต่มวลต่างกัน"
    difficulty: 1

  - qid: chem_atom_005
    topic: chem_atom
    stem: "ค่าพลังงานไอออไนเซชันลำดับที่หนึ่งของธาตุหมู่ 1A ต่ำ เพราะเหตุใด"
    choices:
      - "มีเวเลนซ์อิเล็กตรอนมาก"
      - "มีประจุนิวเคลียสสูง"
      - "มีขนาดอะตอมเล็ก"
      - "เสียอิเล็กตรอน 1 ตัวแล้วได้การจัดเรียงเสถียรแบบแก๊สเฉื่อย"
    answer: 3
    explanation: "โลหะหมู่ 1A มีเวเลนซ์อิเล็กตรอนตัวเดียวที่อยู่ไกลนิวเคลียส เสียไปแล้วเหลือโครงแบบแก๊สเฉื่อย จึงเสียได้ง่ายและว่องไวมาก"
    difficulty: 2

  - qid: chem_atom_006
    topic: chem_atom
    stem: "ธาตุใดมีค่าอิเล็กโทรเนกาติวิตีสูงที่สุด"
    choices: ["ฟลูออรีน", "ออกซิเจน", "คลอรีน", "ไนโตรเจน"]
    answer: 0
    explanation: "ฟลูออรีนมีค่าอิเล็กโทรเนกาติวิตีสูงที่สุด (ราว 4.0) เพราะขนาดเล็กและต้องการอิเล็กตรอนอีกเพียงตัวเดียวเพื่อครบออกเตต"
    difficulty: 1

  # ───────────────────────── พันธะเคมี
  - qid: chem_bond_003
    topic: chem_bond
    stem: "โมเลกุล CH4 มีรูปร่างและมุมพันธะเป็นอย่างไร"
    choices:
      - "เส้นตรง 180 องศา"
      - "ทรงสี่หน้า 109.5 องศา"
      - "พีระมิดฐานสามเหลี่ยม 107 องศา"
      - "มุมงอ 104.5 องศา"
    answer: 1
    explanation: "คาร์บอนมีคู่อิเล็กตรอนรอบตัว 4 คู่ที่เป็นพันธะทั้งหมด ไม่มีคู่โดดเดี่ยว จึงกระจายเป็นทรงสี่หน้าสมมาตรมุม 109.5 องศา"
    difficulty: 2

  - qid: chem_bond_004
    topic: chem_bond
    stem: "เหตุใด H2O มีมุมพันธะ 104.5 องศา ซึ่งเล็กกว่า 109.5 องศา"
    choices:
      - "ออกซิเจนมีขนาดเล็ก"
      - "ไฮโดรเจนเบามาก"
      - "คู่อิเล็กตรอนโดดเดี่ยว 2 คู่ผลักแรงกว่าคู่พันธะ จึงบีบมุมให้แคบลง"
      - "มีพันธะไฮโดรเจนระหว่างโมเลกุล"
    answer: 2
    explanation: "ตามทฤษฎี VSEPR คู่โดดเดี่ยวอยู่ใกล้นิวเคลียสกว่าจึงมีแรงผลักมากกว่าคู่พันธะ ทำให้มุมระหว่างพันธะ O-H หดลงจาก 109.5 เหลือ 104.5 องศา"
    difficulty: 3

  - qid: chem_bond_005
    topic: chem_bond
    stem: "สารใดมีพันธะไฮโดรเจนระหว่างโมเลกุล"
    choices: ["CH4", "Cl2", "CO2", "NH3"]
    answer: 3
    explanation: "พันธะไฮโดรเจนเกิดเมื่อ H ต่อกับ N, O หรือ F โดยตรง NH3 จึงเกิดได้ ส่วน CH4 มี H ต่อกับ C ซึ่งอิเล็กโทรเนกาติวิตีไม่ต่างพอ"
    difficulty: 2

  - qid: chem_bond_006
    topic: chem_bond
    stem: "โมเลกุล CO2 เป็นโมเลกุลไม่มีขั้วทั้งที่มีพันธะมีขั้ว เพราะเหตุใด"
    choices:
      - "รูปร่างเส้นตรงสมมาตร โมเมนต์ขั้วสองข้างหักล้างกันพอดี"
      - "ออกซิเจนไม่มีขั้ว"
      - "คาร์บอนอยู่ตรงกลาง"
      - "มีพันธะคู่จึงไม่มีขั้ว"
    answer: 0
    explanation: "สภาพขั้วของโมเลกุลขึ้นกับผลรวมเวกเตอร์ของโมเมนต์ขั้ว เมื่อ O=C=O เรียงตรงและสมมาตร เวกเตอร์สองทิศจึงหักล้างกันเป็นศูนย์ ต่างจาก H2O ที่มุมงอ"
    difficulty: 3

  - qid: chem_bond_007
    topic: chem_bond
    stem: "สารประกอบไอออนิกมีจุดหลอมเหลวสูง เพราะเหตุใด"
    choices:
      - "มีมวลโมเลกุลมาก"
      - "แรงดึงดูดไฟฟ้าสถิตระหว่างไอออนบวกและลบในผลึกแข็งแรงมาก"
      - "มีพันธะไฮโดรเจน"
      - "มีอิเล็กตรอนอิสระ"
    answer: 1
    explanation: "ผลึกไอออนิกยึดกันด้วยแรงคูลอมบ์ทั่วทั้งโครงร่างสามมิติ ต้องใช้พลังงานสูงมากจึงจะทำลายได้ ส่วนอิเล็กตรอนอิสระเป็นลักษณะของพันธะโลหะ"
    difficulty: 1

  - qid: chem_bond_008
    topic: chem_bond
    stem: "โลหะนำไฟฟ้าได้ดีเพราะเหตุใด"
    choices:
      - "มีไอออนเคลื่อนที่ได้"
      - "มีพันธะโคเวเลนต์แข็งแรง"
      - "มีทะเลอิเล็กตรอนที่เคลื่อนที่ได้อิสระทั่วทั้งก้อน"
      - "มีจุดหลอมเหลวสูง"
    answer: 2
    explanation: "เวเลนซ์อิเล็กตรอนของโลหะไม่ยึดติดกับอะตอมใดอะตอมหนึ่ง แต่เคลื่อนที่ได้ทั่วโครงผลึก จึงนำทั้งไฟฟ้าและความร้อน และทำให้โลหะตีแผ่ได้"
    difficulty: 1

  # ───────────────────────── ปริมาณสัมพันธ์
  - qid: chem_mole_003
    topic: chem_mole
    stem: "น้ำ 36 กรัม คิดเป็นกี่โมล"
    choices: ["1", "36", "18", "2"]
    answer: 3
    explanation: "มวลโมเลกุลของ H2O = 2(1) + 16 = 18 g/mol ดังนั้น 36/18 = 2 โมล"
    difficulty: 1

  - qid: chem_mole_004
    topic: chem_mole
    stem: "แก๊ส O2 จำนวน 0.5 โมล ที่ STP มีปริมาตรเท่าใด"
    choices: ["11.2 ลิตร", "5.6 ลิตร", "22.4 ลิตร", "44.8 ลิตร"]
    answer: 0
    explanation: "ที่ STP แก๊ส 1 โมลมีปริมาตร 22.4 ลิตร ดังนั้น 0.5 × 22.4 = 11.2 ลิตร"
    difficulty: 1

  - qid: chem_mole_005
    topic: chem_mole
    stem: "ต้องเตรียมสารละลาย NaOH เข้มข้น 0.5 mol/dm³ ปริมาตร 200 cm³ ต้องใช้ NaOH กี่กรัม"
    choices: ["2", "4", "8", "20"]
    answer: 1
    explanation: "จำนวนโมล = 0.5 × 0.200 = 0.1 โมล มวลโมเลกุล NaOH = 23 + 16 + 1 = 40 ดังนั้นมวล = 0.1 × 40 = 4 กรัม"
    difficulty: 2

  - qid: chem_mole_006
    topic: chem_mole
    stem: "จากสมการ 2H2 + O2 → 2H2O ถ้าใช้ H2 4 โมล และ O2 1 โมล สารใดเป็นสารกำหนดปริมาณ"
    choices: ["H2", "ทั้งคู่พอดี", "O2", "H2O"]
    answer: 2
    explanation: "อัตราส่วนต้องการคือ H2 : O2 = 2 : 1 ถ้าใช้ O2 1 โมล ต้องการ H2 เพียง 2 โมล แต่มี 4 โมล ดังนั้น O2 หมดก่อนจึงเป็นสารกำหนดปริมาณ"
    difficulty: 2

  - qid: chem_mole_007
    topic: chem_mole
    stem: "เผา CaCO3 100 กรัม ได้ CaO กี่กรัม ตามสมการ CaCO3 → CaO + CO2 (ถ้าเกิดสมบูรณ์)"
    choices: ["44", "100", "78", "56"]
    answer: 3
    explanation: "มวลโมเลกุล CaCO3 = 40 + 12 + 48 = 100 ดังนั้น 100 กรัม = 1 โมล ได้ CaO 1 โมล ซึ่งมีมวล 40 + 16 = 56 กรัม"
    difficulty: 2

  - qid: chem_mole_008
    topic: chem_mole
    stem: "สารประกอบหนึ่งมีคาร์บอน 40%, ไฮโดรเจน 6.7%, ออกซิเจน 53.3% โดยมวล สูตรอย่างง่ายคือข้อใด"
    choices: ["CH2O", "CHO", "C2H4O2", "C6H12O6"]
    answer: 0
    explanation: "หารด้วยมวลอะตอม: C 40/12 = 3.33, H 6.7/1 = 6.7, O 53.3/16 = 3.33 หารด้วยค่าน้อยสุดได้ 1 : 2 : 1 จึงเป็น CH2O"
    difficulty: 3

  # ───────────────────────── แก๊ส
  - qid: chem_gas_002
    topic: chem_gas
    stem: "แก๊สปริมาตร 4 ลิตร ที่ความดัน 1 atm ถูกอัดจนความดันเป็น 2 atm ที่อุณหภูมิคงที่ ปริมาตรใหม่เป็นเท่าใด"
    choices: ["1 ลิตร", "2 ลิตร", "4 ลิตร", "8 ลิตร"]
    answer: 1
    explanation: "กฎของบอยล์ P1V1 = P2V2 ดังนั้น (1)(4) = (2)V2 ได้ V2 = 2 ลิตร"
    difficulty: 1

  - qid: chem_gas_003
    topic: chem_gas
    stem: "ตามทฤษฎีจลน์ของแก๊ส เมื่ออุณหภูมิสูงขึ้น สิ่งใดเพิ่มขึ้นโดยตรง"
    choices: ["มวลของโมเลกุล", "ขนาดของโมเลกุล", "พลังงานจลน์เฉลี่ยของโมเลกุล", "จำนวนโมเลกุล"]
    answer: 2
    explanation: "อุณหภูมิสัมบูรณ์เป็นสัดส่วนโดยตรงกับพลังงานจลน์เฉลี่ย มวลและขนาดโมเลกุลไม่เปลี่ยน ส่วนจำนวนโมเลกุลขึ้นกับปริมาณสารที่ใส่เข้าไป"
    difficulty: 2

  - qid: chem_gas_004
    topic: chem_gas
    stem: "แก๊ส 2 ชนิดที่อุณหภูมิเดียวกัน แก๊สที่มีมวลโมเลกุลน้อยกว่าจะแพร่อย่างไร"
    choices: ["ช้ากว่า", "ไม่แพร่", "เท่ากัน", "เร็วกว่า"]
    answer: 3
    explanation: "ตามกฎของเกรแฮม อัตราการแพร่แปรผกผันกับรากที่สองของมวลโมเลกุล ที่อุณหภูมิเดียวกันโมเลกุลเบากว่าจึงเคลื่อนที่เร็วกว่า"
    difficulty: 2

  - qid: chem_gas_005
    topic: chem_gas
    stem: "แก๊สจริงเบี่ยงเบนจากแก๊สอุดมคติมากที่สุดในสภาวะใด"
    choices: ["ความดันสูง อุณหภูมิต่ำ", "ความดันต่ำ อุณหภูมิสูง", "ความดันต่ำ อุณหภูมิต่ำ", "ที่ STP เท่านั้น"]
    answer: 0
    explanation: "ความดันสูงทำให้โมเลกุลใกล้กันจนปริมาตรของตัวโมเลกุลมีนัยสำคัญ และอุณหภูมิต่ำทำให้แรงดึงดูดระหว่างโมเลกุลเด่นขึ้น ทั้งสองข้อเป็นสมมติฐานที่แก๊สอุดมคติละเลย"
    difficulty: 3

  # ───────────────────────── อัตราการเกิดปฏิกิริยา
  - qid: chem_rate_002
    topic: chem_rate
    stem: "ตัวเร่งปฏิกิริยาเพิ่มอัตราการเกิดปฏิกิริยาด้วยวิธีใด"
    choices:
      - "เพิ่มพลังงานจลน์ของโมเลกุล"
      - "เปิดเส้นทางปฏิกิริยาใหม่ที่มีพลังงานก่อกัมมันต์ต่ำกว่า"
      - "เพิ่มความเข้มข้นของสารตั้งต้น"
      - "เลื่อนตำแหน่งสมดุลไปทางขวา"
    answer: 1
    explanation: "ตัวเร่งไม่ได้ทำให้โมเลกุลมีพลังงานมากขึ้น แต่ลดกำแพงพลังงานลง ทำให้โมเลกุลจำนวนมากขึ้นข้ามได้ และไม่เปลี่ยนตำแหน่งสมดุล"
    difficulty: 2

  - qid: chem_rate_003
    topic: chem_rate
    stem: "การบดของแข็งให้เป็นผงละเอียดทำให้ปฏิกิริยาเร็วขึ้นเพราะเหตุใด"
    choices:
      - "เพิ่มพลังงานก่อกัมมันต์"
      - "เพิ่มอุณหภูมิ"
      - "เพิ่มพื้นที่ผิวสัมผัส ทำให้โอกาสชนกันมากขึ้น"
      - "ลดความเข้มข้น"
    answer: 2
    explanation: "อัตราการเกิดปฏิกิริยาที่ผิวขึ้นกับพื้นที่สัมผัส ผงละเอียดมีพื้นที่ผิวรวมมากกว่าก้อนใหญ่หลายเท่าจึงเกิดเร็วกว่ามาก"
    difficulty: 1

  - qid: chem_rate_004
    topic: chem_rate
    stem: "ปฏิกิริยาหนึ่งมีกฎอัตรา rate = k[A]²[B] ถ้าเพิ่มความเข้มข้นของ A เป็น 2 เท่า อัตราจะเปลี่ยนอย่างไร"
    choices: ["เพิ่ม 2 เท่า", "ไม่เปลี่ยน", "เพิ่ม 8 เท่า", "เพิ่ม 4 เท่า"]
    answer: 3
    explanation: "A มีอันดับ 2 เมื่อ [A] เพิ่ม 2 เท่า อัตราจึงเพิ่ม 2² = 4 เท่า"
    difficulty: 2

  - qid: chem_rate_005
    topic: chem_rate
    stem: "อุณหภูมิที่สูงขึ้นทำให้ปฏิกิริยาเร็วขึ้นเพราะเหตุผลใดเป็นหลัก"
    choices:
      - "สัดส่วนโมเลกุลที่มีพลังงานสูงกว่าพลังงานก่อกัมมันต์เพิ่มขึ้นมาก"
      - "โมเลกุลชนกันบ่อยขึ้นเท่านั้น"
      - "พลังงานก่อกัมมันต์ลดลง"
