    choices: ["การแทนที่", "การเติม", "การขจัด", "การเผาไหม้"]
    answer: 1
    explanation: "พันธะคู่ของแอลคีนแตกออกและเติมโบรมีนสองอะตอมเข้าไป การจางของสีโบรมีนจึงใช้ทดสอบความไม่อิ่มตัวได้ ส่วนแอลเคนต้องใช้แสงและเป็นการแทนที่"
    difficulty: 2

  - qid: chem_organic_005
    topic: chem_organic
    stem: "เอสเทอร์เกิดจากปฏิกิริยาระหว่างสารใดกับสารใด"
    choices:
      - "แอลกอฮอล์กับแอลดีไฮด์"
      - "เอมีนกับกรด"
      - "กรดคาร์บอกซิลิกกับแอลกอฮอล์"
      - "แอลคีนกับน้ำ"
    answer: 2
    explanation: "เอสเทอริฟิเคชันเป็นปฏิกิริยาควบแน่นระหว่างกรดคาร์บอกซิลิกกับแอลกอฮอล์ ได้เอสเทอร์และน้ำ มักใช้กรดซัลฟิวริกเป็นตัวเร่ง"
    difficulty: 2

  - qid: chem_organic_006
    topic: chem_organic
    stem: "สารใดมีจุดเดือดสูงที่สุด เมื่อมีจำนวนคาร์บอนเท่ากัน"
    choices: ["แอลเคน", "แอลคีน", "อีเทอร์", "แอลกอฮอล์"]
    answer: 3
    explanation: "แอลกอฮอล์มีหมู่ −OH ที่สร้างพันธะไฮโดรเจนระหว่างโมเลกุลได้ จึงต้องใช้พลังงานมากกว่าในการแยกโมเลกุลออกจากกัน"
    difficulty: 2

  - qid: chem_organic_007
    topic: chem_organic
    stem: "การเรียกชื่อ CH3-CH(CH3)-CH2-CH3 ตามระบบ IUPAC คือข้อใด"
    choices: ["2-เมทิลบิวเทน", "3-เมทิลบิวเทน", "2-เมทิลโพรเพน", "เพนเทน"]
    answer: 0
    explanation: "โซ่หลักยาวที่สุดมี 4 คาร์บอน (บิวเทน) มีหมู่เมทิลเกาะ นับจากปลายที่ให้เลขน้อยกว่าได้ตำแหน่งที่ 2 จึงเป็น 2-เมทิลบิวเทน"
    difficulty: 3

  - qid: chem_organic_008
    topic: chem_organic
    stem: "เบนซีนมีสมบัติเสถียรกว่าที่คาดจากสูตร C6H6 เพราะเหตุใด"
    choices:
      - "มีพันธะเดี่ยวทั้งหมด"
      - "อิเล็กตรอนพายกระจายตัวทั่ววง (delocalization) ทำให้เสถียร"
      - "มีมวลโมเลกุลมาก"
      - "มีพันธะไฮโดรเจน"
    answer: 1
    explanation: "อิเล็กตรอนพาย 6 ตัวไม่ได้อยู่ประจำที่พันธะคู่ใดพันธะหนึ่ง แต่กระจายทั่ววงหกเหลี่ยม ทำให้พลังงานต่ำลงและเบนซีนชอบปฏิกิริยาแทนที่มากกว่าการเติม"
    difficulty: 3

  # ───────────────────────── พอลิเมอร์
  - qid: chem_polymer_002
    topic: chem_polymer
    stem: "พอลิเมอไรเซชันแบบเติม (addition) ต่างจากแบบควบแน่น (condensation) อย่างไร"
    choices:
      - "แบบเติมมีผลพลอยได้เป็นน้ำ"
      - "แบบควบแน่นใช้มอนอเมอร์ที่มีพันธะคู่"
      - "แบบเติมไม่มีผลพลอยได้ แบบควบแน่นปล่อยโมเลกุลเล็ก เช่น น้ำ ออกมา"
      - "ทั้งสองเหมือนกัน"
    answer: 2
    explanation: "แบบเติมใช้มอนอเมอร์ที่มีพันธะคู่ต่อกันโดยไม่สูญเสียอะตอมใด ส่วนแบบควบแน่น เช่น ไนลอนและพอลิเอสเทอร์ ปล่อยน้ำหรือโมเลกุลเล็กออกทุกครั้งที่เชื่อม"
    difficulty: 2

  - qid: chem_polymer_003
    topic: chem_polymer
    stem: "พลาสติกเทอร์มอเซตต่างจากเทอร์มอพลาสติกอย่างไร"
    choices:
      - "เทอร์มอเซตหลอมซ้ำได้"
      - "ทั้งสองรีไซเคิลได้เหมือนกัน"
      - "เทอร์มอพลาสติกแข็งกว่าเสมอ"
      - "เทอร์มอเซตมีพันธะเชื่อมขวางระหว่างสาย จึงหลอมซ้ำไม่ได้"
    answer: 3
    explanation: "พันธะเชื่อมขวางทำให้โครงสร้างเป็นร่างแหสามมิติถาวร ให้ความร้อนแล้วไหม้ไม่ละลาย จึงรีไซเคิลด้วยการหลอมไม่ได้ ต่างจากเทอร์มอพลาสติกที่สายเรียงกันหลวม ๆ"
    difficulty: 2

  - qid: chem_polymer_004
    topic: chem_polymer
    stem: "มอนอเมอร์ของพอลิเอทิลีนคือสารใด"
    choices: ["เอทีน (เอทิลีน)", "เอทานอล", "เอเทน", "กรดอะซิติก"]
    answer: 0
    explanation: "พอลิเอทิลีนเกิดจากเอทีน CH2=CH2 ต่อกันด้วยพอลิเมอไรเซชันแบบเติม พันธะคู่แตกออกกลายเป็นสายยาว"
    difficulty: 1

  # ───────────────────────── สารชีวโมเลกุล
  - qid: chem_biomol_002
    topic: chem_biomol
    stem: "คาร์โบไฮเดรตประเภทใดที่ร่างกายมนุษย์ย่อยไม่ได้"
    choices: ["แป้ง", "เซลลูโลส", "ไกลโคเจน", "มอลโทส"]
    answer: 1
    explanation: "เซลลูโลสมีพันธะเบตา-1,4-ไกลโคซิดิกซึ่งมนุษย์ไม่มีเอนไซม์ย่อย จึงผ่านออกมาเป็นใยอาหาร ต่างจากแป้งที่เป็นพันธะแอลฟา"
    difficulty: 2

  - qid: chem_biomol_003
    topic: chem_biomol
    stem: "ไขมันอิ่มตัวต่างจากไขมันไม่อิ่มตัวอย่างไร"
    choices:
      - "อิ่มตัวมีพันธะคู่ในสายกรดไขมัน"
      - "อิ่มตัวมีจุดหลอมเหลวต่ำกว่า"
      - "อิ่มตัวไม่มีพันธะคู่ สายเรียงชิดกันได้ จึงเป็นของแข็งที่อุณหภูมิห้อง"
      - "ไม่อิ่มตัวพบเฉพาะในสัตว์"
    answer: 2
    explanation: "พันธะคู่แบบซิสทำให้สายหักงอ เรียงชิดกันไม่ได้ แรงระหว่างโมเลกุลจึงน้อยและเป็นของเหลว ส่วนไขมันอิ่มตัวสายตรงเรียงชิดจึงแข็งตัว"
    difficulty: 2

  - qid: chem_biomol_004
    topic: chem_biomol
    stem: "การเสียสภาพธรรมชาติของโปรตีน (denaturation) หมายถึงการเปลี่ยนแปลงระดับใด"
    choices:
      - "ลำดับกรดอะมิโนเปลี่ยน"
      - "จำนวนกรดอะมิโนลดลง"
      - "พันธะเพปไทด์ขาดทั้งหมด"
      - "โครงสร้างสามมิติคลี่ออก แต่ลำดับกรดอะมิโนยังเดิม"
    answer: 3
    explanation: "ความร้อน กรด หรือโลหะหนักทำลายพันธะไฮโดรเจนและพันธะไดซัลไฟด์ที่ยึดรูปทรงไว้ โปรตีนจึงเสียหน้าที่ แม้โครงสร้างปฐมภูมิจะยังอยู่ครบ"
    difficulty: 2

  - qid: chem_biomol_005
    topic: chem_biomol
    stem: "การทดสอบน้ำตาลรีดิวซ์ด้วยสารละลายเบเนดิกต์ให้ผลบวกอย่างไร"
    choices:
      - "เกิดตะกอนสีแดงอิฐ"
      - "เกิดสีม่วง"
      - "เกิดสีน้ำเงินเข้ม"
      - "ไม่มีการเปลี่ยนแปลง"
    answer: 0
    explanation: "น้ำตาลรีดิวซ์รีดิวซ์ Cu²⁺ สีฟ้าให้เป็น Cu2O ตะกอนสีแดงอิฐ ส่วนสีม่วงเป็นผลบวกของการทดสอบโปรตีนด้วยไบยูเรต และสีน้ำเงินเข้มคือแป้งกับไอโอดีน"
    difficulty: 1

  # ───────────────────────── อุตสาหกรรมและเชื้อเพลิง
  - qid: chem_industry_002
    topic: chem_industry
    stem: "การกลั่นลำดับส่วนของปิโตรเลียมแยกสารตามสมบัติใด"
    choices: ["ความหนาแน่น", "จุดเดือด", "สี", "ความสามารถในการละลายน้ำ"]
    answer: 1
    explanation: "สารที่มีคาร์บอนน้อยมีจุดเดือดต่ำจึงลอยขึ้นสูงในหอกลั่น ส่วนสารโมเลกุลใหญ่ควบแน่นที่ระดับล่างซึ่งร้อนกว่า"
    difficulty: 1

  - qid: chem_industry_003
    topic: chem_industry
    stem: "กระบวนการแตกสลาย (cracking) ในอุตสาหกรรมปิโตรเลียมมีจุดประสงค์ใด"
    choices:
      - "รวมโมเลกุลเล็กให้ใหญ่ขึ้น"
      - "กำจัดกำมะถัน"
      - "แตกไฮโดรคาร์บอนโมเลกุลใหญ่ที่ขายยากให้เป็นโมเลกุลเล็กที่มีมูลค่าสูงกว่า"
      - "เพิ่มความหนืด"
    answer: 2
    explanation: "ความต้องการน้ำมันเบนซินสูงกว่าเศษส่วนหนัก การแตกสลายด้วยความร้อนหรือตัวเร่งจึงเปลี่ยนโมเลกุลใหญ่เป็นแอลเคนสายสั้นและแอลคีนที่ใช้ทำพอลิเมอร์"
    difficulty: 2

  - qid: chem_industry_004
    topic: chem_industry
    stem: "ฝนกรดเกิดจากแก๊สชนิดใดเป็นหลัก"
    choices: ["CO2 และ CH4", "CFC", "O2 และ N2", "SO2 และ NOx"]
    answer: 3
    explanation: "ซัลเฟอร์ไดออกไซด์จากการเผาเชื้อเพลิงที่มีกำมะถันและไนโตรเจนออกไซด์จากเครื่องยนต์ ทำปฏิกิริยากับน้ำในบรรยากาศเกิดกรดซัลฟิวริกและกรดไนตริก"
    difficulty: 1

  # ───────────────────────── ทักษะปฏิบัติการ
  - qid: chem_lab_002
    topic: chem_lab
    stem: "การเจือจางกรดซัลฟิวริกเข้มข้นต้องทำอย่างไร"
    choices:
      - "เทกรดลงในน้ำอย่างช้า ๆ พร้อมคน"
      - "เทน้ำลงในกรด"
      - "เทพร้อมกันทั้งสองอย่าง"
      - "ผสมในภาชนะปิด"
    answer: 0
    explanation: "การเจือจางคายความร้อนมาก ถ้าเทน้ำลงในกรด น้ำปริมาณน้อยจะเดือดกระเด็นพากรดออกมา การเทกรดลงน้ำทำให้ความร้อนกระจายในน้ำปริมาณมาก"
    difficulty: 1

  - qid: chem_lab_003
    topic: chem_lab
    stem: "อุปกรณ์ใดเหมาะที่สุดสำหรับวัดปริมาตรสารละลายอย่างแม่นยำในการไทเทรต"
    choices: ["บีกเกอร์", "บิวเรต", "กระบอกตวง", "หลอดทดลอง"]
    answer: 1
    explanation: "บิวเรตอ่านได้ละเอียดถึง 0.05 cm³ และควบคุมการปล่อยทีละหยดได้ ส่วนบีกเกอร์กับกระบอกตวงมีความคลาดเคลื่อนสูงเกินไปสำหรับการไทเทรต"
    difficulty: 1

  - qid: chem_lab_004
    topic: chem_lab
    stem: "การอ่านปริมาตรของเหลวในบิวเรตต้องอ่านที่ตำแหน่งใด"
    choices:
      - "ขอบบนของของเหลว"
      - "ขอบของภาชนะ"
      - "ส่วนโค้งต่ำสุดของเมนิสคัส โดยให้ระดับสายตาอยู่ตรงกับผิวของเหลว"
      - "ตำแหน่งใดก็ได้"
    answer: 2
    explanation: "ของเหลวส่วนใหญ่ในแก้วมีเมนิสคัสเว้า จึงอ่านที่ท้องโค้งล่าง และต้องอยู่ระดับสายตาเพื่อหลีกเลี่ยงความคลาดเคลื่อนจากพารัลแลกซ์"
    difficulty: 1
