  - qid: bio_evolution_003
    topic: bio_evolution
    stem: "ประชากรอยู่ในสมดุลฮาร์ดี-ไวน์เบิร์ก ถ้าความถี่อัลลีลด้อย q = 0.2 ความถี่ของเฮเทอโรไซกัสเป็นเท่าใด"
