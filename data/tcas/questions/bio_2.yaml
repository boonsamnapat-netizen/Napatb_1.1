    choices:
      - "เป็นแม่แบบของลำดับกรดอะมิโน"
      - "นำกรดอะมิโนมาจับกับรหัสบน mRNA ด้วยแอนติโคดอน"
      - "เป็นส่วนประกอบของไรโบโซม"
      - "ตัดต่ออินตรอนออก"
    answer: 1
    explanation: "tRNA มีแอนติโคดอนที่จับคู่สมกับโคดอนบน mRNA และอีกปลายหนึ่งพากรดอะมิโนที่ตรงกันมาต่อเป็นสายพอลิเพปไทด์"
    difficulty: 2

  - qid: bio_molgen_006
    topic: bio_molgen
    stem: "การกลายพันธุ์แบบใดที่ทำให้กรอบการอ่านรหัสเลื่อนทั้งหมด ส่งผลรุนแรงที่สุด"
    choices: ["การแทนที่เบสหนึ่งตัว", "การกลายพันธุ์แบบเงียบ", "การเพิ่มหรือขาดเบสไปหนึ่งตัว", "การแทนที่ที่ตำแหน่งที่สามของโคดอน"]
    answer: 2
    explanation: "การเพิ่มหรือขาดเบสที่ไม่ใช่ทวีคูณของสาม (frameshift) ทำให้โคดอนตั้งแต่จุดนั้นไปเปลี่ยนหมด โปรตีนที่ได้จึงมักใช้การไม่ได้เลย"
