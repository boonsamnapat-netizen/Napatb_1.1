    answer: 3
    explanation: "เพศชาย XY มี X แท่งเดียว ยีนด้อยบน X จึงแสดงออกทันทีโดยไม่มีอัลลีลคู่มาข่ม ต่างจากเพศหญิง XX ที่ต้องได้ยีนด้อยทั้งสองแท่ง"
