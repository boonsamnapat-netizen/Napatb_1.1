    choices: ["ข่มไม่สมบูรณ์", "มัลติเปิลอัลลีลและการข่มร่วม", "ยีนเชื่อมเพศ", "พอลิยีน"]
    answer: 1
    explanation: "มีอัลลีลสามแบบคือ I^A, I^B, i ในประชากร (มัลติเปิลอัลลีล) และ I^A กับ I^B ข่มร่วมกันทำให้หมู่ AB แสดงทั้งสองแอนติเจน"
    difficulty: 2

  - qid: bio_mendel_005
    topic: bio_mendel
    stem: "พ่อหมู่เลือด A แม่หมู่เลือด B มีลูกหมู่เลือด O ได้ พ่อและแม่ต้องมีจีโนไทป์ใด"
    choices: ["I^A I^A และ I^B I^B", "I^A I^B และ ii", "I^A i และ I^B i", "ii และ ii"]
