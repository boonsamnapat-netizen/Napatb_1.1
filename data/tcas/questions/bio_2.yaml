    choices:
      - "แทนที่เบสหนึ่งตำแหน่ง ทำให้กรดอะมิโนเปลี่ยนหนึ่งตัวในสายเบตาโกลบิน"
      - "ขาดโครโมโซมทั้งแท่ง"
