  # ───────────────────────── พันธุศาสตร์โมเลกุล
  - qid: bio_molgen_002
    topic: bio_molgen
    stem: "สายดีเอ็นเอมีลำดับ 5'-ATGCGT-3' สายคู่สมมีลำดับใด"
