#    จึงยังไม่ได้สอบเทียบความยากกับข้อสอบจริง
subject: bio
questions:
  # ───────────────────────── เคมีพื้นฐานของสิ่งมีชีวิต
  - qid: bio_chem_002
    topic: bio_chem
    stem: "สมบัติใดของน้ำที่ทำให้ร่างกายรักษาอุณหภูมิให้คงที่ได้ดี"
    choices: ["ความจุความร้อนจำเพาะสูง", "ความหนาแน่นสูง", "จุดเดือดต่ำ", "ไม่มีขั้ว"]
    answer: 0
    explanation: "พันธะไฮโดรเจนจำนวนมากทำให้น้ำต้องรับความร้อนมากจึงจะอุณหภูมิเปลี่ยน ร่างกายที่มีน้ำเป็นองค์ประกอบหลักจึงเปลี่ยนอุณหภูมิช้า"
    difficulty: 2

  - qid: bio_chem_003
    topic: bio_chem
    stem: "พันธะที่เชื่อมกรดอะมิโนเข้าด้วยกันในโปรตีนคือพันธะใด"
    choices: ["พันธะไกลโคซิดิก", "พันธะเพปไทด์", "พันธะเอสเทอร์", "พันธะไฮโดรเจน"]
    answer: 1
    explanation: "พันธะเพปไทด์เกิดจากปฏิกิริยาควบแน่นระหว่างหมู่คาร์บอกซิลของกรดอะมิโนหนึ่งกับหมู่อะมิโนของอีกตัว ส่วนไกลโคซิดิกเชื่อมน้ำตาล และเอสเทอร์เชื่อมกลีเซอรอลกับกรดไขมัน"
    difficulty: 1

  - qid: bio_chem_004
    topic: bio_chem
    stem: "เอนไซม์ทำงานได้เร็วขึ้นเพราะเหตุใด"
    choices:
      - "เพิ่มพลังงานให้สารตั้งต้น"
      - "เปลี่ยนทิศทางของสมดุล"
      - "ลดพลังงานก่อกัมมันต์ของปฏิกิริยา"
      - "เพิ่มปริมาณผลิตภัณฑ์สุดท้าย"
    answer: 2
    explanation: "เอนไซม์เป็นตัวเร่งชีวภาพที่ลดพลังงานก่อกัมมันต์ ทำให้ปฏิกิริยาถึงจุดเปลี่ยนได้ง่ายขึ้น แต่ไม่ได้เปลี่ยนตำแหน่งสมดุลหรือปริมาณผลิตภัณฑ์สุดท้าย"
    difficulty: 2

  # ───────────────────────── เซลล์และการลำเลียง
  - qid: bio_cell_002
    topic: bio_cell
    stem: "ออร์แกเนลล์ใดพบในเซลล์พืชแต่ไม่พบในเซลล์สัตว์"
    choices: ["ไมโทคอนเดรีย", "กอลจิบอดี", "ไรโบโซม", "คลอโรพลาสต์"]
    answer: 3
    explanation: "คลอโรพลาสต์และผนังเซลล์เซลลูโลสเป็นลักษณะเฉพาะของเซลล์พืช ส่วนออร์แกเนลล์อื่นในตัวเลือกพบได้ทั้งสองชนิด"
    difficulty: 1

  - qid: bio_cell_003
    topic: bio_cell
    stem: "เซลล์เม็ดเลือดแดงแช่ในสารละลายไฮโพโทนิก จะเกิดอะไรขึ้น"
    choices: ["บวมและอาจแตก", "เหี่ยว", "ไม่เปลี่ยนแปลง", "แบ่งตัวเร็วขึ้น"]
    answer: 0
    explanation: "สารละลายไฮโพโทนิกมีความเข้มข้นตัวถูกละลายต่ำกว่าในเซลล์ น้ำจึงออสโมซิสเข้าเซลล์ เซลล์เม็ดเลือดแดงไม่มีผนังเซลล์จึงบวมจนแตก (hemolysis)"
    difficulty: 2

  - qid: bio_cell_004
    topic: bio_cell
    stem: "โซเดียม-โพแทสเซียมปั๊มจัดเป็นการลำเลียงแบบใด และใช้อัตราส่วนเท่าใด"
    choices:
      - "แพร่แบบธรรมดา 1:1"
      - "แอกทีฟทรานสปอร์ต ส่ง Na+ ออก 3 ตัว รับ K+ เข้า 2 ตัว"
      - "ออสโมซิส 2:3"
      - "แพร่แบบฟาซิลิเทต 3:2"
    answer: 1
    explanation: "ปั๊มนี้ใช้ ATP ลำเลียงทวนความต่างความเข้มข้น ส่ง Na+ ออก 3 ต่อ K+ เข้า 2 ทำให้ด้านในเซลล์เป็นลบเมื่อเทียบกับด้านนอก"
    difficulty: 3

  - qid: bio_cell_005
    topic: bio_cell
    stem: "ออร์แกเนลล์ใดทำหน้าที่ย่อยสลายสิ่งแปลกปลอมและออร์แกเนลล์ที่เสื่อมสภาพ"
    choices: ["แวคิวโอล", "เพอรอกซิโซม", "ไลโซโซม", "เอนโดพลาสมิกเรติคูลัม"]
    answer: 2
    explanation: "ไลโซโซมบรรจุเอนไซม์ไฮโดรไลติกที่ทำงานในสภาพเป็นกรด ทำหน้าที่ย่อยสารที่เซลล์กลืนเข้ามาและกำจัดออร์แกเนลล์เก่า"
    difficulty: 1

  - qid: bio_cell_006
    topic: bio_cell
    stem: "เยื่อหุ้มเซลล์มีโครงสร้างแบบใดตามแบบจำลองฟลูอิดโมเสก"
    choices:
      - "ชั้นโปรตีนประกบฟอสโฟลิพิด"
      - "คอเลสเตอรอลเรียงเป็นชั้นเดียว"
      - "เซลลูโลสเรียงตัวเป็นตาข่าย"
      - "ฟอสโฟลิพิดสองชั้นที่มีโปรตีนแทรกและเคลื่อนที่ได้"
    answer: 3
    explanation: "หางไม่มีขั้วหันเข้าหากัน หัวมีขั้วหันออกสู่น้ำ โปรตีนกระจายแทรกอยู่และเคลื่อนที่ในระนาบได้เหมือนโมเสกที่ลอยอยู่บนของเหลว"
    difficulty: 2

  # ───────────────────────── การหายใจระดับเซลล์
  - qid: bio_resp_002
    topic: bio_resp
    stem: "ไกลโคไลซิสเกิดขึ้นที่ส่วนใดของเซลล์"
    choices: ["ไซโทซอล", "เมทริกซ์ของไมโทคอนเดรีย", "เยื่อชั้นในไมโทคอนเดรีย", "นิวเคลียส"]
    answer: 0
    explanation: "ไกลโคไลซิสเกิดในไซโทซอลและไม่ต้องใช้ออกซิเจน จึงเป็นขั้นตอนที่เกิดได้ทั้งในภาวะมีและไม่มีออกซิเจน"
    difficulty: 1

  - qid: bio_resp_003
    topic: bio_resp
    stem: "ในภาวะขาดออกซิเจน เซลล์กล้ามเนื้อคนเปลี่ยนไพรูเวตไปเป็นสารใด"
    choices: ["เอทานอล", "กรดแลกติก", "อะซิติลโคเอ", "คาร์บอนไดออกไซด์"]
    answer: 1
    explanation: "การหมักแบบแลกติกในเซลล์กล้ามเนื้อคนเปลี่ยนไพรูเวตเป็นกรดแลกติกเพื่อสร้าง NAD+ กลับมาใช้ในไกลโคไลซิสต่อ ส่วนการหมักเป็นเอทานอลพบในยีสต์"
    difficulty: 2

  - qid: bio_resp_004
    topic: bio_resp
    stem: "ตัวรับอิเล็กตรอนตัวสุดท้ายในกระบวนการถ่ายทอดอิเล็กตรอนคือสารใด"
    choices: ["NAD+", "FAD", "ออกซิเจน", "ATP"]
    answer: 2
    explanation: "ออกซิเจนรับอิเล็กตรอนและโปรตอนกลายเป็นน้ำ ถ้าไม่มีออกซิเจน ห่วงโซ่จะติดขัดและ NADH สะสมจนไกลโคไลซิสหยุด"
    difficulty: 2

  - qid: bio_resp_005
    topic: bio_resp
    stem: "การสร้าง ATP ในขั้นออกซิเดทีฟฟอสโฟรีเลชันอาศัยหลักการใด"
    choices:
      - "การถ่ายหมู่ฟอสเฟตโดยตรงจากสารตัวกลาง"
      - "การตรึงคาร์บอนไดออกไซด์"
      - "การสลายกรดแลกติก"
      - "ความต่างของความเข้มข้นโปรตอนสองฝั่งเยื่อ"
    answer: 3
    explanation: "ห่วงโซ่ถ่ายทอดอิเล็กตรอนปั๊มโปรตอนออกไปสะสมในช่องระหว่างเยื่อ โปรตอนไหลกลับผ่าน ATP synthase ตามหลักเคมิออสโมซิสจึงได้ ATP"
    difficulty: 3

  - qid: bio_resp_006
    topic: bio_resp
    stem: "วัฏจักรเครบส์ 1 รอบให้ NADH, FADH2 และ ATP อย่างละกี่โมเลกุล"
    choices: ["3, 1, 1", "2, 2, 1", "3, 2, 2", "1, 1, 3"]
    answer: 0
    explanation: "อะซิติลโคเอ 1 โมเลกุลเข้าสู่วัฏจักรให้ NADH 3, FADH2 1 และ ATP (หรือ GTP) 1 โมเลกุล พร้อม CO2 2 โมเลกุล"
    difficulty: 3

  # ───────────────────────── การสังเคราะห์ด้วยแสง
  - qid: bio_photo_002
    topic: bio_photo
    stem: "ปฏิกิริยาแสงเกิดขึ้นที่ส่วนใดของคลอโรพลาสต์"
    choices: ["สโตรมา", "เยื่อไทลาคอยด์", "เยื่อชั้นนอก", "ช่องว่างระหว่างเยื่อ"]
    answer: 1
    explanation: "ระบบแสง I และ II ฝังอยู่ในเยื่อไทลาคอยด์ ส่วนวัฏจักรคัลวินเกิดในสโตรมาซึ่งเป็นของเหลวรอบ ๆ"
    difficulty: 1

  - qid: bio_photo_003
    topic: bio_photo
    stem: "เอนไซม์รูบิสโกทำหน้าที่ใดในวัฏจักรคัลวิน"
    choices:
      - "สลายน้ำให้ได้ออกซิเจน"
      - "สร้าง ATP จากโปรตอน"
      - "ตรึงคาร์บอนไดออกไซด์เข้ากับ RuBP"
      - "เปลี่ยน NADP+ เป็น NADPH"
    answer: 2
    explanation: "รูบิสโกเร่งการรวม CO2 กับ RuBP (5 คาร์บอน) ได้สารประกอบ 6 คาร์บอนที่แตกเป็น PGA 2 โมเลกุลทันที เป็นขั้นตรึงคาร์บอนขั้นแรก"
    difficulty: 2

  - qid: bio_photo_004
    topic: bio_photo
    stem: "พืช C4 ได้เปรียบพืช C3 ในสภาพอากาศร้อนแห้งเพราะเหตุใด"
    choices:
      - "มีคลอโรฟิลล์มากกว่า"
      - "เปิดปากใบตลอดเวลา"
      - "ไม่ต้องใช้น้ำ"
      - "ลดการเกิดโฟโตเรสไพเรชันโดยแยกที่ตรึง CO2 ออกจากวัฏจักรคัลวิน"
    answer: 3
    explanation: "พืช C4 ตรึง CO2 ในเซลล์มีโซฟิลล์ด้วย PEP carboxylase ที่ไม่จับ O2 แล้วส่งไปปล่อยเข้มข้นในเซลล์บันเดิลชีท จึงลดการที่รูบิสโกไปจับออกซิเจนแทน"
    difficulty: 3

  - qid: bio_photo_005
    topic: bio_photo
    stem: "พืช CAM เช่น กระบองเพชร เปิดปากใบเวลาใด และเพราะเหตุใด"
    choices:
      - "กลางคืน เพื่อลดการสูญเสียน้ำ"
      - "กลางวัน เพื่อรับแสงมากที่สุด"
      - "ตลอดเวลา เพื่อรับ CO2 ให้มากที่สุด"
      - "เฉพาะช่วงฝนตก"
    answer: 0
    explanation: "พืช CAM เปิดปากใบกลางคืนที่อากาศเย็นและชื้นกว่า เก็บ CO2 ไว้ในรูปกรดมาลิก แล้วกลางวันปิดปากใบแต่ยังทำวัฏจักรคัลวินได้จากคาร์บอนที่เก็บไว้"
    difficulty: 3

  - qid: bio_photo_006
    topic: bio_photo
    stem: "ผลผลิตของปฏิกิริยาแสงที่ถูกนำไปใช้ในวัฏจักรคัลวินคือข้อใด"
    choices: ["กลูโคสและน้ำ", "ATP และ NADPH", "CO2 และ O2", "RuBP และ PGA"]
    answer: 1
    explanation: "ปฏิกิริยาแสงเปลี่ยนพลังงานแสงเป็นพลังงานเคมีในรูป ATP และ NADPH ซึ่งวัฏจักรคัลวินนำไปใช้รีดิวซ์ PGA เป็นน้ำตาล"
    difficulty: 2

  # ───────────────────────── การแบ่งเซลล์
  - qid: bio_division_002
    topic: bio_division
    stem: "การแลกเปลี่ยนชิ้นส่วนโครโมโซมคู่เหมือน (crossing over) เกิดในระยะใด"
    choices: ["แอนาเฟสของไมโทซิส", "เมทาเฟส II", "โพรเฟส I ของไมโอซิส", "อินเตอร์เฟส"]
    answer: 2
    explanation: "เกิดที่ระยะแพคีทีนของโพรเฟส I เมื่อโครโมโซมคู่เหมือนจับคู่กันเป็นไบวาเลนต์ เป็นแหล่งความหลากหลายทางพันธุกรรมที่สำคัญ"
    difficulty: 2

  - qid: bio_division_003
    topic: bio_division
    stem: "เซลล์ที่มีโครโมโซม 2n = 24 เมื่อผ่านไมโอซิสสมบูรณ์จะได้เซลล์ลูกกี่เซลล์ และแต่ละเซลล์มีโครโมโซมเท่าใด"
    choices: ["2 เซลล์ 24 แท่ง", "2 เซลล์ 12 แท่ง", "4 เซลล์ 24 แท่ง", "4 เซลล์ 12 แท่ง"]
    answer: 3
    explanation: "ไมโอซิสแบ่งสองครั้งได้เซลล์ลูก 4 เซลล์ และลดจำนวนโครโมโซมลงครึ่งหนึ่งเหลือ n = 12"
    difficulty: 1

  - qid: bio_division_004
    topic: bio_division
    stem: "ระยะใดของวัฏจักรเซลล์ที่มีการจำลอง DNA"
    choices: ["S", "G1", "G2", "M"]
    answer: 0
    explanation: "ระยะ S (synthesis) คือช่วงที่ DNA ถูกจำลองจนโครโมโซมแต่ละแท่งมีสองโครมาทิด ส่วน G1 และ G2 เป็นช่วงเติบโตและเตรียมความพร้อม"
    difficulty: 1

  - qid: bio_division_005
    topic: bio_division
    stem: "ความแตกต่างสำคัญระหว่างแอนาเฟส I ของไมโอซิสกับแอนาเฟสของไมโทซิสคือข้อใด"
    choices:
      - "แอนาเฟส I แยกโครมาทิดพี่น้อง แต่ไมโทซิสแยกโครโมโซมคู่เหมือน"
      - "แอนาเฟส I แยกโครโมโซมคู่เหมือน แต่ไมโทซิสแยกโครมาทิดพี่น้อง"
      - "ทั้งสองแยกโครมาทิดพี่น้องเหมือนกัน"
      - "แอนาเฟส I ไม่มีการเคลื่อนที่ของโครโมโซม"
    answer: 1
    explanation: "แอนาเฟส I แยกสมาชิกของคู่เหมือนไปคนละขั้ว ทำให้จำนวนโครโมโซมลดครึ่ง ส่วนไมโทซิสและแอนาเฟส II แยกโครมาทิดพี่น้องซึ่งไม่ลดจำนวนชุด"
    difficulty: 3

  - qid: bio_division_006
    topic: bio_division
    stem: "เซลล์มะเร็งต่างจากเซลล์ปกติในแง่การควบคุมวัฏจักรเซลล์อย่างไร"
    choices:
      - "แบ่งตัวช้ากว่าปกติ"
      - "ไม่มีการจำลอง DNA"
      - "ไม่ตอบสนองต่อจุดตรวจสอบและสัญญาณยับยั้งการแบ่งตัว"
      - "มีโครโมโซมเป็นแฮพลอยด์"
    answer: 2
    explanation: "การกลายพันธุ์ของยีนควบคุม เช่น p53 ทำให้เซลล์ผ่านจุดตรวจสอบไปได้ทั้งที่ DNA เสียหาย และไม่หยุดแบ่งตัวเมื่อสัมผัสเซลล์ข้างเคียง"
    difficulty: 2

  # ───────────────────────── พันธุศาสตร์เมนเดล
  - qid: bio_mendel_002
    topic: bio_mendel
    stem: "ผสม Aa × Aa อัตราส่วนฟีโนไทป์ของรุ่นลูกเป็นเท่าใด เมื่อ A ข่ม a สมบูรณ์"
