    choices: ["9:3:3:1", "1:1:1:1", "3:1", "1:2:1"]
    answer: 0
    explanation: "เป็นการผสมสองลักษณะที่แยกอิสระ ได้ 9 เด่นทั้งคู่ : 3 เด่น-ด้อย : 3 ด้อย-เด่น : 1 ด้อยทั้งคู่"
    difficulty: 2

  - qid: bio_mendel_004
