    explanation: "สายคู่สมจับกันแบบขนานสวนทาง A จับ T และ G จับ C ดังนั้นตรงข้าม 5'-ATGCGT-3' คือ 3'-TACGCA-5'"
    difficulty: 2

  - qid: bio_molgen_003
    topic: bio_molgen
    stem: "การถอดรหัส (transcription) ให้ผลลัพธ์เป็นสารใด และเกิดที่ใดในเซลล์ยูคาริโอต"
    choices: ["โปรตีน ที่ไรโบโซม", "tRNA ที่กอลจิ", "DNA ที่ไซโทพลาซึม", "mRNA ที่นิวเคลียส"]
    answer: 3
    explanation: "การถอดรหัสสร้าง RNA จากแม่แบบ DNA ในนิวเคลียส แล้ว mRNA จึงออกมาแปลรหัสเป็นโปรตีนที่ไรโบโซมในไซโทพลาซึม"
    difficulty: 1

  - qid: bio_molgen_004
    topic: bio_molgen
    stem: "รหัสพันธุกรรมหนึ่งรหัส (codon) ประกอบด้วยเบสกี่ตัว และเหตุใดจึงต้องเป็นจำนวนนี้"
    choices:
      - "3 ตัว เพราะให้ 64 แบบ ครอบคลุมกรดอะมิโน 20 ชนิด"
      - "2 ตัว เพราะให้ 16 แบบ เพียงพอ"
      - "4 ตัว เพราะมีเบส 4 ชนิด"
      - "1 ตัว เพราะประหยัดที่สุด"
    answer: 0
    explanation: "เบส 2 ตัวให้ได้เพียง 4² = 16 แบบ ไม่พอสำหรับกรดอะมิโน 20 ชนิด ส่วน 3 ตัวให้ 4³ = 64 แบบ ซึ่งเกินพอและทำให้รหัสมีความซ้ำซ้อน"
    difficulty: 2

  - qid: bio_molgen_005
    topic: bio_molgen
