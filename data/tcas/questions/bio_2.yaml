  # ───────────────────────── วิวัฒนาการ
  - qid: bio_evolution_002
    topic: bio_evolution
    stem: "โครงสร้างที่มีต้นกำเนิดร่วมกันแต่ทำหน้าที่ต่างกัน เช่น ครีบวาฬกับแขนคน เรียกว่าอะไร"
