subject: thai
questions:
  - qid: thai_grammar_001
    topic: thai_grammar
    stem: "คำในข้อใดเป็น 'คำสมาส'"
    choices:
      - "รถไฟ"
      - "วิทยาศาสตร์"
      - "น้ำใจ"
      - "ลูกเสือ"
    answer: 1
    explanation: "คำสมาสเกิดจากคำบาลี/สันสกฤตมารวมกัน — 'วิทยา' + 'ศาสตร์' ส่วนอีก 3 ข้อเป็นคำประสมจากคำไทยแท้"
    difficulty: 2

  - qid: thai_usage_001
    topic: thai_usage
    stem: "คำในข้อใดสะกดถูกต้อง"
    choices:
      - "อนุญาติ"
      - "อนุญาต"
      - "อณุญาต"
      - "อนุยาต"
    answer: 1
    explanation: "เขียนว่า 'อนุญาต' ไม่มีสระอิที่ตัว ต — เป็นคำที่เขียนผิดบ่อยที่สุดคำหนึ่ง"
    difficulty: 1

  - qid: thai_usage_002
    topic: thai_usage
    stem: "ข้อใดใช้คำราชาศัพท์ถูกต้องเมื่อกล่าวถึงพระมหากษัตริย์ในความหมายว่า 'รับประทานอาหาร'"
    choices:
      - "ทรงเสวย"
      - "เสวย"
      - "ทรงรับประทาน"
      - "ทรงพระเสวย"
    answer: 1
    explanation: "'เสวย' เป็นคำราชาศัพท์ในตัวอยู่แล้ว จึงไม่ต้องเติม 'ทรง' นำหน้า — เติมได้เฉพาะคำสามัญ เช่น ทรงงาน ทรงดนตรี"
    difficulty: 2

  - qid: thai_rhetoric_001
    topic: thai_rhetoric
    stem: "ข้อความ 'ดวงตาของเธอสุกใสดั่งดาวประกายพรึก' ใช้ภาพพจน์ชนิดใด"
    choices:
      - "อุปลักษณ์"
      - "อุปมา"
      - "บุคคลวัต"
      - "อธิพจน์"
    answer: 1
    explanation: "มีคำเปรียบ 'ดั่ง' เชื่อมสิ่งสองสิ่ง จึงเป็นอุปมา — ถ้าเปรียบตรง ๆ โดยไม่มีคำเชื่อม เช่น 'ดวงตาเธอคือดวงดาว' จะเป็นอุปลักษณ์"
    difficulty: 2

  - qid: thai_rhetoric_002
    topic: thai_rhetoric
    stem: "ข้อความ 'สายลมกระซิบข้างหูฉันเบา ๆ' ใช้ภาพพจน์ชนิดใด"
    choices:
      - "อุปมา"
      - "บุคคลวัต (บุคลาธิษฐาน)"
      - "อธิพจน์"
      - "สัทพจน์"
    answer: 1
    explanation: "สมมติให้สิ่งไม่มีชีวิต (สายลม) ทำกิริยาของคน (กระซิบ) คือบุคคลวัต"
    difficulty: 2

  - qid: thai_reason_001
    topic: thai_reason
    stem: "ข้อความ 'นักเรียนห้องนี้สอบผ่านทุกคน เพราะครูสอนดี' ส่วนใดคือข้อสรุป"
    choices:
      - "ครูสอนดี"
      - "นักเรียนห้องนี้สอบผ่านทุกคน"
      - "ทั้งสองส่วนเป็นข้อสรุป"
      - "ข้อความนี้ไม่มีข้อสรุป"
    answer: 1
    explanation: "คำว่า 'เพราะ' นำหน้าเหตุผล ดังนั้นส่วนที่อยู่หน้ามันคือข้อสรุป ส่วน 'ครูสอนดี' เป็นเหตุผลสนับสนุน"
    difficulty: 2

  - qid: thai_reading_001
    topic: thai_reading
    stem: "จากข้อความ 'แม้ยอดผู้ป่วยจะลดลงต่อเนื่องสามสัปดาห์ แต่กระทรวงยังคงมาตรการเฝ้าระวังไว้ เพราะเชื้อกลายพันธุ์ยังตรวจพบในหลายจังหวัด' สาระสำคัญที่สุดคือข้อใด"
    choices:
      - "ยอดผู้ป่วยลดลงสามสัปดาห์ติดต่อกัน"
      - "เชื้อกลายพันธุ์พบในหลายจังหวัด"
      - "กระทรวงยังไม่ผ่อนคลายมาตรการ แม้ตัวเลขผู้ป่วยจะดีขึ้น"
      - "มาตรการเฝ้าระวังไม่ได้ผล"
    answer: 2
    explanation: "โครงสร้าง 'แม้...แต่...' เน้นน้ำหนักที่ประโยคหลังคำว่า 'แต่' ส่วนตัวเลือกอื่นเป็นเพียงรายละเอียดประกอบ"
    difficulty: 2

  - qid: thai_grammar_002
    topic: thai_grammar
    stem: "คำว่า 'เดิน' ในประโยค 'นาฬิกาเรือนนี้เดินเร็วไปห้านาที' ทำหน้าที่เป็นคำชนิดใด"
    choices:
      - "คำนาม"
      - "คำกริยา"
      - "คำวิเศษณ์"
      - "คำบุพบท"
    answer: 1
    explanation: "'เดิน' แสดงอาการของประธาน (นาฬิกา) จึงเป็นคำกริยา ส่วน 'เร็ว' เป็นคำวิเศษณ์ขยายกริยา"
    difficulty: 1

  - qid: thai_lit_001
    topic: thai_literature
    stem: "วรรณคดีเรื่อง 'อิเหนา' พระราชนิพนธ์ในรัชกาลใด"
    choices:
      - "รัชกาลที่ 1"
      - "รัชกาลที่ 2"
      - "รัชกาลที่ 5"
      - "รัชกาลที่ 6"
    answer: 1
    explanation: "อิเหนาเป็นบทละครในพระราชนิพนธ์ในรัชกาลที่ 2 ซึ่งเป็นยุคทองของวรรณคดีไทย เช่นเดียวกับรามเกียรติ์ฉบับพระราชนิพนธ์ในรัชกาลนั้น"
    difficulty: 2

  - qid: thai_writing_001
    topic: thai_writing
    stem: "ข้อความใดเรียงลำดับได้เป็นย่อหน้าที่ต่อเนื่องที่สุด (1) จึงควรพักสายตาทุก 20 นาที (2) การจ้องจอนาน ๆ ทำให้ตาล้า (3) โดยมองไกลออกไปสัก 20 วินาที"
    choices:
      - "1 - 2 - 3"
      - "2 - 1 - 3"
      - "3 - 2 - 1"
      - "2 - 3 - 1"
    answer: 1
    explanation: "ข้อ 2 เป็นสาเหตุ ข้อ 1 ขึ้นต้นด้วย 'จึง' จึงเป็นผลที่ตามมา และข้อ 3 ขยายวิธีการของข้อ 1 — ดูคำเชื่อมเป็นหลัก"
    difficulty: 2
