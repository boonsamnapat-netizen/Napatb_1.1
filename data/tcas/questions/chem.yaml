subject: chem
questions:
  - qid: chem_mole_001
    topic: chem_mole
    stem: "แก๊สอุดมคติ 1 โมล ที่ STP (0 °C, 1 atm) มีปริมาตรเท่าใด"
    choices:
      - "22.4 dm³"
      - "11.2 dm³"
      - "24.0 dm³"
      - "44.8 dm³"
    answer: 0
    explanation: "ปริมาตรโมลาร์ที่ STP = 22.4 dm³/mol (ที่ 25 °C, 1 atm จะเป็น 24.5 dm³/mol)"
    difficulty: 1

  - qid: chem_mole_002
    topic: chem_mole
    stem: "สาร 1 โมล มีจำนวนอนุภาคเท่าใด"
    choices:
      - "6.02 × 10²²"
      - "6.02 × 10²³"
      - "1.60 × 10⁻¹⁹"
      - "3.01 × 10²³"
    answer: 1
    explanation: "เลขอาโวกาโดร = 6.02 × 10²³ อนุภาคต่อโมล"
    difficulty: 1

  - qid: chem_acidbase_001
    topic: chem_acidbase
    stem: "สารละลาย HCl เข้มข้น 0.01 mol/dm³ มี pH เท่าใด (HCl แตกตัวสมบูรณ์)"
    choices:
      - "1"
      - "10"
      - "2"
      - "12"
    answer: 2
    explanation: "[H⁺] = 0.01 = 10⁻² mol/dm³ ดังนั้น pH = −log(10⁻²) = 2"
    difficulty: 2

  - qid: chem_bond_001
    topic: chem_bond
    stem: "โมเลกุล CH₄ มีรูปร่างแบบใดตามทฤษฎี VSEPR"
    choices:
      - "เส้นตรง"
      - "สามเหลี่ยมแบนราบ"
      - "พีระมิดฐานสามเหลี่ยม"
      - "ทรงสี่หน้า (tetrahedral)"
    answer: 3
    explanation: "C มีอิเล็กตรอนคู่ร่วมพันธะ 4 คู่ ไม่มีคู่โดดเดี่ยว จึงจัดตัวเป็นทรงสี่หน้า มุมพันธะ 109.5°"
    difficulty: 2

  - qid: chem_bond_002
    topic: chem_bond
    stem: "โมเลกุล NH₃ มีรูปร่างแบบใด และเหตุใดจึงต่างจาก CH₄"
    choices:
      - "พีระมิดฐานสามเหลี่ยม เพราะมีคู่โดดเดี่ยว 1 คู่ผลักคู่ร่วมพันธะ"
      - "ทรงสี่หน้า เพราะมีคู่อิเล็กตรอน 4 คู่เท่ากัน"
      - "สามเหลี่ยมแบนราบ เพราะไม่มีคู่โดดเดี่ยว"
      - "มุมงอ เพราะมีคู่โดดเดี่ยว 2 คู่"
    answer: 0
    explanation: "N มีคู่ร่วมพันธะ 3 คู่ + คู่โดดเดี่ยว 1 คู่ คู่โดดเดี่ยวผลักแรงกว่า จึงกดมุมพันธะเหลือ ~107°"
    difficulty: 2

  - qid: chem_redox_001
    topic: chem_redox
    stem: "ในเซลล์กัลวานิก ปฏิกิริยาออกซิเดชันเกิดขึ้นที่ขั้วใด และขั้วนั้นมีประจุอะไร"
    choices:
      - "แคโทด ประจุลบ"
      - "แอโนด ประจุลบ"
      - "แคโทด ประจุบวก"
      - "แอโนด ประจุบวก"
    answer: 1
    explanation: "จำว่า 'AN OX' — ออกซิเดชันเกิดที่แอโนดเสมอ และในเซลล์กัลวานิกแอโนดเป็นขั้วลบ (กลับกับเซลล์อิเล็กโทรลิติก)"
    difficulty: 3

  - qid: chem_equilibrium_001
    topic: chem_equilibrium
    stem: "ระบบ N₂(g) + 3H₂(g) ⇌ 2NH₃(g) เมื่อเพิ่มความดันโดยลดปริมาตร สมดุลจะเลื่อนไปทางใด"
    choices:
      - "ไม่เลื่อน เพราะความดันไม่มีผลต่อสมดุล"
      - "ไปทางซ้าย เพราะด้านซ้ายมีจำนวนโมลแก๊สมากกว่า"
      - "ไปทางขวา เพราะด้านขวามีจำนวนโมลแก๊สน้อยกว่า"
      - "ไปทางซ้าย เพราะปฏิกิริยาคายความร้อน"
    answer: 2
    explanation: "หลักเลอชาเตอลิเอ: เพิ่มความดัน ระบบเลื่อนไปด้านที่มีโมลแก๊สน้อยกว่า — ซ้าย 4 โมล ขวา 2 โมล จึงเลื่อนขวา"
    difficulty: 2

  - qid: chem_rate_001
    topic: chem_rate
    stem: "ตัวเร่งปฏิกิริยาทำให้อัตราการเกิดปฏิกิริยาเพิ่มขึ้นด้วยกลไกใด"
    choices:
      - "เพิ่มพลังงานจลน์เฉลี่ยของอนุภาค"
      - "ทำให้ค่าคงที่สมดุลสูงขึ้น"
      - "เพิ่มความเข้มข้นของสารตั้งต้น"
      - "ลดพลังงานก่อกัมมันต์โดยเปิดเส้นทางปฏิกิริยาใหม่"
    answer: 3
    explanation: "ตัวเร่งลด Ea ทำให้สัดส่วนอนุภาคที่ชนแล้วเกิดปฏิกิริยามากขึ้น แต่ไม่เปลี่ยนค่า K และไม่เปลี่ยน ΔH"
    difficulty: 2

  - qid: chem_organic_001
    topic: chem_organic
    stem: "หมู่ฟังก์ชันของกรดคาร์บอกซิลิกคือข้อใด"
    choices:
      - "−COOH"
      - "−CHO"
      - "−OH"
      - "−NH₂"
    answer: 0
    explanation: "−COOH คือคาร์บอกซิล ส่วน −OH คือไฮดรอกซิล (แอลกอฮอล์), −CHO คือแอลดีไฮด์, −NH₂ คือเอมีน"
    difficulty: 1

  - qid: chem_biomol_001
    topic: chem_biomol
    stem: "กรดอะมิโนสองโมเลกุลเชื่อมกันด้วยพันธะชนิดใด และปล่อยสารใดออกมา"
    choices:
      - "พันธะไกลโคซิดิก ปล่อยน้ำ"
      - "พันธะเพปไทด์ ปล่อยน้ำ"
      - "พันธะเอสเทอร์ ปล่อยแอลกอฮอล์"
      - "พันธะไฮโดรเจน ไม่ปล่อยสารใด"
    answer: 1
    explanation: "หมู่ −COOH ของตัวหนึ่งทำปฏิกิริยากับ −NH₂ ของอีกตัว เกิดพันธะเพปไทด์และปล่อยน้ำ (condensation)"
    difficulty: 2

  - qid: chem_atom_001
    topic: chem_atom
    stem: "ธาตุที่อยู่หมู่ 1 คาบ 3 ของตารางธาตุคือธาตุใด"
    choices:
      - "ลิเทียม (Li)"
      - "แมกนีเซียม (Mg)"
      - "โซเดียม (Na)"
      - "โพแทสเซียม (K)"
    answer: 2
    explanation: "Na เลขอะตอม 11 การจัดเรียงอิเล็กตรอน 2,8,1 → เวเลนซ์อิเล็กตรอน 1 ตัว (หมู่ 1) มี 3 ระดับพลังงาน (คาบ 3)"
    difficulty: 1

  - qid: chem_gas_001
    topic: chem_gas
    stem: "แก๊สในภาชนะปิดปริมาตรคงที่ เมื่อเพิ่มอุณหภูมิสัมบูรณ์เป็น 2 เท่า ความดันจะเป็นอย่างไร"
    choices:
      - "ลดลงครึ่งหนึ่ง"
      - "เท่าเดิม"
      - "เพิ่มเป็น 4 เท่า"
      - "เพิ่มเป็น 2 เท่า"
    answer: 3
    explanation: "กฎเกย์-ลูสแซก: ที่ปริมาตรคงที่ P แปรผันตรงกับ T (เคลวิน) เพิ่ม T 2 เท่า P จึงเพิ่ม 2 เท่า"
    difficulty: 2

  - qid: chem_polymer_201
    topic: chem_polymer
    stem: "ยางธรรมชาติมีมอนอเมอร์เป็นสารใด"
    choices: ["สไตรีน", "เอทิลีน", "ไอโซพรีน", "ไวนิลคลอไรด์"]
    answer: 2
    explanation: "ยางธรรมชาติคือ cis-1,4-พอลิไอโซพรีน เกิดจากมอนอเมอร์ไอโซพรีน ส่วนสไตรีนให้พอลิสไตรีน เอทิลีนให้พอลิเอทิลีน และไวนิลคลอไรด์ให้ PVC"
    difficulty: 2

  - qid: chem_industry_001
    topic: chem_industry
    stem: "การกลั่นลำดับส่วนน้ำมันดิบ สารในข้อใดถูกเก็บได้ที่ตำแหน่งสูงที่สุดของหอกลั่น"
    choices:
      - "น้ำมันหล่อลื่น"
      - "แก๊สปิโตรเลียม"
      - "น้ำมันดีเซล"
      - "บิทูเมน"
    answer: 1
    explanation: "สารที่มีจุดเดือดต่ำและโมเลกุลเล็กที่สุดลอยขึ้นสูงสุด — แก๊สปิโตรเลียมจึงอยู่บนสุด ส่วนบิทูเมนจุดเดือดสูงสุดอยู่ก้นหอ"
    difficulty: 2

  - qid: chem_lab_201
    topic: chem_lab
    stem: "ต้องการเตรียมสารละลายมาตรฐาน 250 cm³ ที่ทราบความเข้มข้นแน่นอน ควรใช้อุปกรณ์ใดวัดปริมาตรขั้นสุดท้าย"
    choices: ["บีกเกอร์ 250 cm³", "ขวดวัดปริมาตร 250 cm³", "กระบอกตวง 250 cm³", "ขวดรูปกรวย 250 cm³"]
    answer: 1
    explanation: "ขวดวัดปริมาตรมีขีดบอกปริมาตรเพียงขีดเดียวและความคลาดเคลื่อนต่ำที่สุด จึงใช้กับสารละลายมาตรฐาน กระบอกตวงแม่นกว่าบีกเกอร์แต่ยังไม่พอ ส่วนบีกเกอร์กับขวดรูปกรวยบอกปริมาตรได้แค่คร่าว ๆ"
    difficulty: 1
