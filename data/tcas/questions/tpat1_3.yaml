    stem: "สารละลายเข้มข้น 20% ปริมาตร 200 มิลลิลิตร ถ้าเติมน้ำจนได้ปริมาตร 500 มิลลิลิตร ความเข้มข้นใหม่เป็นเท่าใด"
    choices: ["4%", "8%", "10%", "12%"]
