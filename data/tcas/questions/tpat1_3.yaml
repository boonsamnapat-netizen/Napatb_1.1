# ชุดที่ 3 — ปรับสัดส่วนให้เข้าใกล้ข้อสอบจริง
#
# ข้อสอบจริง TPAT1: เชาวน์ 45 ข้อ · จริยธรรม 55 ข้อ · เชื่อมโยง 1 บทความ
# คลังเดิม 73 ข้อ มีจริยธรรมแค่ 21 ข้อ (29%) ทั้งที่ในข้อสอบจริงเป็น 55%
# ชุดนี้จึงเติมจริยธรรมเป็นหลัก (25 จาก 32 ข้อ)
#
# พาร์ตมิติสัมพันธ์ (ภาพพับ/ภาพหมุน) ไม่เพิ่มในชุดนี้ เพราะต้องใช้รูป
# ซึ่งคลังที่เป็นข้อความล้วนทำได้จำกัด — 8 ข้อเดิมเป็นแบบบรรยายด้วยคำแล้ว
#
# ⚠️ ข้อจริยธรรมทั้งหมดอิงหลักจริยธรรมทางการแพทย์ 4 ข้อและหน้าที่พื้นฐาน
#    ของผู้ประกอบวิชาชีพ **ไม่อ้างเลขมาตราของกฎหมายไทย** เพราะเครื่องที่
#    เขียนไฟล์นี้ตรวจสอบตัวบทไม่ได้ ถ้าจะเพิ่มข้ออ้างอิงกฎหมาย ให้เปิด
#    ตัวบทจริงก่อนเสมอ
subject: tpat1
questions:

  # ── จริยธรรม: หลัก 4 ข้อ ─────────────────────────────────────
  - qid: tpat1_ethics_principle_101
    topic: tpat1_ethics_principle
    stem: "ผู้ป่วยมะเร็งระยะสุดท้ายที่มีสติสัมปชัญญะดี ปฏิเสธการให้เคมีบำบัดรอบต่อไป ทั้งที่แพทย์เชื่อว่าจะช่วยยืดชีวิตได้อีกไม่กี่เดือน หลักจริยธรรมข้อใดสนับสนุนการเคารพการตัดสินใจของผู้ป่วยมากที่สุด"
    choices: ["การเคารพในการตัดสินใจของผู้ป่วย (autonomy)", "การทำประโยชน์ให้ผู้ป่วย (beneficence)", "การไม่ก่ออันตราย (non-maleficence)", "ความยุติธรรม (justice)"]
    answer: 0
    explanation: "ผู้ป่วยมีสติสัมปชัญญะดีและได้รับข้อมูลครบ การตัดสินใจปฏิเสธการรักษาเป็นสิทธิของเขา หลัก autonomy คุ้มครองสิทธินี้โดยตรง แม้ผลลัพธ์อาจขัดกับสิ่งที่แพทย์เห็นว่าดีที่สุด (beneficence)"
    difficulty: 1

  - qid: tpat1_ethics_principle_102
    topic: tpat1_ethics_principle
    stem: "โรงพยาบาลมีเครื่องช่วยหายใจว่างเพียงเครื่องเดียว แต่มีผู้ป่วยวิกฤต 3 รายที่ต้องใช้พร้อมกัน การตัดสินใจจัดสรรควรยึดหลักข้อใดเป็นหลัก"
    choices: ["autonomy", "beneficence", "non-maleficence", "justice"]
    answer: 3
    explanation: "เมื่อทรัพยากรมีจำกัดและต้องเลือกว่าใครได้ก่อน ประเด็นคือการกระจายทรัพยากรอย่างเป็นธรรม ซึ่งเป็นขอบเขตของหลัก justice โดยตรง"
    difficulty: 1

  - qid: tpat1_ethics_principle_103
    topic: tpat1_ethics_principle
    stem: "แพทย์เลือกไม่สั่งการตรวจเอกซเรย์เพิ่มเติมในผู้ป่วยที่อาการชัดเจนอยู่แล้ว เพราะประโยชน์ที่ได้ไม่คุ้มกับปริมาณรังสีที่ผู้ป่วยจะได้รับ การตัดสินใจนี้สะท้อนหลักใดชัดเจนที่สุด"
    choices: ["autonomy", "justice", "non-maleficence", "confidentiality"]
    answer: 2
    explanation: "การชั่งน้ำหนักว่าหัตถการอาจก่ออันตราย (รังสี) มากกว่าประโยชน์ที่ได้ แล้วเลือกไม่ทำ คือหลัก non-maleficence — 'first, do no harm'"
    difficulty: 2

  - qid: tpat1_ethics_principle_104
    topic: tpat1_ethics_principle
    stem: "ข้อใด **ไม่ใช่** องค์ประกอบของการขอความยินยอมโดยได้รับข้อมูลครบถ้วน (informed consent)"
    choices: ["ผู้ป่วยได้รับข้อมูลทางเลือกการรักษาและความเสี่ยง", "ผู้ป่วยมีความสามารถในการตัดสินใจ", "ผู้ป่วยตัดสินใจโดยสมัครใจ ไม่ถูกบังคับ", "ญาติสายตรงต้องเห็นชอบด้วยทุกครั้ง"]
    answer: 3
    explanation: "informed consent ประกอบด้วยการให้ข้อมูล ความสามารถในการตัดสินใจ และความสมัครใจ ส่วนความเห็นชอบของญาติไม่ใช่เงื่อนไขเมื่อผู้ป่วยตัดสินใจเองได้ (ญาติจะมีบทบาทเมื่อผู้ป่วยตัดสินใจเองไม่ได้)"
    difficulty: 2

  - qid: tpat1_ethics_principle_105
    topic: tpat1_ethics_principle
    stem: "ผู้ป่วยอายุ 15 ปีมาขอรับบริการคุมกำเนิดโดยไม่ต้องการให้ผู้ปกครองทราบ ประเด็นจริยธรรมสองข้อใดที่ขัดกันในสถานการณ์นี้มากที่สุด"
    choices: ["autonomy กับ justice", "การรักษาความลับกับหน้าที่ต่อผู้ปกครอง", "beneficence กับ justice", "การรักษาความลับกับความยุติธรรมในการจัดสรรทรัพยากร"]
    answer: 1
    explanation: "แกนของปัญหาคือสิทธิในความลับและการตัดสินใจของวัยรุ่น ปะทะกับบทบาทของผู้ปกครอง ไม่ใช่เรื่องการจัดสรรทรัพยากร (justice) จึงตัดตัวเลือกที่มี justice ออกได้"
    difficulty: 3

  - qid: tpat1_ethics_principle_106
    topic: tpat1_ethics_principle
    stem: "แพทย์บอกความจริงเรื่องการวินิจฉัยกับผู้ป่วย แม้รู้ว่าจะทำให้ผู้ป่วยเสียใจมาก การกระทำนี้ยึดหลักใดเป็นสำคัญ"
    choices: ["การไม่ก่ออันตราย", "ความซื่อสัตย์ต่อผู้ป่วย (veracity)", "ความยุติธรรม", "การทำประโยชน์สูงสุด"]
    answer: 1
    explanation: "veracity คือหน้าที่บอกความจริง เป็นฐานของ informed consent — ถ้าปิดบังการวินิจฉัย ผู้ป่วยจะตัดสินใจเรื่องการรักษาของตัวเองไม่ได้"
    difficulty: 2

  - qid: tpat1_ethics_principle_107
    topic: tpat1_ethics_principle
    stem: "ในกรณีที่ผู้ป่วยหมดสติจากอุบัติเหตุและต้องผ่าตัดฉุกเฉินทันทีเพื่อรักษาชีวิต โดยติดต่อญาติไม่ได้ แพทย์ควรทำอย่างไร"
    choices: ["รอจนกว่าจะติดต่อญาติได้ก่อนเสมอ", "ผ่าตัดได้ โดยถือว่าเป็นการยินยอมโดยปริยายในภาวะฉุกเฉิน", "ให้พยาบาลลงนามแทนผู้ป่วย", "ยุติการรักษาเพราะไม่มีผู้ยินยอม"]
    answer: 1
    explanation: "ภาวะฉุกเฉินที่คุกคามชีวิตและไม่อาจขอความยินยอมได้ ถือว่ามีการยินยอมโดยปริยาย (implied consent) เพราะคนทั่วไปย่อมต้องการให้ช่วยชีวิต การรอจนติดต่อญาติได้อาจทำให้ผู้ป่วยเสียชีวิต"
    difficulty: 2

  - qid: tpat1_ethics_principle_108
    topic: tpat1_ethics_principle
    stem: "หลัก beneficence กับ non-maleficence ต่างกันอย่างไร"
    choices: ["beneficence คือทำสิ่งที่เป็นประโยชน์ ส่วน non-maleficence คือหลีกเลี่ยงการก่ออันตราย", "beneficence ใช้กับผู้ป่วยเด็ก ส่วน non-maleficence ใช้กับผู้ใหญ่", "beneficence เป็นหน้าที่ตามกฎหมาย ส่วน non-maleficence เป็นเพียงมารยาท", "ทั้งสองมีความหมายเหมือนกันทุกประการ"]
    answer: 0
    explanation: "beneficence เป็นหน้าที่เชิงบวก (ลงมือทำสิ่งที่ดีต่อผู้ป่วย) ส่วน non-maleficence เป็นหน้าที่เชิงลบ (ละเว้นการทำอันตราย) ทั้งคู่เป็นหลักคนละข้อและบางครั้งขัดกันเอง เช่น การผ่าตัดที่ช่วยชีวิตแต่ก็สร้างบาดแผล"
    difficulty: 1

  # ── จริยธรรม: วิเคราะห์สถานการณ์ ─────────────────────────────
  - qid: tpat1_ethics_case_101
    topic: tpat1_ethics_case
    stem: "คุณเป็นนักศึกษาแพทย์ เห็นรุ่นพี่แพทย์ใช้มือถือถ่ายภาพแผลผู้ป่วยลงกลุ่มไลน์ของทีมโดยไม่ได้ขออนุญาต ควรทำอย่างไรเหมาะสมที่สุด"
    choices: ["ไม่ทำอะไร เพราะเป็นเรื่องภายในทีมรักษา", "ถ่ายเก็บไว้เป็นหลักฐานแล้วโพสต์ประจานในโซเชียล", "ทักท้วงรุ่นพี่อย่างสุภาพ และถ้าไม่ได้ผลจึงรายงานอาจารย์ผู้ควบคุม", "บอกผู้ป่วยให้ไปฟ้องร้องรุ่นพี่ทันที"]
    answer: 2
    explanation: "การถ่ายภาพผู้ป่วยต้องขอความยินยอมแม้จะใช้ในทีม การทักท้วงตรงก่อนแล้วค่อยยกระดับตามลำดับขั้นเป็นวิธีที่แก้ปัญหาจริงโดยไม่ทำร้ายใครเกินจำเป็น ส่วนการประจานในโซเชียลยิ่งละเมิดความลับผู้ป่วยซ้ำ"
    difficulty: 2

  - qid: tpat1_ethics_case_102
    topic: tpat1_ethics_case
    stem: "ผู้ป่วยขอให้คุณไม่บอกญาติว่าเขาเป็นมะเร็ง แต่ลูกของผู้ป่วยมาถามคุณโดยตรง ควรตอบอย่างไร"
    choices: ["บอกความจริงทั้งหมดเพราะเป็นลูกแท้ ๆ", "บอกว่าไม่สามารถให้ข้อมูลได้หากผู้ป่วยไม่ยินยอม และชวนให้คุยกับผู้ป่วยเอง", "ปฏิเสธว่าไม่ทราบอะไรเลย", "บอกเป็นนัย ๆ ให้ลูกเดาเอาเอง"]
    answer: 1
    explanation: "ความลับเป็นของผู้ป่วย ไม่ใช่ของครอบครัว การอธิบายกรอบที่ตัวเองทำได้อย่างตรงไปตรงมาแล้วเปิดทางให้ครอบครัวคุยกันเอง รักษาทั้งความลับและความสัมพันธ์ ส่วนการโกหกว่าไม่ทราบเป็นการทำลายความไว้วางใจ"
    difficulty: 2

  - qid: tpat1_ethics_case_103
    topic: tpat1_ethics_case
    stem: "คุณตรวจพบว่าตัวเองสั่งยาผิดขนาดให้ผู้ป่วยเมื่อวาน โชคดีที่ผู้ป่วยยังไม่มีอาการผิดปกติ ควรทำอย่างไร"
    choices: ["เงียบไว้ เพราะไม่มีใครรู้และผู้ป่วยก็ปลอดภัย", "แก้ไขคำสั่งยาเงียบ ๆ แล้วไม่ต้องบอกใคร", "แจ้งทีมและผู้ป่วย พร้อมติดตามอาการและรายงานตามระบบความปลอดภัยของโรงพยาบาล", "โทษเภสัชกรที่จ่ายยาโดยไม่ทักท้วง"]
    answer: 2
    explanation: "ความผิดพลาดที่ยังไม่ก่ออันตรายก็ยังเป็นความผิดพลาดที่ต้องรายงาน เพราะระบบต้องรู้เพื่อป้องกันครั้งต่อไป และผู้ป่วยมีสิทธิรู้สิ่งที่เกิดกับร่างกายตัวเอง การปิดบังทำลายทั้งความไว้วางใจและระบบความปลอดภัย"
    difficulty: 2

  - qid: tpat1_ethics_case_104
    topic: tpat1_ethics_case
    stem: "ผู้ป่วยยากจนไม่มีเงินจ่ายค่ายาที่จำเป็น แต่โรงพยาบาลมีระเบียบให้เก็บเงินก่อน คุณในฐานะแพทย์ควรทำอย่างไรก่อนเป็นอันดับแรก"
    choices: ["ออกเงินให้ผู้ป่วยเองทันที", "ประสานนักสังคมสงเคราะห์และตรวจสอบสิทธิการรักษาที่ผู้ป่วยมี", "บอกให้ผู้ป่วยไปหายืมเงินมาก่อน", "เปลี่ยนไปใช้ยาที่ถูกกว่าโดยไม่บอกผู้ป่วย"]
    answer: 1
    explanation: "ทางแก้เชิงระบบมาก่อน — คนไทยเกือบทุกคนมีสิทธิการรักษาบางอย่าง และโรงพยาบาลมีกลไกช่วยเหลือ การออกเงินเองแก้ได้แค่รายเดียวและไม่ยั่งยืน ส่วนการเปลี่ยนยาโดยไม่บอกละเมิดสิทธิที่จะรู้ของผู้ป่วย"
    difficulty: 2

  - qid: tpat1_ethics_case_105
    topic: tpat1_ethics_case
    stem: "เพื่อนสนิทขอให้คุณ (ซึ่งเป็นแพทย์) สั่งยานอนหลับให้โดยไม่ต้องตรวจ เพราะ 'รู้จักกันดีอยู่แล้ว' ควรทำอย่างไร"
    choices: ["สั่งให้ตามที่ขอ เพราะเป็นเพื่อนและรู้ประวัติดี", "ปฏิเสธ และแนะนำให้เข้ารับการตรวจตามระบบ", "สั่งให้ครั้งเดียวแล้วบอกว่าครั้งหน้าต้องมาตรวจ", "ให้ยาชนิดอื่นที่อ่อนกว่าแทนโดยไม่บอก"]
    answer: 1
    explanation: "การสั่งยาโดยไม่ตรวจและไม่มีเวชระเบียนเป็นการรักษาที่ไม่ได้มาตรฐาน ยิ่งกับยาที่ควบคุมพิเศษ ความสนิทสนมยังทำให้การตัดสินใจทางคลินิกเสียความเป็นกลาง การปฏิเสธแล้วชี้ทางที่ถูกจึงเป็นทางเลือกเดียวที่ยอมรับได้"
    difficulty: 1

  - qid: tpat1_ethics_case_106
    topic: tpat1_ethics_case
    stem: "ในหอผู้ป่วย คุณได้ยินญาติผู้ป่วยพูดจาเหยียดเชื้อชาติกับพยาบาลผู้ช่วย สิ่งที่ควรทำมากที่สุดคือข้อใด"
    choices: ["ทำเป็นไม่ได้ยินเพราะไม่ใช่หน้าที่ตัวเอง", "ตำหนิญาติอย่างรุนแรงต่อหน้าผู้ป่วยคนอื่น", "เข้าไปหยุดสถานการณ์อย่างสุภาพ และแจ้งหัวหน้าเวรตามระบบ", "แนะนำให้พยาบาลผู้ช่วยอดทนไว้"]
    answer: 2
    explanation: "การเพิกเฉยเท่ากับปล่อยให้เกิดซ้ำ ส่วนการตำหนิรุนแรงต่อหน้าคนอื่นทำให้สถานการณ์บานปลายและกระทบผู้ป่วยรายอื่น การเข้าไปหยุดอย่างสงบแล้วส่งต่อตามระบบคุ้มครองทั้งเพื่อนร่วมงานและบรรยากาศการรักษา"
    difficulty: 2

  - qid: tpat1_ethics_case_107
    topic: tpat1_ethics_case
    stem: "บริษัทยาเชิญคุณไปสัมมนาต่างประเทศฟรี พร้อมค่าที่พัก โดยไม่มีเงื่อนไขเป็นลายลักษณ์อักษร สิ่งที่ควรพิจารณามากที่สุดคือข้อใด"
    choices: ["รับได้เลยเพราะไม่มีเงื่อนไขผูกมัด", "ผลประโยชน์ทับซ้อนที่อาจกระทบการสั่งยาในอนาคต แม้จะไม่มีเงื่อนไขเขียนไว้", "ควรรับถ้าเพื่อนแพทย์คนอื่นก็รับกัน", "ควรรับถ้ามูลค่าไม่เกินหนึ่งแสนบาท"]
    answer: 1
    explanation: "ประเด็นของผลประโยชน์ทับซ้อนไม่ได้อยู่ที่มีสัญญาผูกมัดหรือไม่ แต่อยู่ที่ความสัมพันธ์นั้นอาจโน้มน้าวการตัดสินใจโดยที่เจ้าตัวไม่รู้ตัว การที่คนอื่นก็ทำหรือมูลค่าต่ำกว่าเกณฑ์ ไม่ได้ทำให้ปัญหาหายไป"
    difficulty: 2

  - qid: tpat1_ethics_case_108
    topic: tpat1_ethics_case
    stem: "ผู้ป่วยจิตเวชที่มีอาการหลงผิดรุนแรง ปฏิเสธการรักษาทั้งหมด และมีพฤติกรรมที่อาจทำร้ายตนเอง หลักการใดใช้พิจารณาการรักษาโดยผู้ป่วยไม่ยินยอมได้"
    choices: ["สิทธิของผู้ป่วยเหนือทุกกรณี จึงต้องปล่อยไป", "เมื่อความสามารถในการตัดสินใจบกพร่องและมีอันตรายต่อชีวิต การคุ้มครองผู้ป่วยมาก่อน", "ญาติมีสิทธิตัดสินใจแทนได้เสมอในทุกกรณี", "แพทย์ตัดสินใจแทนได้เสมอโดยไม่ต้องมีเกณฑ์"]
    answer: 1
    explanation: "หลัก autonomy ตั้งอยู่บนสมมติฐานว่าผู้ป่วยมีความสามารถในการตัดสินใจ เมื่อความสามารถนั้นบกพร่องจากตัวโรคและมีความเสี่ยงต่อชีวิต หลักการคุ้มครอง (beneficence/non-maleficence) จึงมีน้ำหนักขึ้น แต่ต้องมีเกณฑ์และกระบวนการ ไม่ใช่ดุลพินิจแพทย์ล้วน ๆ"
    difficulty: 3

  - qid: tpat1_ethics_case_109
    topic: tpat1_ethics_case
    stem: "คุณกำลังอยู่เวรและเหนื่อยมากจนเริ่มไม่มั่นใจในการตัดสินใจ ควรทำอย่างไรเหมาะสมที่สุด"
    choices: ["ฝืนทำต่อไปเพราะเป็นหน้าที่", "ปรึกษาแพทย์ที่อาวุโสกว่าและขอความช่วยเหลือ", "ปล่อยให้พยาบาลตัดสินใจแทน", "เลื่อนการตัดสินใจทั้งหมดไปเวรถัดไป"]
    answer: 1
    explanation: "การรู้ขีดจำกัดของตัวเองและขอความช่วยเหลือคือส่วนหนึ่งของความปลอดภัยผู้ป่วย ไม่ใช่ความอ่อนแอ ส่วนการฝืนทำ การโยนให้คนที่ไม่มีอำนาจตัดสิน หรือการเลื่อนงานที่จำเป็น ล้วนเพิ่มความเสี่ยงต่อผู้ป่วย"
    difficulty: 1

  - qid: tpat1_ethics_case_110
    topic: tpat1_ethics_case
    stem: "ผู้ป่วยเล่าให้ฟังว่าตั้งใจจะทำร้ายบุคคลหนึ่งอย่างเจาะจงหลังออกจากโรงพยาบาล ประเด็นจริยธรรมหลักคือข้อใด"
    choices: ["ต้องรักษาความลับผู้ป่วยไว้ทุกกรณีโดยไม่มีข้อยกเว้น", "หน้าที่รักษาความลับอาจถูกจำกัดเมื่อมีอันตรายร้ายแรงต่อบุคคลที่สาม", "ต้องแจ้งสื่อมวลชนเพื่อเตือนสังคม", "ต้องยุติการรักษาผู้ป่วยรายนี้ทันที"]
    answer: 1
    explanation: "ความลับผู้ป่วยไม่ใช่หลักสัมบูรณ์ เมื่อมีความเสี่ยงร้ายแรงและเจาะจงต่อผู้อื่น หน้าที่ป้องกันอันตรายอาจมีน้ำหนักเหนือกว่า แต่การเปิดเผยต้องจำกัดเฉพาะเท่าที่จำเป็นและผ่านช่องทางที่เหมาะสม ไม่ใช่ประกาศต่อสาธารณะ"
    difficulty: 3

  # ── จริยธรรม: จรรยาบรรณวิชาชีพ ───────────────────────────────
  - qid: tpat1_ethics_prof_101
    topic: tpat1_ethics_prof
    stem: "ข้อใดขัดต่อจรรยาบรรณวิชาชีพเวชกรรมมากที่สุด"
    choices: ["ปฏิเสธการรักษานอกเวลาราชการโดยส่งต่อให้แพทย์เวร", "โฆษณาอวดอ้างว่าตนรักษาโรคมะเร็งหายขาดได้ทุกราย", "แนะนำให้ผู้ป่วยไปพบแพทย์เฉพาะทางที่เหมาะสมกว่า", "ขอความเห็นที่สองจากเพื่อนร่วมวิชาชีพ"]
    answer: 1
    explanation: "การโฆษณาอวดอ้างสรรพคุณเกินจริงเป็นการหลอกลวงผู้ป่วยและทำลายความน่าเชื่อถือของวิชาชีพ ส่วนอีกสามข้อเป็นการปฏิบัติที่เหมาะสม — การส่งต่อและการขอความเห็นที่สองคือการยอมรับขีดจำกัดของตัวเอง"
    difficulty: 1

  - qid: tpat1_ethics_prof_102
    topic: tpat1_ethics_prof
    stem: "แพทย์ควรหลีกเลี่ยงการรักษาบุคคลในข้อใดมากที่สุด หากมีทางเลือกอื่น"
    choices: ["ผู้ป่วยที่ไม่มีสิทธิการรักษา", "สมาชิกในครอบครัวของตนเอง", "ผู้ป่วยที่พูดภาษาอื่น", "ผู้ป่วยสูงอายุ"]
    answer: 1
    explanation: "การรักษาคนในครอบครัวทำให้ความเป็นกลางเสียไป ซักประวัติเรื่องละเอียดอ่อนได้ยาก และมักละเลยขั้นตอนที่ควรทำ จึงควรหลีกเลี่ยงเมื่อมีทางเลือกอื่น ส่วนอีกสามข้อไม่ใช่เหตุผลที่ยอมรับได้ในการปฏิเสธการรักษา"
    difficulty: 2

  - qid: tpat1_ethics_prof_103
    topic: tpat1_ethics_prof
    stem: "การเขียนเวชระเบียนที่เหมาะสมควรมีลักษณะใด"
    choices: ["บันทึกเฉพาะสิ่งที่เป็นผลดีต่อแพทย์", "บันทึกตามจริง ครบถ้วน และตรงเวลาที่เกิดเหตุ", "เว้นว่างไว้ก่อนแล้วค่อยเติมย้อนหลังเมื่อมีปัญหา", "บันทึกด้วยคำที่คลุมเครือเพื่อความปลอดภัยทางกฎหมาย"]
    answer: 1
    explanation: "เวชระเบียนเป็นทั้งเครื่องมือสื่อสารในทีมและหลักฐานทางกฎหมาย การบันทึกตามจริงและตรงเวลาคือมาตรฐาน ส่วนการเลือกบันทึกเฉพาะบางส่วน เติมย้อนหลัง หรือเขียนคลุมเครือ ล้วนทำให้ทีมรักษาตัดสินใจผิดพลาดและถือเป็นการปลอมแปลงเอกสารได้"
    difficulty: 2

  - qid: tpat1_ethics_prof_104
    topic: tpat1_ethics_prof
    stem: "เมื่อแพทย์ทราบว่าเพื่อนร่วมวิชาชีพมีปัญหาการใช้สารเสพติดจนกระทบการทำงาน สิ่งที่ควรทำคือข้อใด"
    choices: ["ปกปิดไว้เพื่อรักษาชื่อเสียงของวิชาชีพ", "รายงานตามช่องทางที่กำหนด เพื่อให้เพื่อนได้รับการช่วยเหลือและผู้ป่วยปลอดภัย", "บอกต่อในกลุ่มเพื่อนเพื่อให้ระวังตัว", "รอจนกว่าจะเกิดความเสียหายกับผู้ป่วยก่อน"]
    answer: 1
    explanation: "หน้าที่ต่อความปลอดภัยของผู้ป่วยมาก่อนความสัมพันธ์ส่วนตัว และการรายงานตามช่องทางยังเป็นทางที่ทำให้เพื่อนได้รับการรักษาจริง ต่างจากการนินทาซึ่งทำลายชื่อเสียงโดยไม่แก้ปัญหา"
    difficulty: 2

  - qid: tpat1_ethics_prof_105
    topic: tpat1_ethics_prof
    stem: "ข้อใดเป็นการรักษาขอบเขตความสัมพันธ์ระหว่างแพทย์กับผู้ป่วยที่เหมาะสม"
    choices: ["รับของขวัญมูลค่าสูงจากผู้ป่วยเป็นการส่วนตัว", "เริ่มความสัมพันธ์เชิงชู้สาวกับผู้ป่วยที่กำลังรักษาอยู่", "ปฏิเสธคำขอเป็นเพื่อนในโซเชียลมีเดียของผู้ป่วยที่ยังรักษาอยู่ อย่างสุภาพ", "ให้คำปรึกษาทางการแพทย์ผ่านแชตส่วนตัวโดยไม่มีเวชระเบียน"]
    answer: 2
    explanation: "ความสัมพันธ์แพทย์-ผู้ป่วยมีความไม่เท่ากันของอำนาจและข้อมูลอยู่ในตัว การรักษาระยะห่างในพื้นที่ส่วนตัวจึงเป็นการคุ้มครองผู้ป่วย อีกสามข้อล้วนทำให้เส้นแบ่งเลือนและเปิดช่องให้เกิดการเอาเปรียบ"
    difficulty: 2

  - qid: tpat1_ethics_prof_106
    topic: tpat1_ethics_prof
    stem: "การทำวิจัยในมนุษย์ต้องผ่านขั้นตอนใดก่อนเริ่มเก็บข้อมูลเสมอ"
    choices: ["การอนุมัติจากคณะกรรมการจริยธรรมการวิจัยในมนุษย์", "การอนุมัติจากผู้อำนวยการโรงพยาบาลเพียงคนเดียว", "การตีพิมพ์โครงร่างในวารสารก่อน", "การขอทุนวิจัยให้ครบก่อน"]
    answer: 0
    explanation: "การพิจารณาโดยคณะกรรมการจริยธรรมที่เป็นอิสระคือกลไกคุ้มครองอาสาสมัคร ต้องผ่านก่อนเก็บข้อมูลเสมอ ไม่ใช่การอนุมัติเชิงบริหารหรือเรื่องทุน"
    difficulty: 1

  - qid: tpat1_ethics_prof_107
    topic: tpat1_ethics_prof
    stem: "ข้อใดคือเหตุผลหลักที่ผู้ประกอบวิชาชีพต้องเข้ารับการศึกษาต่อเนื่องตลอดชีวิต"
    choices: ["เพื่อสะสมคะแนนต่ออายุใบอนุญาตเท่านั้น", "เพราะองค์ความรู้ทางการแพทย์เปลี่ยนแปลงตลอด การรักษาที่เคยดีที่สุดอาจล้าสมัย", "เพื่อให้ได้ตำแหน่งทางวิชาการ", "เพราะโรงพยาบาลบังคับ"]
    answer: 1
    explanation: "เหตุผลเชิงจริยธรรมคือหน้าที่ให้การรักษาตามมาตรฐานปัจจุบันแก่ผู้ป่วย คะแนนต่ออายุใบอนุญาตเป็นเพียงกลไกบังคับให้เกิดสิ่งนี้ ไม่ใช่เป้าหมายในตัวเอง"
    difficulty: 1

  # ── เชาวน์: ตรรกะ ────────────────────────────────────────────
  - qid: tpat1_logic_101
    topic: tpat1_logic
    stem: "กำหนดว่า 'นักเรียนทุกคนที่สอบผ่านได้ทุนการศึกษา' และ 'สมชายไม่ได้ทุนการศึกษา' สรุปข้อใดถูกต้อง"
    choices: ["สมชายสอบผ่าน", "สมชายสอบไม่ผ่าน", "สมชายไม่ใช่นักเรียน", "สรุปแน่นอนไม่ได้"]
    answer: 1
    explanation: "จาก 'ผ่าน → ได้ทุน' รูปที่สมมูลคือ 'ไม่ได้ทุน → ไม่ผ่าน' (contrapositive) เมื่อสมชายไม่ได้ทุน จึงสรุปได้ว่าเขาสอบไม่ผ่าน"
    difficulty: 2

  - qid: tpat1_logic_102
    topic: tpat1_logic
    stem: "กำหนดว่า 'ถ้าฝนตก ถนนจะเปียก' และพบว่า 'ถนนเปียก' สรุปข้อใดถูกต้อง"
    choices: ["ฝนตกแน่นอน", "ฝนไม่ตกแน่นอน", "สรุปไม่ได้ว่าฝนตกหรือไม่", "ถนนจะเปียกตลอดไป"]
    answer: 2
    explanation: "การสรุปจากผลย้อนไปหาเหตุ ('ถนนเปียก จึงฝนตก') เป็นความผิดพลาดที่เรียกว่า affirming the consequent — ถนนอาจเปียกจากรถน้ำหรือท่อแตกก็ได้"
    difficulty: 2

  - qid: tpat1_logic_103
    topic: tpat1_logic
    stem: "ในกล่องมีลูกบอลสีแดง สีน้ำเงิน และสีเขียว รวม 3 สี ถ้าหยิบโดยไม่มองและต้องการให้แน่ใจว่าได้สีซ้ำกันอย่างน้อย 2 ลูก ต้องหยิบอย่างน้อยกี่ลูก"
    choices: ["2", "3", "4", "6"]
    answer: 2
    explanation: "กรณีแย่ที่สุดคือหยิบ 3 ลูกได้คนละสีพอดี ลูกที่ 4 จึงต้องซ้ำกับสีใดสีหนึ่งแน่นอน (หลักรังนกพิราบ)"
    difficulty: 2

  # ── เชาวน์: อุปมาอุปไมย ──────────────────────────────────────
  - qid: tpat1_analogy_101
    topic: tpat1_analogy
    stem: "หัวใจ : สูบฉีด เปรียบได้กับ ไต : ?"
    choices: ["กรอง", "หายใจ", "ย่อย", "สะสม"]
    answer: 0
    explanation: "ความสัมพันธ์คือ อวัยวะ : หน้าที่หลักของอวัยวะนั้น หัวใจสูบฉีดเลือด ไตกรองของเสียออกจากเลือด"
    difficulty: 1

  - qid: tpat1_analogy_102
    topic: tpat1_analogy
    stem: "วัคซีน : ป้องกัน เปรียบได้กับ ยาปฏิชีวนะ : ?"
    choices: ["ป้องกัน", "รักษา", "วินิจฉัย", "บรรเทา"]
    answer: 1
    explanation: "ความสัมพันธ์คือ สิ่งที่ให้ : จุดมุ่งหมายหลัก วัคซีนให้ก่อนป่วยเพื่อป้องกัน ส่วนยาปฏิชีวนะให้เมื่อติดเชื้อแล้วเพื่อรักษา — ตัวเลือก 1 ซ้ำความสัมพันธ์เดิมจึงผิด"
    difficulty: 2

  # ── เชาวน์: คณิตคิดเร็ว ──────────────────────────────────────
  - qid: tpat1_quant_101
    topic: tpat1_quant
    stem: "ผู้ป่วยหนัก 60 กก. ต้องได้ยาขนาด 5 มิลลิกรัมต่อน้ำหนักตัว 1 กิโลกรัม แบ่งให้วันละ 2 ครั้งเท่า ๆ กัน แต่ละครั้งได้ยากี่มิลลิกรัม"
    choices: ["120", "150", "300", "600"]
