# คลังข้อสอบ A-Level ภาษาไทย ชุดที่ 2
#
# ⚠️ ทุกข้อแต่งขึ้นใหม่ ไม่ได้คัดลอกจากข้อสอบเก่า
subject: thai
questions:
  # ───────────────────────── การอ่านจับใจความ
  - qid: thai_reading_002
    topic: thai_reading
    stem: "\"การนอนหลับไม่เพียงพอส่งผลต่อความจำ สมาธิ และระบบภูมิคุ้มกัน การนอนจึงไม่ใช่เรื่องของความขี้เกียจ แต่เป็นการลงทุนที่จำเป็น\" ใจความสำคัญของข้อความนี้คือข้อใด"
    choices:
      - "การนอนหลับให้เพียงพอเป็นสิ่งจำเป็นต่อสุขภาพ ไม่ใช่ความขี้เกียจ"
      - "คนที่นอนมากคือคนขี้เกียจ"
      - "ความจำเสื่อมเกิดจากการนอนมากเกินไป"
      - "ระบบภูมิคุ้มกันไม่เกี่ยวกับการนอน"
    answer: 0
    explanation: "ประโยคสุดท้ายที่ขึ้นต้นด้วย 'จึง' เป็นข้อสรุปของผู้เขียน ส่วนสองประโยคแรกเป็นเหตุผลสนับสนุน"
    difficulty: 2

  - qid: thai_reading_003
    topic: thai_reading
    stem: "\"แม้เทคโนโลยีจะช่วยให้การรักษาแม่นยำขึ้น แต่ความไว้วางใจระหว่างแพทย์กับผู้ป่วยยังคงเป็นหัวใจของการแพทย์\" ผู้เขียนต้องการเน้นสิ่งใด"
    choices:
      - "เทคโนโลยีไม่มีประโยชน์"
      - "ความสัมพันธ์ระหว่างแพทย์กับผู้ป่วยสำคัญกว่าที่คิด แม้เทคโนโลยีจะก้าวหน้า"
      - "ควรเลิกใช้เทคโนโลยีในการรักษา"
      - "แพทย์ไม่จำเป็นต้องเรียนเทคโนโลยี"
    answer: 1
    explanation: "โครงสร้าง 'แม้...แต่...' ทำให้น้ำหนักของประโยคตกอยู่ที่ส่วนหลัง คือความไว้วางใจ ส่วนตัวเลือกอื่นตีความเกินจากที่เขียน"
    difficulty: 2

  - qid: thai_reading_004
    topic: thai_reading
    stem: "\"งานวิจัยชิ้นนี้ศึกษาในกลุ่มตัวอย่างเพียง 30 คน ผลที่ได้จึงควรตีความอย่างระมัดระวัง\" ผู้เขียนมีท่าทีอย่างไรต่องานวิจัยนี้"
    choices: ["เชื่อถืออย่างเต็มที่", "ปฏิเสธโดยสิ้นเชิง", "ยอมรับแต่ตั้งข้อสังเกตถึงข้อจำกัด", "ไม่แสดงความเห็น"]
    answer: 2
    explanation: "ผู้เขียนไม่ได้ปฏิเสธผลการวิจัย แต่เตือนให้ระวังเพราะกลุ่มตัวอย่างเล็ก จึงเป็นท่าทีที่ยอมรับอย่างมีเงื่อนไข"
    difficulty: 2

  - qid: thai_reading_005
    topic: thai_reading
    stem: "\"ข่าวปลอมด้านสุขภาพแพร่เร็วกว่าข่าวจริง เพราะมักเล่นกับความกลัวและความหวัง\" สาเหตุที่ข่าวปลอมแพร่เร็วตามข้อความนี้คืออะไร"
    choices:
      - "มีคนเขียนเยอะกว่า"
      - "สื่อหลักไม่รายงานข่าวจริง"
      - "อ่านง่ายกว่าข่าวจริง"
      - "กระตุ้นอารมณ์ความกลัวและความหวังของผู้อ่าน"
    answer: 3
    explanation: "คำว่า 'เพราะ' ระบุสาเหตุไว้ตรง ๆ คือการเล่นกับอารมณ์ ตัวเลือกอื่นเป็นการเติมเหตุผลที่ข้อความไม่ได้กล่าว"
    difficulty: 1

  - qid: thai_reading_006
    topic: thai_reading
    stem: "\"ยาทุกชนิดล้วนมีทั้งคุณและโทษ อยู่ที่ว่าใช้ถูกขนาด ถูกเวลา และถูกคนหรือไม่\" ข้อความนี้ใช้วิธีการเขียนแบบใด"
    choices: ["การอธิบายด้วยเงื่อนไข", "การเล่าเรื่อง", "การพรรณนา", "การโต้แย้ง"]
    answer: 0
    explanation: "ผู้เขียนอธิบายว่าผลของยาขึ้นกับเงื่อนไขสามข้อ จึงเป็นการอธิบายเชิงเงื่อนไข ไม่ใช่การเล่าเหตุการณ์หรือบรรยายภาพ"
    difficulty: 2

  - qid: thai_reading_007
    topic: thai_reading
    stem: "\"เขาเป็นหมอที่ผู้ป่วยรอคิวข้ามเดือนเพื่อจะได้พบ\" ข้อความนี้สื่อความหมายโดยนัยว่าอย่างไร"
    choices:
      - "โรงพยาบาลบริหารงานไม่ดี"
      - "แพทย์คนนี้เป็นที่ยอมรับและได้รับความไว้วางใจสูง"
      - "ผู้ป่วยมีเวลาว่างมาก"
      - "แพทย์คนนี้ทำงานช้า"
    answer: 1
    explanation: "การที่คนยอมรอนานสะท้อนความต้องการและความเชื่อมั่น เป็นการสื่อความยกย่องโดยไม่กล่าวตรง ๆ"
    difficulty: 2

  - qid: thai_reading_008
    topic: thai_reading
    stem: "\"ปัญหาสุขภาพจิตในวัยรุ่นไทยเพิ่มขึ้นทุกปี ทว่างบประมาณด้านนี้กลับลดลง\" คำว่า 'ทว่า' ทำหน้าที่ใด"
    choices: ["เชื่อมความคล้อยตาม", "เชื่อมความเป็นเหตุเป็นผล", "เชื่อมความขัดแย้ง", "เชื่อมการยกตัวอย่าง"]
    answer: 2
    explanation: "ทว่าเป็นคำเชื่อมแสดงความขัดแย้ง เหมือน 'แต่' ที่นี่ใช้ชี้ว่าปัญหาเพิ่มแต่งบกลับสวนทาง"
    difficulty: 1

  # ───────────────────────── การใช้เหตุผล
  - qid: thai_reason_002
    topic: thai_reason
    stem: "\"คนที่กินผักทุกวันมักมีสุขภาพดี ดังนั้นถ้าอยากสุขภาพดีต้องกินผักทุกวัน\" ข้อบกพร่องของการให้เหตุผลนี้คืออะไร"
    choices:
      - "ไม่มีข้อบกพร่อง"
      - "ใช้ภาษาไม่สุภาพ"
      - "ใช้ตัวอย่างน้อยเกินไป"
      - "สับสนระหว่างความสัมพันธ์กับความเป็นเหตุเป็นผล และสรุปเกินจากข้อมูล"
    answer: 3
    explanation: "การที่สองสิ่งพบร่วมกันไม่ได้แปลว่าสิ่งหนึ่งทำให้เกิดอีกสิ่ง และคำว่า 'มัก' ก็ไม่ได้แปลว่า 'ต้อง' การสรุปจึงแข็งเกินหลักฐาน"
    difficulty: 3

  - qid: thai_reason_003
    topic: thai_reason
    stem: "\"นักเรียนห้องนี้สอบตกสามคน แสดงว่าครูสอนไม่ดี\" ข้อสรุปนี้เป็นการใช้เหตุผลแบบใด"
    choices: ["ด่วนสรุปจากข้อมูลไม่เพียงพอ", "สมเหตุสมผล", "อุปมาอุปไมย", "นิรนัย"]
    answer: 0
    explanation: "การสอบตกอาจมีสาเหตุอื่นอีกมาก เช่น การเตรียมตัวของนักเรียนเอง การสรุปสาเหตุเดียวจากข้อมูลน้อยจึงเป็นการด่วนสรุป"
    difficulty: 2

  - qid: thai_reason_004
    topic: thai_reason
    stem: "\"ถ้าฝนตก สนามจะเปียก ตอนนี้สนามเปียก แสดงว่าฝนตก\" ข้อสรุปนี้ถูกต้องหรือไม่ เพราะเหตุใด"
    choices:
      - "ถูกต้อง เพราะสนามเปียกจริง"
      - "ไม่ถูกต้อง เพราะสนามอาจเปียกจากสาเหตุอื่น เช่น มีคนรดน้ำ"
      - "ถูกต้อง เพราะเป็นการใช้เหตุผลแบบนิรนัย"
      - "ไม่ถูกต้อง เพราะฝนไม่ทำให้สนามเปียก"
    answer: 1
    explanation: "เป็นความผิดพลาดแบบยืนยันผลลัพธ์ (affirming the consequent) ผลอาจมาจากเหตุอื่นได้ จึงย้อนสรุปกลับไปหาเหตุไม่ได้"
    difficulty: 3

  - qid: thai_reason_005
    topic: thai_reason
    stem: "ข้อใดเป็นการอ้างเหตุผลโดยอาศัยความน่าเชื่อถือของบุคคลอย่างไม่เหมาะสม"
    choices:
      - "แพทย์เฉพาะทางด้านหัวใจอธิบายเรื่องโรคหัวใจ"
      - "นักวิจัยอ้างอิงผลการทดลองของตนเอง"
      - "นักแสดงชื่อดังบอกว่าอาหารเสริมชนิดนี้รักษามะเร็งได้"
      - "ครูอธิบายเนื้อหาในวิชาที่ตนสอน"
    answer: 2
    explanation: "ความมีชื่อเสียงในด้านหนึ่งไม่ได้ทำให้คำพูดในอีกด้านน่าเชื่อถือ การอ้างเช่นนี้เรียกว่าการอ้างผู้มีชื่อเสียงผิดสาขา"
    difficulty: 2

  - qid: thai_reason_006
    topic: thai_reason
    stem: "\"ไม่มีใครพิสูจน์ได้ว่าวิธีนี้ไม่ได้ผล แสดงว่าวิธีนี้ได้ผล\" การให้เหตุผลนี้ผิดพลาดอย่างไร"
    choices:
      - "ใช้ตัวอย่างมากเกินไป"
      - "ไม่มีข้อผิดพลาด"
      - "ใช้ภาษากำกวม"
      - "อ้างความไม่รู้มาเป็นหลักฐานยืนยัน"
    answer: 3
    explanation: "การที่ยังไม่มีหลักฐานหักล้างไม่ได้แปลว่าข้อความนั้นจริง ภาระการพิสูจน์อยู่ที่ผู้กล่าวอ้าง ไม่ใช่ผู้สงสัย"
    difficulty: 3

  # ───────────────────────── หลักภาษา
  - qid: thai_grammar_003
    topic: thai_grammar
    stem: "คำว่า \"งดงาม\" เกิดจากการสร้างคำแบบใด"
    choices: ["คำซ้อน", "คำประสม", "คำซ้ำ", "คำสมาส"]
    answer: 0
    explanation: "คำซ้อนเกิดจากคำที่มีความหมายใกล้เคียงกันมาซ้อนกันเพื่อเน้นย้ำ ทั้ง 'งด' และ 'งาม' สื่อความสวยงามเหมือนกัน"
    difficulty: 2

  - qid: thai_grammar_004
    topic: thai_grammar
    stem: "ข้อใดเป็นคำสมาส"
    choices: ["แม่น้ำ", "วิทยาศาสตร์", "พ่อครัว", "รถไฟ"]
    answer: 1
    explanation: "คำสมาสเกิดจากการรวมคำบาลีสันสกฤตเข้าด้วยกัน วิทยา + ศาสตร์ ส่วนตัวเลือกอื่นเป็นคำประสมจากคำไทย"
    difficulty: 2

  - qid: thai_grammar_005
    topic: thai_grammar
    stem: "ประโยค \"นักเรียนที่ขยันย่อมประสบความสำเร็จ\" มีโครงสร้างแบบใด"
    choices: ["ประโยคความเดียว", "ประโยคความรวม", "ประโยคความซ้อน", "ประโยคคำสั่ง"]
    answer: 2
    explanation: "มีอนุประโยค 'ที่ขยัน' ทำหน้าที่ขยายคำนาม 'นักเรียน' จึงเป็นประโยคความซ้อน ไม่ใช่ประโยคความรวมที่เชื่อมสองใจความเท่าเทียมกัน"
    difficulty: 2

  - qid: thai_grammar_006
    topic: thai_grammar
    stem: "คำใดเป็นคำอุทาน"
    choices: ["และ", "ที่", "อย่าง", "โอ้โฮ"]
    answer: 3
    explanation: "คำอุทานใช้แสดงอารมณ์ความรู้สึก ส่วน 'และ' เป็นคำเชื่อม 'อย่าง' เป็นคำวิเศษณ์ และ 'ที่' เป็นคำสรรพนามเชื่อม"
    difficulty: 1

  # ───────────────────────── การใช้ภาษา
  - qid: thai_usage_003
    topic: thai_usage
    stem: "ข้อใดใช้ระดับภาษาเหมาะสมกับการเขียนรายงานวิชาการ"
    choices:
      - "ผลการทดลองเป็นไปตามสมมติฐานที่ตั้งไว้"
      - "ผลการทดลองออกมาเจ๋งมาก"
      - "ผลที่ได้ก็โอเคอยู่นะ"
      - "ผลออกมาแบบว่าดีเลย"
    answer: 0
    explanation: "งานวิชาการต้องใช้ภาษาระดับทางการ กระชับ ไม่ใช้คำสแลงหรือภาษาพูด"
    difficulty: 1

  - qid: thai_usage_004
    topic: thai_usage
    stem: "ประโยคใดใช้คำฟุ่มเฟือย"
    choices:
      - "เขาเดินเข้าไปในห้อง"
      - "เขาเดินเข้าไปข้างในภายในห้อง"
      - "เขาเข้าห้อง"
      - "เขาเดินเข้าห้อง"
    answer: 1
    explanation: "คำว่า 'ข้างใน' และ 'ภายใน' มีความหมายซ้ำกัน และซ้ำกับ 'เข้าไป' อีกชั้นหนึ่ง จึงเป็นคำฟุ่มเฟือย"
    difficulty: 1

  - qid: thai_usage_005
    topic: thai_usage
    stem: "ข้อใดใช้ราชาศัพท์ถูกต้อง"
    choices:
      - "พระบาทสมเด็จพระเจ้าอยู่หัวเสด็จไปทรงเปิดงาน"
      - "พระบาทสมเด็จพระเจ้าอยู่หัวไปเปิดงาน"
      - "พระบาทสมเด็จพระเจ้าอยู่หัวเสด็จพระราชดำเนินไปทรงเปิดงาน"
      - "พระบาทสมเด็จพระเจ้าอยู่หัวทรงเสด็จพระราชดำเนิน"
    answer: 2
    explanation: "การเดินทางของพระมหากษัตริย์ใช้ 'เสด็จพระราชดำเนิน' และไม่ใช้ 'ทรง' นำหน้าคำที่เป็นราชาศัพท์อยู่แล้ว"
    difficulty: 3

  - qid: thai_usage_006
    topic: thai_usage
    stem: "ข้อใดเขียนสะกดถูกต้องทุกคำ"
    choices:
      - "อนุญาติ ผลลัพธ์ สังเกต"
      - "อนุญาติ ผลลัพท์ สังเกตุ"
      - "อนุญาต ผลลัพท์ สังเกตุ"
      - "อนุญาต ผลลัพธ์ สังเกต"
    answer: 3
    explanation: "คำที่มักเขียนผิดสามคำนี้ ที่ถูกคือ อนุญาต (ไม่มีสระอิ) ผลลัพธ์ (ธ ไม่ใช่ ท) และ สังเกต (ไม่มีสระอุ)"
    difficulty: 2

  # ───────────────────────── โวหารและภาพพจน์
  - qid: thai_rhetoric_003
    topic: thai_rhetoric
    stem: "\"ดวงตาของเธอเป็นประกายดั่งดาว\" ใช้ภาพพจน์ชนิดใด"
    choices: ["อุปมา", "อุปลักษณ์", "บุคคลวัต", "อติพจน์"]
    answer: 0
    explanation: "มีคำเปรียบเทียบ 'ดั่ง' ปรากฏชัด จึงเป็นอุปมา ส่วนอุปลักษณ์จะเปรียบโดยตรงว่า 'เป็น' โดยไม่ใช้คำเชื่อมเปรียบเทียบ"
    difficulty: 2

  - qid: thai_rhetoric_004
    topic: thai_rhetoric
    stem: "\"สายลมกระซิบบอกความลับแก่ต้นไม้\" ใช้ภาพพจน์ชนิดใด"
    choices: ["อุปมา", "บุคคลวัต", "อติพจน์", "สัทพจน์"]
    answer: 1
    explanation: "บุคคลวัตคือการให้สิ่งไม่มีชีวิตมีกิริยาอาการอย่างมนุษย์ ที่นี่คือลมที่ 'กระซิบ' และ 'บอกความลับ'"
    difficulty: 2

  - qid: thai_rhetoric_005
    topic: thai_rhetoric
    stem: "\"รอเธอมาเป็นพันปี\" ใช้ภาพพจน์ชนิดใด"
    choices: ["นามนัย", "อุปมา", "อติพจน์", "สัทพจน์"]
    answer: 2
    explanation: "อติพจน์คือการกล่าวเกินจริงเพื่อเน้นความรู้สึก ที่นี่คือการรอที่ยาวนานจนเกินความเป็นไปได้"
    difficulty: 1

  # ───────────────────────── วรรณคดี
  - qid: thai_literature_002
    topic: thai_literature
    stem: "วรรณคดีเรื่องใดเป็นพระราชนิพนธ์ในพระบาทสมเด็จพระพุทธเลิศหล้านภาลัย"
    choices: ["ลิลิตพระลอ", "ไตรภูมิพระร่วง", "สามก๊ก", "อิเหนา"]
    answer: 3
    explanation: "บทละครเรื่องอิเหนาเป็นพระราชนิพนธ์ในรัชกาลที่ 2 ส่วนสามก๊กเป็นงานแปลสมัยรัชกาลที่ 1 และไตรภูมิพระร่วงเป็นวรรณคดีสมัยสุโขทัย"
    difficulty: 2

  - qid: thai_literature_003
    topic: thai_literature
    stem: "คำประพันธ์ประเภทกลอนสุภาพหนึ่งบทมีกี่วรรค และวรรคละกี่คำโดยทั่วไป"
    choices: ["4 วรรค วรรคละ 7-9 คำ", "2 วรรค วรรคละ 5 คำ", "8 วรรค วรรคละ 4 คำ", "6 วรรค วรรคละ 6 คำ"]
    answer: 0
    explanation: "กลอนสุภาพหนึ่งบทมี 2 บาท บาทละ 2 วรรค รวม 4 วรรค แต่ละวรรคนิยม 7-9 คำ"
    difficulty: 2

  - qid: thai_literature_004
    topic: thai_literature
    stem: "วรรณคดีเรื่องใดสะท้อนภาพสังคมและวิถีชีวิตชาวบ้านไทยได้ชัดเจนที่สุด"
    choices: ["รามเกียรติ์", "ขุนช้างขุนแผน", "ลิลิตตะเลงพ่าย", "มหาชาติคำหลวง"]
    answer: 1
    explanation: "ขุนช้างขุนแผนเล่าเรื่องสามัญชน จึงบันทึกประเพณี ความเชื่อ และวิถีชีวิตชาวบ้านไว้ละเอียด ต่างจากเรื่องอื่นที่เน้นเทพเจ้า สงคราม หรือพุทธประวัติ"
    difficulty: 2

  - qid: thai_literature_005
    topic: thai_literature
    stem: "\"เสียงลือเสียงเล่าอ้าง อันใด พี่เอย\" เป็นคำประพันธ์ประเภทใด"
    choices: ["กลอนแปด", "กาพย์ยานี", "โคลงสี่สุภาพ", "ฉันท์"]
    answer: 2
    explanation: "บาทแรกของโคลงสี่สุภาพมี 5 คำแล้วตามด้วยคำสร้อย 2 คำ ('พี่เอย') ซึ่งเป็นลักษณะเฉพาะของโคลงสี่สุภาพ"
    difficulty: 3

  # ───────────────────────── การเขียน
  - qid: thai_writing_002
    topic: thai_writing
    stem: "ข้อใดควรอยู่เป็นประโยคแรกของย่อหน้าที่อธิบายสาเหตุของโรคอ้วน"
    choices:
      - "ดังนั้นการออกกำลังกายจึงสำคัญ"
      - "นอกจากนี้การนอนก็มีผลด้วย"
      - "ตัวอย่างเช่น น้ำอัดลมหนึ่งกระป๋องให้พลังงานสูงมาก"
      - "โรคอ้วนเกิดจากหลายปัจจัยประกอบกัน ทั้งอาหาร การเคลื่อนไหว และพันธุกรรม"
    answer: 3
    explanation: "ประโยคใจความหลักต้องกว้างและครอบคลุมทั้งย่อหน้า ส่วนตัวเลือกอื่นขึ้นต้นด้วยคำเชื่อมที่บ่งบอกว่าต้องมีเนื้อหามาก่อน"
    difficulty: 2

  - qid: thai_writing_003
    topic: thai_writing
    stem: "เรียงลำดับข้อความให้เป็นย่อหน้าที่ต่อเนื่อง: (1) จึงทำให้ผู้ป่วยเข้าถึงการรักษาได้เร็วขึ้น (2) โรงพยาบาลนำระบบนัดหมายออนไลน์มาใช้ (3) ระบบนี้ลดเวลารอคอยลงอย่างมาก"
    choices: ["2, 3, 1", "1, 2, 3", "3, 2, 1", "2, 1, 3"]
    answer: 0
    explanation: "ต้องเริ่มจากสิ่งที่เกิดขึ้นก่อน คือนำระบบมาใช้ แล้วจึงเป็นผลทีละขั้น คำว่า 'จึง' ในข้อ 1 บ่งว่าต้องอยู่ท้ายสุด"
    difficulty: 2

  - qid: thai_writing_004
    topic: thai_writing
    stem: "การเขียนย่อความที่ดีควรมีลักษณะใด"
    choices:
      - "คัดลอกประโยคเด่นจากต้นฉบับมาต่อกัน"
      - "เก็บใจความสำคัญครบถ้วนด้วยสำนวนของตนเอง และสั้นกว่าต้นฉบับ"
      - "เพิ่มความคิดเห็นของผู้ย่อลงไปด้วย"
      - "ย่อให้สั้นที่สุดโดยไม่ต้องครบใจความ"
    answer: 1
    explanation: "ย่อความต้องรักษาใจความหลักไว้ครบ เรียบเรียงใหม่ด้วยภาษาของผู้ย่อ และไม่สอดแทรกความเห็นส่วนตัว"
    difficulty: 1

  - qid: thai_writing_005
    topic: thai_writing
    stem: "ในการเขียนจดหมายราชการ ควรใช้คำขึ้นต้นและลงท้ายอย่างไรจึงเหมาะสม"
    choices:
      - "สวัสดีครับ / ด้วยความเคารพ"
      - "ถึง ... / แล้วเจอกัน"
      - "เรียน ... / ขอแสดงความนับถือ"
      - "ที่รัก ... / รักและคิดถึง"
    answer: 2
    explanation: "จดหมายราชการใช้ 'เรียน' นำหน้าผู้รับ และลงท้ายด้วย 'ขอแสดงความนับถือ' ตามระเบียบงานสารบรรณ"
    difficulty: 1
