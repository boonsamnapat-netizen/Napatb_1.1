# ⚠️ ทุกข้อแต่งขึ้นใหม่ตามเนื้อหาหลักสูตร ไม่ได้คัดลอกจากข้อสอบเก่า
#    ใช้ g = 10 m/s² ทุกข้อ เว้นแต่ระบุไว้เป็นอย่างอื่น
subject: phys
questions:
  # ───────────────────────── การเคลื่อนที่
  - qid: phys_kinematics_002
    topic: phys_kinematics
    stem: "รถออกตัวจากหยุดนิ่งด้วยความเร่งคงที่ 2 m/s² เป็นเวลา 5 วินาที ได้ระยะทางเท่าใด"
    choices: ["25 m", "10 m", "50 m", "100 m"]
    answer: 0
    explanation: "s = ut + ½at² = 0 + ½(2)(5²) = 25 เมตร"
    difficulty: 1

  - qid: phys_kinematics_003
    topic: phys_kinematics
    stem: "ปล่อยวัตถุตกอิสระจากที่สูง 45 เมตร ใช้เวลากี่วินาทีจึงถึงพื้น"
    choices: ["2", "3", "4.5", "9"]
    answer: 1
    explanation: "h = ½gt² ดังนั้น 45 = ½(10)t² ได้ t² = 9 และ t = 3 วินาที"
    difficulty: 2

  - qid: phys_kinematics_004
    topic: phys_kinematics
    stem: "ขว้างวัตถุขึ้นในแนวดิ่งด้วยความเร็วต้น 20 m/s ขึ้นได้สูงสุดเท่าใด"
    choices: ["10 m", "40 m", "20 m", "80 m"]
    answer: 2
    explanation: "ที่จุดสูงสุด v = 0 ใช้ v² = u² − 2gh ได้ 0 = 400 − 20h ดังนั้น h = 20 เมตร"
    difficulty: 2

  - qid: phys_kinematics_005
    topic: phys_kinematics
    stem: "ในการเคลื่อนที่แบบโพรเจกไทล์ ปริมาณใดคงที่ตลอดการเคลื่อนที่ (ไม่คิดแรงต้านอากาศ)"
    choices: ["ความเร็วในแนวดิ่ง", "ความเร็วลัพธ์", "ความเร่งในแนวราบ ซึ่งเท่ากับ g", "ความเร็วในแนวราบ"]
    answer: 3
    explanation: "แนวราบไม่มีแรงกระทำ ความเร็วแนวราบจึงคงที่ ส่วนแนวดิ่งมีความเร่ง g คงที่ทำให้ความเร็วแนวดิ่งเปลี่ยนตลอด"
    difficulty: 2

  - qid: phys_kinematics_006
    topic: phys_kinematics
    stem: "ยิงวัตถุในแนวราบจากหน้าผาสูง 20 เมตร ด้วยความเร็ว 15 m/s ตกห่างจากฐานหน้าผาเท่าใด"
    choices: ["30 m", "20 m", "15 m", "45 m"]
    answer: 0
    explanation: "หาเวลาตกจากแนวดิ่ง 20 = ½(10)t² ได้ t = 2 วินาที ระยะแนวราบ = 15 × 2 = 30 เมตร"
    difficulty: 3

  - qid: phys_kinematics_007
    topic: phys_kinematics
    stem: "มุมยิงที่ทำให้วัตถุไปได้ไกลที่สุดบนพื้นราบคือมุมใด"
    choices: ["30 องศา", "45 องศา", "60 องศา", "90 องศา"]
    answer: 1
    explanation: "ระยะทางไกลสุด R = u²sin2θ/g มีค่ามากสุดเมื่อ sin2θ = 1 คือ 2θ = 90 องศา ดังนั้น θ = 45 องศา"
    difficulty: 2

  - qid: phys_kinematics_008
    topic: phys_kinematics
    stem: "กราฟความเร็ว-เวลาที่เป็นเส้นตรงเอียงขึ้น พื้นที่ใต้กราฟแทนปริมาณใด"
    choices: ["ความเร่ง", "แรง", "การกระจัด", "กำลัง"]
    answer: 2
    explanation: "พื้นที่ใต้กราฟความเร็ว-เวลาคือความเร็วคูณเวลา ซึ่งเท่ากับการกระจัด ส่วนความชันของกราฟคือความเร่ง"
    difficulty: 1

  # ───────────────────────── แรงและกฎนิวตัน
  - qid: phys_newton_002
    topic: phys_newton
    stem: "วัตถุมวล 4 kg ถูกแรง 20 N กระทำบนพื้นลื่น มีความเร่งเท่าใด"
    choices: ["2 m/s²", "80 m/s²", "20 m/s²", "5 m/s²"]
    answer: 3
    explanation: "จาก F = ma ได้ a = 20/4 = 5 m/s²"
    difficulty: 1

  - qid: phys_newton_003
    topic: phys_newton
    stem: "กฎข้อที่สามของนิวตันกล่าวว่าอย่างไร"
    choices:
      - "ทุกแรงกิริยามีแรงปฏิกิริยาขนาดเท่ากันทิศตรงข้าม กระทำต่อวัตถุคนละก้อน"
      - "แรงเท่ากับมวลคูณความเร่ง"
      - "วัตถุรักษาสภาพการเคลื่อนที่เดิม"
      - "แรงลัพธ์เป็นศูนย์เมื่อสมดุล"
    answer: 0
    explanation: "จุดสำคัญคือแรงคู่กิริยา-ปฏิกิริยากระทำต่อวัตถุคนละก้อน จึงไม่หักล้างกันและไม่ทำให้ทุกอย่างหยุดนิ่ง"
    difficulty: 2

  - qid: phys_newton_004
    topic: phys_newton
    stem: "คนมวล 60 kg ยืนในลิฟต์ที่กำลังเร่งขึ้นด้วยความเร่ง 2 m/s² แรงที่พื้นลิฟต์ดันคนเท่าใด"
    choices: ["480 N", "720 N", "600 N", "1200 N"]
    answer: 1
    explanation: "N − mg = ma ดังนั้น N = m(g + a) = 60(10 + 2) = 720 นิวตัน คนจึงรู้สึกหนักกว่าปกติ"
    difficulty: 3

  - qid: phys_newton_005
    topic: phys_newton
    stem: "วัตถุวางนิ่งบนพื้นเอียง แรงเสียดทานสถิตมีทิศทางใด"
    choices: ["ลงตามพื้นเอียง", "ตั้งฉากกับพื้นเอียง", "ขึ้นตามพื้นเอียง", "ในแนวดิ่งลง"]
    answer: 2
    explanation: "องค์ประกอบของน้ำหนักตามแนวพื้นเอียงดึงวัตถุลง แรงเสียดทานจึงต้านในทิศตรงข้ามคือขึ้นตามพื้นเอียง"
    difficulty: 2

  - qid: phys_newton_006
    topic: phys_newton
    stem: "สัมประสิทธิ์ความเสียดทานจลน์ 0.2 วัตถุมวล 10 kg เคลื่อนที่บนพื้นราบ แรงเสียดทานเท่าใด"
    choices: ["2 N", "10 N", "100 N", "20 N"]
    answer: 3
    explanation: "f = μN = 0.2 × (10 × 10) = 20 นิวตัน"
    difficulty: 2

  - qid: phys_newton_007
    topic: phys_newton
    stem: "เหตุใดคนที่ไม่คาดเข็มขัดนิรภัยจึงพุ่งไปข้างหน้าเมื่อรถเบรกกะทันหัน"
    choices:
      - "ความเฉื่อยทำให้คนรักษาการเคลื่อนที่เดิมไว้ขณะที่รถชะลอ"
      - "แรงจากเบรกผลักคนไปข้างหน้า"
      - "แรงโน้มถ่วงเปลี่ยนทิศ"
      - "แรงเสียดทานผลักคน"
    answer: 0
    explanation: "กฎข้อที่หนึ่งของนิวตัน วัตถุที่กำลังเคลื่อนที่จะเคลื่อนที่ต่อไปด้วยความเร็วเดิมถ้าไม่มีแรงลัพธ์มากระทำ ตัวรถถูกเบรกแต่ตัวคนไม่ถูก"
    difficulty: 1

  - qid: phys_newton_008
    topic: phys_newton
    stem: "มวล 2 kg และ 3 kg ผูกด้วยเชือกวางบนพื้นลื่น ดึงด้วยแรง 10 N ที่มวล 3 kg แรงตึงเชือกเท่าใด"
    choices: ["2 N", "4 N", "6 N", "10 N"]
    answer: 1
    explanation: "ระบบรวมมวล 5 kg มีความเร่ง a = 10/5 = 2 m/s² แรงตึงเชือกเป็นแรงเดียวที่ลากมวล 2 kg ดังนั้น T = 2 × 2 = 4 นิวตัน"
    difficulty: 3

  # ───────────────────────── สมดุลกลและโมเมนต์
  - qid: phys_equilibrium_002
    topic: phys_equilibrium
    stem: "คานยาว 4 เมตร มีจุดหมุนตรงกลาง แขวนน้ำหนัก 20 N ที่ปลายซ้ายสุด ต้องแขวนน้ำหนักเท่าใดที่ห่างจุดหมุนไปทางขวา 1 เมตร จึงจะสมดุล"
    choices: ["10 N", "20 N", "40 N", "80 N"]
    answer: 2
    explanation: "โมเมนต์ซ้าย = 20 × 2 = 40 N·m ต้องเท่ากับโมเมนต์ขวา = F × 1 ดังนั้น F = 40 นิวตัน"
    difficulty: 2

  - qid: phys_equilibrium_003
    topic: phys_equilibrium
    stem: "เงื่อนไขของสมดุลสมบูรณ์ของวัตถุแข็งเกร็งคือข้อใด"
    choices:
      - "แรงลัพธ์เป็นศูนย์เท่านั้น"
      - "วัตถุต้องหยุดนิ่ง"
      - "โมเมนต์เป็นศูนย์เท่านั้น"
      - "แรงลัพธ์เป็นศูนย์ และผลรวมโมเมนต์รอบจุดใด ๆ เป็นศูนย์"
    answer: 3
    explanation: "ต้องครบทั้งสมดุลต่อการเลื่อนที่ (ΣF = 0) และสมดุลต่อการหมุน (Στ = 0) วัตถุที่เคลื่อนที่ด้วยความเร็วคงที่ก็ถือว่าสมดุลได้"
    difficulty: 2

  - qid: phys_equilibrium_004
    topic: phys_equilibrium
    stem: "เหตุใดรถบรรทุกที่บรรทุกของสูงจึงพลิกคว่ำง่ายกว่ารถที่บรรทุกของต่ำ"
    choices:
      - "จุดศูนย์ถ่วงสูงขึ้น ทำให้เอียงเพียงเล็กน้อยแนวน้ำหนักก็ออกนอกฐาน"
      - "มีน้ำหนักมากกว่า"
      - "แรงเสียดทานน้อยกว่า"
      - "ความเร็วสูงกว่า"
    answer: 0
    explanation: "เสถียรภาพขึ้นกับว่าแนวดิ่งผ่านจุดศูนย์ถ่วงยังตกอยู่ในฐานหรือไม่ จุดศูนย์ถ่วงยิ่งสูงยิ่งต้องเอียงน้อยก็หลุดออกนอกฐาน"
    difficulty: 2

  - qid: phys_equilibrium_005
    topic: phys_equilibrium
    stem: "โมเมนต์ของแรงมีหน่วยเป็นอะไร"
    choices: ["นิวตัน", "นิวตัน-เมตร", "จูล", "วัตต์"]
    answer: 1
    explanation: "โมเมนต์ = แรง × ระยะตั้งฉาก จึงมีหน่วยนิวตัน-เมตร แม้จะมีมิติเดียวกับจูลแต่เป็นปริมาณคนละชนิด จึงไม่เรียกเป็นจูล"
    difficulty: 1

  # ───────────────────────── งานและพลังงาน
  - qid: phys_work_002
    topic: phys_work
    stem: "ออกแรง 50 N ลากวัตถุไปตามแนวแรง 4 เมตร ได้งานเท่าใด"
    choices: ["12.5 J", "54 J", "200 J", "800 J"]
    answer: 2
    explanation: "W = Fs cosθ เมื่อแรงขนานกับการกระจัด cosθ = 1 ได้ W = 50 × 4 = 200 จูล"
    difficulty: 1

  - qid: phys_work_003
    topic: phys_work
    stem: "ถือกระเป๋าหนัก 100 N เดินในแนวราบ 20 เมตร งานที่ทำต่อกระเป๋าเท่าใด"
    choices: ["5 J", "100 J", "2000 J", "0 J"]
    answer: 3
    explanation: "แรงที่ถือมีทิศขึ้นในแนวดิ่ง แต่การกระจัดอยู่ในแนวราบ มุมระหว่างกันเป็น 90 องศา cos90 = 0 งานจึงเป็นศูนย์"
    difficulty: 2

  - qid: phys_work_004
    topic: phys_work
    stem: "วัตถุมวล 2 kg เคลื่อนที่ด้วยความเร็ว 10 m/s มีพลังงานจลน์เท่าใด"
    choices: ["100 J", "20 J", "10 J", "200 J"]
    answer: 0
    explanation: "Ek = ½mv² = ½(2)(100) = 100 จูล"
    difficulty: 1

  - qid: phys_work_005
    topic: phys_work
    stem: "เครื่องยนต์ทำงาน 6000 จูลใน 30 วินาที มีกำลังเท่าใด"
    choices: ["100 W", "200 W", "1800 W", "180000 W"]
    answer: 1
    explanation: "P = W/t = 6000/30 = 200 วัตต์"
    difficulty: 1

  - qid: phys_work_006
    topic: phys_work
    stem: "ปล่อยลูกบอลจากที่สูง 5 เมตร ความเร็วขณะกระทบพื้นเป็นเท่าใด (ไม่คิดแรงต้าน)"
    choices: ["5 m/s", "25 m/s", "10 m/s", "50 m/s"]
    answer: 2
    explanation: "ใช้กฎอนุรักษ์พลังงาน mgh = ½mv² ได้ v = √(2gh) = √(2×10×5) = 10 m/s มวลตัดกันไปจึงไม่ต้องรู้"
    difficulty: 2

  # ───────────────────────── โมเมนตัม
  - qid: phys_momentum_002
    topic: phys_momentum
    stem: "วัตถุมวล 3 kg เคลื่อนที่ด้วยความเร็ว 4 m/s มีโมเมนตัมเท่าใด"
    choices: ["7 kg·m/s", "48 kg·m/s", "24 kg·m/s", "12 kg·m/s"]
    answer: 3
    explanation: "p = mv = 3 × 4 = 12 kg·m/s"
    difficulty: 1

  - qid: phys_momentum_003
    topic: phys_momentum
    stem: "การชนแบบยืดหยุ่นสมบูรณ์ต่างจากการชนแบบไม่ยืดหยุ่นอย่างไร"
    choices:
      - "แบบยืดหยุ่นอนุรักษ์ทั้งโมเมนตัมและพลังงานจลน์ แบบไม่ยืดหยุ่นอนุรักษ์เฉพาะโมเมนตัม"
      - "แบบยืดหยุ่นอนุรักษ์โมเมนตัมเท่านั้น"
      - "แบบไม่ยืดหยุ่นไม่อนุรักษ์อะไรเลย"
      - "ทั้งสองแบบพลังงานจลน์เท่าเดิม"
    answer: 0
    explanation: "โมเมนตัมอนุรักษ์เสมอเมื่อไม่มีแรงภายนอก แต่พลังงานจลน์บางส่วนเปลี่ยนเป็นความร้อนและการเสียรูปในการชนแบบไม่ยืดหยุ่น"
    difficulty: 2

  - qid: phys_momentum_004
    topic: phys_momentum
    stem: "วัตถุ 2 kg ความเร็ว 6 m/s ชนติดกับวัตถุ 4 kg ที่อยู่นิ่ง ความเร็วหลังชนของทั้งคู่เป็นเท่าใด"
    choices: ["1 m/s", "2 m/s", "3 m/s", "6 m/s"]
    answer: 1
    explanation: "โมเมนตัมก่อนชน = 2 × 6 = 12 kg·m/s หลังชนติดกันมวลรวม 6 kg ดังนั้น v = 12/6 = 2 m/s"
    difficulty: 2

  - qid: phys_momentum_005
    topic: phys_momentum
    stem: "เหตุใดถุงลมนิรภัยจึงลดการบาดเจ็บได้"
    choices:
      - "ลดโมเมนตัมของคน"
      - "เพิ่มแรงกระแทก"
      - "ยืดเวลาที่ใช้ในการหยุด ทำให้แรงกระแทกเฉลี่ยลดลง"
      - "ทำให้โมเมนตัมไม่อนุรักษ์"
    answer: 2
    explanation: "จากการดล FΔt = Δp โมเมนตัมที่ต้องเปลี่ยนเท่าเดิม แต่ถ้ายืดเวลา Δt ให้นานขึ้น แรงเฉลี่ย F จะลดลงตามสัดส่วน"
    difficulty: 2

  - qid: phys_momentum_006
    topic: phys_momentum
    stem: "ปืนมวล 5 kg ยิงกระสุนมวล 0.01 kg ออกไปด้วยความเร็ว 500 m/s ปืนถอยหลังด้วยความเร็วเท่าใด"
    choices: ["0.1 m/s", "10 m/s", "5 m/s", "1 m/s"]
    answer: 3
    explanation: "โมเมนตัมรวมก่อนยิงเป็นศูนย์ ดังนั้น 5v = 0.01 × 500 = 5 ได้ v = 1 m/s ในทิศตรงข้าม"
    difficulty: 2

  # ───────────────────────── การเคลื่อนที่แบบวงกลม
  - qid: phys_circular_002
    topic: phys_circular
    stem: "แรงสู่ศูนย์กลางมีทิศทางใด และทำหน้าที่อะไร"
    choices:
      - "เข้าหาศูนย์กลาง ทำให้ทิศความเร็วเปลี่ยนไปเรื่อย ๆ"
      - "ออกจากศูนย์กลาง ผลักวัตถุออก"
      - "ตามแนวสัมผัส เพิ่มอัตราเร็ว"
      - "ในแนวดิ่งเสมอ"
    answer: 0
    explanation: "ในการเคลื่อนที่วงกลมสม่ำเสมอ อัตราเร็วคงที่แต่ทิศเปลี่ยนตลอด จึงมีความเร่งเข้าสู่ศูนย์กลางและต้องมีแรงในทิศเดียวกัน"
    difficulty: 1

  - qid: phys_circular_003
    topic: phys_circular
