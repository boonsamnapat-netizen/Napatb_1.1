function viewToday() {
  const root = $("#v-today");
  root.innerHTML = "";
  const wrap = el('<div class="stack"></div>');

  const todaysTests = DATA.tests.filter(t => t.date === TODAY);
  const todo = buildPlan(TODAY, 1)[0];
  const doneToday = S.log[TODAY] || [];
  const blocks = todo.blocks;
  const hoursLeft = blocks.reduce((a, b) => a + b.hours, 0);
  const hoursDone = doneToday.reduce((a, b) => a + b.hours, 0);
  const allDone = hoursDone > 0 && blocks.length === 0;
  const st = streak();

  /* ---- เปิดครั้งแรก: ถามสามอย่างที่ทำให้ตารางเป็นของเขาจริง ๆ
     เดิมเป็นการ์ดอธิบายใบเดียวแล้วโยนตารางที่คิดจาก "เวลาว่างค่าเริ่มต้น" ให้
     ซึ่งไม่ใช่เวลาว่างของใครเลย */
  if (!S.seenIntro) {
    root.appendChild(onboarding());
    return;
  }

  /* ---- ปุ่มหลัก: เริ่มลงมือ ไม่ใช่รายงานว่าเป็นศูนย์ (วางหลังแถบสถานะ) */
  const startSlot = el('<div></div>');
  if (blocks.length) {
    const first = blocks[0];
    const start = el(
      '<button class="start">' +
        '<span class="start-ico"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>' +
        '<span class="start-t"><b>เริ่มอ่าน · ' + fmtHours(first.hours) + "</b>" +
          "<span>" + esc(first.topicName) + "</span></span>" +
      "</button>");
    start.addEventListener("click", () => startTimer(first));
    startSlot.appendChild(start);
  }

  /* ---- ยังทันไหม — ตอบคำถามที่สำคัญที่สุดก่อนเรื่องอื่น */
  const look = outlook().filter(o => o.need > 0);
  if (look.length) {
    const worst = look.reduce((a, b) => (a.slack <= b.slack ? a : b));
    const cls = worst.status === "over" ? "over" : worst.status === "tight" ? "tight" : "ok";
    const label = { ok: "ตามทัน", tight: "ค่อนข้างตึง", over: "ไม่ทันแล้ว" }[cls];
    const detail = worst.status === "over"
      ? "ยังต้องอ่านอีก " + Math.round(worst.need) + " ชม. แต่ก่อนถึง " +
        worst.name + " เหลือเวลาว่างแค่ " + Math.round(worst.avail) +
        " ชม. — ต้องเพิ่มเวลาต่อวัน หรือตัดหัวข้อที่น้ำหนักน้อยออก"
      : "ยังต้องอ่านอีก " + Math.round(worst.need) + " ชม. จากเวลาว่างที่เหลือ " +
        Math.round(worst.avail) + " ชม. ก่อน " + worst.name;
    wrap.appendChild(el(
      '<div class="status ' + cls + '">' +
        '<div class="status-hd"><span class="status-dot"></span>' +
        '<b>' + label + '</b><span class="spacer num">' +
        Math.round(worst.need) + " / " + Math.round(worst.avail) + " ชม.</span></div>" +
        '<p class="tiny" style="margin:3px 0 0">' + esc(detail) + "</p>" +
      "</div>"));
  }

  wrap.appendChild(startSlot);   // ปุ่มเริ่มอ่าน วางต่อจากแถบสถานะ

  /* ---- summary tiles — สามใบสามสี ไม่ใช่สามใบสีเดียว */
  const totalBlocks = doneToday.length + blocks.length;
  wrap.appendChild(el(
    '<div class="tiles">' +
      '<div class="tile" style="--tc:var(--marigold)"><div class="tile-n" ' +
        'data-key="streak" data-count="' + st + '">0</div><div class="tile-l">วันติดต่อกัน 🔥</div></div>' +
      '<div class="tile" style="--tc:var(--indigo)"><div class="tile-n" ' +
        'data-key="blocksToday" data-count="' + doneToday.length + '" data-suf="/' + totalBlocks + '">0</div>' +
        '<div class="tile-l">บล็อกวันนี้</div></div>' +
      '<div class="tile" style="--tc:' + (hoursLeft ? "var(--brick)" : "var(--ok)") + '">' +
        '<div class="tile-n" data-key="hoursLeft" data-count="' + (Math.round(hoursLeft * 10) / 10) + '" data-dec="1">0</div>' +
        '<div class="tile-l">ชั่วโมงที่เหลือ</div></div>' +
    "</div>"
  ));

  /* ---- today's blocks
     หัวการ์ดเป็นแถบสีเต็มความกว้าง สีมาจากวิชาที่กินเวลามากที่สุดของวันนี้
     จึงเปลี่ยนไปตามตารางจริง ไม่ใช่สีตกแต่งที่ตายตัว */
  const card = el('<div class="card"></div>');
  const hoursBySubj = {};
  blocks.concat(doneToday).forEach(b => {
    if (b.subject) hoursBySubj[b.subject] = (hoursBySubj[b.subject] || 0) + b.hours;
  });
  const leadSubj = Object.keys(hoursBySubj)
    .sort((a, b) => hoursBySubj[b] - hoursBySubj[a])[0] || "";
  const donePct = totalBlocks ? doneToday.length / totalBlocks : 0;

  const band = el(
    '<div class="dayband" data-s="' + esc(leadSubj) + '">' +
      '<div class="dayband-t">' +
        "<h2>" + esc(thaiDate(TODAY, true)) + "</h2>" +
        '<div class="dayband-sub">' +
          (totalBlocks
            ? esc(doneToday.length + " จาก " + totalBlocks + " บล็อก · " +
                  (hoursDone ? "ทำไป " + fmtHours(hoursDone) + " · " : "") +
                  "เหลือ " + fmtHours(hoursLeft))
            : esc(todo.note || "ไม่มีตารางของวันนี้")) +
        "</div>" +
      "</div>" +
      (totalBlocks ? ringHTML(donePct, 58, 6, "dayRing") : "") +
    "</div>");
  card.appendChild(band);
  const body = el('<div class="card-pad"></div>');

  if (allDone) {
    body.appendChild(el(
      '<div class="done-hero">' +
        '<div class="done-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg></div>' +
        "<b>ครบแล้ววันนี้</b>" +
        '<span class="tiny">ทำไป ' + fmtHours(hoursDone) +
        (st > 1 ? " · ต่อเนื่อง " + st + " วันติด" : "") + "</span>" +
      "</div>"));
  } else if (!blocks.length) {
    body.appendChild(el('<div class="empty">' + esc(todo.note || "ไม่มีตารางของวันนี้") + "</div>"));
  } else {
    const reviews = blocks.filter(b => b.kind === "review");
    const learns = blocks.filter(b => b.kind === "learn");
    if (reviews.length) {
      body.appendChild(el('<div class="section-title"><h2>ทบทวนก่อน</h2></div>'));
      body.appendChild(el('<p class="tiny" style="margin:-6px 0 8px">อ่านแล้วลืมคือเสียเวลาเปล่า — คิวทบทวนมาก่อนของใหม่เสมอ</p>'));
      let prev = null;
      reviews.forEach(b => {
        body.appendChild(blockRow(TODAY, b, { showSubject: b.subject !== prev }));
        prev = b.subject;
      });
    }
    if (learns.length) {
      body.appendChild(el('<div class="section-title" style="margin-top:' + (reviews.length ? "14px" : "0") + '"><h2>อ่านใหม่</h2></div>'));
      let prevL = null;
      learns.forEach(b => {
        body.appendChild(blockRow(TODAY, b, { showSubject: b.subject !== prevL }));
        prevL = b.subject;
      });
    }
  }

  // ที่ทำเสร็จไปแล้ววันนี้ — กดซ้ำเพื่อยกเลิกได้
  if (doneToday.length) {
    body.appendChild(el('<div class="section-title" style="margin-top:14px"><h2>ทำเสร็จแล้ว</h2></div>'));
    doneToday.forEach((e, i) => {
      const t = TOPIC_OF.get(e.topic);
      body.appendChild(blockRow(TODAY, {
        kind: e.kind, subject: e.subject || (t && t.subject), topic: e.topic,
        topicName: t ? t.name : e.topic, hours: e.hours, repetition: e.rep || 0,
      }, { done: true, index: i }));
    });
  }
  card.appendChild(body);
  wrap.appendChild(card);

  /* ---- tests today or next */
  const upcoming = todaysTests.length ? todaysTests : DATA.tests.filter(t => t.date > TODAY).slice(0, 1);
  if (upcoming.length) {
    const tc = el('<div class="card"></div>');
    tc.appendChild(el('<div class="card-hd"><h2>' + (todaysTests.length ? "ต้องทดสอบวันนี้" : "การทดสอบครั้งถัดไป") + "</h2></div>"));
    const tb = el('<div class="card-pad stack"></div>');
    upcoming.forEach(t => tb.appendChild(testRow(t)));
    tc.appendChild(tb);
    wrap.appendChild(tc);
  }

  /* ---- quick quiz */
  const subjectsToday = [...new Set(
    blocks.map(b => b.subject).concat(doneToday.map(e => e.subject).filter(Boolean)))];
  const qc = el('<div class="card card-pad stack"></div>');
  qc.appendChild(el('<div class="section-title"><h2>ทดสอบเร็ว</h2></div>'));
  qc.appendChild(el('<p class="muted" style="margin:-8px 0 0">ทำข้อสอบสั้น ๆ จากวิชาที่อ่านวันนี้ ตอบผิดข้อไหนระบบจะเอากลับมาถามซ้ำ</p>'));
  const row = el('<div class="btn-row"></div>');
  if (subjectsToday.length) {
    subjectsToday.forEach(sc => {
      const n = DATA.questions.filter(q => q.subject === sc).length;
      if (!n) return;
      const b = el('<button class="btn btn-sm">' + esc(subjLabel(sc)) + " · " + n + " ข้อ</button>");
      b.addEventListener("click", () => { startQuiz({ subject: sc, count: 5 }); go("quiz"); });
      row.appendChild(b);
    });
  }
  const anyBtn = el('<button class="btn btn-sm btn-pri">สุ่มทุกวิชา 10 ข้อ</button>');
  anyBtn.addEventListener("click", () => { startQuiz({ count: 10 }); go("quiz"); });
  row.appendChild(anyBtn);
  qc.appendChild(row);
  wrap.appendChild(qc);

  /* ---- milestones */
  const ms = DATA.milestones
    .map(m => ({ ...m, inDays: daysBetween(TODAY, m.date) }))
    .filter(m => m.inDays >= 0 && m.inDays <= 60);
  if (ms.length) {
    const mc = el('<div class="card card-pad"></div>');
    mc.appendChild(el('<div class="section-title"><h2>หมุดหมายที่ใกล้ถึง</h2></div>'));
    ms.forEach(m => mc.appendChild(el(
      '<div style="padding:7px 0;border-bottom:1px solid var(--line-soft)">' +
        '<div style="font-size:13.5px;line-height:1.5">' + esc(m.label) + "</div>" +
        '<div class="tiny">' + (m.inDays === 0 ? "วันนี้" : "อีก " + m.inDays + " วัน") +
          " · " + esc(thaiDate(m.date)) + "</div>" +
      "</div>"
    )));
    wrap.appendChild(mc);
  }

  root.appendChild(wrap);
}

let planWindow = 14;

function viewPlan() {
  const root = $("#v-plan");
  root.innerHTML = "";
  const wrap = el('<div class="stack"></div>');

  const ctl = el('<div class="card card-pad"></div>');
  ctl.appendChild(el('<div class="section-title"><h2>ช่วงที่แสดง</h2></div>'));
  const row = el('<div class="btn-row"></div>');
  [7, 14, 30, 90].forEach(n => {
    const b = el('<button class="btn btn-sm' + (planWindow === n ? " btn-pri" : "") + '">' + n + " วัน</button>");
    b.addEventListener("click", () => { planWindow = n; render(); });
    row.appendChild(b);
  });
  ctl.appendChild(row);
  ctl.appendChild(el('<p class="tiny" style="margin:10px 0 0">ตารางจัดใหม่ทุกครั้งที่เปิด ' +
    'จากงานที่ยังไม่ได้ทำจริง — ข้ามไปกี่วันงานก็ไม่หาย จะถูกดันมาข้างหน้าให้เอง ' +
    'ติ๊กได้เฉพาะของวันนี้</p>'));
  wrap.appendChild(ctl);

  const days = buildPlan(TODAY, planWindow);
  const card = el('<div class="card card-pad"></div>');

  if (!days.some(d => d.blocks.length)) {
    card.appendChild(el('<div class="empty">ไม่มีตารางในช่วงนี้แล้ว</div>'));
    wrap.appendChild(card);
    root.appendChild(wrap);
    return;
  }

  // จัดกลุ่มเป็นสัปดาห์ (จันทร์เป็นวันแรก) — 30 วันจะได้สแกนได้ ไม่ใช่เลื่อนยาว 13 จอ
  const weeks = [];
  days.forEach(day => {
    const dt = d(day.date);
    const mon = d(day.date);
    mon.setDate(mon.getDate() - ((dt.getDay() + 6) % 7));
    const key = iso(mon);
    let w = weeks[weeks.length - 1];
    if (!w || w.key !== key) { w = { key, start: key, days: [] }; weeks.push(w); }
    w.days.push(day);
  });

  weeks.forEach((w, wi) => {
    const hours = w.days.reduce((a, x) => a + x.blocks.reduce((b, y) => b + y.hours, 0), 0);
    const nTopics = new Set(w.days.flatMap(x => x.blocks.filter(y => y.kind === "learn").map(y => y.topic))).size;
    const last = w.days[w.days.length - 1].date;
    const open = wi < 2;   // กางสองสัปดาห์แรกไว้ ที่เหลือพับเก็บ

    const head = el('<button class="wk" aria-expanded="' + open + '">' +
      '<span class="wk-c">▾</span>' +
      '<span class="wk-t">' + esc(thaiDate(w.start, false)) + " – " + esc(thaiDate(last, false)) + "</span>" +
      '<span class="wk-m">' + (hours ? Math.round(hours) + " ชม." : "พัก") +
        (nTopics ? " · " + nTopics + " หัวข้อ" : "") + "</span>" +
      "</button>");
    const body = el('<div class="wk-body"></div>');
    body.hidden = !open;

    // สัดส่วนชั่วโมงต่อวิชาในสัปดาห์นี้
    const mixHours = {};
    w.days.forEach(x => x.blocks.forEach(y => {
      mixHours[y.subject] = (mixHours[y.subject] || 0) + y.hours;
    }));
    const mixList = Object.entries(mixHours).sort((a, b) => b[1] - a[1]);
    if (mixList.length) {
      const bar = el('<div class="mix"></div>');
      mixList.forEach(([sc, h]) => {
        const seg = el('<span></span>');
        seg.setAttribute("data-s", sc);
        seg.style.flex = h;
        seg.title = subjLabel(sc) + " " + Math.round(h) + " ชม.";
        bar.appendChild(seg);
      });
      body.appendChild(bar);
      const key = el('<div class="mix-key"></div>');
      mixList.forEach(([sc, h]) => {

    const spine = el('<div class="spine" style="padding-top:12px"></div>');

    w.days.forEach(day => {

      const monKey = dt.getFullYear() + "-" + dt.getMonth();
      const sd = el('<div class="sday' + (day.date === TODAY ? " today" : "") + '"></div>');

          (monKey !== lastMonth ? '<div class="sday-mon">' + MON[dt.getMonth()] + "</div>" : "") +
        "</div>"));
      lastMonth = monKey;

      if (!day.blocks.length) {
        sd.appendChild(el('<div class="tiny" style="padding:3px 0 0">' + esc(day.note || "พัก") + "</div>"));
      } else {
        let prev = null;
        day.blocks.forEach(b => {
          sd.appendChild(blockRow(day.date, b, {
            readonly: day.date !== TODAY,
            showSubject: b.subject !== prev,
          }));
          prev = b.subject;
        });

      DATA.tests.filter(t => t.date === day.date).forEach(t => sd.appendChild(el(
        '<div class="blk" style="cursor:default"><span class="blk-body">' +
          '<span class="blk-name">' + esc(t.title) + "</span>" +
          '<span class="blk-meta"><span class="chip mock">' + esc(t.kindLabel) + "</span></span>" +
        "</span></div>")));
      spine.appendChild(sd);
    });
    body.appendChild(spine);
    card.appendChild(body);
  });

  wrap.appendChild(card);
  root.appendChild(wrap);
}

function testRow(t) {
  const inDays = daysBetween(TODAY, t.date);
  const key = t.date + "|" + t.kind;
  const done = !!S.tests[key];
  const chipCls = t.kind === "mock" ? "mock" : (t.kind === "monthly" ? "review" : "learn");

  const node = el(
    '<div class="blk' + (done ? " done" : "") + '" style="border-left-color:' +
      (t.kind === "mock" ? "var(--brick)" : t.kind === "monthly" ? "var(--marigold-f)" : "var(--indigo)") + '">' +
      '<span class="blk-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg></span>' +
      '<span class="blk-body">' +
        '<span class="blk-name">' + esc(t.title) + "</span>" +
        '<span class="blk-meta">' +
          '<span class="chip ' + chipCls + '">' + esc(t.kindLabel) + "</span>" +
          '<span class="blk-sub">' + esc(thaiDate(t.date)) + " · " +
            (inDays === 0 ? "วันนี้" : inDays > 0 ? "อีก " + inDays + " วัน" : "ผ่านมาแล้ว") +
            (t.questions ? " · ~" + t.questions + " ข้อ" : "") +
            (t.minutes ? " " + t.minutes + " นาที" : "") + "</span>" +
        "</span>" +
        (t.note ? '<span class="tiny" style="display:block;margin-top:4px">' + esc(t.note) + "</span>" : "") +
      "</span>" +
    "</div>"
  );
  node.style.cursor = "pointer";
  node.setAttribute("role", "button");
  node.tabIndex = 0;
  const toggle = () => {
    if (S.tests[key]) delete S.tests[key]; else S.tests[key] = true;
    Store.save(); render();
  };
  node.addEventListener("click", toggle);
  node.addEventListener("keydown", ev => {
    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); }
  });
  return node;
}

let quiz = null;

function startQuiz(opts) {
  const pool = DATA.questions.filter(q =>
    (!opts.subject || q.subject === opts.subject) && (!opts.topic || q.topic === opts.topic));

  // เรียงลำดับความสำคัญ: ข้อที่เคยตอบผิด -> ยังไม่เคยทำ -> ที่เหลือ
  const rank = q => {
    const r = S.q[q.qid];
    if (!r) return 1;
    return r.ok < r.seen ? 0 : 2;
  };
  const shuffled = pool.slice().sort(() => Math.random() - 0.5).sort((a, b) => rank(a) - rank(b));
  const items = shuffled.slice(0, opts.count || 10);

  quiz = { items, i: 0, answers: new Array(items.length).fill(null), done: false, subject: opts.subject || null };
}

function answerQuiz(choiceIndex) {
  if (!quiz || quiz.answers[quiz.i] !== null) return;
  const q = quiz.items[quiz.i];
  quiz.answers[quiz.i] = choiceIndex;
  const ok = choiceIndex === q.answer;
  const rec = S.q[q.qid] || { seen: 0, ok: 0 };
  rec.seen += 1; if (ok) rec.ok += 1;
  S.q[q.qid] = rec;
  Store.save();
  render();
}

function viewQuiz() {
  const root = $("#v-quiz");
  root.innerHTML = "";
  const wrap = el('<div class="stack"></div>');

  /* ---- picker */
  if (!quiz) {
    const pick = el('<div class="card card-pad stack"></div>');
    pick.appendChild(el('<div class="section-title"><h2>เลือกชุดข้อสอบ</h2></div>'));
    pick.appendChild(el('<p class="muted" style="margin:-8px 0 0">ข้อที่เคยตอบผิดจะถูกดันขึ้นมาถามก่อนเสมอ ' +
      "คลังตอนนี้มี " + DATA.questions.length + " ข้อ</p>"));

    const grid = el('<div class="tiles"></div>');
    Object.entries(SUBJ).forEach(([code, s]) => {
      const n = DATA.questions.filter(q => q.subject === code).length;
      if (!n) return;
      let seen = 0, ok = 0;
      DATA.questions.filter(q => q.subject === code).forEach(q => {
        const r = S.q[q.qid]; if (r) { seen += r.seen; ok += r.ok; }
      });
      const acc = seen ? Math.round(100 * ok / seen) : null;
      const b = el(
        '<button class="tile press" data-s="' + esc(code) + '" ' +
          'style="cursor:pointer;text-align:left;--tc:var(--sc);border-left:4px solid var(--sc)">' +
          '<div class="tile-n">' + n + '<span style="font-size:13px;color:var(--text-3)"> ข้อ</span></div>' +
          '<div class="tile-l">' + esc(s.name) + "</div>" +
          '<div class="tiny" style="margin-top:3px">' + (acc === null ? "ยังไม่เคยทำ" : "เคยถูก " + acc + "%") + "</div>" +
        "</button>"
      );
      b.addEventListener("click", () => { startQuiz({ subject: code, count: Math.min(10, n) }); render(); });
      grid.appendChild(b);
    });
    pick.appendChild(grid);

    const all = el('<button class="btn btn-pri">สุ่มทุกวิชา 15 ข้อ</button>');
    all.addEventListener("click", () => { startQuiz({ count: 15 }); render(); });
    pick.appendChild(all);
    wrap.appendChild(pick);

    /* history */
    if (S.runs.length) {
      const h = el('<div class="card card-pad"></div>');
      h.appendChild(el('<div class="section-title"><h2>ผลย้อนหลัง</h2></div>'));
      S.runs.slice(-8).reverse().forEach(r => h.appendChild(el(
        '<div style="display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line-soft)">' +
          '<span class="num" style="font-size:14px;min-width:52px;color:' +
            (r.pct >= 80 ? "var(--ok)" : r.pct >= 60 ? "var(--warn)" : "var(--brick)") + '">' + r.pct + "%</span>" +
          "<span style=\"font-size:13.5px\">" + esc(r.subject || "รวมทุกวิชา") + "</span>" +
          '<span class="tiny" style="margin-left:auto">' + r.correct + "/" + r.total + " · " + esc(thaiDate(r.date)) + "</span>" +
        "</div>"
      )));
      wrap.appendChild(h);
    }

    root.appendChild(wrap);
    return;
  }

  /* ---- results */
  if (quiz.done) {
    const correct = quiz.items.filter((q, i) => quiz.answers[i] === q.answer).length;
    const pct = Math.round(100 * correct / quiz.items.length);
    const verdict = pct >= 80 ? "แม่นแล้ว" : pct >= 60 ? "ผ่านเกณฑ์ แต่ยังมีจุดรั่ว" : "ต้องกลับไปทบทวน";

    const res = el('<div class="card card-pad stack"></div>');
    res.appendChild(el(
      '<div><div class="eyebrow">ผลการทำชุดนี้</div>' +
      '<div class="tile-n" style="font-size:42px;color:' +
        (pct >= 80 ? "var(--ok)" : pct >= 60 ? "var(--warn)" : "var(--brick)") + '">' + pct + "%</div>" +
      '<div class="muted">ถูก ' + correct + " จาก " + quiz.items.length + " ข้อ — " + verdict + "</div></div>"
    ));

    const wrong = quiz.items.filter((q, i) => quiz.answers[i] !== q.answer);
    if (wrong.length) {
      res.appendChild(el('<hr class="rule">'));
      res.appendChild(el('<div class="section-title"><h2>ข้อที่ยังพลาด</h2></div>'));
      wrong.forEach(q => {
        const t = TOPIC_OF.get(q.topic);
        res.appendChild(el(
          '<div style="padding:9px 0;border-bottom:1px solid var(--line-soft)">' +
            '<div style="font-size:13.5px;line-height:1.65">' + esc(q.stem) + "</div>" +
            '<div style="font-size:13.5px;margin-top:5px"><b>เฉลย:</b> ' +
              esc(CHOICE_LETTERS[q.answer] + ". " + q.choices[q.answer]) + "</div>" +
            (t ? '<div class="tiny" style="margin-top:3px">หัวข้อ: ' + esc(t.name) + "</div>" : "") +
          "</div>"
        ));
      });
    }

    const row = el('<div class="btn-row"></div>');
    const again = el('<button class="btn btn-pri">ทำชุดใหม่</button>');
    again.addEventListener("click", () => { quiz = null; render(); });
    row.appendChild(again);
    if (wrong.length) {
      const retry = el('<button class="btn">ทำเฉพาะข้อที่ผิด (' + wrong.length + ")</button>");
      retry.addEventListener("click", () => {
        quiz = { items: wrong, i: 0, answers: new Array(wrong.length).fill(null), done: false, subject: quiz.subject };
        render();
      });
      row.appendChild(retry);
    }
    res.appendChild(row);
    wrap.appendChild(res);
    root.appendChild(wrap);
    return;
  }

  /* ---- runner */
  const q = quiz.items[quiz.i];
  const given = quiz.answers[quiz.i];
  const answered = given !== null;
  const subj = SUBJ[q.subject];
  const topic = TOPIC_OF.get(q.topic);

  const pips = el('<div class="q-progress"></div>');
  quiz.items.forEach((it, i) => {
    const a = quiz.answers[i];
    const cls = i === quiz.i ? "now" : a === null ? "" : (a === it.answer ? "ok" : "bad");
    pips.appendChild(el('<span class="q-pip ' + cls + '"></span>'));
  });

  const card = el('<div class="card" data-s="' + esc(q.subject) + '"></div>');
  // หัวการ์ดใช้สีของวิชาที่กำลังทำ — รู้ว่ากำลังทำวิชาอะไรจากสีก่อนอ่านชื่อ
  card.appendChild(el(
    '<div class="dayband" data-s="' + esc(q.subject) + '" style="padding:13px 16px">' +
      '<div class="dayband-t">' +
        '<h2 style="font-size:15px">' + esc(subjName(q.subject)) + "</h2>" +
        '<div class="dayband-sub num">ข้อ ' + (quiz.i + 1) + " จาก " + quiz.items.length + "</div>" +
      "</div>" +
    "</div>"
  ));

  const body = el('<div class="card-pad"></div>');
  body.appendChild(pips);
  body.appendChild(el('<p class="q-stem">' + esc(q.stem) + "</p>"));

  q.choices.forEach((c, i) => {
    let cls = "", bub = "bub";
    if (answered) {
      if (i === q.answer) { cls = "is-ok"; bub += " ok"; }
      else if (i === given) { cls = "is-bad"; bub += " bad"; }
    }
    const b = el(
      '<button class="q-choice ' + cls + '">' +
        '<span class="' + bub + '">' + CHOICE_LETTERS[i] + "</span>" +
        '<span class="q-choice-t">' + esc(c) + "</span>" +
      "</button>"
    );
    if (answered) b.disabled = true;
    else b.addEventListener("click", () => answerQuiz(i));
    body.appendChild(b);
  });

  if (answered) {
    if (q.explanation) body.appendChild(el('<div class="q-explain">' + esc(q.explanation) + "</div>"));
    if (topic) body.appendChild(el('<p class="tiny" style="margin:8px 0 0">หัวข้อ: ' + esc(topic.name) + "</p>"));

    const nav = el('<div class="btn-row" style="margin-top:14px"></div>');
    const last = quiz.i === quiz.items.length - 1;
    const next = el('<button class="btn btn-pri">' + (last ? "ดูผลรวม" : "ข้อถัดไป") + "</button>");
    next.addEventListener("click", () => {
      if (last) {
        const correct = quiz.items.filter((it, i) => quiz.answers[i] === it.answer).length;
        S.runs.push({
          date: TODAY, subject: quiz.subject ? subjLabel(quiz.subject) : null,
          total: quiz.items.length, correct, pct: Math.round(100 * correct / quiz.items.length),
        });
        Store.save();
        quiz.done = true;
      } else quiz.i += 1;
      render();
    });
    nav.appendChild(next);
    const quit = el('<button class="btn">ออก</button>');
    quit.addEventListener("click", () => { quiz = null; render(); });
    nav.appendChild(quit);
    body.appendChild(nav);
  }

  card.appendChild(body);
  wrap.appendChild(card);
  root.appendChild(wrap);
}

/* ─────────────────────────────────────────────────────────────
   คะแนน กสพท — คำถามเดียวที่เด็กอยากรู้จริง ๆ

   สูตรเดียวกับ src/tcas/scoring.py เป๊ะ ๆ เพื่อให้ CLI กับแอปตอบตรงกัน
   น้ำหนักและเกณฑ์ขั้นต่ำมาจาก config ที่ฝังมาตอน build ไม่ได้ฮาร์ดโค้ดที่นี่
   ทั้งสองค่าถอดจากประกาศ กสพท ฉบับที่ 1 ปีการศึกษา 2569 ข้อ 4 — เป็นของจริง
   แต่เป็นของ*ปีที่แล้ว* (ประกาศปี 2570 ยังไม่ออก) หน้าจอจึงยังต้องกำกับไว้
   ───────────────────────────────────────────────────────────── */
const W = DATA.weights || {};
const GROUP_LABEL = DATA.groupLabels || {};
const MINS = DATA.minimums || {};

const myScores = () => S.scores || (S.scores = {});

/* คะแนนดิบ -> % ของคะแนนเต็มวิชานั้น (TPAT1 เต็ม 300, A-Level เต็ม 100) */
function toPercent(code, raw) {
  const max = (SUBJ[code] || {}).maxScore || 0;
  return max ? 100 * Number(raw) / max : 0;
}

/* รวมเป็น % รายกลุ่ม — กลุ่มวิทย์เฉลี่ยจากสามวิชาเท่า ๆ กัน */
function groupPercents(scores) {
  const buckets = {};
  for (const [code, raw] of Object.entries(scores)) {
    if (!SUBJ[code] || raw === "" || raw == null) continue;
    const g = SUBJ[code].group;
    (buckets[g] = buckets[g] || []).push(toPercent(code, raw));
  }
  const out = {};
  for (const [g, vals] of Object.entries(buckets))
    if (vals.length) out[g] = vals.reduce((a, b) => a + b, 0) / vals.length;
  return out;
}

const filledSubjects = scores =>
  Object.keys(SUBJ).filter(c => scores[c] !== "" && scores[c] != null);
const missingSubjects = scores =>
  Object.keys(SUBJ).filter(c => scores[c] === "" || scores[c] == null);

function scoreCard(scores) {
  const pcts = groupPercents(scores);
  let total = 0;
  const breakdown = [];
  for (const [g, weight] of Object.entries(W)) {
    const pct = pcts[g] || 0;
    const weighted = weight * pct / 100;
    total += weighted;
    breakdown.push({ group: g, pct, weight, weighted, filled: g in pcts });
  }

  return {
    total, breakdown,
    failures: checkMinimums(scores),
    missing: missingSubjects(scores),
  };
}

/* เกณฑ์ขั้นต่ำของวิชานี้ (%) — null = ประกาศไม่ได้กำหนดเกณฑ์ไว้
   ลอกตรรกะจาก scoring.minimum_floor() ใน src/tcas/scoring.py */
function minimumFloor(code) {
  const subj = SUBJ[code];
  if (!subj) return null;
  let floor;
  if (subj.group === "tpat1") floor = MINS.tpat1_pct;
  else if (subj.group === "english" && MINS.english_pct != null) floor = MINS.english_pct;
  else floor = MINS.alevel_each_subject_pct != null
    ? MINS.alevel_each_subject_pct
    : MINS.alevel_each_group_pct;   // รองรับ config รุ่นก่อน
  return floor == null ? null : Number(floor);
}

/* ประกาศ กสพท เขียนว่า "ไม่น้อยกว่า 30% ของคะแนนเต็ม**ในแต่ละวิชา**"
   คำว่า *แต่ละวิชา* คือหัวใจ: ฟิสิกส์ 20 / เคมี 40 / ชีวะ 40 เฉลี่ยกลุ่มได้ 33%
   ถ้าเช็คที่ระดับกลุ่มจะขึ้นว่าผ่าน ทั้งที่ความจริงตกเพราะฟิสิกส์ไม่ถึง 30 */
function checkMinimums(scores) {
  const out = [];
  Object.keys(SUBJ).forEach(code => {
    if (scores[code] === "" || scores[code] == null) return;
    const floor = minimumFloor(code);
    if (floor == null) return;
    const pct = toPercent(code, scores[code]);
    if (pct < floor)
      out.push((SUBJ[code].name || code) + " ได้ " + pct.toFixed(1) +
               "% ต่ำกว่าเกณฑ์ " + floor.toFixed(0) + "%");
  });
  return out;
}

/* ต้องทำ % เท่าไรในวิชาที่ยังไม่ได้กรอก จึงจะไปถึงเป้า
   สมมติว่าทุกวิชาที่เหลือทำได้เท่ากันหมด — คืน null ถ้ากรอกครบแล้ว */
function requiredPercent(scores, targetTotal) {
  const missing = missingSubjects(scores);
  if (!missing.length) return null;
  const pcts = groupPercents(scores);
  let have = 0;
  for (const [g, w] of Object.entries(W)) have += w * (pcts[g] || 0) / 100;

  // น้ำหนักที่ยังเปิดอยู่: กลุ่มที่ยังไม่มีคะแนนเลย + ส่วนที่ขาดของกลุ่มวิทย์
  let openWeight = 0;
  for (const [g, w] of Object.entries(W)) {
    const inGroup = Object.keys(SUBJ).filter(c => SUBJ[c].group === g);
    const done = inGroup.filter(c => scores[c] !== "" && scores[c] != null).length;
    openWeight += w * (inGroup.length - done) / inGroup.length;
  }
  if (openWeight <= 0) return null;
  return 100 * (targetTotal - have) / openWeight;
}

const targetProgram = () => {
  const code = (S.settings || {}).targetProgram ||
               ((DATA.student || {}).target_program);
  return (DATA.programs || []).find(p => p.code === code) || null;
};

/* คะแนนที่ต้องไปให้ถึง — ค่าที่ผู้ใช้ตั้งเองชนะค่าที่มากับตัวแอปเสมอ
   เพราะเขาไปเปิดประกาศจริงมา ส่วนของเรายังเป็นค่าประมาณ */
function targetScore() {
  const manual = (S.settings || {}).targetScore;
  if (manual != null && manual !== "") return Number(manual);
  const p = targetProgram();
  return p && p.projected != null ? p.projected : null;
}

/* ─────────────────────────────────────────────────────────────
   การ์ดคะแนน — กรอกคะแนนสอบแล้วบอกว่าห่างจากคณะเป้าหมายเท่าไร
   ───────────────────────────────────────────────────────────── */
function scorePanel() {
  const scores = myScores();
  const filled = filledSubjects(scores);
  const card = el('<div class="card"></div>');
  const target = targetProgram();

  const sc = filled.length ? scoreCard(scores) : null;
  const allSubjects = Object.keys(SUBJ).length;
  const complete = sc && !sc.missing.length;
  const goal = targetScore();
  const hasTarget = goal != null;
  const gap = sc && hasTarget ? sc.total - goal : null;

  /* ที่ยังกรอกไม่ครบ คะแนนรวมย่อมต่ำเพราะวิชาที่ยังไม่สอบนับเป็นศูนย์
     ถ้าพาดหัวว่า "ยังขาดอีก 32 คะแนน" ทั้งที่เพิ่งสอบไป 4 วิชา
     มันคือการขู่ให้ตกใจโดยไม่มีข้อมูลรองรับ — จึงเปลี่ยนเป็นบอกว่า
     วิชาที่เหลือต้องทำได้เฉลี่ยเท่าไร ซึ่งเป็นตัวเลขที่เอาไปใช้ได้จริง */
  const need = sc && hasTarget && !complete
    ? requiredPercent(scores, goal) : null;

  /* ตกเกณฑ์ขั้นต่ำคือถูกคัดออกทันที ไม่ว่าคะแนนรวมจะสูงแค่ไหน
     จึงต้องกลบทุกสัญญาณอื่น ไม่งั้นแถบจะขึ้นว่า "เกือบถึงแล้ว" ให้คนที่หมดสิทธิ์ */
  const failed = sc && sc.failures.length > 0;

  const tone = failed ? "far"
    : !sc || !hasTarget ? ""
    : complete ? (gap >= 0 ? "ok" : gap > -5 ? "near" : "far")
    : need == null ? ""
    : need <= 65 ? "ok" : need <= 85 ? "near" : "far";

  const sub = failed
    ? "ตกเกณฑ์ขั้นต่ำ " + sc.failures.length + " วิชา — ดูรายละเอียดด้านล่าง"
    :
    !filled.length ? "กรอกคะแนนที่สอบได้ด้านล่าง แล้วจะรู้ว่าห่างเป้าเท่าไร"
    : !hasTarget ? "กรอกแล้ว " + filled.length + " จาก " + allSubjects + " วิชา — " +
                   (target ? "คณะนี้ยังไม่มีคะแนนต่ำสุดในระบบ ใส่คะแนนเป้าหมายเองด้านล่าง"
                           : "ตั้งคะแนนเป้าหมายเพื่อดูว่าต้องไปให้ถึงเท่าไร")
    : complete ? (gap >= 0
        ? "เกินคะแนนต่ำสุดที่คาดไว้ " + gap.toFixed(2) + " คะแนน"
        : "ยังขาดอีก " + Math.abs(gap).toFixed(2) + " คะแนน")
    : need == null ? "กรอกแล้ว " + filled.length + " จาก " + allSubjects + " วิชา"
    : need > 100
      ? "กรอกแล้ว " + filled.length + "/" + allSubjects +
        " วิชา · ที่เหลือต้องได้เกิน 100% ซึ่งเป็นไปไม่ได้แล้ว"
      : need <= 0
        ? "กรอกแล้ว " + filled.length + "/" + allSubjects +
          " วิชา · ถึงเป้าแล้วแม้ที่เหลือได้ 0"
        : "กรอกแล้ว " + filled.length + "/" + allSubjects +
          " วิชา · ที่เหลือต้องได้เฉลี่ย " + need.toFixed(0) + "%";

  const band = el(
    '<div class="scoreband ' + tone + '">' +
      '<div class="dayband-t">' +
        "<h2>" + (target ? esc(target.name)
                  : hasTarget ? "เป้าหมาย " + goal.toFixed(1) + " คะแนน"
                  : "ยังไม่ได้เลือกคณะเป้าหมาย") + "</h2>" +
        '<div class="dayband-sub">' + esc(sub) + "</div>" +
      "</div>" +
      (filled.length
        ? '<div class="scoreband-n"><span data-key="myTotal" data-count="' +
            sc.total.toFixed(2) + '" data-dec="2">0.00</span>' +
          "<small>" + (complete ? "/ 100" : "จาก " + filled.length + " วิชาที่กรอก") +
          "</small></div>"
        : "") +
    "</div>");
  card.appendChild(band);

  const body = el('<div class="card-pad stack"></div>');

  /* ---- เลือกคณะเป้าหมาย */
  const progs = DATA.programs || [];
  if (progs.length) {
    const row = el('<div class="field"><span class="field-l">คณะเป้าหมาย</span></div>');
    const sel = el('<select class="sel" style="max-width:62%"></select>');
    sel.appendChild(el('<option value="">— ยังไม่เลือก —</option>'));

    // จัดกลุ่มตามคณะ — รายการยาว 57 รายการ ถ้าเรียงรวดเดียวจะหาไม่เจอ
    const byFaculty = {};
    progs.forEach(p => (byFaculty[p.faculty] = byFaculty[p.faculty] || []).push(p));
    Object.entries(byFaculty).forEach(([faculty, list]) => {
      const grp = el('<optgroup label="' + esc(faculty) + '"></optgroup>');
      list.forEach(p => {
        const o = el('<option value="' + esc(p.code) + '">' + esc(p.name) +
          (p.projected != null ? " · " + p.projected.toFixed(1) : " · ยังไม่มีคะแนน") +
          "</option>");
        if (target && p.code === target.code) o.selected = true;
        grp.appendChild(o);
      });
      sel.appendChild(grp);
    });
    sel.addEventListener("change", () => {
      S.settings = Object.assign({}, S.settings, { targetProgram: sel.value });
      Store.save(); render();
    });
    row.appendChild(sel);
    body.appendChild(row);

    /* คะแนนเป้าหมายที่ตั้งเอง — คณะส่วนใหญ่ยังไม่มีคะแนนต่ำสุดในระบบ
       ถ้าไปเปิดประกาศจริงมาแล้ว ใส่ตรงนี้ได้เลย ไม่ต้องรอแก้ไฟล์ config
       ค่าที่ใส่เองจะถูกใช้แทนค่าที่มากับตัวแอปเสมอ */
    const manualRow = el('<div class="field"><span class="field-l">' +
      "คะแนนเป้าหมายที่ตั้งเอง</span></div>");
    const manual = el('<input class="hours-in" type="number" min="0" max="100" step="0.01" ' +
      'style="width:78px" placeholder="—" value="' +
      ((S.settings || {}).targetScore != null ? esc(S.settings.targetScore) : "") + '">');
    manual.addEventListener("change", () => {
      const v = manual.value.trim();
      const patch = {};
      if (v === "") patch.targetScore = null;
      else patch.targetScore = Math.max(0, Math.min(100, Number(v) || 0));
      S.settings = Object.assign({}, S.settings, patch);
      Store.save(); render();
    });
    manualRow.appendChild(manual);
    manualRow.appendChild(el('<span class="tiny">/ 100</span>'));
    body.appendChild(manualRow);
    body.appendChild(el('<p class="tiny" style="margin:0">คณะที่ขึ้นว่า ' +
      '"ยังไม่มีคะแนน" คือยังไม่ได้ใส่คะแนนต่ำสุดย้อนหลังไว้ในระบบ — ' +
      "ไปดูจากประกาศ กสพท แล้วกรอกช่องบนนี้ได้เลย</p>"));
  }

  /* ---- ช่องกรอกคะแนนรายวิชา */
  body.appendChild(el('<div class="section-title" style="margin-top:4px">' +
    "<h2>คะแนนที่สอบได้</h2></div>"));
  body.appendChild(el('<p class="tiny" style="margin:-8px 0 0">กรอกเท่าที่สอบไปแล้ว ' +
    "วิชาที่ยังไม่ได้สอบเว้นว่างไว้ ระบบจะคิดให้ว่าที่เหลือต้องทำได้กี่เปอร์เซ็นต์</p>"));

  const grid = el('<div class="sgrid"></div>');
  Object.entries(SUBJ).forEach(([code, subj]) => {
    const cell = el('<label class="scell" data-s="' + esc(code) + '"></label>');
    cell.appendChild(el('<span class="scell-l">' + esc(subj.short || subj.name) + "</span>"));
    const inp = el('<input type="number" inputmode="decimal" min="0" step="0.01" max="' +
      subj.maxScore + '" placeholder="—" value="' +
      (scores[code] != null ? esc(scores[code]) : "") + '">');
    inp.addEventListener("change", () => {
      const v = inp.value.trim();
      if (v === "") delete scores[code];
      else {
        const n = Math.max(0, Math.min(subj.maxScore, Number(v) || 0));
        scores[code] = n;
        inp.value = n;
      }
      Store.save(); render();
    });
    cell.appendChild(inp);
    cell.appendChild(el('<span class="scell-m">/' + subj.maxScore + "</span>"));
    grid.appendChild(cell);
  });
  body.appendChild(grid);

  if (!filled.length) {
    card.appendChild(body);
    return card;
  }

  /* ---- สัดส่วนคะแนนที่ได้จริงเทียบน้ำหนักเต็มของแต่ละกลุ่ม */
  body.appendChild(el('<div class="section-title" style="margin-top:6px">' +
    "<h2>ได้มาจากกลุ่มไหนบ้าง</h2></div>"));
  sc.breakdown.forEach(b => {
    const pctOfWeight = b.weight ? 100 * b.weighted / b.weight : 0;
    body.appendChild(el(
      '<div class="wrow">' +
        '<span class="wrow-l">' + esc(GROUP_LABEL[b.group] || b.group) + "</span>" +
        '<span class="wrow-bar"><i style="width:' + Math.max(0, Math.min(100, pctOfWeight)).toFixed(1) + '%"></i></span>' +
        '<span class="wrow-n num">' + (b.filled ? b.weighted.toFixed(2) : "—") +
          " / " + b.weight.toFixed(0) + "</span>" +
      "</div>"));
  });

  body.appendChild(el('<p class="tiny" style="margin:0">น้ำหนัก TPAT1 30 · วิทย์ 28 · ' +
    "คณิต 1 14 · อังกฤษ 14 · ไทย 7 · สังคม 7 — จากประกาศ กสพท ฉบับที่ 1 " +
    "<b>ปีการศึกษา 2569</b> ข้อ 4 (ของปี 2570 ยังไม่ประกาศ)</p>"));

  /* ---- ตกเกณฑ์ขั้นต่ำหรือยัง — สำคัญกว่าคะแนนรวม */
  if (sc.failures.length) {
    body.appendChild(el('<div class="note" style="border-color:var(--brick);' +
      'background:var(--brick-dim)"><b>ตกเกณฑ์ขั้นต่ำ</b><br>' +
      sc.failures.map(esc).join("<br>") +
      "<br><br>ประกาศกำหนดว่า A-Level ต้องได้ไม่น้อยกว่า 30% ของคะแนนเต็ม" +
      "<b>ในแต่ละวิชา</b> ตกวิชาเดียวคือคัดออกทันที ไม่ว่าคะแนนรวมจะสูงแค่ไหน</div>"));
  }

  /* ---- ที่เหลือต้องทำได้เท่าไร */
  if (sc.missing.length && hasTarget) {
    if (need != null) {
      const impossible = need > 100;
      body.appendChild(el('<div class="note"' +
        (impossible ? ' style="border-color:var(--brick);background:var(--brick-dim)"' : "") +
        "><b>อีก " + sc.missing.length + " วิชาที่ยังไม่ได้กรอก</b><br>" +
        (impossible
          ? "ต้องได้ " + need.toFixed(1) + "% ในทุกวิชาที่เหลือ ซึ่งเกิน 100% — " +
            "คณะนี้ไปไม่ถึงแล้วด้วยคะแนนชุดนี้ ลองดูคณะอื่นในรายการ"
          : need <= 0
            ? "ถึงเป้าแล้วแม้ไม่ได้คะแนนเพิ่มเลยจากวิชาที่เหลือ"
            : "ต้องได้เฉลี่ย <b>" + need.toFixed(1) + "%</b> ในทุกวิชาที่เหลือ จึงจะถึง " +
              goal.toFixed(1) + " คะแนน") + "</div>"));
    }
  }

  /* บอกที่มาของเส้นเป้าหมายให้ชัด — ตัวเลขที่เอาไปตัดสินใจต้องรู้ว่ามาจากไหน
     และรู้ว่ามันเป็นสถิติของปีที่แล้ว ไม่ใช่เส้นตัดของปีที่กำลังจะสอบ */
  if (target && target.verified) {
    const range = target.top != null
      ? " ปีนั้นคนที่ผ่านได้ตั้งแต่ " + target.projected.toFixed(2) +
        " ถึง " + target.top.toFixed(2) + " คะแนน"
      : "";
    body.appendChild(el('<p class="tiny" style="margin:0">เส้นเป้าหมายมาจาก' +
      "<b>สถิติจริง</b> ของ TCAS ปีการศึกษา 2569 รอบ 3 ประมวลผลครั้งที่ 1" +
      (target.seats ? " (รับ " + target.seats + " ที่นั่ง" +
        (target.applicants ? " · สมัคร " + target.applicants + " คน)" : ")") : "") +
      esc(range) +
      " — <b>ไม่ใช่เส้นตัดของปี 2570</b> ที่กำลังจะสอบ คะแนนขยับได้ทุกปี</p>"));
  } else if (target) {
    body.appendChild(el('<p class="tiny" style="margin:0">คณะนี้ยังไม่มีคะแนนต่ำสุด' +
      "ในระบบ ใส่เป้าหมายเองได้ที่ช่องด้านบน</p>"));
  }

  card.appendChild(body);
  return card;
}

/* ─────────────────────────────────────────────────────────────
   โอกาสติด — คำถามที่เด็กถามจริงคือ "คะแนนเท่านี้ ติดที่ไหนได้บ้าง"
   ไม่ใช่แค่ "ห่างจากคณะเป้าหมายอยู่เท่าไร"

   ตั้งใจ**ไม่**แสดงเป็น "โอกาสติด 78%" เพราะมีสถิติอยู่ปีเดียว
   จะคำนวณความน่าจะเป็นจากจุดข้อมูลจุดเดียวไม่ได้ ตัวเลขที่ออกมาจะเป็นของปลอม
   ที่ดูน่าเชื่อ ซึ่งอันตรายกว่าไม่บอกอะไรเลย สิ่งที่บอกได้จริงมีอย่างเดียวคือ
   "คะแนนชุดนี้ห่างจากคนสุดท้ายที่ติดเมื่อปีที่แล้วกี่คะแนน"
   ───────────────────────────────────────────────────────────── */

/* ขอบเขตของแต่ละแถบ = ค่าเดียวกับ src/tcas/ranking.py เป๊ะ ๆ
   ถ้าที่นี่กับ CLI ตอบไม่ตรงกัน ผู้ใช้จะไม่รู้ว่าอันไหนจริง */
const BANDS = [
  { key: "safe",   label: "ค่อนข้างปลอดภัย", min: 3,         color: "var(--ok)" },
  { key: "likely", label: "ลุ้นได้",          min: 0,         color: "var(--marigold)" },
  { key: "reach",  label: "ท้าทาย",           min: -3,        color: "var(--warn)" },
  { key: "far",    label: "ยังห่าง",          min: -Infinity, color: "var(--brick)" },
];
const bandOf = m => BANDS.find(b => m >= b.min) || BANDS[BANDS.length - 1];

const STAR = '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">' +
  '<path d="M12 3.7l2.6 5.27 5.82.85-4.21 4.1.99 5.79L12 16.98l-5.2 2.73.99-5.79-4.21-4.1 ' +
  '5.82-.85z" fill="var(--st-f,none)" stroke="currentColor" stroke-width="1.6" ' +
  'stroke-linejoin="round"/></svg>';

/* ค่าเฉลี่ย % ของวิชาที่กรอกไปแล้ว — ใช้เป็นค่าตั้งต้นของ "ที่เหลือจะทำได้เท่าไร"
   เพราะเป็นการเดาที่มีหลักฐานรองรับที่สุดเท่าที่มี ไม่ใช่เลขที่คิดขึ้นเอง */
function avgFilledPercent() {
  const scores = myScores();
  const filled = filledSubjects(scores);
  if (!filled.length) return null;
  return filled.reduce((a, c) => a + toPercent(c, scores[c]), 0) / filled.length;
}
const assumedPercent = () => {
  const v = (S.settings || {}).assumePct;
  return v == null || v === "" ? avgFilledPercent() : Number(v);
};

/* คะแนนรวมที่เอาไปเทียบกับคณะต่าง ๆ
   กรอกครบ  -> คะแนนจริง
   ยังไม่ครบ -> เติมวิชาที่ว่างด้วย % ที่สมมติไว้ แล้วคิดใหม่ทั้งก้อน
   ต้องเติมกลับเป็น "คะแนนดิบ" ไม่ใช่บวก % เข้าไปตรง ๆ เพราะกลุ่มวิทยาศาสตร์
   เฉลี่ยจากสามวิชา การเติมทีละวิชาจึงไม่ได้ขยับคะแนนกลุ่มเป็นเส้นตรง */
function assessedScore() {
  const scores = myScores();
  if (!filledSubjects(scores).length) return null;
  const gaps = missingSubjects(scores);
  if (!gaps.length) return scoreCard(scores).total;
  const pct = assumedPercent();
  if (pct == null) return null;
  const filledIn = Object.assign({}, scores);
  gaps.forEach(c => { filledIn[c] = (SUBJ[c].maxScore || 0) * pct / 100; });
  return scoreCard(filledIn).total;
}

const watchList = () => ((S.settings || {}).watch || []).slice();
const isWatched = code => watchList().indexOf(code) >= 0;
function toggleWatch(code) {
  const cur = watchList();
  const i = cur.indexOf(code);
  if (i >= 0) cur.splice(i, 1); else cur.push(code);
  S.settings = Object.assign({}, S.settings, { watch: cur });
  Store.save();
}

/* คะแนนอยู่ตรงไหนของกลุ่มที่ติดปีที่แล้ว — ใช้ได้เมื่อรู้ทั้งคะแนนต่ำสุดและสูงสุด
   ประโยคนี้บอกได้มากกว่าตัวเลขห่างเฉย ๆ ว่า "ติดแบบเฉียดฉิว" หรือ "ติดสบาย" */
function positionNote(score, low, top) {
  if (top == null || top <= low) return "";
  if (score < low) return "";
  const pos = (score - low) / (top - low);
  if (pos > 1) return "สูงกว่าคะแนนสูงสุดปีที่แล้ว";
  if (pos >= 0.66) return "อยู่ต้นกลุ่มที่ติดปีที่แล้ว";
  if (pos >= 0.33) return "อยู่กลางกลุ่มที่ติดปีที่แล้ว";
  return "อยู่ท้ายกลุ่มที่ติดปีที่แล้ว";
}

function progRow(p, score, target) {
  const m = p.projected == null ? null : score - p.projected;
  const b = m == null ? null : bandOf(m);
  const on = isWatched(p.code);
  const row = el('<div class="prow' +
    (target && p.code === target.code ? " is-target" : "") +
    '" style="--bc:' + (b ? b.color : "var(--line)") + '"></div>');

  const star = el('<button class="prow-star" aria-pressed="' + (on ? "true" : "false") +
    '" style="' + (on ? "--st-f:currentColor" : "") + '" aria-label="' +
    (on ? "เอาออกจากคณะที่สนใจ" : "เพิ่มเข้าคณะที่สนใจ") + '">' + STAR + "</button>");
  star.addEventListener("click", () => { toggleWatch(p.code); render(); });
  row.appendChild(star);

  /* บรรทัดรองมีที่ไม่ถึงสองบรรทัด จึงต้องเลือกเฉพาะสิ่งที่บอกอะไรใหม่
     ชื่อมหาวิทยาลัยไม่ต้องซ้ำ เพราะอยู่ในชื่อคณะอยู่แล้วทุกรายการ
     และอัตราส่วนคนต่อที่นั่งสั้นกว่าและอ่านง่ายกว่าเลขผู้สมัครดิบ */
  const bits = [];
  const pos = m != null ? positionNote(score, p.projected, p.top) : "";
  if (pos) bits.push(pos);
  if (p.university && p.name.indexOf(p.university) < 0) bits.push(esc(p.university));
  if (p.seats) bits.push("รับ " + p.seats + " ที่นั่ง");
  if (p.seats && p.applicants) bits.push((p.applicants / p.seats).toFixed(1) + " คนต่อที่");

  row.appendChild(el('<div class="prow-m">' +
    '<div class="prow-n">' + esc(p.name) + "</div>" +
    '<div class="prow-s">' + bits.join(" · ") + "</div>" +
    "</div>"));

  row.appendChild(el('<div class="prow-r">' +
    '<div class="prow-d">' + (m == null ? "—" : (m >= 0 ? "+" : "−") + Math.abs(m).toFixed(2)) + "</div>" +
    '<div class="prow-b">' + (m == null ? "ไม่มีข้อมูล" : "ต่ำสุด " + p.projected.toFixed(2)) + "</div>" +
    "</div>"));
  return row;
}

function chancePanel() {
  const all = DATA.programs || [];
  const withData = all.filter(p => p.projected != null);
  const target = targetProgram();
  const card = el('<div class="card card-pad stack"></div>');
  card.appendChild(el('<div class="section-title"><h2>มีโอกาสติดที่ไหนบ้าง</h2></div>'));

  if (!all.length) return card;

  const scores = myScores();
  const filled = filledSubjects(scores);
  if (!filled.length) {
    card.appendChild(el('<p class="tiny" style="margin:0">กรอกคะแนนที่สอบได้ในการ์ดด้านบนก่อน ' +
      "แล้วตรงนี้จะไล่ให้ดูทีละคณะว่าคะแนนชุดนั้นไปถึงไหนแล้วบ้าง — " +
      "ยังไม่ครบทุกวิชาก็ดูได้ ระบบจะเดาที่เหลือให้จากค่าเฉลี่ยที่ทำได้</p>"));
    return card;
  }

  const gaps = missingSubjects(scores);
  const score = assessedScore();
  const sc = scoreCard(scores);

  /* ---- ประโยคเดียวที่ตอบคำถามหัวข้อ */
  const passed = withData.filter(p => score >= p.projected).length;
  card.appendChild(el('<p style="margin:0;font-size:14px;line-height:1.7">' +
    "ด้วยคะแนน <b class=\"num\">" + score.toFixed(2) + "</b> ผ่านคะแนนต่ำสุดของปีที่แล้ว " +
    '<b class="num">' + passed + "</b> จาก " + withData.length + " คณะที่มีข้อมูล</p>"));

  /* ---- สมมติฐานของวิชาที่ยังไม่ได้สอบ
     ถ้าไม่เปิดให้ปรับ ตัวเลขข้างบนจะเป็นคำทำนายที่ผู้ใช้ไม่มีสิทธิ์เถียง
     ปรับได้เมื่อไร มันจะกลายเป็นเครื่องมือถามว่า "ต้องทำได้เท่าไรถึงจะติดที่นี่" */
  if (gaps.length) {
    const pct = assumedPercent();
    const auto = (S.settings || {}).assumePct == null || S.settings.assumePct === "";
    const row = el('<div class="field"><span class="field-l">' +
      "สมมติว่าอีก " + gaps.length + " วิชาที่ยังไม่ได้กรอก ทำได้เฉลี่ย</span></div>");
    const inp = el('<input class="hours-in" type="number" min="0" max="100" step="1" ' +
      'style="width:72px" value="' + (pct == null ? "" : pct.toFixed(0)) + '">');
    inp.addEventListener("change", () => {
      const v = inp.value.trim();
      S.settings = Object.assign({}, S.settings, {
        assumePct: v === "" ? null : Math.max(0, Math.min(100, Number(v) || 0)),
      });
      Store.save(); render();
    });
    row.appendChild(inp);
    row.appendChild(el('<span class="tiny">%</span>'));
    card.appendChild(row);
    card.appendChild(el('<p class="tiny" style="margin:0">' +
      (auto
        ? "ค่านี้ตั้งจากค่าเฉลี่ยของวิชาที่กรอกไปแล้ว — แก้ได้ถ้าคิดว่าจะทำได้ดีกว่านี้"
        : "ตั้งเอง — ล้างช่องให้ว่างเพื่อกลับไปใช้ค่าเฉลี่ยจากที่กรอกแล้ว (" +
          (avgFilledPercent() || 0).toFixed(0) + "%)") + "</p>"));
  }

  /* ---- ตกเกณฑ์ขั้นต่ำ = คัดออกทุกคณะ ต้องขึ้นก่อนรายการเสมอ */
  if (sc.failures.length) {
    card.appendChild(el('<div class="note" style="border-color:var(--brick);' +
      'background:var(--brick-dim)"><b>ตกเกณฑ์ขั้นต่ำ ' + sc.failures.length + " วิชา</b><br>" +
      "รายการข้างล่างนี้เทียบเฉพาะคะแนนรวม แต่ถ้าตกเกณฑ์ขั้นต่ำจะถูกคัดออก" +
      "ทุกคณะไม่ว่าคะแนนรวมจะสูงแค่ไหน — แก้ตรงนั้นก่อน</div>"));
  }

  /* ---- ตัวกรอง: คณะกับมหาวิทยาลัยที่สนใจ */
  const facs = [];
  const unis = [];
  all.forEach(p => {
    if (p.faculty && facs.indexOf(p.faculty) < 0) facs.push(p.faculty);
    if (p.university && unis.indexOf(p.university) < 0) unis.push(p.university);
  });
  unis.sort((a, b) => a.localeCompare(b, "th"));

  const facSel = ((S.settings || {}).chanceFac || []).filter(f => facs.indexOf(f) >= 0);
  const uniSel = (S.settings || {}).chanceUni || "";

  const chips = el('<div class="fchips"></div>');
  const allChip = el('<button class="fchip" aria-pressed="' +
    (facSel.length ? "false" : "true") + '">ทุกคณะ</button>');
  allChip.addEventListener("click", () => {
    S.settings = Object.assign({}, S.settings, { chanceFac: [] });
    Store.save(); render();
  });
  chips.appendChild(allChip);
  facs.forEach(f => {
    const on = facSel.indexOf(f) >= 0;
    const c = el('<button class="fchip" aria-pressed="' + (on ? "true" : "false") + '">' +
      esc(f) + "</button>");
    c.addEventListener("click", () => {
      const next = facSel.slice();
      const i = next.indexOf(f);
      if (i >= 0) next.splice(i, 1); else next.push(f);
      S.settings = Object.assign({}, S.settings, { chanceFac: next });
      Store.save(); render();
    });
    chips.appendChild(c);
  });
  card.appendChild(chips);

  const uniRow = el('<div class="field"><span class="field-l">มหาวิทยาลัย</span></div>');
  const uniSelEl = el('<select class="sel" style="max-width:62%"></select>');
  uniSelEl.appendChild(el('<option value="">— ทุกมหาวิทยาลัย —</option>'));
  unis.forEach(u => {
    const o = el('<option value="' + esc(u) + '">' + esc(u) + "</option>");
    if (u === uniSel) o.selected = true;
    uniSelEl.appendChild(o);
  });
  uniSelEl.addEventListener("change", () => {
    S.settings = Object.assign({}, S.settings, { chanceUni: uniSelEl.value });
    Store.save(); render();
  });
  uniRow.appendChild(uniSelEl);
  card.appendChild(uniRow);

  /* ---- คณะที่ติดดาวไว้ — ไม่ขึ้นกับตัวกรอง เพราะเป็นรายการที่ตั้งใจเก็บไว้ดู */
  const watched = all.filter(p => isWatched(p.code));
  if (watched.length) {
    watched.sort((a, b) => (b.projected || 0) - (a.projected || 0));
    card.appendChild(el('<div class="section-title" style="margin:6px 0 0">' +
      "<h2>คณะที่สนใจ</h2></div>"));
    const box = el("<div></div>");
    watched.forEach(p => box.appendChild(progRow(p, score, target)));
    card.appendChild(box);
  }

  /* ---- รายการทั้งหมด แยกตามแถบโอกาส */
  let list = withData.slice();
  if (facSel.length) list = list.filter(p => facSel.indexOf(p.faculty) >= 0);
  if (uniSel) list = list.filter(p => p.university === uniSel);

  const listTitle = el('<div class="section-title" style="margin:8px 0 0">' +
    "<h2>เรียงตามโอกาส</h2></div>");
  card.appendChild(listTitle);

  if (!list.length) {
    card.appendChild(el('<p class="tiny" style="margin:0">ไม่มีคณะที่ตรงกับตัวกรองนี้' +
      " — ลองเอาตัวกรองออกสักอัน</p>"));
  }

  const open = (S.settings || {}).chanceOpen || {};
  BANDS.forEach(b => {
    const rows = list.filter(p => bandOf(score - p.projected).key === b.key)
                     .sort((x, y) => y.projected - x.projected);
    if (!rows.length) return;
    // "ยังห่าง" พับไว้เป็นค่าเริ่มต้น — เป็นกลุ่มที่ยาวที่สุดและอยากดูน้อยที่สุด
    const isOpen = open[b.key] != null ? open[b.key] : b.key !== "far";
    const hd = el('<button class="bandhd" aria-expanded="' + (isOpen ? "true" : "false") +
      '" style="--bc:' + b.color + '">' +
      '<span class="bandhd-d"></span>' +
      '<span class="bandhd-t">' + b.label + "</span>" +
      '<span class="bandhd-n">' + rows.length + " คณะ</span>" +
      '<span class="bandhd-c">▾</span></button>');
    const body = el("<div class=\"bandbody\"></div>");
    if (!isOpen) body.hidden = true;
    rows.forEach(p => body.appendChild(progRow(p, score, target)));
    hd.addEventListener("click", () => {
      const next = Object.assign({}, open);
      next[b.key] = !isOpen;
      S.settings = Object.assign({}, S.settings, { chanceOpen: next });
      Store.save();
      body.hidden = isOpen;
      hd.setAttribute("aria-expanded", isOpen ? "false" : "true");
    });
    card.appendChild(hd);
    card.appendChild(body);
  });

  const noData = all.length - withData.length;
  card.appendChild(el('<p class="tiny" style="margin:6px 0 0">' +
    "เทียบกับ<b>คะแนนต่ำสุดของปีการศึกษา 2569</b> (รอบ 3 ประมวลผลครั้งที่ 1) " +
    "ไม่ใช่เส้นตัดของปี 2570 ที่กำลังจะสอบ — คะแนนขยับได้ทุกปีตามความยากข้อสอบ" +
    "และจำนวนผู้สมัคร ตัวเลขนี้จึงใช้เล็งทิศ ไม่ใช่คำรับประกัน" +
    (noData ? " · อีก " + noData + " คณะยังไม่มีคะแนนในระบบ" : "") + "</p>"));

  return card;
}

/* ─────────────────────────────────────────────────────────────
   VIEW: ความคืบหน้า
   ───────────────────────────────────────────────────────────── */
function viewProgress() {
  const root = $("#v-progress");
  root.innerHTML = "";
  const wrap = el('<div class="stack"></div>');

  const st = subjectStats();
  const doneTopics = st.reduce((a, s) => a + s.done, 0);
  const allTopics = st.reduce((a, s) => a + s.total, 0);
  const hoursDone = st.reduce((a, s) => a + s.hoursDone, 0);
  const hoursAll = st.reduce((a, s) => a + s.hoursTotal, 0);
  let seen = 0, ok = 0;
  Object.values(S.q).forEach(r => { seen += r.seen; ok += r.ok; });

  /* ---- คะแนนของฉัน: อยู่ตรงไหน ขาดอีกเท่าไร
     วางไว้บนสุดเพราะเป็นคำถามที่เด็กเปิดแอปมาเพื่อถาม ไม่ใช่ % หัวข้อที่อ่านจบ */
  wrap.appendChild(scorePanel());

  /* ---- แล้วคะแนนชุดนั้นไปถึงคณะไหนบ้าง
     ต่อจากการ์ดคะแนนทันที เพราะเป็นคำถามถัดไปในหัวเสมอ — กรอกคะแนนเสร็จ
     ไม่มีใครอยากรู้ว่าอ่านหนังสือไปกี่ % ก่อนจะรู้ว่าคะแนนนี้ติดที่ไหน */
  wrap.appendChild(chancePanel());

  /* วงใหญ่ตอบคำถามเดียว: อ่านไปแล้วกี่เปอร์เซ็นต์ของทั้งหมด
     เลขสี่ตัวที่เหลือเป็นรายละเอียด จึงอยู่ในไทล์เล็กด้านล่าง */
  const overall = allTopics ? doneTopics / allTopics : 0;
  wrap.appendChild(el(
    '<div class="bigring">' +
      ringHTML(overall, 104, 10, "overallRing") +
      '<div class="bigring-t">' +
        "<h2>อ่านจบไปแล้ว " + doneTopics + " จาก " + allTopics + " หัวข้อ</h2>" +
        '<p class="tiny" style="margin:4px 0 0">คิดเป็น ' + Math.round(hoursDone) +
          " ชม. จากทั้งหลักสูตร " + Math.round(hoursAll) + " ชม. — " +
          (overall >= 0.999 ? "ครบทุกหัวข้อแล้ว"
            : "เหลืออีก " + Math.round(hoursAll - hoursDone) + " ชม.") + "</p>" +
      "</div>" +
    "</div>"
  ));

  const shareRow = el('<div class="btn-row"></div>');
  const shareBtn = el('<button class="btn btn-sm">บันทึกการ์ดความคืบหน้า</button>');
  shareBtn.addEventListener("click", () => shareProgress());
  shareRow.appendChild(shareBtn);
  wrap.appendChild(shareRow);

  wrap.appendChild(el(
    '<div class="tiles tiles-4">' +
      '<div class="tile" style="--tc:var(--marigold)"><div class="tile-n" data-key="pTopics" data-count="' +
        Math.round(100 * doneTopics / allTopics) + '" data-suf="%">0%</div><div class="tile-l">เนื้อหาที่อ่านจบ</div></div>' +
      '<div class="tile" style="--tc:var(--indigo)"><div class="tile-n" data-key="pHours" data-count="' +
        Math.round(hoursDone) + '">0</div><div class="tile-l">ชม. จาก ' + Math.round(hoursAll) + "</div></div>" +
      '<div class="tile" style="--tc:' + (seen && ok / seen >= 0.7 ? "var(--ok)" : "var(--brick)") + '">' +
        '<div class="tile-n"' + (seen ? ' data-key="pAcc" data-count="' + Math.round(100 * ok / seen) + '" data-suf="%"' : "") +
        ">" + (seen ? "0%" : "—") + '</div><div class="tile-l">ความแม่นข้อสอบ</div></div>' +
      '<div class="tile" style="--tc:var(--ok)"><div class="tile-n" data-key="pSeen" data-count="' + seen +
        '">0</div><div class="tile-l">ข้อที่ทำไปแล้ว</div></div>' +
    "</div>"
  ));

  const card = el('<div class="card card-pad"></div>');
  card.appendChild(el('<div class="section-title"><h2>รายวิชา</h2></div>'));
  card.appendChild(el('<p class="tiny" style="margin:-6px 0 8px">แต่ละวงกลมคือหนึ่งหัวข้อ — เติมเมื่ออ่านครบทุกบล็อกของหัวข้อนั้น</p>'));

  st.forEach(s => {
    const row = el('<div class="srow"></div>');
    row.setAttribute("data-s", s.code);
    row.appendChild(el(
      '<div class="srow-hd">' +

        (s.accuracy !== null
          ? '<span class="chip ' + (s.accuracy >= 70 ? "ok" : "review") + '">แม่น ' + Math.round(s.accuracy) + "%</span>"
          : "") +
        '<span class="srow-pct">' + s.done + "/" + s.total + "</span>" +
      "</div>"
    ));

    s.topics.forEach(t => {

      const dot = el('<span class="dot' + (on ? " on" : "") + '"></span>');

      dots.appendChild(dot);
    });
    row.appendChild(dots);
    card.appendChild(row);
  });
  wrap.appendChild(card);

  wrap.appendChild(weakSpots());
  wrap.appendChild(effortPanel());


  /* backup / restore / reset */
  const rc = el('<div class="card card-pad stack"></div>');
  rc.appendChild(el('<div class="section-title"><h2>ข้อมูลที่บันทึกไว้</h2></div>'));
  rc.appendChild(el('<p class="tiny" style="margin:-8px 0 0">' +
    (Store.persistent
      ? "ความคืบหน้าเก็บไว้ในเครื่องนี้เท่านั้น ไม่ได้ส่งขึ้นเซิร์ฟเวอร์ — ย้ายเครื่องให้กด " +
        "<b>สำรองข้อมูล</b> แล้วเอาไฟล์ไป <b>กู้คืน</b> ที่อีกเครื่อง"
      : "⚠️ เบราว์เซอร์นี้ไม่ยอมให้บันทึกถาวร ความคืบหน้าจะหายเมื่อปิดหน้า") + "</p>"));

  const nBlocks = Object.values(S.log).reduce((a, v) => a + v.length, 0);
  const nTopics = Object.keys(S.topics).length;
  const nQ = Object.keys(S.q).length;
  rc.appendChild(el('<p class="tiny" style="margin:0">ตอนนี้เก็บไว้: บล็อกที่ทำแล้ว ' + nBlocks +
    " · หัวข้อที่มีความคืบหน้า " + nTopics + " · ข้อสอบที่เคยทำ " + nQ +
    " · ชุดที่ทำจบ " + S.runs.length +
    " · ลิงก์ที่บันทึก " + Object.values(S.links || {}).reduce((a, v) => a + v.length, 0) + "</p>"));

  const row = el('<div class="btn-row"></div>');

  const backup = el('<button class="btn btn-sm">สำรองข้อมูล</button>');
  backup.addEventListener("click", () => {
    const blob = backupBlob();
    S.lastBackup = TODAY; Store.save();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "tcas70-progress-" + TODAY + ".json";
    // ต้องอยู่ใน DOM จริงก่อน ไม่งั้นบางเบราว์เซอร์เมิน click()
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  row.appendChild(backup);

  const restore = el('<button class="btn btn-sm">กู้คืนจากไฟล์</button>');
  const picker = el('<input type="file" accept="application/json,.json" style="display:none">');
  restore.addEventListener("click", () => picker.click());
  picker.addEventListener("change", ev => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (e) { alert("อ่านไฟล์ไม่ได้ — ไฟล์นี้ไม่ใช่ JSON ที่ถูกต้อง"); return; }
      const dd = parsed && parsed.data;
      const looksOurs = dd && typeof dd === "object" && dd.q &&
                        (dd.topics || dd.done);   // dd.done = ไฟล์สำรองรุ่นเก่า
      if (!looksOurs) {
        alert("ไฟล์นี้ไม่ใช่ไฟล์สำรองของ TCAS70 — เลือกไฟล์ที่ได้จากปุ่ม สำรองข้อมูล");
        return;
      }
      if (!confirm("ทับความคืบหน้าปัจจุบันด้วยไฟล์นี้? (ของเดิมจะหาย)")) return;

      S.q = dd.q || {}; S.tests = dd.tests || {}; S.runs = dd.runs || [];
      S.topics = dd.topics || {}; S.log = dd.log || {}; S.days = dd.days || {};
      S.links = dd.links || {}; S.settings = dd.settings || {};

      if (!dd.topics && dd.done) {
        // ไฟล์สำรองรุ่นเก่าเก็บเป็น "วันที่|หัวข้อ" — แปลงเป็นชั่วโมงต่อหัวข้อ
        const hoursOf = new Map();
        for (const day of DATA.plan)
          for (const b of day.blocks)
            if (b.kind === "learn") hoursOf.set(day.date + "|" + b.topic, b.hours);
        for (const key of Object.keys(dd.done)) {
          const [, topic] = key.split("|");
          const h = hoursOf.get(key) || 0;
          if (!topic || !h) continue;
          const rec = S.topics[topic] || { hoursDone: 0 };
          rec.hoursDone = (rec.hoursDone || 0) + h;
          S.topics[topic] = rec;
        }
      }
      S.migrated = true;
      Store.save(); quiz = null; render();
      alert("กู้คืนเรียบร้อย");
    };
    reader.readAsText(file);
    ev.target.value = "";
  });
  row.appendChild(restore);
  row.appendChild(picker);

  const rb = el('<button class="btn btn-sm">ล้างทั้งหมด</button>');
  rb.addEventListener("click", () => {
    if (!confirm("ล้างบล็อกที่เช็คไว้ ผลข้อสอบ และประวัติทั้งหมด?")) return;
    S.topics = {}; S.log = {}; S.days = {};
    S.q = {}; S.tests = {}; S.runs = [];
    // ลิงก์ที่บันทึกเองกับค่าที่ตั้งไว้ไม่ใช่ "ความคืบหน้า" จึงไม่ล้างไปด้วย
    Store.save(); quiz = null; render();
  });
  row.appendChild(rb);
  rc.appendChild(row);
  wrap.appendChild(rc);

  root.appendChild(wrap);
}

/* ─────────────────────────────────────────────────────────────
   ปฏิทิน (.ics) — ช่องทางแจ้งเตือนที่ไม่ต้องมีเซิร์ฟเวอร์

   PWA ส่ง push เองไม่ได้ถ้าไม่มีหลังบ้าน แต่ปฏิทินของเครื่องส่งได้
   แอปจึงสร้างไฟล์ .ics จากตารางที่คำนวณสด ๆ ให้ผู้ใช้นำเข้าครั้งเดียว
   แล้วปล่อยให้ iOS/Google Calendar เป็นคนเตือน — เชื่อถือได้กว่าและ
   ไม่ต้องตั้ง secret อะไรทั้งนั้น

   ข้อแลก: ไฟล์เป็นภาพนิ่ง ณ วันที่กด ถ้าตารางขยับเยอะต้องนำเข้าใหม่
   ทุก event จึงมี UID คงที่ (ผูกกับวันและหัวข้อ) ปฏิทินจะได้ทับของเดิม
   แทนที่จะซ้อนกันเป็นสองรายการ
   ───────────────────────────────────────────────────────────── */
const ICS_PREFIX = "tcas70-";

function icsEscape(t) {
  return String(t).replace(/\\/g, "\\\\").replace(/;/g, "\;")
    .replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
}

/* RFC 5545 บังคับให้บรรทัดยาวไม่เกิน 75 ออกเทต แล้วพับด้วย CRLF + ช่องว่าง
   ภาษาไทยเป็น UTF-8 หลายไบต์ต่อตัว จึงต้องนับไบต์แต่ตัดที่ขอบตัวอักษร
   ถ้าตัดกลางตัวอักษรปฏิทินจะอ่านเป็นอักขระเสีย */
function icsFold(line) {
  const enc = new TextEncoder();
  if (enc.encode(line).length <= 75) return line;
  const out = [];
  let cur = "", curBytes = 0, limit = 75;
  for (const ch of line) {
    const n = enc.encode(ch).length;
    if (curBytes + n > limit) { out.push(cur); cur = " "; curBytes = 1; limit = 75; }
    cur += ch; curBytes += n;
  }
  out.push(cur);
  return out.join("\r\n");
}

const icsStamp = () => new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
const icsDate = isoStr => isoStr.replace(/-/g, "");
function icsLocal(isoStr, hour, minute) {
  // เวลาแบบ "ลอย" (ไม่มี Z ไม่มี TZID) = เวลาท้องถิ่นของเครื่องที่เปิด
  // ตรงกับความหมายที่ต้องการพอดี และไม่ต้องแนบ VTIMEZONE ให้ยุ่ง
  const hh = String(Math.floor(hour)).padStart(2, "0");
  const mm = String(minute).padStart(2, "0");
  return icsDate(isoStr) + "T" + hh + mm + "00";
}

function icsEvent(o) {
  const L = ["BEGIN:VEVENT", "UID:" + o.uid, "DTSTAMP:" + icsStamp()];
  if (o.allDay) {
    const end = d(o.date); end.setDate(end.getDate() + 1);
    L.push("DTSTART;VALUE=DATE:" + icsDate(o.date));
    L.push("DTEND;VALUE=DATE:" + icsDate(iso(end)));
  } else {
    L.push("DTSTART:" + o.start, "DTEND:" + o.end);
  }
  L.push("SUMMARY:" + icsEscape(o.summary));
  if (o.desc) L.push("DESCRIPTION:" + icsEscape(o.desc));
  L.push("TRANSP:TRANSPARENT");
  // หลายเตือนต่อหนึ่งรายการ — ไม่ใช่หลายรายการอันละหนึ่งเตือน
  // ไม่งั้นวันสอบจะโผล่ซ้ำสองบรรทัดในปฏิทิน
  (o.alarms || []).forEach(trig =>
    L.push("BEGIN:VALARM", "ACTION:DISPLAY",
           "DESCRIPTION:" + icsEscape(o.summary),
           "TRIGGER:" + trig, "END:VALARM"));
  L.push("END:VEVENT");
  return L;
}

/* สร้างปฏิทินจากตารางที่ buildPlan คำนวณสด — ไม่ใช่ตารางที่ build ไว้ตอน export
   ผู้ใช้จึงได้ตารางที่ปรับตามงานค้างจริงเสมอ */
/* "08.30-10.00" -> [8, 30, 10, 0] · คืน [null,...] ถ้ารูปแบบไม่ตรง
   ปฏิทินใช้จุดคั่นแบบไทย ไม่ใช่ทวิภาค จึงรับทั้งสองแบบไว้ */
function parseSlot(s) {
  const m = String(s || "").match(/(\d{1,2})[.:](\d{2})\s*-\s*(\d{1,2})[.:](\d{2})/);
  return m ? [+m[1], +m[2], +m[3], +m[4]] : [null, null, null, null];
}

function buildICS(nDays, startHour, opts) {
  const o = opts || {};
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0",
             "PRODID:-//TCAS70//ตารางเตรียมสอบแพทย์//TH",
             "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
             "X-WR-CALNAME:TCAS70 ตารางอ่านหนังสือ",
             "X-WR-TIMEZONE:Asia/Bangkok"];

  if (o.blocks !== false) {
    buildPlan(TODAY, nDays).forEach(day => {
      let at = startHour;
      day.blocks.forEach((b, i) => {
        const endAt = at + b.hours;
        L.push(...icsEvent({
          uid: ICS_PREFIX + "b-" + day.date + "-" + b.topic + "-" + b.kind + "@tcas70",
          start: icsLocal(day.date, at, Math.round((at % 1) * 60)),
          end: icsLocal(day.date, endAt, Math.round((endAt % 1) * 60)),
          summary: (b.kind === "review" ? "ทบทวน: " : "อ่าน: ") + b.topicName,
          desc: subjName(b.subject) + " · " + fmtHours(b.hours) +
                (b.kind === "review" ? " · ทบทวนครั้งที่ " + b.repetition : ""),
          alarms: i === 0 ? ["-PT10M"] : [],   // เตือนเฉพาะบล็อกแรกของวัน
        }));
        at = endAt + 0.25;                     // พัก 15 นาทีระหว่างบล็อก
      });
    });
  }

  if (o.tests !== false) {
    DATA.tests.filter(t => t.date >= TODAY).forEach(t => L.push(...icsEvent({
      uid: ICS_PREFIX + "t-" + t.date + "-" + t.kind + "@tcas70",
      allDay: true, date: t.date,
      summary: "ทดสอบ: " + t.title,
      desc: (t.note || "") + (t.minutes ? "\nประมาณ " + t.minutes + " นาที" : ""),
      alarms: ["-P1D"],
    })));
  }

  if (o.exams !== false) {
    (DATA.exams || []).filter(e => e.date >= TODAY).forEach(e => L.push(...icsEvent({
      uid: ICS_PREFIX + "e-" + e.date + "-" + e.key + "@tcas70",
      allDay: true, date: e.date,
      summary: "สอบ: " + e.name + (e.verified ? "" : " (วันสอบยังไม่ยืนยัน)"),
      desc: e.verified ? "" : "วันสอบนี้เป็นค่าประมาณ ตรวจกับ mytcas.com ก่อนเสมอ",
      alarms: ["-P7D", "-P1D"],
    })));

    /* วิชาที่สอบวันไหนกี่โมง — ลงเป็นอีเวนต์ตามเวลาจริง ไม่ใช่ all-day
       เพราะสิ่งที่ต้องรู้เช้าวันสอบคือ "ห้องเปิดกี่โมง" ไม่ใช่ "วันนี้มีสอบ" */
    Object.entries(DATA.subjectExams || {}).forEach(([code, sp]) => {
      if (!SUBJ[code] || sp.date < TODAY) return;
      const [h1, m1, h2, m2] = parseSlot(sp.time);
      L.push(...icsEvent(h1 == null ? {
        uid: ICS_PREFIX + "s-" + sp.date + "-" + code + "@tcas70",
        allDay: true, date: sp.date, summary: "สอบ " + SUBJ[code].name, alarms: ["-P1D"],
      } : {
        uid: ICS_PREFIX + "s-" + sp.date + "-" + code + "@tcas70",
        start: icsLocal(sp.date, h1, m1),
        end: icsLocal(sp.date, h2, m2),
        summary: "สอบ " + SUBJ[code].name,
        desc: "ตารางสอบ TCAS70 · " + sp.time + " น.",
        alarms: ["-P1D", "-PT90M"],
      }));
    });
  }

  /* หมุดหมายการสมัคร — พลาดวันสมัครคือจบเกม ไม่มีรอบแก้ตัว
     จึงเตือนล่วงหน้าถึงสองครั้ง และกำกับไว้ถ้าวันนั้นยังเป็นการคาดการณ์ */
  if (o.milestones !== false) {
    (DATA.milestones || []).filter(m => m.date >= TODAY).forEach((m, i) => L.push(...icsEvent({
      uid: ICS_PREFIX + "m-" + m.date + "-" + i + "@tcas70",
      allDay: true, date: m.date,
      summary: "TCAS: " + m.label,
      desc: m.verified === false ? "วันนี้ยังเป็นการคาดการณ์ — ตรวจกับ mytcas.com" : "",
      alarms: ["-P7D", "-P1D"],
    })));
  }

  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n") + "\r\n";
}

function downloadICS(nDays, startHour, opts) {
  const blob = new Blob([buildICS(nDays, startHour, opts)],
    { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "tcas70-" + TODAY + ".ics";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ─────────────────────────────────────────────────────────────
   จุดที่พลาดซ้ำ ๆ — "แม่น 62%" บอกไม่ได้ว่าต้องกลับไปอ่านอะไร
   ต้องชี้เป็นหัวข้อถึงจะเอาไปทำอะไรต่อได้
   ───────────────────────────────────────────────────────────── */
function weakSpots() {
  const card = el('<div class="card card-pad"></div>');
  card.appendChild(el('<div class="section-title"><h2>จุดที่พลาดซ้ำ</h2></div>'));

  // รวมสถิติรายหัวข้อจากผลตอบรายข้อ
  const byTopic = {};
  DATA.questions.forEach(q => {
    const r = S.q[q.qid];
    if (!r || !r.seen) return;
    const t = (byTopic[q.topic] = byTopic[q.topic] || { seen: 0, ok: 0, subject: q.subject });
    t.seen += r.seen; t.ok += r.ok;
  });

  // ต้องเคยทำอย่างน้อย 3 ข้อจึงจะพูดถึง — น้อยกว่านั้นเป็นเรื่องของดวง
  const weak = Object.entries(byTopic)
    .filter(([, t]) => t.seen >= 3 && t.ok / t.seen < 0.7)
    .map(([code, t]) => ({ code, ...t, acc: 100 * t.ok / t.seen }))
    .sort((a, b) => a.acc - b.acc)
    .slice(0, 8);

  const totalSeen = Object.values(byTopic).reduce((a, t) => a + t.seen, 0);
  if (!totalSeen) {
    card.appendChild(el('<p class="tiny" style="margin:-6px 0 0">ยังไม่มีข้อมูล — ' +
      "ทำข้อสอบสักชุดแล้วหน้านี้จะบอกว่าหัวข้อไหนควรกลับไปอ่านซ้ำ</p>"));
    return card;
  }
  if (!weak.length) {
    card.appendChild(el('<p class="tiny" style="margin:-6px 0 0">ยังไม่มีหัวข้อไหน' +
      "ที่พลาดซ้ำถึงเกณฑ์ (ทำแล้วอย่างน้อย 3 ข้อและถูกต่ำกว่า 70%)</p>"));
    return card;
  }

  card.appendChild(el('<p class="tiny" style="margin:-6px 0 8px">เรียงจากที่พลาดมากที่สุด ' +
    "นับเฉพาะหัวข้อที่ทำไปแล้วอย่างน้อย 3 ข้อ กดเพื่อหาที่อ่าน</p>"));
  weak.forEach(w => {
    const t = TOPIC_OF.get(w.code);
    const btn = el('<button class="blk" data-s="' + esc(w.subject || "") + '" ' +
      'style="margin-bottom:7px">' +
      '<span class="blk-body">' +
        '<span class="blk-name">' + esc(t ? t.name : w.code) + "</span>" +
        '<span class="blk-meta">' +
          '<span class="blk-sub">' + esc(subjLabel(w.subject)) + "</span>" +
          '<span class="chip ' + (w.acc < 50 ? "mock" : "review") + '">ถูก ' +
            Math.round(w.acc) + "% จาก " + w.seen + " ข้อ</span>" +
        "</span>" +
      "</span>" +
    "</button>");
    btn.addEventListener("click", () => openResources(w.code));
    card.appendChild(btn);
  });
  return card;
}

/* ─────────────────────────────────────────────────────────────
   ทำได้จริงเทียบกับที่วางแผนไว้ — ตัวเลขที่บอกว่าแผนสมจริงหรือเปล่า
   ───────────────────────────────────────────────────────────── */
function effortPanel() {
  const card = el('<div class="card card-pad"></div>');
  card.appendChild(el('<div class="section-title"><h2>ทำได้จริงเทียบกับแผน</h2></div>'));

  // ย้อนหลัง 14 วันที่ผ่านมาแล้ว (ไม่นับวันนี้ที่ยังไม่จบ)
  const days = [];
  for (let i = 14; i >= 1; i--) {
    const dt = d(TODAY); dt.setDate(dt.getDate() - i);
    const key = iso(dt);
    days.push({ key, planned: hoursFor(key), actual: Number(S.days[key] || 0) });
  }
  const planned = days.reduce((a, x) => a + x.planned, 0);
  const actual = days.reduce((a, x) => a + x.actual, 0);
  if (planned <= 0) {
    card.appendChild(el('<p class="tiny" style="margin:-6px 0 0">ยังไม่มีข้อมูลย้อนหลังพอ</p>'));
    return card;
  }
  const ratio = actual / planned;

  card.appendChild(el('<p class="tiny" style="margin:-6px 0 9px">14 วันที่ผ่านมา ' +
    "ทำไป <b>" + (Math.round(actual * 10) / 10) + " ชม.</b> จากที่วางไว้ <b>" +
    (Math.round(planned * 10) / 10) + " ชม.</b> คิดเป็น <b>" + Math.round(ratio * 100) +
    "%</b></p>"));

  // แท่งรายวัน — เห็นว่าหลุดเป็นบางวันหรือหลุดตลอด
  const bars = el('<div class="ebars"></div>');
  days.forEach(x => {
    const h = x.planned > 0 ? Math.min(1.4, x.actual / x.planned) : 0;
    const cls = x.planned === 0 ? "off" : h >= 0.9 ? "good" : h >= 0.5 ? "mid" : "low";
    const bar = el('<span class="ebar ' + cls + '" title="' + esc(thaiDate(x.key)) + " · ทำ " +
      (Math.round(x.actual * 10) / 10) + " จาก " + (Math.round(x.planned * 10) / 10) +
      ' ชม."><i style="height:' + Math.round(Math.min(100, h * 71)) + '%"></i></span>');
    bars.appendChild(bar);
  });
  card.appendChild(bars);

  card.appendChild(el('<p class="tiny" style="margin:8px 0 0">' +
    (ratio >= 0.9
      ? "ทำได้ตามแผนสม่ำเสมอ — แผนนี้สมจริงแล้ว"
      : ratio >= 0.6
        ? "ทำได้ราวสองในสามของแผน ถ้าเป็นแบบนี้ต่อเนื่อง ลองลดชั่วโมงต่อวันลงให้ตรงกับ" +
          "ความจริง ตารางจะได้ไม่สะสมหนี้"
        : "ทำได้น้อยกว่าครึ่งของแผนมาก — แผนตั้งไว้สูงเกินไป แก้เวลาว่างต่อวันในหน้าตั้งค่า " +
          "แล้วตารางจะกระจายใหม่ให้เอง") + "</p>"));
  return card;
}

/* ─────────────────────────────────────────────────────────────
   การ์ดแชร์ — วาดด้วย canvas แล้วส่งออกเป็นรูป

   วาดเองแทนที่จะแคปหน้าจอ เพราะแคปหน้าจอจะติดข้อมูลส่วนตัว (ชื่อคณะ
   คะแนนที่กรอกไว้) การ์ดนี้จึงเลือกโชว์เฉพาะสิ่งที่ตั้งใจให้คนอื่นเห็น
   ───────────────────────────────────────────────────────────── */
const SHARE_W = 1080, SHARE_H = 1350;

function drawShareCard(cv) {
  const g = cv.getContext("2d");
  const st = streak();
  const stats = subjectStats();
  const doneTopics = stats.reduce((a, x) => a + x.done, 0);
  const allTopics = stats.reduce((a, x) => a + x.total, 0);
  const pct = allTopics ? doneTopics / allTopics : 0;
  const e = nextExam(true);
  const days = e ? daysBetween(TODAY, e.date) : null;
  let seen = 0, ok = 0;
  Object.values(S.q).forEach(r => { seen += r.seen; ok += r.ok; });

  // พื้นหลัง: ไล่สีหมึกม่วง + ลายวงฝนคำตอบแบบเดียวกับแถบบนของแอป
  const bg = g.createLinearGradient(0, 0, SHARE_W, SHARE_H);
  bg.addColorStop(0, "#2a1d2e");
  bg.addColorStop(0.55, "#3a2440");
  bg.addColorStop(1, "#46283f");
  g.fillStyle = bg;
  g.fillRect(0, 0, SHARE_W, SHARE_H);
  g.fillStyle = "rgba(255,255,255,.05)";
  for (let y = 30; y < SHARE_H; y += 54)
    for (let x = 30; x < SHARE_W; x += 54) {
      g.beginPath(); g.arc(x, y, 9, 0, Math.PI * 2); g.fill();
    }

  const F = '"Plex Thai", system-ui, sans-serif';
  g.textBaseline = "alphabetic";

  g.fillStyle = "#b49bad";
  g.font = "500 34px " + F;
  g.fillText("TCAS70 · เตรียมสอบแพทย์ กสพท", 80, 130);

  // ตัวเลขนับถอยหลัง — พระเอกของการ์ด
  if (days != null) {
    g.fillStyle = "#f0ab2c";
    g.font = "700 260px " + F;
    const numTxt = String(days);
    g.fillText(numTxt, 80, 400);
    const w = g.measureText(numTxt).width;
    g.fillStyle = "#e2d0dc";
    g.font = "600 52px " + F;
    g.fillText("วัน", 80 + w + 26, 400);
    g.fillStyle = "#b49bad";
    g.font = "400 34px " + F;
    g.fillText("ก่อน " + (e.name || "สอบ"), 80, 460);
  }

  // วงแหวนความคืบหน้า
  const cx = SHARE_W - 250, cy = 300, r = 130;
  g.lineWidth = 26; g.lineCap = "round";
  g.strokeStyle = "rgba(255,255,255,.16)";
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
  if (pct > 0) {
    g.strokeStyle = "#f7bc4b";
    g.beginPath();
    g.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct);
    g.stroke();
  }
  g.fillStyle = "#fff"; g.textAlign = "center";
  g.font = "700 66px " + F;
  g.fillText(Math.round(pct * 100) + "%", cx, cy + 22);
  g.font = "400 28px " + F;
  g.fillStyle = "#b49bad";
  g.fillText("เนื้อหาที่อ่านจบ", cx, cy + 190);
  g.textAlign = "left";

  // สามตัวเลขล่าง
  const cells = [
    [String(st), "วันติดต่อกัน"],
    [doneTopics + "/" + allTopics, "หัวข้อที่อ่านจบ"],
    [seen ? Math.round(100 * ok / seen) + "%" : "—", "ความแม่นข้อสอบ"],
  ];
  cells.forEach(([big, small], i) => {
    const x = 80, y = 700 + i * 175;
    g.fillStyle = "rgba(255,255,255,.07)";
    roundRect(g, x, y - 78, SHARE_W - 160, 140, 28); g.fill();
    g.fillStyle = "#f7bc4b";
    g.font = "700 76px " + F;
    g.fillText(big, x + 42, y + 12);
    g.fillStyle = "#e2d0dc";
    g.font = "400 34px " + F;
    g.fillText(small, x + 342, y + 4);   // ป้ายชิดคอลัมน์เดียวกันทั้งสามแถว
  });

  g.fillStyle = "#8f7d8b";
  g.font = "400 26px " + F;
  g.fillText("ตารางอ่านหนังสือที่จัดใหม่ให้เองทุกวัน", 80, SHARE_H - 70);
}

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

async function shareProgress() {
  const cv = document.createElement("canvas");
  cv.width = SHARE_W; cv.height = SHARE_H;
  // ต้องรอฟอนต์โหลดเสร็จก่อน ไม่งั้น canvas จะวาดด้วยฟอนต์สำรอง
  try { await document.fonts.ready; } catch (e) {}
  drawShareCard(cv);

  const blob = await new Promise(res => cv.toBlob(res, "image/png"));
  if (!blob) return;
  const file = new File([blob], "tcas70-" + TODAY + ".png", { type: "image/png" });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
