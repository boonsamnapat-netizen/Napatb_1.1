<title>TCAS70 — ตารางเตรียมสอบแพทย์</title>

<style>
/* ═══════════════════════════════════════════════════════════════
   TOKENS
   ═══════════════════════════════════════════════════════════════ */
:root {
  --ink:        #101826;
  --paper:      #e6e9ef;
  --surface:    #ffffff;
  --surface-2:  #f4f6f9;
  --line:       #d3d9e2;
  --line-soft:  #e7ebf1;
  --text:       #101826;
  --text-2:     #4a5566;
  --text-3:     #78838f;

  --indigo:     #2b4c8c;
  --indigo-dim: #dde4f0;
  --marigold:   #b8801d;
  --marigold-f: #e0a02b;
  --brick:      #b04a38;
  --brick-dim:  #f6e3df;
  --ok:         #2e7a56;
  --ok-dim:     #dcece4;
  --warn:       #9a6714;
  --warn-dim:   #f6ecd8;

  --sans: "Sarabun", "Noto Sans Thai", "IBM Plex Sans Thai", "Leelawadee UI",
          "Thonburi", "Krungthep", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo,
          Consolas, monospace;

  --r: 3px;
  --shadow: 0 1px 2px rgba(16, 24, 38, .06), 0 4px 16px rgba(16, 24, 38, .05);
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:      #070c14;
    --surface:    #18212f;
    --surface-2:  #212b3a;
    --line:       #303b4d;
    --line-soft:  #26313f;
    --text:       #e6eaf0;
    --text-2:     #a2adbd;
    --text-3:     #788495;

    --indigo:     #7fa3e0;
    --indigo-dim: #1c2942;
    --marigold:   #e0a02b;
    --marigold-f: #e0a02b;
    --brick:      #e08573;
    --brick-dim:  #35201d;
    --ok:         #6dc39a;
    --ok-dim:     #172b23;
    --warn:       #d9a94a;
    --warn-dim:   #2b2416;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  }
}

:root[data-theme="dark"] {
  --paper:      #070c14;
  --surface:    #18212f;
  --surface-2:  #212b3a;
  --line:       #303b4d;
  --line-soft:  #26313f;
  --text:       #e6eaf0;
  --text-2:     #a2adbd;
  --text-3:     #788495;
  --indigo:     #7fa3e0;
  --indigo-dim: #1c2942;
  --marigold:   #e0a02b;
  --marigold-f: #e0a02b;
  --brick:      #e08573;
  --brick-dim:  #35201d;
  --ok:         #6dc39a;
  --ok-dim:     #172b23;
  --warn:       #d9a94a;
  --warn-dim:   #2b2416;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
}

:root[data-theme="light"] {
  --paper:      #e6e9ef;
  --surface:    #ffffff;
  --surface-2:  #f4f6f9;
  --line:       #d3d9e2;
  --line-soft:  #e7ebf1;
  --text:       #101826;
  --text-2:     #4a5566;
  --text-3:     #78838f;
  --indigo:     #2b4c8c;
  --indigo-dim: #dde4f0;
  --marigold:   #b8801d;
  --marigold-f: #e0a02b;
  --brick:      #b04a38;
  --brick-dim:  #f6e3df;
  --ok:         #2e7a56;
  --ok-dim:     #dcece4;
  --warn:       #9a6714;
  --warn-dim:   #f6ecd8;
  --shadow: 0 1px 2px rgba(16, 24, 38, .06), 0 4px 16px rgba(16, 24, 38, .05);
}

/* ═══════════════════════════════════════════════════════════════
   BASE
   ═══════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  /* Thai vowel marks sit above and below — tight leading clips them */
  line-height: 1.75;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
  /* clear the fixed bottom tab bar (~62px) plus the home indicator on iOS */
  padding-bottom: calc(78px + env(safe-area-inset-bottom, 0px));
}

@media (min-width: 720px) { body { padding-bottom: 0; } }

h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; line-height: 1.45; }

button { font-family: inherit; font-size: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--marigold-f);
  outline-offset: 2px;
  border-radius: var(--r);
}

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

.eyebrow {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .11em;
  text-transform: uppercase;
  color: var(--text-3);
  line-height: 1.5;
}

.shell { max-width: 940px; margin: 0 auto; padding: 0 16px; }

/* ═══════════════════════════════════════════════════════════════
   COUNTDOWN BAR — the one thing that is always true
   ═══════════════════════════════════════════════════════════════ */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--ink);
  color: #e6eaf0;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.topbar-in {
  max-width: 940px; margin: 0 auto;
  /* status-bar-style ของ iOS เป็น black-translucent + viewport-fit=cover
     หน้าเว็บจึงไหลขึ้นไปใต้นาฬิกา/แบต ต้องเผื่อ safe area เองไม่งั้นหัวแอปทับกัน */
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}

.brand { display: flex; flex-direction: column; gap: 1px; margin-right: auto; }
.brand-name { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
.brand-sub { font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: #8f9bb0; }

.cd { display: flex; align-items: baseline; gap: 7px; }
.cd-n { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 600; line-height: 1; color: var(--marigold-f); letter-spacing: -.03em; }
.cd-meta { display: flex; flex-direction: column; line-height: 1.3; }
.cd-unit { font-size: 12px; color: #b9c2d0; }
.cd-what { font-size: 11px; color: #8f9bb0; max-width: 190px; }

.streak{display:flex;align-items:baseline;gap:5px;padding:4px 10px;border-radius:99px;
  background:rgba(224,160,43,.14);border:1px solid rgba(224,160,43,.35)}
/* display:flex ชนะ [hidden] ของเบราว์เซอร์ ต้องประกาศทับเอง */
.streak[hidden]{display:none}
.streak-n{font-size:16px;font-weight:600;color:var(--marigold-f);line-height:1}
.streak-l{font-size:11px;color:#b9c2d0}

.gear{appearance:none;border:0;background:rgba(255,255,255,.08);color:#c8d0dc;cursor:pointer;
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.gear:hover{background:rgba(255,255,255,.16);color:#fff}
.gear svg{width:17px;height:17px}

/* ── settings ─────────────────────────────────────────────── */
.field{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.field:last-child{border-bottom:0}
.field-l{font-size:14.5px;flex:1;min-width:0}
.field input[type=text]{font-family:inherit;font-size:14px;color:var(--text);width:100%;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.hours-in{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;
  width:66px;text-align:center;color:var(--text);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:7px 4px}
.hours-in:focus{border-color:var(--marigold-f);outline:none}
.week-total{display:flex;align-items:baseline;gap:8px;padding-top:11px;font-size:13.5px;color:var(--text-2)}
.week-total b{font-family:var(--mono);font-size:17px;color:var(--text)}

/* ── where to read ────────────────────────────────────────── */
.blk-row{position:relative}
.blk-row .blk{padding-right:46px}
.blk-res{position:absolute;right:7px;top:9px;appearance:none;cursor:pointer;
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--surface-2);color:var(--text-2)}
.blk-res:hover{border-color:var(--indigo);color:var(--indigo)}
.blk-res svg{width:15px;height:15px}

.sheet-back{position:fixed;inset:0;z-index:85;background:rgba(8,12,20,.55);
  display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.sheet-back{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:86vh;overflow-y:auto;
  border-radius:14px 14px 0 0;padding:18px 17px calc(20px + env(safe-area-inset-bottom,0px));
  animation:sheetIn .2s ease-out}
@media (min-width:720px){.sheet{border-radius:12px;max-height:80vh}}
@keyframes sheetIn{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet-hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
.sheet-hd h2{font-size:17px;flex:1;min-width:0}
.sheet-x{appearance:none;border:0;background:none;cursor:pointer;color:var(--text-3);
  font-size:22px;line-height:1;padding:0 2px}

.res{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;margin-bottom:7px;
  border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surface);
  text-decoration:none;color:inherit}
.res:hover{border-color:var(--indigo)}
.res-ico{flex:none;width:26px;height:26px;border-radius:var(--r);display:grid;place-items:center;
  background:var(--indigo-dim);color:var(--indigo);font-size:13px}
.res-b{flex:1;min-width:0}
.res-b b{display:block;font-size:14px;font-weight:600}
.res-b span{display:block;font-size:12.5px;color:var(--text-2);line-height:1.6}
.res-del{appearance:none;border:0;background:none;cursor:pointer;color:var(--text-3);
  font-size:17px;line-height:1;padding:2px 4px;flex:none}
.res-del:hover{color:var(--brick)}

/* ── first run + focus timer ──────────────────────────────── */
.intro{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--marigold-f);
  border-radius:var(--r);padding:15px 17px}
.intro h2{font-size:16px;margin-bottom:6px}
.intro ol{margin:8px 0 0;padding-left:20px}
.intro li{font-size:14px;color:var(--text-2);margin-bottom:5px;line-height:1.7}
.intro li b{color:var(--text)}

.start{display:flex;align-items:center;gap:13px;width:100%;cursor:pointer;text-align:left;
  border:1px solid var(--ink);background:var(--ink);color:#f0f2f6;
  border-radius:var(--r);padding:14px 16px}
.start:hover{background:#1c2942}
:root[data-theme="dark"] .start{background:var(--marigold-f);border-color:var(--marigold-f);color:#2a1e06}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .start{
  background:var(--marigold-f);border-color:var(--marigold-f);color:#2a1e06}}
.start-ico{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.14)}
:root[data-theme="dark"] .start-ico{background:rgba(0,0,0,.14)}
.start-ico svg{width:16px;height:16px}
.start-t{flex:1;min-width:0}
.start-t b{display:block;font-size:15px}
.start-t span{font-size:12.5px;opacity:.72;display:block}

.timer{position:fixed;inset:0;z-index:80;background:var(--ink);color:#e8ebf1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.timer-topic{font-size:15px;color:#a9b3c2;text-align:center;max-width:32ch}
.timer-n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:64px;font-weight:600;
  letter-spacing:-.04em;line-height:1.1;color:var(--marigold-f)}
.timer-sub{font-size:13px;color:#8f9bb0;margin-bottom:16px}
.timer-btns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.timer .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#e8ebf1}
.timer .btn:hover{background:rgba(255,255,255,.18)}
.timer .btn-pri{background:var(--marigold-f);border-color:var(--marigold-f);color:#2a1e06}
.timer-ring{width:180px;height:180px;margin-bottom:14px;transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:5}
.timer-ring .bg{stroke:rgba(255,255,255,.12)}
.timer-ring .fg{stroke:var(--marigold-f);stroke-linecap:round;transition:stroke-dashoffset 1s linear}

/* ═══════════════════════════════════════════════════════════════
   ON-TRACK STATUS
   ═══════════════════════════════════════════════════════════════ */
.status{border-left:3px solid var(--line);padding:2px 0 2px 12px}
.status.ok{border-left-color:var(--ok)}
.status.tight{border-left-color:var(--warn)}
.status.over{border-left-color:var(--brick)}
.status-hd{display:flex;align-items:baseline;gap:8px;font-size:14px}
.status-hd .spacer{margin-left:auto;font-size:13px;color:var(--text-2)}
.status-dot{display:none}
.status.ok .status-hd b{color:var(--ok)}
.status.tight .status-hd b{color:var(--warn)}
.status.over .status-hd b{color:var(--brick)}

/* ═══════════════════════════════════════════════════════════════
   DAY COMPLETE + TOAST
   ═══════════════════════════════════════════════════════════════ */
.done-hero{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:26px 16px;text-align:center}
.done-hero b{font-size:17px}
.done-mark{width:46px;height:46px;border-radius:50%;background:var(--ok);color:var(--surface);
  display:grid;place-items:center;margin-bottom:3px}
.done-mark svg{width:24px;height:24px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:70;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  background:var(--ink);color:#f0f2f6;padding:10px 18px;border-radius:99px;
  box-shadow:0 6px 24px rgba(0,0,0,.28);animation:toastIn .22s ease-out}
.toast-big-t{font-size:14px;font-weight:600}
.toast-sub{font-size:11.5px;color:#a9b3c2}
.toast.toast-big{background:var(--ok);color:#fff;padding:13px 24px;border-radius:14px}
.toast.toast-big .toast-sub{color:rgba(255,255,255,.85)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(7px)}
                   to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media (min-width:720px){.toast{bottom:26px}}

/* ═══════════════════════════════════════════════════════════════
   TABS
   ═══════════════════════════════════════════════════════════════ */
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  padding: 9px 2px 11px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--text-3);
  border-top: 2px solid transparent;
  margin-top: -1px;
  transition: color .15s;
}
.tab-ico { width: 19px; height: 19px; display: block; }
.tab-label { font-size: 10.5px; line-height: 1.2; }
.tab[aria-selected="true"] { color: var(--text); border-top-color: var(--marigold-f); }
.tab:hover { color: var(--text-2); }

@media (min-width: 720px) {
  .tabs {
    position: sticky; top: 57px; bottom: auto;
    max-width: 940px; margin: 0 auto;
    grid-template-columns: repeat(5, auto);
    justify-content: start; gap: 2px;
    background: var(--paper); border-top: 0;
    border-bottom: 1px solid var(--line);
    padding: 0;
  }
  .tab {
    flex-direction: row; gap: 7px; padding: 12px 15px;
    border-top: 0; border-bottom: 2px solid transparent; margin-top: 0;
  }
  .tab[aria-selected="true"] { border-bottom-color: var(--marigold-f); }
  .tab-label { font-size: 13px; }
}

/* ═══════════════════════════════════════════════════════════════
   CARDS / PANELS
   ═══════════════════════════════════════════════════════════════ */
main { padding-top: 26px; }
.view { display: none; }
.view.on { display: block; }

.stack { display: flex; flex-direction: column; gap: 14px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
}
.card-pad { padding: 15px 16px; }

.card-hd {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 13px 16px;
  border-bottom: 1px solid var(--line-soft);
}
.card-hd h2 { font-size: 15px; }
.card-hd .spacer { margin-left: auto; }

.section-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; }
.section-title h2 { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; font-family: var(--mono); font-weight: 600; color: var(--text-2); }

/* ═══════════════════════════════════════════════════════════════
   OMR BUBBLE — the motif. Every Thai student knows this grid.
   ═══════════════════════════════════════════════════════════════ */
.bub {
  flex: none;
  width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid var(--line);
  display: grid; place-items: center;
  font-size: 12.5px; font-weight: 600;
  color: var(--text-3);
  background: var(--surface);
  transition: background .12s, border-color .12s, color .12s;
}
.bub.fill { background: var(--marigold-f); border-color: var(--marigold-f); color: #2a1e06; }
.bub.ok   { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.bub.bad  { background: var(--brick); border-color: var(--brick); color: var(--surface); }

/* tiny bubbles used as progress dots */
.dots { display: flex; flex-wrap: wrap; gap: 5px; }
.dot {
  width: 12px; height: 12px; border-radius: 50%;
  border: 1.5px solid var(--line);
  background: transparent;
}
.dot.on { background: var(--sc, var(--ok)); border-color: var(--sc, var(--ok)); }

/* แถบสัดส่วนวิชาในสัปดาห์ — เห็นส่วนผสมของสัปดาห์ได้ในแวบเดียว
   เว้นช่อง 2px ระหว่างช่วงตามสเปกของ mark ไม่ให้สองสีเชื่อมกันจนอ่านผิด */
.mix { display: flex; gap: 2px; height: 6px; margin: 9px 0 7px; }
.mix span { border-radius: 2px; background: var(--sc, var(--line)); min-width: 3px; }
.mix-key { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 4px; }
.mix-key i {
  display: inline-flex; align-items: center; gap: 5px;
  font-style: normal; font-size: 11.5px; color: var(--text-2);
}
.mix-key i::before {
  content: ""; width: 9px; height: 9px; border-radius: 2px;
  background: var(--sc, var(--line)); flex: none;
}

/* หัวสัปดาห์ — ทำให้ตารางยาว ๆ สแกนได้ แทนที่จะเป็นแถวเรียงไม่จบ */
.wk {
  position: sticky; top: var(--stick, 58px); z-index: 20;
  display: flex; align-items: baseline; gap: 9px;
  margin: 0 -16px; padding: 9px 16px;
  background: var(--surface); border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line-soft);
  cursor: pointer; width: calc(100% + 32px);
  text-align: left; font: inherit; color: inherit;
}
.wk:first-child { border-top: 0; }
.wk-t { font-size: 13px; font-weight: 700; }
.wk-m { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
.wk-c { font-size: 11px; color: var(--text-3); transition: transform .15s; }
.wk[aria-expanded="false"] .wk-c { transform: rotate(-90deg); }
.wk-body[hidden] { display: none; }

/* ═══════════════════════════════════════════════════════════════
   DATE SPINE — dates are a real sequence, so a spine is honest
   ═══════════════════════════════════════════════════════════════ */
/* geometry: date column sits at 0-40px, the rule at 48px, blocks from 62px —
   the column and the rule must not overlap or the dates get struck through */
.spine { position: relative; padding-left: 62px; }
.spine::before {
  content: ""; position: absolute; left: 48px; top: 6px; bottom: 6px;
  width: 1px; background: var(--line);
}

.sday { position: relative; padding-bottom: 18px; }
.sday-mark {
  position: absolute; left: -62px; top: 1px;
  width: 40px; text-align: right;
}

   ในแอปนี้ชื่อวิชาแสดงเป็นข้อความเสมอ ไม่ได้ใช้สีสื่อความหมายลำพัง)
   สีนี้บอก "วิชาอะไร" ส่วนสีเหลืองยังสงวนไว้บอก "ตอนนี้" เหมือนเดิม
   ═══════════════════════════════════════════════════════════════ */
[data-s="social"] { --sc: #7E9A25; --sc-dim: #f1f4e2; }

@media (prefers-color-scheme: dark) {

/* ═══════════════════════════════════════════════════════════════
   BLOCK ROWS
   หนึ่งกล่องพอ — แถวข้างในไม่มีขอบของตัวเอง ใช้เส้นคั่นบางกับช่องไฟแทน
   ═══════════════════════════════════════════════════════════════ */
.blk {
  display: flex; align-items: flex-start; gap: 12px;

  border: 0; background: none;
  border-left: 3px solid var(--sc, transparent);

}

/* ช่องติ๊กใช้ทรงเดียวกับวงฝนคำตอบ — ลายเดียวกันทั้งแอป */
.blk-check {
  flex: none; width: 24px; height: 24px; margin-top: 1px;

<script>
const DATA = /*__TCAS_DATA__*/null;

/* ─────────────────────────────────────────────────────────────
   storage — sandboxed frames can refuse localStorage, so never
   let a throw take the page down; fall back to memory for the session
   ───────────────────────────────────────────────────────────── */
const Store = (() => {
  const KEY = "tcas70.v1";
  let mem = null, usable = true;
  try {
    const probe = "__t";
    localStorage.setItem(probe, "1");
    localStorage.removeItem(probe);
  } catch (e) { usable = false; }

  function read() {
    if (mem) return mem;
    if (usable) {
      try { mem = JSON.parse(localStorage.getItem(KEY) || "{}"); }
      catch (e) { mem = {}; }
    } else mem = {};

    // topicCode -> {hoursDone, learnedOn, rep, ease, next}
    // ความคืบหน้าผูกกับ "หัวข้อ" ไม่ใช่ "วันที่" — ข้ามวันแล้วงานจึงไม่หาย
    if (!mem.topics) mem.topics = {};
    if (!mem.q) mem.q = {};              // qid -> {seen, ok}
    if (!mem.tests) mem.tests = {};      // "YYYY-MM-DD|kind" -> true
    if (!mem.runs) mem.runs = [];        // quiz history
    if (!mem.days) mem.days = {};        // "YYYY-MM-DD" -> ชั่วโมงที่ทำวันนั้น (ใช้นับ streak)
    if (!mem.settings) mem.settings = {};
    if (!mem.links) mem.links = {};    // topicCode -> [{url,title,saved}]
    if (!mem.log) mem.log = {};          // "YYYY-MM-DD" -> [{topic,kind,hours,rep}] ที่ทำเสร็จวันนั้น
    return mem;
  }
  function save() {
    if (!usable) return;
    try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { usable = false; }
  }
  return { read, save, get persistent() { return usable; } };
})();

const S = Store.read();

/* ย้ายข้อมูลจากรูปแบบเดิม (v1) ที่เก็บเป็น "วันที่|หัวข้อ" มาเป็นชั่วโมงต่อหัวข้อ
   ทำครั้งเดียวแล้วทิ้งของเดิม — ผู้ใช้เดิมจึงไม่เสียความคืบหน้าที่เคยติ๊กไว้ */
(function migrateFromDateKeyedProgress() {
  if (!S.done || S.migrated) return;
  const hoursOf = new Map();
  for (const day of DATA.plan)
    for (const b of day.blocks)
      if (b.kind === "learn") hoursOf.set(day.date + "|" + b.topic, b.hours);

  for (const key of Object.keys(S.done)) {
    const [, topic] = key.split("|");
    const h = hoursOf.get(key) || 0;
    if (!topic || !h) continue;
    const rec = S.topics[topic] || { hoursDone: 0 };
    rec.hoursDone = (rec.hoursDone || 0) + h;
    S.topics[topic] = rec;
  }
  delete S.done;
  S.migrated = true;
  Store.save();
})();

/* ─────────────────────────────────────────────────────────────
   dates
   ───────────────────────────────────────────────────────────── */
const DOW = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
const DOW_FULL = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
const MON = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

function d(iso) { const [y, m, dd] = iso.split("-").map(Number); return new Date(y, m - 1, dd); }
function iso(dt) {
  return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") +
         "-" + String(dt.getDate()).padStart(2, "0");
}
function thaiDate(isoStr, full) {
  const t = d(isoStr);
  const base = t.getDate() + " " + MON[t.getMonth()] + " " + (t.getFullYear() + 543);
  return full ? base + " (" + DOW_FULL[t.getDay()] + ")" : base;
}
function daysBetween(a, b) { return Math.round((d(b) - d(a)) / 86400000); }
function fmtHours(h) {
  const H = Math.floor(h), M = Math.round((h - H) * 60);
  if (H && M) return H + " ชม. " + M + " น.";
  if (H) return H + " ชม.";
  return M + " นาที";
}

/* วันนี้จริง ๆ — แต่ข้อมูลถูกสร้างไว้ล่วงหน้า ถ้าเปิดหน้านี้ก่อนวันเริ่มแผน
   ให้ยึดวันเริ่มแผนแทน จะได้ไม่เจอหน้าว่าง */
const REAL_TODAY = iso(new Date());
const TODAY = REAL_TODAY < DATA.startDate ? DATA.startDate : REAL_TODAY;

const SUBJ = DATA.subjects;
const TOPIC_OF = (() => {
  const m = new Map();
  for (const [sc, s] of Object.entries(SUBJ)) for (const t of s.topics) m.set(t.code, { subject: sc, ...t });
  return m;
})();

/* ─────────────────────────────────────────────────────────────
   helpers
   ───────────────────────────────────────────────────────────── */
const $ = (sel, root) => (root || document).querySelector(sel);
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

const CHOICE_LETTERS = ["ก", "ข", "ค", "ง", "จ"];

/* ชิปในตารางมีที่แคบ — ใช้ชื่อสั้น ("ชีววิทยา") ไม่ใช่ชื่อเต็ม ("A-Level ชีววิทยา") */
const subjLabel = code => (SUBJ[code] && (SUBJ[code].short || SUBJ[code].name)) || code;
const subjName  = code => (SUBJ[code] && SUBJ[code].name) || code;
/* ค่าที่ผู้ใช้ตั้งเองในแอปทับ config ที่ฝังมาตอน build
   เก็บใน localStorage เท่านั้น — แก้บนมือถือแล้วตารางคำนวณใหม่ทันที ไม่ต้อง deploy */
const ST = (() => {
  const base = JSON.parse(JSON.stringify(DATA.study));
  const ov = S.settings || {};
  if (ov.hoursByWeekday) Object.assign(base.hoursByWeekday, ov.hoursByWeekday);
  if (Array.isArray(ov.daysOff)) base.daysOff = ov.daysOff;
  return base;
})();
const studentName = () => (S.settings && S.settings.name) || (DATA.student && DATA.student.name) || "";
const DOW_KEY = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];

/** ตัวนับถอยหลังหลักยึดเฉพาะสนามที่มีน้ำหนักใน กสพท — TGAT ไม่นับ */
function nextExam(countingOnly) {
  for (const e of DATA.exams) {
    if (daysBetween(TODAY, e.date) < 0) continue;
    if (countingOnly && e.counts === false) continue;
    return e;
  }
  return null;
}

/* ── สถานะรายหัวข้อ ───────────────────────────────────────── */
const topicRec = code => S.topics[code] || {};
const hoursDoneOf = code => Number(topicRec(code).hoursDone || 0);
const hoursLeftOf = t => Math.max(0, Math.round((t.hours - hoursDoneOf(t.code)) * 4) / 4);
const isLearned = code => {
  const t = TOPIC_OF.get(code);
  return !!t && hoursDoneOf(code) >= t.hours - 0.001;
};

/** ความแม่นของหัวข้อ จากข้อสอบที่เคยทำในหัวข้อนั้น (ยังไม่เคยทำ = ค่าตั้งต้น) */
function masteryOf(code) {
  let seen = 0, ok = 0;
  for (const q of DATA.questions) {
    if (q.topic !== code) continue;
    const r = S.q[q.qid];
    if (r) { seen += r.seen; ok += r.ok; }
  }
  return seen ? (100 * ok / seen) : ST.baselineMastery;
}

/* ── เวลาว่างในแต่ละวัน ───────────────────────────────────── */
function hoursFor(isoStr) {
  if (ST.daysOff.includes(isoStr)) return 0;
  return Number(ST.hoursByWeekday[DOW_KEY[d(isoStr).getDay()]] || 0);
}

/** ชั่วโมงอ่าน "ของใหม่" ที่เหลือระหว่างสองวัน (หักส่วนที่กันไว้ทบทวน) */
function learnHoursBetween(fromISO, toISO) {
  const learnShare = 1 - ST.reviewShare;
  let total = 0, cur = d(fromISO), end = d(toISO), guard = 0;
  while (cur <= end && guard++ < 800) {
    total += hoursFor(iso(cur)) * learnShare;
    cur.setDate(cur.getDate() + 1);
  }
  return total;
}

/** น้ำหนักของวิชาในคะแนนรวม 100 (กลุ่มวิทย์ 3 วิชาหารเท่ากัน) */
const SUBJ_WEIGHT = (() => {
  const perGroup = {};
  for (const s of Object.values(SUBJ)) perGroup[s.group] = (perGroup[s.group] || 0) + 1;
  const out = {};
  for (const [code, s] of Object.entries(SUBJ))
    out[code] = (DATA.weights[s.group] || 1) / (perGroup[s.group] || 1);
  return out;
})();

/* ── ตัวจัดตาราง ───────────────────────────────────────────
   จัดใหม่ทุกครั้งที่เปิดหน้า โดยเริ่มจาก "วันนี้" และ "สิ่งที่ยังไม่ได้ทำจริง"
   ข้ามไปกี่วันก็ตาม งานที่ค้างจะถูกดันมาข้างหน้าเสมอ ไม่หายไปตามปฏิทิน
   สูตรเดียวกับฝั่ง Python: น้ำหนักหัวข้อ × น้ำหนักวิชา × (1−ความแม่น) × ความเร่งด่วน */
function buildPlan(fromISO, nDays) {
  const pending = [];
  for (const [sc, s] of Object.entries(SUBJ)) {
    // สอบวิชานี้ไปแล้วก็ไม่ต้องอ่านต่อ — ไม่งั้นความเร่งด่วนจะพุ่งค้างตลอดกาล
    // (เวลาว่างก่อนเส้นตายเป็น 0 ทำให้ตัวหารเล็กจนดันวิชานั้นขึ้นบนสุดเสมอ)
    if (ST.deadlines[sc] && ST.deadlines[sc] < fromISO) continue;
    for (const t of s.topics) {
      const left = hoursLeftOf(t);
      if (left >= 0.25)
        pending.push({ subject: sc, code: t.code, name: t.name, weight: t.weight, left });
    }
  }

  // คิวทบทวน — จำลองต่อไปข้างหน้าโดยถือว่าทบทวนผ่าน
  const sim = new Map();
  for (const [code, rec] of Object.entries(S.topics))
    if (rec.next && TOPIC_OF.has(code)) sim.set(code, { next: rec.next, rep: rec.rep || 0 });

  const days = [];
  const cur = d(fromISO);

  for (let i = 0; i < nDays; i++) {
    const dayISO = iso(cur);
    // หักเวลาที่ทำไปแล้ววันนั้นออก — ทำครึ่งวันแล้วตารางจะเหลือแค่ส่วนที่ค้าง
    const logged = (S.log[dayISO] || []).reduce((a, x) => a + x.hours, 0);
    const capacity = Math.max(0, hoursFor(dayISO) - logged);
    const day = { date: dayISO, blocks: [],
                  note: hoursFor(dayISO) <= 0 ? "วันพัก" : (capacity <= 0 ? "ทำครบแล้ว" : "") };

    if (capacity > 0) {
      let usedReview = 0;
      const reviewBudget = capacity * ST.reviewShare;

      // 1) ทบทวนก่อน — ค้างนานสุดขึ้นก่อน
      const due = [...sim.entries()].filter(([, r]) => r.next <= dayISO)
        .sort((a, b) => (a[1].next < b[1].next ? -1 : 1));
      for (const [code, r] of due) {
        const t = TOPIC_OF.get(code);
        if (!t) continue;
        let need = Math.max(0.25, Math.round(t.hours * 0.25 * Math.pow(0.7, r.rep) * 4) / 4);
        need = Math.min(need, capacity - usedReview);
        if (need < 0.25) break;
        if (usedReview + need > reviewBudget && usedReview > 0) break;
        day.blocks.push({ kind: "review", subject: t.subject, topic: code,
                          topicName: t.name, hours: need, repetition: r.rep + 1 });
        usedReview += need;
        const gap = ST.reviewIntervals[Math.min(r.rep + 1, ST.reviewIntervals.length - 1)];
        const nx = d(dayISO); nx.setDate(nx.getDate() + gap);
        sim.set(code, { next: iso(nx), rep: r.rep + 1 });
      }

      // 2) อ่านใหม่ตามลำดับความคุ้ม
      let budget = capacity - usedReview;
      if (pending.length) {
        const remain = {}, urgency = {};
        for (const p of pending) remain[p.subject] = (remain[p.subject] || 0) + p.left;
        for (const sc of Object.keys(remain)) {
          const avail = learnHoursBetween(dayISO, ST.deadlines[sc] || dayISO);
          urgency[sc] = Math.min(5, Math.max(0.1, remain[sc] / Math.max(avail, 1)));
        }
        const score = p => p.weight * SUBJ_WEIGHT[p.subject] *
          (1 - masteryOf(p.code) / 100) * (urgency[p.subject] || 1);
        pending.sort((a, b) => score(b) - score(a));

        // หัวข้อที่ลงมือไปแล้ววันนี้ ให้ไปต่อคิวท้าย — จะได้ไม่เด้งกลับมาซ้ำ
        // ทันทีที่ติ๊กเสร็จ (มันยัง priority สูงสุดอยู่ เพราะยังอ่านไม่จบ)
        const workedToday = new Set((S.log[dayISO] || []).map(e => e.topic));
        if (workedToday.size) {
          const front = pending.filter(x => !workedToday.has(x.code));
          const back = pending.filter(x => workedToday.has(x.code));
          pending.length = 0;
          pending.push(...front, ...back);
        }
      }
      while (budget >= 0.25 && pending.length) {
        const p = pending[0];
        const chunk = Math.round(Math.min(ST.blockHours, p.left, budget) * 4) / 4;
        if (chunk < 0.25) break;
        day.blocks.push({ kind: "learn", subject: p.subject, topic: p.code,
                          topicName: p.name, hours: chunk, repetition: 0 });
        budget -= chunk;
        p.left = Math.round((p.left - chunk) * 4) / 4;
        pending.shift();
        if (p.left >= 0.25) {
          pending.push(p);          // เหลืออีก -> ต่อวันหลัง ไม่กองซ้ำวันเดียว
        } else {
          const nx = d(dayISO); nx.setDate(nx.getDate() + ST.reviewIntervals[0]);
          sim.set(p.code, { next: iso(nx), rep: 0 });
        }
      }
    }
    days.push(day);
    cur.setDate(cur.getDate() + 1);
  }
  return days;
}

/* ── ยังทันไหม ─────────────────────────────────────────────
   เทียบชั่วโมงที่ยังต้องอ่าน กับชั่วโมงว่างที่เหลือจริงก่อนถึงวันสอบแต่ละสนาม */
function outlook() {
  const byDeadline = {};
  for (const [sc, s] of Object.entries(SUBJ)) {
    const dl = ST.deadlines[sc];
    if (!dl || dl < TODAY) continue;   // สนามที่สอบไปแล้วไม่ต้องเตือนอีก
    byDeadline[dl] = (byDeadline[dl] || 0) + s.topics.reduce((a, t) => a + hoursLeftOf(t), 0);
  }
  return Object.entries(byDeadline).sort().map(([dl, need]) => {
    const avail = learnHoursBetween(TODAY, dl);
    const exam = DATA.exams.find(e => e.date === dl);
    const ratio = avail > 0 ? need / avail : (need > 0 ? 99 : 0);
    return {
      deadline: dl, need, avail, slack: avail - need,
      name: exam ? exam.name : dl,
      status: need <= 0 ? "done" : ratio <= 0.85 ? "ok" : ratio <= 1 ? "tight" : "over",
    };
  });
}

/* ── streak ───────────────────────────────────────────────── */
function streak() {
  let n = 0;
  const cur = d(TODAY);
  // วันนี้ยังไม่ได้ทำก็ยังไม่ตัด streak — เริ่มนับจากเมื่อวานแทน
  if (!(S.days[iso(cur)] > 0)) cur.setDate(cur.getDate() - 1);
  for (let i = 0; i < 400; i++) {
    if (!(S.days[iso(cur)] > 0)) break;
    n++; cur.setDate(cur.getDate() - 1);
  }
  return n;
}

function subjectStats() {
  const out = [];
  for (const [code, s] of Object.entries(SUBJ)) {
    const total = s.topics.length;
    const dn = s.topics.filter(t => isLearned(t.code)).length;
    const hoursDone = s.topics.reduce((a, t) => a + Math.min(hoursDoneOf(t.code), t.hours), 0);
    let seen = 0, ok = 0;
    for (const q of DATA.questions) {
      if (q.subject !== code) continue;
      const r = S.q[q.qid];
      if (r) { seen += r.seen; ok += r.ok; }
    }
    out.push({
      code, name: s.name, total, done: dn,
      pct: total ? (100 * dn / total) : 0,
      hoursDone, hoursTotal: s.hours,
      accuracy: seen ? (100 * ok / seen) : null, seen,
      topics: s.topics,
    });
  }
  return out.sort((a, b) => b.pct - a.pct);
}

/* ─────────────────────────────────────────────────────────────
   VIEW: วันนี้
   ───────────────────────────────────────────────────────────── */
/* ทำบล็อกเสร็จ: ลงชั่วโมงให้หัวข้อ บันทึกลงล็อกของวัน แล้วขยับคิวทบทวน
   ตารางที่เหลือจะถูกคำนวณใหม่เองจากชั่วโมงที่เหลือ ไม่ต้องแตะปฏิทิน */
function completeBlock(dayISO, b) {
  const rec = S.topics[b.topic] || {};

  if (b.kind === "learn") {
    rec.hoursDone = Number(rec.hoursDone || 0) + b.hours;
    const t = TOPIC_OF.get(b.topic);
    if (t && rec.hoursDone >= t.hours - 0.001 && !rec.learnedOn) {
      rec.learnedOn = dayISO;
      rec.rep = 0;
      const nx = d(dayISO); nx.setDate(nx.getDate() + ST.reviewIntervals[0]);
      rec.next = iso(nx);
    }
  } else {
    rec.rep = Number(rec.rep || 0) + 1;
    const gap = ST.reviewIntervals[Math.min(rec.rep, ST.reviewIntervals.length - 1)];
    const nx = d(dayISO); nx.setDate(nx.getDate() + gap);
    rec.next = iso(nx);
  }

  S.topics[b.topic] = rec;
  (S.log[dayISO] = S.log[dayISO] || []).push(
    { topic: b.topic, kind: b.kind, hours: b.hours, rep: b.repetition, subject: b.subject });
  S.days[dayISO] = Number(S.days[dayISO] || 0) + b.hours;
  Store.save();
}

function undoLogged(dayISO, index) {
  const entries = S.log[dayISO] || [];
  const e = entries[index];
  if (!e) return;
  const rec = S.topics[e.topic] || {};
  if (e.kind === "learn") {
    rec.hoursDone = Math.max(0, Number(rec.hoursDone || 0) - e.hours);
    const t = TOPIC_OF.get(e.topic);
    if (t && rec.hoursDone < t.hours - 0.001) { delete rec.learnedOn; delete rec.next; delete rec.rep; }
  } else {
    rec.rep = Math.max(0, Number(rec.rep || 0) - 1);
  }
  S.topics[e.topic] = rec;
  entries.splice(index, 1);
  S.days[dayISO] = Math.max(0, Number(S.days[dayISO] || 0) - e.hours);
  if (!S.days[dayISO]) delete S.days[dayISO];
  Store.save();
}

function blockRow(dayISO, b, opts) {
  const o = opts || {};
  // ชื่อวิชาโผล่เฉพาะตอนที่ต่างจากแถวก่อนหน้า — ไม่งั้นชิป "TPAT1" จะซ้ำติดกัน 40 แถว
  const showSubj = o.showSubject !== false;
  const meta =
    (showSubj ? '<span class="blk-sub">' + esc(subjLabel(b.subject)) + "</span>" : "") +
    '<span class="chip">' + fmtHours(b.hours) + "</span>" +
    (b.kind === "review" && b.repetition > 1
      ? '<span class="chip">ครั้งที่ ' + b.repetition + "</span>" : "");

  const btn = el(
    '<button class="blk ' + (o.done ? "done" : "") + '">' +
      '<span class="blk-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg></span>' +
      '<span class="blk-body">' +
        '<span class="blk-name">' + esc(b.topicName) + "</span>" +
        '<span class="blk-meta">' + meta + "</span>" +
      "</span>" +
    "</button>"
  );
  btn.setAttribute("aria-pressed", o.done ? "true" : "false");
  if (o.readonly) { btn.disabled = true; btn.style.cursor = "default"; }
  else {
    btn.addEventListener("click", () => {
      if (o.done) undoLogged(dayISO, o.index);
      else { completeBlock(dayISO, b); celebrate(dayISO); }
      render();
    });
  }

  const row = el('<div class="blk-row"></div>');
  btn.setAttribute("data-s", b.subject || "");
  row.appendChild(btn);
  const res = el('<button class="blk-res" aria-label="หาอ่านหัวข้อนี้">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9a3 3 0 0 1 3 3v11a2.5 2.5 0 0 0-2.5-2.5H4z"/><path d="M20 5h-2a3 3 0 0 0-3 3v11a2.5 2.5 0 0 1 2.5-2.5H20z"/></svg></button>');
  res.addEventListener("click", ev => { ev.stopPropagation(); openResources(b.topic); });
  row.appendChild(res);
  return row;
}

/* ── "จะไปอ่านที่ไหน" ──────────────────────────────────────
   ปุ่มค้นหายิงคำค้นจากชื่อหัวข้อจริง จึงไม่มีวันเสียแม้ลิงก์ใน config จะตาย
   ส่วนลิงก์ที่ผู้ใช้บันทึกเอง ผูกกับหัวข้อไปตลอด เจอของดีครั้งเดียวไม่ต้องหาซ้ำ */
const RES = DATA.resources || {};

function searchUrlsFor(topicName, subjectCode) {
  const engines = (RES.search && RES.search.engines) || [];
  const exam = (SUBJ[subjectCode] || {}).exam || "alevel";
  const suffix = ((RES.search || {}).suffix_by_exam || {})[exam] || "";
  const q = encodeURIComponent((topicName + " " + suffix).trim());
  return engines.map(e => ({ name: e.name, icon: e.icon || "🔍", url: e.url.replace("{q}", q) }));
}

function hubsFor(subjectCode) {
  return (RES.hubs || []).filter(h => {
    const subs = h.subjects || ["all"];
    return subs.includes("all") || subs.includes(subjectCode);
  });
}

const savedLinks = code => (S.links && S.links[code]) || [];

function resourceRow(icon, title, sub, href, onDelete) {
  const node = el(
    '<a class="res" target="_blank" rel="noopener noreferrer" href="' + esc(href) + '">' +
      '<span class="res-ico">' + esc(icon) + "</span>" +
      '<span class="res-b"><b>' + esc(title) + "</b>" +
        (sub ? "<span>" + esc(sub) + "</span>" : "") + "</span>" +
    "</a>");
  if (onDelete) {
    const del = el('<button class="res-del" aria-label="ลบลิงก์">×</button>');
    del.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); onDelete(); });
    node.appendChild(del);
  }
  return node;
}

function openResources(topicCode) {
  const t = TOPIC_OF.get(topicCode);
  if (!t) return;
  const old = $("#sheet"); if (old) old.remove();

  const back = el('<div class="sheet-back" id="sheet"></div>');
  const sheet = el('<div class="sheet"></div>');
  back.addEventListener("click", ev => { if (ev.target === back) back.remove(); });

  const hd = el('<div class="sheet-hd"><h2>' + esc(t.name) + "</h2></div>");
  const x = el('<button class="sheet-x" aria-label="ปิด">×</button>');
  x.addEventListener("click", () => back.remove());
  hd.appendChild(x);
  sheet.appendChild(hd);
  sheet.appendChild(el('<p class="tiny" style="margin:0 0 13px">' +
    esc(subjName(t.subject)) + " · " + t.hours + " ชม. · น้ำหนักออกสอบ " + t.weight + "/5</p>"));

  /* ค้นหา — ใช้ได้เสมอ */
  sheet.appendChild(el('<div class="section-title"><h2>ค้นหาหัวข้อนี้</h2></div>'));
  searchUrlsFor(t.name, t.subject).forEach(e =>
    sheet.appendChild(resourceRow(e.icon, "ค้นบน " + e.name, t.name, e.url)));

  /* ลิงก์ที่บันทึกเอง */
  sheet.appendChild(el('<div class="section-title" style="margin-top:15px"><h2>ลิงก์ของฉัน</h2></div>'));
  const mine = savedLinks(topicCode);
  if (mine.length) {
    mine.forEach((lk, i) => sheet.appendChild(
      resourceRow("★", lk.title || lk.url, lk.url, lk.url, () => {
        S.links[topicCode].splice(i, 1);
        if (!S.links[topicCode].length) delete S.links[topicCode];
        Store.save(); openResources(topicCode);
      })));
  } else {
    sheet.appendChild(el('<p class="tiny" style="margin:-2px 0 8px">เจอคลิปหรือสรุปที่ดี ' +
      "บันทึกไว้ตรงนี้ ครั้งหน้าไม่ต้องหาใหม่</p>"));
  }

  const addRow = el('<div class="btn-row" style="margin-top:6px"></div>');
  const urlIn = el('<input type="text" placeholder="วางลิงก์ที่นี่" ' +
    'style="flex:1;min-width:140px;font-family:inherit;font-size:13.5px;color:var(--text);' +
    'background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:8px 10px">');
  const addBtn = el('<button class="btn btn-sm">บันทึก</button>');
  const add = () => {
    let v = urlIn.value.trim();
    if (!v) return;
    if (!/^https?:\/\//i.test(v)) v = "https://" + v;
    try { new URL(v); } catch (e) { alert("ลิงก์ไม่ถูกต้อง"); return; }
    S.links = S.links || {};
    (S.links[topicCode] = S.links[topicCode] || []).push({ url: v, title: "", saved: TODAY });
    Store.save(); openResources(topicCode);
  };
  addBtn.addEventListener("click", add);
  urlIn.addEventListener("keydown", ev => { if (ev.key === "Enter") add(); });
  addRow.appendChild(urlIn); addRow.appendChild(addBtn);
  sheet.appendChild(addRow);

  /* แหล่งรวม */
  const hubs = hubsFor(t.subject);
  if (hubs.length) {
    sheet.appendChild(el('<div class="section-title" style="margin-top:16px"><h2>แหล่งรวมของวิชานี้</h2></div>'));
    hubs.forEach(h => sheet.appendChild(
      resourceRow(h.verified ? "✓" : "↗", h.name, h.note || "", h.url)));
    sheet.appendChild(el('<p class="tiny" style="margin:6px 0 0">ลิงก์เหล่านี้มาจากการค้นเว็บ ' +
      "แต่ยังไม่ได้เปิดยืนยันทีละอัน ถ้าเจอลิงก์เสียแก้ได้ที่ config/tcas_resources.yaml</p>"));
  }

  back.appendChild(sheet);
  document.body.appendChild(back);
}

/* ── ตัวจับเวลาอ่านหนังสือ ─────────────────────────────────
   กดเริ่มแล้วเต็มจอ นับถอยหลังตามเวลาของบล็อกนั้น
   ครบเวลา (หรือกดจบก่อน) = ติ๊กบล็อกให้อัตโนมัติ */
let timerState = null;

function startTimer(b) {
  const secs = Math.round(b.hours * 3600);
  timerState = { block: b, total: secs, left: secs, paused: false, tick: null };
  renderTimer();
  timerState.tick = setInterval(() => {
    if (!timerState || timerState.paused) return;
    timerState.left -= 1;
    if (timerState.left <= 0) finishTimer(true);
    else updateTimerFace();
  }, 1000);
}

function finishTimer(complete) {
  if (!timerState) return;
  const b = timerState.block;
  clearInterval(timerState.tick);
  const node = $("#timer"); if (node) node.remove();
  timerState = null;
  if (complete) { completeBlock(TODAY, b); celebrate(TODAY); }
  render();
}

function fmtClock(s) {
  const m = Math.floor(s / 60), r = s % 60;
  return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
}

function updateTimerFace() {
  if (!timerState) return;
  const n = $("#timerN"); if (n) n.textContent = fmtClock(Math.max(0, timerState.left));
  const ring = $("#timerFg");
  if (ring) {
    const C = 2 * Math.PI * 82;
    ring.style.strokeDasharray = C;
    ring.style.strokeDashoffset = C * (1 - timerState.left / timerState.total);
  }
}

function renderTimer() {
  const b = timerState.block;
  const node = el(
    '<div class="timer" id="timer" role="dialog" aria-label="กำลังจับเวลา">' +
      '<div class="timer-topic">' + esc(b.topicName) + "</div>" +
      '<svg class="timer-ring" viewBox="0 0 180 180" aria-hidden="true">' +
        '<circle class="bg" cx="90" cy="90" r="82"/>' +
        '<circle class="fg" id="timerFg" cx="90" cy="90" r="82"/>' +
      "</svg>" +
      '<div class="timer-n" id="timerN">' + fmtClock(timerState.left) + "</div>" +
      '<div class="timer-sub">' + (b.kind === "review" ? "ทบทวน" : "อ่านใหม่") +
        " · " + esc(subjLabel(b.subject)) + "</div>" +
      '<div class="timer-btns">' +
        '<button class="btn" id="tPause">พัก</button>' +
        '<button class="btn btn-pri" id="tDone">ทำเสร็จแล้ว</button>' +
        '<button class="btn" id="tQuit">ยกเลิก</button>' +
      "</div>" +
    "</div>");
  document.body.appendChild(node);
  updateTimerFace();

  $("#tPause").addEventListener("click", () => {
    timerState.paused = !timerState.paused;
    $("#tPause").textContent = timerState.paused ? "ไปต่อ" : "พัก";
  });
  $("#tDone").addEventListener("click", () => finishTimer(true));
  $("#tQuit").addEventListener("click", () => finishTimer(false));
}

/* ฟีดแบ็กตอนทำเสร็จ — เงียบ ๆ ตอนทำได้ทีละบล็อก และชัดขึ้นเมื่อครบทั้งวัน */
let toastTimer = null;
function celebrate(dayISO) {
  const left = buildPlan(dayISO, 1)[0].blocks.length;
  const st = streak();
  const msg = left === 0
    ? { big: "ครบแล้ววันนี้", sub: st > 1 ? "ต่อเนื่อง " + st + " วันติด 🔥" : "เริ่มนับ streak แล้ว" }
    : { big: "บันทึกแล้ว", sub: "เหลืออีก " + left + " บล็อก" };

  const old = $("#toast"); if (old) old.remove();
  const node = el(
    '<div id="toast" class="toast' + (left === 0 ? " toast-big" : "") + '">' +
      '<span class="toast-big-t">' + esc(msg.big) + "</span>" +
      '<span class="toast-sub">' + esc(msg.sub) + "</span>" +
    "</div>");
  document.body.appendChild(node);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.remove(), left === 0 ? 3200 : 1700);
}

  const look = outlook().filter(o => o.need > 0);
  if (look.length) {
    const worst = look.reduce((a, b) => (a.slack <= b.slack ? a : b));
    const cls = worst.status === "over" ? "over" : worst.status === "tight" ? "tight" : "ok";
    const label = { ok: "ตามทัน", tight: "ค่อนข้างตึง", over: "ไม่ทันแล้ว" }[cls];

  /* ---- today's blocks */
  const card = el('<div class="card"></div>');
  card.appendChild(el(
    '<div class="card-hd"><h2>' + esc(thaiDate(TODAY, true)) + "</h2>" +

        "<b>ครบแล้ววันนี้</b>" +
        '<span class="tiny">ทำไป ' + fmtHours(hoursDone) +

      "</div>"));
  } else if (!blocks.length) {
    body.appendChild(el('<div class="empty">' + esc(todo.note || "ไม่มีตารางของวันนี้") + "</div>"));
  } else {
    const reviews = blocks.filter(b => b.kind === "review");

  // ที่ทำเสร็จไปแล้ววันนี้ — กดซ้ำเพื่อยกเลิกได้

  /* ---- milestones */

          " · " + esc(thaiDate(m.date)) + "</div>" +
      "</div>"

  }

  root.appendChild(wrap);
}

/* ─────────────────────────────────────────────────────────────
   VIEW: ตารางอ่าน
   ───────────────────────────────────────────────────────────── */
let planWindow = 14;

function viewPlan() {
  const root = $("#v-plan");
  root.innerHTML = "";
  const wrap = el('<div class="stack"></div>');

  const ctl = el('<div class="card card-pad"></div>');
  ctl.appendChild(el('<div class="section-title"><h2>ช่วงที่แสดง</h2></div>'));
  const row = el('<div class="btn-row"></div>');
  [7, 14, 30, 90].forEach(n => {
    const b = el('<button class="btn btn-sm' + (planWindow === n ? " btn-pri" : "") + '">' + n + " วัน</button>");
    b.addEventListener("click", () => { planWindow = n; render(); });
    row.appendChild(b);
  });
  ctl.appendChild(row);
  ctl.appendChild(el('<p class="tiny" style="margin:10px 0 0">ตารางจัดใหม่ทุกครั้งที่เปิด ' +
    'จากงานที่ยังไม่ได้ทำจริง — ข้ามไปกี่วันงานก็ไม่หาย จะถูกดันมาข้างหน้าให้เอง ' +
    'ติ๊กได้เฉพาะของวันนี้</p>'));
  wrap.appendChild(ctl);

  const days = buildPlan(TODAY, planWindow);
  const card = el('<div class="card card-pad"></div>');

  if (!days.some(d => d.blocks.length)) {
    card.appendChild(el('<div class="empty">ไม่มีตารางในช่วงนี้แล้ว</div>'));
    wrap.appendChild(card);
    root.appendChild(wrap);
    return;
  }

  // จัดกลุ่มเป็นสัปดาห์ (จันทร์เป็นวันแรก) — 30 วันจะได้สแกนได้ ไม่ใช่เลื่อนยาว 13 จอ
  const weeks = [];
  days.forEach(day => {
    const dt = d(day.date);
    const mon = d(day.date);
    mon.setDate(mon.getDate() - ((dt.getDay() + 6) % 7));
    const key = iso(mon);
    let w = weeks[weeks.length - 1];
    if (!w || w.key !== key) { w = { key, start: key, days: [] }; weeks.push(w); }
    w.days.push(day);
  });

  weeks.forEach((w, wi) => {
    const hours = w.days.reduce((a, x) => a + x.blocks.reduce((b, y) => b + y.hours, 0), 0);
    const nTopics = new Set(w.days.flatMap(x => x.blocks.filter(y => y.kind === "learn").map(y => y.topic))).size;
    const last = w.days[w.days.length - 1].date;
    const open = wi < 2;   // กางสองสัปดาห์แรกไว้ ที่เหลือพับเก็บ

    const head = el('<button class="wk" aria-expanded="' + open + '">' +
      '<span class="wk-c">▾</span>' +
      '<span class="wk-t">' + esc(thaiDate(w.start, false)) + " – " + esc(thaiDate(last, false)) + "</span>" +
      '<span class="wk-m">' + (hours ? Math.round(hours) + " ชม." : "พัก") +
        (nTopics ? " · " + nTopics + " หัวข้อ" : "") + "</span>" +
      "</button>");
    const body = el('<div class="wk-body"></div>');
    body.hidden = !open;

    // สัดส่วนชั่วโมงต่อวิชาในสัปดาห์นี้
    const mixHours = {};
    w.days.forEach(x => x.blocks.forEach(y => {
      mixHours[y.subject] = (mixHours[y.subject] || 0) + y.hours;
    }));
    const mixList = Object.entries(mixHours).sort((a, b) => b[1] - a[1]);
    if (mixList.length) {
      const bar = el('<div class="mix"></div>');
      mixList.forEach(([sc, h]) => {
        const seg = el('<span></span>');
        seg.setAttribute("data-s", sc);
        seg.style.flex = h;
        seg.title = subjLabel(sc) + " " + Math.round(h) + " ชม.";
        bar.appendChild(seg);
      });
      body.appendChild(bar);
      const key = el('<div class="mix-key"></div>');
      mixList.forEach(([sc, h]) => {
        const k = el("<i>" + esc(subjLabel(sc)) + " " + Math.round(h) + " ชม.</i>");
        k.setAttribute("data-s", sc);
        key.appendChild(k);
      });
      body.appendChild(key);
    }
    head.addEventListener("click", () => {
      body.hidden = !body.hidden;
      head.setAttribute("aria-expanded", String(!body.hidden));
    });
    card.appendChild(head);

    const spine = el('<div class="spine" style="padding-top:12px"></div>');
    let lastMonth = "";
    w.days.forEach(day => {
      const dt = d(day.date);
      const monKey = dt.getFullYear() + "-" + dt.getMonth();
      const sd = el('<div class="sday' + (day.date === TODAY ? " today" : "") + '"></div>');
      sd.appendChild(el(
        '<div class="sday-mark">' +
          '<div class="sday-dow">' + DOW[dt.getDay()] + "</div>" +
          '<div class="sday-num">' + dt.getDate() + "</div>" +
          (monKey !== lastMonth ? '<div class="sday-mon">' + MON[dt.getMonth()] + "</div>" : "") +
        "</div>"));
      lastMonth = monKey;

      if (!day.blocks.length) {
        sd.appendChild(el('<div class="tiny" style="padding:3px 0 0">' + esc(day.note || "พัก") + "</div>"));
      } else {
        let prev = null;
        day.blocks.forEach(b => {
          sd.appendChild(blockRow(day.date, b, {
            readonly: day.date !== TODAY,
            showSubject: b.subject !== prev,
          }));
          prev = b.subject;
        });
      }
      DATA.tests.filter(t => t.date === day.date).forEach(t => sd.appendChild(el(
        '<div class="blk" style="cursor:default"><span class="blk-body">' +

  wrap.appendChild(card);

}

function testRow(t) {
  const inDays = daysBetween(TODAY, t.date);
  const key = t.date + "|" + t.kind;
  const done = !!S.tests[key];
  const chipCls = t.kind === "mock" ? "mock" : (t.kind === "monthly" ? "review" : "learn");

  const node = el(

      '<span class="blk-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg></span>' +
      '<span class="blk-body">' +
        '<span class="blk-name">' + esc(t.title) + "</span>" +
        '<span class="blk-meta">' +
          '<span class="chip ' + chipCls + '">' + esc(t.kindLabel) + "</span>" +
          '<span class="blk-sub">' + esc(thaiDate(t.date)) + " · " +
            (inDays === 0 ? "วันนี้" : inDays > 0 ? "อีก " + inDays + " วัน" : "ผ่านมาแล้ว") +
            (t.questions ? " · ~" + t.questions + " ข้อ" : "") +
            (t.minutes ? " " + t.minutes + " นาที" : "") + "</span>" +
        "</span>" +
        (t.note ? '<span class="tiny" style="display:block;margin-top:4px">' + esc(t.note) + "</span>" : "") +
      "</span>" +
    "</div>"
  );
  node.style.cursor = "pointer";
  node.setAttribute("role", "button");
  node.tabIndex = 0;
  const toggle = () => {
    if (S.tests[key]) delete S.tests[key]; else S.tests[key] = true;
    Store.save(); render();
  };
  node.addEventListener("click", toggle);
  node.addEventListener("keydown", ev => {
    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); }
  });
  return node;
}

   ───────────────────────────────────────────────────────────── */
let quiz = null;

function startQuiz(opts) {
  const pool = DATA.questions.filter(q =>
    (!opts.subject || q.subject === opts.subject) && (!opts.topic || q.topic === opts.topic));

  // เรียงลำดับความสำคัญ: ข้อที่เคยตอบผิด -> ยังไม่เคยทำ -> ที่เหลือ
  const rank = q => {
    const r = S.q[q.qid];
    if (!r) return 1;
    return r.ok < r.seen ? 0 : 2;
  };
  const shuffled = pool.slice().sort(() => Math.random() - 0.5).sort((a, b) => rank(a) - rank(b));
  const items = shuffled.slice(0, opts.count || 10);

  quiz = { items, i: 0, answers: new Array(items.length).fill(null), done: false, subject: opts.subject || null };
}

function answerQuiz(choiceIndex) {
  if (!quiz || quiz.answers[quiz.i] !== null) return;
  const q = quiz.items[quiz.i];
  quiz.answers[quiz.i] = choiceIndex;
  const ok = choiceIndex === q.answer;
  const rec = S.q[q.qid] || { seen: 0, ok: 0 };
  rec.seen += 1; if (ok) rec.ok += 1;
  S.q[q.qid] = rec;
  Store.save();
  render();
}

function viewQuiz() {
  const root = $("#v-quiz");
  root.innerHTML = "";
  const wrap = el('<div class="stack"></div>');

  /* ---- picker */
  if (!quiz) {
    const pick = el('<div class="card card-pad stack"></div>');
    pick.appendChild(el('<div class="section-title"><h2>เลือกชุดข้อสอบ</h2></div>'));
    pick.appendChild(el('<p class="muted" style="margin:-8px 0 0">ข้อที่เคยตอบผิดจะถูกดันขึ้นมาถามก่อนเสมอ ' +
      "คลังตอนนี้มี " + DATA.questions.length + " ข้อ</p>"));

    const grid = el('<div class="tiles"></div>');
    Object.entries(SUBJ).forEach(([code, s]) => {
      const n = DATA.questions.filter(q => q.subject === code).length;
      if (!n) return;
      let seen = 0, ok = 0;
      DATA.questions.filter(q => q.subject === code).forEach(q => {
        const r = S.q[q.qid]; if (r) { seen += r.seen; ok += r.ok; }
      });
      const acc = seen ? Math.round(100 * ok / seen) : null;
      const b = el(
        '<button class="tile" data-s="' + esc(code) + '" ' +
          'style="cursor:pointer;text-align:left;border-left:3px solid var(--sc)">' +
          '<div class="tile-n">' + n + '<span style="font-size:13px;color:var(--text-3)"> ข้อ</span></div>' +
          '<div class="tile-l">' + esc(s.name) + "</div>" +
          '<div class="tiny" style="margin-top:3px">' + (acc === null ? "ยังไม่เคยทำ" : "เคยถูก " + acc + "%") + "</div>" +
        "</button>"
      );
      b.addEventListener("click", () => { startQuiz({ subject: code, count: Math.min(10, n) }); render(); });
      grid.appendChild(b);
    });
    pick.appendChild(grid);

    const all = el('<button class="btn btn-pri">สุ่มทุกวิชา 15 ข้อ</button>');
    all.addEventListener("click", () => { startQuiz({ count: 15 }); render(); });
    pick.appendChild(all);
    wrap.appendChild(pick);

    /* history */
    if (S.runs.length) {
      const h = el('<div class="card card-pad"></div>');
      h.appendChild(el('<div class="section-title"><h2>ผลย้อนหลัง</h2></div>'));
      S.runs.slice(-8).reverse().forEach(r => h.appendChild(el(
        '<div style="display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line-soft)">' +
          '<span class="num" style="font-size:14px;min-width:52px;color:' +
            (r.pct >= 80 ? "var(--ok)" : r.pct >= 60 ? "var(--warn)" : "var(--brick)") + '">' + r.pct + "%</span>" +
          "<span style=\"font-size:13.5px\">" + esc(r.subject || "รวมทุกวิชา") + "</span>" +
          '<span class="tiny" style="margin-left:auto">' + r.correct + "/" + r.total + " · " + esc(thaiDate(r.date)) + "</span>" +
        "</div>"
      )));
      wrap.appendChild(h);
    }

    root.appendChild(wrap);
    return;
  }

  /* ---- results */
  if (quiz.done) {
    const correct = quiz.items.filter((q, i) => quiz.answers[i] === q.answer).length;
    const pct = Math.round(100 * correct / quiz.items.length);
    const verdict = pct >= 80 ? "แม่นแล้ว" : pct >= 60 ? "ผ่านเกณฑ์ แต่ยังมีจุดรั่ว" : "ต้องกลับไปทบทวน";

    const res = el('<div class="card card-pad stack"></div>');
    res.appendChild(el(
      '<div><div class="eyebrow">ผลการทำชุดนี้</div>' +
      '<div class="tile-n" style="font-size:42px;color:' +
        (pct >= 80 ? "var(--ok)" : pct >= 60 ? "var(--warn)" : "var(--brick)") + '">' + pct + "%</div>" +
      '<div class="muted">ถูก ' + correct + " จาก " + quiz.items.length + " ข้อ — " + verdict + "</div></div>"
    ));

    const wrong = quiz.items.filter((q, i) => quiz.answers[i] !== q.answer);
    if (wrong.length) {
      res.appendChild(el('<hr class="rule">'));
      res.appendChild(el('<div class="section-title"><h2>ข้อที่ยังพลาด</h2></div>'));
      wrong.forEach(q => {
        const t = TOPIC_OF.get(q.topic);
        res.appendChild(el(
          '<div style="padding:9px 0;border-bottom:1px solid var(--line-soft)">' +
            '<div style="font-size:13.5px;line-height:1.65">' + esc(q.stem) + "</div>" +
            '<div style="font-size:13.5px;margin-top:5px"><b>เฉลย:</b> ' +
              esc(CHOICE_LETTERS[q.answer] + ". " + q.choices[q.answer]) + "</div>" +
            (t ? '<div class="tiny" style="margin-top:3px">หัวข้อ: ' + esc(t.name) + "</div>" : "") +
          "</div>"
        ));
      });
    }

    const row = el('<div class="btn-row"></div>');
    const again = el('<button class="btn btn-pri">ทำชุดใหม่</button>');
    again.addEventListener("click", () => { quiz = null; render(); });
    row.appendChild(again);
    if (wrong.length) {
      const retry = el('<button class="btn">ทำเฉพาะข้อที่ผิด (' + wrong.length + ")</button>");
      retry.addEventListener("click", () => {
        quiz = { items: wrong, i: 0, answers: new Array(wrong.length).fill(null), done: false, subject: quiz.subject };
        render();
      });
      row.appendChild(retry);
    }
    res.appendChild(row);
    wrap.appendChild(res);
    root.appendChild(wrap);
    return;
  }

  /* ---- runner */
  const q = quiz.items[quiz.i];
  const given = quiz.answers[quiz.i];
  const answered = given !== null;
  const subj = SUBJ[q.subject];
  const topic = TOPIC_OF.get(q.topic);

  const pips = el('<div class="q-progress"></div>');
  quiz.items.forEach((it, i) => {
    const a = quiz.answers[i];
    const cls = i === quiz.i ? "now" : a === null ? "" : (a === it.answer ? "ok" : "bad");
    pips.appendChild(el('<span class="q-pip ' + cls + '"></span>'));
  });

  const card = el('<div class="card"></div>');
  card.appendChild(el(
    '<div class="card-hd">' +
      '<h2 class="num" style="font-size:14px">ข้อ ' + (quiz.i + 1) + " / " + quiz.items.length + "</h2>" +
      '<span class="spacer chip subj" data-s="' + esc(q.subject) + '">' +
        esc(subjLabel(q.subject)) + "</span>" +
    "</div>"
  ));

  const body = el('<div class="card-pad"></div>');
  body.appendChild(pips);
  body.appendChild(el('<p class="q-stem">' + esc(q.stem) + "</p>"));

  q.choices.forEach((c, i) => {
    let cls = "", bub = "bub";
    if (answered) {
      if (i === q.answer) { cls = "is-ok"; bub += " ok"; }
      else if (i === given) { cls = "is-bad"; bub += " bad"; }
    }
    const b = el(
      '<button class="q-choice ' + cls + '">' +
        '<span class="' + bub + '">' + CHOICE_LETTERS[i] + "</span>" +
        '<span class="q-choice-t">' + esc(c) + "</span>" +
      "</button>"
    );
    if (answered) b.disabled = true;
    else b.addEventListener("click", () => answerQuiz(i));
    body.appendChild(b);
  });

  if (answered) {
    if (q.explanation) body.appendChild(el('<div class="q-explain">' + esc(q.explanation) + "</div>"));
    if (topic) body.appendChild(el('<p class="tiny" style="margin:8px 0 0">หัวข้อ: ' + esc(topic.name) + "</p>"));

    const nav = el('<div class="btn-row" style="margin-top:14px"></div>');
    const last = quiz.i === quiz.items.length - 1;
    const next = el('<button class="btn btn-pri">' + (last ? "ดูผลรวม" : "ข้อถัดไป") + "</button>");
    next.addEventListener("click", () => {
      if (last) {
        const correct = quiz.items.filter((it, i) => quiz.answers[i] === it.answer).length;
        S.runs.push({
          date: TODAY, subject: quiz.subject ? subjLabel(quiz.subject) : null,
          total: quiz.items.length, correct, pct: Math.round(100 * correct / quiz.items.length),
        });
        Store.save();
        quiz.done = true;
      } else quiz.i += 1;
      render();
    });
    nav.appendChild(next);
    const quit = el('<button class="btn">ออก</button>');
    quit.addEventListener("click", () => { quiz = null; render(); });
    nav.appendChild(quit);
    body.appendChild(nav);
  }

  card.appendChild(body);
  wrap.appendChild(card);
  root.appendChild(wrap);
}

  const row = el('<div class="btn-row"></div>');

  const backup = el('<button class="btn btn-sm">สำรองข้อมูล</button>');

      { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "tcas70-progress-" + TODAY + ".json";
    // ต้องอยู่ใน DOM จริงก่อน ไม่งั้นบางเบราว์เซอร์เมิน click()
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  row.appendChild(backup);

  const restore = el('<button class="btn btn-sm">กู้คืนจากไฟล์</button>');
  const picker = el('<input type="file" accept="application/json,.json" style="display:none">');
  restore.addEventListener("click", () => picker.click());
  picker.addEventListener("change", ev => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (e) { alert("อ่านไฟล์ไม่ได้ — ไฟล์นี้ไม่ใช่ JSON ที่ถูกต้อง"); return; }
      const dd = parsed && parsed.data;
      const looksOurs = dd && typeof dd === "object" && dd.q &&
                        (dd.topics || dd.done);   // dd.done = ไฟล์สำรองรุ่นเก่า
      if (!looksOurs) {
        alert("ไฟล์นี้ไม่ใช่ไฟล์สำรองของ TCAS70 — เลือกไฟล์ที่ได้จากปุ่ม สำรองข้อมูล");

      if (!confirm("ทับความคืบหน้าปัจจุบันด้วยไฟล์นี้? (ของเดิมจะหาย)")) return;

      S.q = dd.q || {}; S.tests = dd.tests || {}; S.runs = dd.runs || [];
      S.topics = dd.topics || {}; S.log = dd.log || {}; S.days = dd.days || {};
      S.links = dd.links || {}; S.settings = dd.settings || {};

      if (!dd.topics && dd.done) {
        // ไฟล์สำรองรุ่นเก่าเก็บเป็น "วันที่|หัวข้อ" — แปลงเป็นชั่วโมงต่อหัวข้อ
        const hoursOf = new Map();
        for (const day of DATA.plan)
          for (const b of day.blocks)
            if (b.kind === "learn") hoursOf.set(day.date + "|" + b.topic, b.hours);
        for (const key of Object.keys(dd.done)) {
          const [, topic] = key.split("|");
          const h = hoursOf.get(key) || 0;
          if (!topic || !h) continue;
          const rec = S.topics[topic] || { hoursDone: 0 };
          rec.hoursDone = (rec.hoursDone || 0) + h;
          S.topics[topic] = rec;
        }
      }
      S.migrated = true;
      Store.save(); quiz = null; render();
      alert("กู้คืนเรียบร้อย");
    };
    reader.readAsText(file);
    ev.target.value = "";
  });
  row.appendChild(restore);
  row.appendChild(picker);

  const rb = el('<button class="btn btn-sm">ล้างทั้งหมด</button>');
  rb.addEventListener("click", () => {
    if (!confirm("ล้างบล็อกที่เช็คไว้ ผลข้อสอบ และประวัติทั้งหมด?")) return;
    S.topics = {}; S.log = {}; S.days = {};
    S.q = {}; S.tests = {}; S.runs = [];
    // ลิงก์ที่บันทึกเองกับค่าที่ตั้งไว้ไม่ใช่ "ความคืบหน้า" จึงไม่ล้างไปด้วย
    Store.save(); quiz = null; render();
  });
  row.appendChild(rb);
  rc.appendChild(row);
  wrap.appendChild(rc);

  root.appendChild(wrap);
}

const DOW_TH = { mon: "จันทร์", tue: "อังคาร", wed: "พุธ", thu: "พฤหัสบดี",
                 fri: "ศุกร์", sat: "เสาร์", sun: "อาทิตย์" };

function saveSetting(patch) {
  S.settings = Object.assign({}, S.settings, patch);
  Store.save();
  location.reload();   // ST ถูกคำนวณตอนโหลด — โหลดใหม่ให้ตารางคิดจากค่าใหม่ทั้งหมด
}

function viewSettings() {
  const root = $("#v-settings");
  root.innerHTML = "";
  const wrap = el('<div class="stack"></div>');

  /* ---- ชื่อ */
  const nameCard = el('<div class="card card-pad"></div>');
  nameCard.appendChild(el('<div class="section-title"><h2>ชื่อที่แสดง</h2></div>'));
  const nameIn = el('<input type="text" maxlength="24" value="' + esc(studentName()) + '">');
  nameIn.addEventListener("change", () => saveSetting({ name: nameIn.value.trim() }));
  nameCard.appendChild(nameIn);
  wrap.appendChild(nameCard);

  /* ---- เวลาว่างรายวัน */
  const hCard = el('<div class="card card-pad"></div>');
  hCard.appendChild(el('<div class="section-title"><h2>เวลาว่างต่อวัน</h2></div>'));
  hCard.appendChild(el('<p class="tiny" style="margin:-6px 0 6px">ตารางทั้งหมดคำนวณจากตรงนี้ ' +
    'แก้แล้วแผนจะจัดใหม่ทันที — ใส่เท่าที่ทำได้จริง ไม่ใช่เท่าที่อยากให้เป็น</p>'));

  ["mon","tue","wed","thu","fri","sat","sun"].forEach(k => {
    const row = el('<div class="field"><span class="field-l">' + DOW_TH[k] + "</span></div>");
    const inp = el('<input class="hours-in" type="number" min="0" max="16" step="0.5" value="' +
      (ST.hoursByWeekday[k] || 0) + '">');
    inp.addEventListener("change", () => {
      const v = Math.max(0, Math.min(16, Number(inp.value) || 0));
      saveSetting({ hoursByWeekday: Object.assign({}, S.settings.hoursByWeekday, { [k]: v }) });
    });
    row.appendChild(inp);
    row.appendChild(el('<span class="tiny" style="width:26px">ชม.</span>'));
    hCard.appendChild(row);
  });

  const weekly = ["mon","tue","wed","thu","fri","sat","sun"]
    .reduce((a, k) => a + Number(ST.hoursByWeekday[k] || 0), 0);
  hCard.appendChild(el('<div class="week-total">รวมสัปดาห์ละ <b>' + weekly +
    "</b> ชม. · เดือนละราว <b>" + Math.round(weekly * 4.3) + "</b> ชม.</div>"));
  wrap.appendChild(hCard);

  /* ---- วันหยุด */
  const offCard = el('<div class="card card-pad stack"></div>');
  offCard.appendChild(el('<div class="section-title"><h2>วันหยุดเต็มวัน</h2></div>'));
  offCard.appendChild(el('<p class="tiny" style="margin:-8px 0 0">วันที่ใส่ไว้จะไม่ถูกจัดตาราง ' +
    "งานจะถูกกระจายไปวันอื่นให้เอง</p>"));

  const list = el('<div class="stack" style="gap:6px"></div>');
  (ST.daysOff || []).slice().sort().forEach(dt => {
    const row = el('<div class="field"><span class="field-l num">' + esc(thaiDate(dt)) + "</span></div>");
    const rm = el('<button class="btn btn-sm">ลบ</button>');
    rm.addEventListener("click", () =>
      saveSetting({ daysOff: ST.daysOff.filter(x => x !== dt) }));
    row.appendChild(rm);
    list.appendChild(row);
  });
  if (!(ST.daysOff || []).length)
    list.appendChild(el('<p class="tiny" style="margin:0">ยังไม่ได้ตั้งวันหยุด</p>'));
  offCard.appendChild(list);

  const addRow = el('<div class="btn-row"></div>');
  const dateIn = el('<input class="hours-in" type="date" style="width:auto;font-size:13px">');
  const addBtn = el('<button class="btn btn-sm">เพิ่มวันหยุด</button>');
  addBtn.addEventListener("click", () => {
    const v = dateIn.value;
    if (!v) return;
    if ((ST.daysOff || []).includes(v)) return;
    saveSetting({ daysOff: (ST.daysOff || []).concat(v).sort() });
  });
  addRow.appendChild(dateIn); addRow.appendChild(addBtn);
  offCard.appendChild(addRow);
  wrap.appendChild(offCard);

  /* ---- ผลกระทบต่อแผน */
  const look = outlook().filter(o => o.need > 0);
  if (look.length) {
    const im = el('<div class="card card-pad"></div>');
    im.appendChild(el('<div class="section-title"><h2>ผลต่อแผน</h2></div>'));
    look.forEach(o => im.appendChild(el(
      '<div style="display:flex;gap:10px;align-items:baseline;padding:5px 0;' +
        'border-bottom:1px solid var(--line-soft)">' +
        '<span style="font-size:13.5px;flex:1">' + esc(o.name) + "</span>" +
        '<span class="num" style="font-size:13px;color:' +
          (o.status === "over" ? "var(--brick)" : o.status === "tight" ? "var(--marigold)" : "var(--ok)") +
        '">' + Math.round(o.need) + " / " + Math.round(o.avail) + " ชม.</span>" +
      "</div>")));
    im.appendChild(el('<p class="tiny" style="margin:8px 0 0">ต้องอ่าน / เวลาว่างที่มี — ' +
      "ถ้าตัวซ้ายมากกว่าตัวขวา แปลว่าเวลาไม่พอ</p>"));
    wrap.appendChild(im);
  }

  /* ---- คืนค่าเริ่มต้น */
  const rst = el('<div class="card card-pad stack"></div>');
  rst.appendChild(el('<p class="tiny" style="margin:0">ค่าที่ตั้งที่นี่เก็บในเครื่องนี้เท่านั้น ' +
    "และทับค่าที่มากับตัวแอป</p>"));
  const rb = el('<button class="btn btn-sm">คืนค่าเริ่มต้น</button>');
  rb.addEventListener("click", () => {
    if (!confirm("คืนค่าเวลาว่างและวันหยุดกลับเป็นค่าเริ่มต้น?")) return;
    S.settings = {}; Store.save(); location.reload();
  });
  rst.appendChild(rb);
  wrap.appendChild(rst);

  root.appendChild(wrap);
}

let current = "today";
const VIEWS = { today: viewToday, plan: viewPlan, tests: viewTests,
                quiz: viewQuiz, progress: viewProgress, settings: viewSettings };

function go(name) {
  current = name;
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", t.dataset.view === name ? "true" : "false"));
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  $("#v-" + name).classList.add("on");
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

document.querySelectorAll(".tab").forEach(t =>
  t.addEventListener("click", () => go(t.dataset.view)));
$("#gearBtn").addEventListener("click", () => go(current === "settings" ? "today" : "settings"));

function syncStickyOffset() {
  const bar = document.querySelector(".topbar");
  const tabs = document.querySelector(".tabs");
  let top = bar ? bar.getBoundingClientRect().height : 58;
  // บนจอกว้าง แท็บเป็น sticky ต่อจากแถบบน จึงต้องบวกความสูงแท็บด้วย
  if (tabs && getComputedStyle(tabs).position === "sticky")
    top += tabs.getBoundingClientRect().height;
  document.documentElement.style.setProperty("--stick", Math.round(top) + "px");
}

function render() {
  renderTop();
  VIEWS[current]();
  syncStickyOffset();
}
