<title>TCAS70 — ตารางเตรียมสอบแพทย์</title>

<style>
/* ═══════════════════════════════════════════════════════════════
   TOKENS
   ═══════════════════════════════════════════════════════════════ */
:root {
  --ink:        #101826;
  --paper:      #eef0f3;
  --surface:    #ffffff;
  --surface-2:  #f6f7f9;
  --line:       #d8dde5;
  --line-soft:  #e6eaef;
  --text:       #101826;
  --text-2:     #4a5566;
  --text-3:     #78838f;

  --indigo:     #2b4c8c;
  --indigo-dim: #dde4f0;
  --marigold:   #b8801d;
  --marigold-f: #e0a02b;
  --brick:      #b04a38;
  --brick-dim:  #f6e3df;
  --ok:         #2e7a56;
  --ok-dim:     #dcece4;
  --warn:       #9a6714;
  --warn-dim:   #f6ecd8;

  --sans: "Sarabun", "Noto Sans Thai", "IBM Plex Sans Thai", "Leelawadee UI",
          "Thonburi", "Krungthep", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo,
          Consolas, monospace;

  --r: 3px;
  --shadow: 0 1px 2px rgba(16, 24, 38, .06), 0 4px 16px rgba(16, 24, 38, .05);
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:      #0c121c;
    --surface:    #141c2a;
    --surface-2:  #1a2333;
    --line:       #2a3547;
    --line-soft:  #212b3c;
    --text:       #e6eaf0;
    --text-2:     #a2adbd;
    --text-3:     #788495;

    --indigo:     #7fa3e0;
    --indigo-dim: #1c2942;
    --marigold:   #e0a02b;
    --marigold-f: #e0a02b;
    --brick:      #e08573;
    --brick-dim:  #35201d;
    --ok:         #6dc39a;
    --ok-dim:     #172b23;
    --warn:       #d9a94a;
    --warn-dim:   #2b2416;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  }
}

:root[data-theme="dark"] {
  --paper:      #0c121c;
  --surface:    #141c2a;
  --surface-2:  #1a2333;
  --line:       #2a3547;
  --line-soft:  #212b3c;
  --text:       #e6eaf0;
  --text-2:     #a2adbd;
  --text-3:     #788495;
  --indigo:     #7fa3e0;
  --indigo-dim: #1c2942;
  --marigold:   #e0a02b;
  --marigold-f: #e0a02b;
  --brick:      #e08573;
  --brick-dim:  #35201d;
  --ok:         #6dc39a;
  --ok-dim:     #172b23;
  --warn:       #d9a94a;
  --warn-dim:   #2b2416;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
}

:root[data-theme="light"] {
  --paper:      #eef0f3;
  --surface:    #ffffff;
  --surface-2:  #f6f7f9;
  --line:       #d8dde5;
  --line-soft:  #e6eaef;
  --text:       #101826;
  --text-2:     #4a5566;
  --text-3:     #78838f;
  --indigo:     #2b4c8c;
  --indigo-dim: #dde4f0;
  --marigold:   #b8801d;
  --marigold-f: #e0a02b;
  --brick:      #b04a38;
  --brick-dim:  #f6e3df;
  --ok:         #2e7a56;
  --ok-dim:     #dcece4;
  --warn:       #9a6714;
  --warn-dim:   #f6ecd8;
  --shadow: 0 1px 2px rgba(16, 24, 38, .06), 0 4px 16px rgba(16, 24, 38, .05);
}

/* ═══════════════════════════════════════════════════════════════
   BASE
   ═══════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  /* Thai vowel marks sit above and below — tight leading clips them */
  line-height: 1.75;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
  /* clear the fixed bottom tab bar (~62px) plus the home indicator on iOS */
  padding-bottom: calc(78px + env(safe-area-inset-bottom, 0px));
}

@media (min-width: 720px) { body { padding-bottom: 0; } }

h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; line-height: 1.45; }

button { font-family: inherit; font-size: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--marigold-f);
  outline-offset: 2px;
  border-radius: var(--r);
}

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

.eyebrow {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .11em;
  text-transform: uppercase;
  color: var(--text-3);
  line-height: 1.5;
}

.shell { max-width: 940px; margin: 0 auto; padding: 0 16px; }

/* ═══════════════════════════════════════════════════════════════
   COUNTDOWN BAR — the one thing that is always true
   ═══════════════════════════════════════════════════════════════ */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--ink);
  color: #e6eaf0;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.topbar-in {
  max-width: 940px; margin: 0 auto; padding: 12px 16px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}

.brand { display: flex; flex-direction: column; gap: 1px; margin-right: auto; }
.brand-name { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
.brand-sub { font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: #8f9bb0; }

.cd { display: flex; align-items: baseline; gap: 7px; }
.cd-n { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 600; line-height: 1; color: var(--marigold-f); letter-spacing: -.03em; }
.cd-meta { display: flex; flex-direction: column; line-height: 1.3; }
.cd-unit { font-size: 12px; color: #b9c2d0; }
.cd-what { font-size: 11px; color: #8f9bb0; max-width: 190px; }

.streak{display:flex;align-items:baseline;gap:5px;padding:4px 10px;border-radius:99px;
  background:rgba(224,160,43,.14);border:1px solid rgba(224,160,43,.35)}
/* display:flex ชนะ [hidden] ของเบราว์เซอร์ ต้องประกาศทับเอง */
.streak[hidden]{display:none}
.streak-n{font-size:16px;font-weight:600;color:var(--marigold-f);line-height:1}
.streak-l{font-size:11px;color:#b9c2d0}

/* ═══════════════════════════════════════════════════════════════
   ON-TRACK STATUS
   ═══════════════════════════════════════════════════════════════ */
.status{border:1px solid var(--line);border-left-width:4px;border-radius:var(--r);
  padding:12px 14px;background:var(--surface)}
.status.ok{border-left-color:var(--ok);background:var(--ok-dim)}
.status.tight{border-left-color:var(--warn-f,var(--marigold-f));background:var(--warn-dim)}
.status.over{border-left-color:var(--brick);background:var(--brick-dim)}
.status-hd{display:flex;align-items:baseline;gap:8px;font-size:14.5px}
.status-hd .spacer{margin-left:auto;font-size:13px;color:var(--text-2)}
.status-dot{width:9px;height:9px;border-radius:50%;flex:none;align-self:center}
.status.ok .status-dot{background:var(--ok)}
.status.tight .status-dot{background:var(--marigold-f)}
.status.over .status-dot{background:var(--brick)}

/* ═══════════════════════════════════════════════════════════════
   DAY COMPLETE + TOAST
   ═══════════════════════════════════════════════════════════════ */
.done-hero{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:26px 16px;text-align:center}
.done-hero b{font-size:17px}
.done-mark{width:46px;height:46px;border-radius:50%;background:var(--ok);color:var(--surface);
  display:grid;place-items:center;margin-bottom:3px}
.done-mark svg{width:24px;height:24px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:70;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  background:var(--ink);color:#f0f2f6;padding:10px 18px;border-radius:99px;
  box-shadow:0 6px 24px rgba(0,0,0,.28);animation:toastIn .22s ease-out}
.toast-big-t{font-size:14px;font-weight:600}
.toast-sub{font-size:11.5px;color:#a9b3c2}
.toast.toast-big{background:var(--ok);color:#fff;padding:13px 24px;border-radius:14px}
.toast.toast-big .toast-sub{color:rgba(255,255,255,.85)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(7px)}
                   to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media (min-width:720px){.toast{bottom:26px}}

/* ═══════════════════════════════════════════════════════════════
   TABS
   ═══════════════════════════════════════════════════════════════ */
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  padding: 9px 2px 11px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--text-3);
  border-top: 2px solid transparent;
  margin-top: -1px;
  transition: color .15s;
}
.tab-ico { width: 19px; height: 19px; display: block; }
.tab-label { font-size: 10.5px; line-height: 1.2; }
.tab[aria-selected="true"] { color: var(--text); border-top-color: var(--marigold-f); }
.tab:hover { color: var(--text-2); }

@media (min-width: 720px) {
  .tabs {
    position: sticky; top: 57px; bottom: auto;
    max-width: 940px; margin: 0 auto;
    grid-template-columns: repeat(5, auto);
    justify-content: start; gap: 2px;
    background: var(--paper); border-top: 0;
    border-bottom: 1px solid var(--line);
    padding: 0;
  }
  .tab {
    flex-direction: row; gap: 7px; padding: 12px 15px;
    border-top: 0; border-bottom: 2px solid transparent; margin-top: 0;
  }
  .tab[aria-selected="true"] { border-bottom-color: var(--marigold-f); }
  .tab-label { font-size: 13px; }
}

/* ═══════════════════════════════════════════════════════════════
   CARDS / PANELS
   ═══════════════════════════════════════════════════════════════ */
main { padding-top: 20px; }
.view { display: none; }
.view.on { display: block; }

.stack { display: flex; flex-direction: column; gap: 14px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
}
.card-pad { padding: 15px 16px; }

.card-hd {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 13px 16px;
  border-bottom: 1px solid var(--line-soft);
}
.card-hd h2 { font-size: 15px; }
.card-hd .spacer { margin-left: auto; }

.section-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; }
.section-title h2 { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; font-family: var(--mono); font-weight: 600; color: var(--text-2); }

/* ═══════════════════════════════════════════════════════════════
   OMR BUBBLE — the motif. Every Thai student knows this grid.
   ═══════════════════════════════════════════════════════════════ */
.bub {
  flex: none;
  width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid var(--line);
  display: grid; place-items: center;
  font-size: 12.5px; font-weight: 600;
  color: var(--text-3);
  background: var(--surface);
  transition: background .12s, border-color .12s, color .12s;
}
.bub.fill { background: var(--marigold-f); border-color: var(--marigold-f); color: #2a1e06; }
.bub.ok   { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.bub.bad  { background: var(--brick); border-color: var(--brick); color: var(--surface); }

/* tiny bubbles used as progress dots */
.dots { display: flex; flex-wrap: wrap; gap: 3px; }
.dot {
  width: 9px; height: 9px; border-radius: 50%;
  border: 1.25px solid var(--line);
  background: transparent;
}
.dot.on { background: var(--marigold-f); border-color: var(--marigold-f); }

/* ═══════════════════════════════════════════════════════════════
   DATE SPINE — dates are a real sequence, so a spine is honest
   ═══════════════════════════════════════════════════════════════ */
/* geometry: date column sits at 0-40px, the rule at 48px, blocks from 62px —
   the column and the rule must not overlap or the dates get struck through */
.spine { position: relative; padding-left: 62px; }
.spine::before {
  content: ""; position: absolute; left: 48px; top: 6px; bottom: 6px;
  width: 1px; background: var(--line);
}

.sday { position: relative; padding-bottom: 18px; }
.sday-mark {
  position: absolute; left: -62px; top: 1px;
  width: 40px; text-align: right;
}
.sday-dow { font-size: 10.5px; color: var(--text-3); line-height: 1.3; }
.sday-num {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 17px; font-weight: 600; line-height: 1.15; color: var(--text-2);
  letter-spacing: -.03em;
}
.sday-mon { font-size: 10px; color: var(--text-3); line-height: 1.3; }

.sday.today .sday-num { color: var(--marigold); }
.sday.today::after {
  content: ""; position: absolute; left: -19px; top: 9px;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--marigold-f);
  box-shadow: 0 0 0 3px var(--surface);
}
.sday.past { opacity: .5; }

/* ═══════════════════════════════════════════════════════════════
   BLOCK ROWS
   ═══════════════════════════════════════════════════════════════ */
.blk {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 10px 12px;
  border: 1px solid var(--line-soft);
  border-left: 3px solid var(--indigo);
  border-radius: var(--r);
  background: var(--surface);
  margin-bottom: 7px;
  cursor: pointer;
  text-align: left; width: 100%;
  transition: border-color .12s, background .12s;
}
.blk:hover { border-color: var(--line); }
.blk.review { border-left-color: var(--marigold-f); }
.blk.done { opacity: .52; }
.blk.done .blk-name { text-decoration: line-through; text-decoration-thickness: 1px; }

.blk-check {
  flex: none; width: 20px; height: 20px; margin-top: 2px;
  border: 1.5px solid var(--line); border-radius: 50%;
  display: grid; place-items: center;
  background: var(--surface);
}
.blk.done .blk-check { background: var(--ok); border-color: var(--ok); }
.blk-check svg { width: 11px; height: 11px; opacity: 0; color: var(--surface); }
.blk.done .blk-check svg { opacity: 1; }

.blk-body { min-width: 0; flex: 1; }
.blk-name { font-size: 14px; line-height: 1.5; }
.blk-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em;
  padding: 1px 6px; border-radius: 2px;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--line-soft);
  white-space: nowrap;
}
.chip.learn   { background: var(--indigo-dim);   color: var(--indigo);   border-color: transparent; }
.chip.review  { background: var(--warn-dim);     color: var(--warn);     border-color: transparent; }
.chip.mock    { background: var(--brick-dim);    color: var(--brick);    border-color: transparent; }
.chip.ok      { background: var(--ok-dim);       color: var(--ok);       border-color: transparent; }

/* ═══════════════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════════════ */
.btn {
  appearance: none; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--r); padding: 9px 15px;
  font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); }
.btn-pri {
  background: var(--ink); color: #f0f2f6; border-color: var(--ink);
}
.btn-pri:hover { background: #1c2942; border-color: #1c2942; }
:root[data-theme="dark"] .btn-pri { background: var(--marigold-f); color: #2a1e06; border-color: var(--marigold-f); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .btn-pri { background: var(--marigold-f); color: #2a1e06; border-color: var(--marigold-f); }
}
.btn-sm { padding: 5px 11px; font-size: 12.5px; font-weight: 500; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ═══════════════════════════════════════════════════════════════
   STAT TILES
   ═══════════════════════════════════════════════════════════════ */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 10px; }
.tile {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 12px 13px;
}
.tile-n { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 25px; font-weight: 600; line-height: 1.15; letter-spacing: -.03em; }
.tile-l { font-size: 12px; color: var(--text-2); margin-top: 1px; }

/* ═══════════════════════════════════════════════════════════════
   QUIZ
   ═══════════════════════════════════════════════════════════════ */
.q-stem { font-size: 16px; line-height: 1.75; margin: 0 0 14px; }
.q-choice {
  display: flex; align-items: flex-start; gap: 11px; width: 100%;
  padding: 9px 12px; margin-bottom: 7px;
  border: 1px solid var(--line-soft); border-radius: var(--r);
  background: var(--surface); cursor: pointer; text-align: left;
  transition: border-color .12s, background .12s;
}
.q-choice:hover:not(:disabled) { border-color: var(--indigo); }
.q-choice:disabled { cursor: default; }
.q-choice.is-ok  { border-color: var(--ok);    background: var(--ok-dim); }
.q-choice.is-bad { border-color: var(--brick); background: var(--brick-dim); }
.q-choice-t { flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.6; padding-top: 2px; }

.q-explain {
  border-left: 3px solid var(--indigo);
  background: var(--surface-2);
  padding: 11px 13px; border-radius: 0 var(--r) var(--r) 0;
  font-size: 13.5px; line-height: 1.7; color: var(--text-2);
  margin-top: 10px;
}

.q-progress { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 3px; }
.q-pip { width: 100%; max-width: 26px; height: 4px; border-radius: 2px; background: var(--line); flex: 1; }
.q-pip.ok { background: var(--ok); }
.q-pip.bad { background: var(--brick); }
.q-pip.now { background: var(--marigold-f); }

/* ═══════════════════════════════════════════════════════════════
   SUBJECT PROGRESS ROWS
   ═══════════════════════════════════════════════════════════════ */
.srow { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
.srow:last-child { border-bottom: 0; }
.srow-hd { display: flex; align-items: baseline; gap: 9px; margin-bottom: 7px; }
.srow-name { font-size: 14px; font-weight: 600; }
.srow-pct { margin-left: auto; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text-2); }

/* ═══════════════════════════════════════════════════════════════
   MISC
   ═══════════════════════════════════════════════════════════════ */
.muted { color: var(--text-2); font-size: 13.5px; }
.tiny  { color: var(--text-3); font-size: 12px; line-height: 1.6; }

.note {
  border: 1px solid var(--warn);
  border-left-width: 3px;
  background: var(--warn-dim);
  color: var(--text);
  padding: 11px 13px; border-radius: var(--r);
  font-size: 13px; line-height: 1.7;
}

.empty { padding: 26px 16px; text-align: center; color: var(--text-3); font-size: 13.5px; }

.scroll-x { overflow-x: auto; }

select.sel {
  font-family: inherit; font-size: 13px; color: var(--text);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 6px 9px;
}

hr.rule { border: 0; border-top: 1px solid var(--line-soft); margin: 0; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="brand-name" id="brandName">TCAS70 · เตรียมสอบแพทย์</span>
      <span class="brand-sub">กสพท · รอบ 3 Admission</span>
    </div>
    <div class="cd">
      <span class="cd-n num" id="cdNum">—</span>
      <span class="cd-meta">
        <span class="cd-unit" id="cdUnit">วัน</span>
        <span class="cd-what" id="cdWhat">—</span>
      </span>
    </div>
    <div class="streak" id="streakBox" hidden>
      <span class="streak-n num" id="streakN">0</span>
      <span class="streak-l">วันติด</span>
    </div>

<script>
const DATA = /*__TCAS_DATA__*/null;

/* ─────────────────────────────────────────────────────────────
   storage — sandboxed frames can refuse localStorage, so never
   let a throw take the page down; fall back to memory for the session
   ───────────────────────────────────────────────────────────── */
const Store = (() => {
  const KEY = "tcas70.v1";
  let mem = null, usable = true;
  try {
    const probe = "__t";
    localStorage.setItem(probe, "1");
    localStorage.removeItem(probe);
  } catch (e) { usable = false; }

  function read() {
    if (mem) return mem;
    if (usable) {
      try { mem = JSON.parse(localStorage.getItem(KEY) || "{}"); }
      catch (e) { mem = {}; }
    } else mem = {};

    // topicCode -> {hoursDone, learnedOn, rep, ease, next}
    // ความคืบหน้าผูกกับ "หัวข้อ" ไม่ใช่ "วันที่" — ข้ามวันแล้วงานจึงไม่หาย
    if (!mem.topics) mem.topics = {};
    if (!mem.q) mem.q = {};              // qid -> {seen, ok}
    if (!mem.tests) mem.tests = {};      // "YYYY-MM-DD|kind" -> true
    if (!mem.runs) mem.runs = [];        // quiz history
    if (!mem.days) mem.days = {};        // "YYYY-MM-DD" -> ชั่วโมงที่ทำวันนั้น (ใช้นับ streak)
    if (!mem.log) mem.log = {};          // "YYYY-MM-DD" -> [{topic,kind,hours,rep}] ที่ทำเสร็จวันนั้น
    return mem;
  }
  function save() {
    if (!usable) return;
    try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { usable = false; }
  }
  return { read, save, get persistent() { return usable; } };
})();

const S = Store.read();

/* ย้ายข้อมูลจากรูปแบบเดิม (v1) ที่เก็บเป็น "วันที่|หัวข้อ" มาเป็นชั่วโมงต่อหัวข้อ
   ทำครั้งเดียวแล้วทิ้งของเดิม — ผู้ใช้เดิมจึงไม่เสียความคืบหน้าที่เคยติ๊กไว้ */
(function migrateFromDateKeyedProgress() {
  if (!S.done || S.migrated) return;
  const hoursOf = new Map();
  for (const day of DATA.plan)
    for (const b of day.blocks)
      if (b.kind === "learn") hoursOf.set(day.date + "|" + b.topic, b.hours);

  for (const key of Object.keys(S.done)) {
    const [, topic] = key.split("|");
    const h = hoursOf.get(key) || 0;
    if (!topic || !h) continue;
    const rec = S.topics[topic] || { hoursDone: 0 };
    rec.hoursDone = (rec.hoursDone || 0) + h;
    S.topics[topic] = rec;
  }
  delete S.done;
  S.migrated = true;
  Store.save();
})();

/* ─────────────────────────────────────────────────────────────
   dates
   ───────────────────────────────────────────────────────────── */
const DOW = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
const DOW_FULL = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
const MON = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

function d(iso) { const [y, m, dd] = iso.split("-").map(Number); return new Date(y, m - 1, dd); }
function iso(dt) {
  return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") +
         "-" + String(dt.getDate()).padStart(2, "0");
}
function thaiDate(isoStr, full) {
  const t = d(isoStr);
  const base = t.getDate() + " " + MON[t.getMonth()] + " " + (t.getFullYear() + 543);
  return full ? base + " (" + DOW_FULL[t.getDay()] + ")" : base;
}
function daysBetween(a, b) { return Math.round((d(b) - d(a)) / 86400000); }
function fmtHours(h) {
  const H = Math.floor(h), M = Math.round((h - H) * 60);
  if (H && M) return H + " ชม. " + M + " น.";
  if (H) return H + " ชม.";
  return M + " นาที";
}

/* วันนี้จริง ๆ — แต่ข้อมูลถูกสร้างไว้ล่วงหน้า ถ้าเปิดหน้านี้ก่อนวันเริ่มแผน
   ให้ยึดวันเริ่มแผนแทน จะได้ไม่เจอหน้าว่าง */
const REAL_TODAY = iso(new Date());
const TODAY = REAL_TODAY < DATA.startDate ? DATA.startDate : REAL_TODAY;

const SUBJ = DATA.subjects;
const TOPIC_OF = (() => {
  const m = new Map();
  for (const [sc, s] of Object.entries(SUBJ)) for (const t of s.topics) m.set(t.code, { subject: sc, ...t });
  return m;
})();

/* ─────────────────────────────────────────────────────────────
   helpers
   ───────────────────────────────────────────────────────────── */
const $ = (sel, root) => (root || document).querySelector(sel);
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

const CHOICE_LETTERS = ["ก", "ข", "ค", "ง", "จ"];

/* ชิปในตารางมีที่แคบ — ใช้ชื่อสั้น ("ชีววิทยา") ไม่ใช่ชื่อเต็ม ("A-Level ชีววิทยา") */
const subjLabel = code => (SUBJ[code] && (SUBJ[code].short || SUBJ[code].name)) || code;
const subjName  = code => (SUBJ[code] && SUBJ[code].name) || code;
const ST = DATA.study;
const DOW_KEY = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];

/** ตัวนับถอยหลังหลักยึดเฉพาะสนามที่มีน้ำหนักใน กสพท — TGAT ไม่นับ */
function nextExam(countingOnly) {
  for (const e of DATA.exams) {
    if (daysBetween(TODAY, e.date) < 0) continue;
    if (countingOnly && e.counts === false) continue;
    return e;
  }
  return null;
}

/* ── สถานะรายหัวข้อ ───────────────────────────────────────── */
const topicRec = code => S.topics[code] || {};
const hoursDoneOf = code => Number(topicRec(code).hoursDone || 0);
const hoursLeftOf = t => Math.max(0, Math.round((t.hours - hoursDoneOf(t.code)) * 4) / 4);
const isLearned = code => {
  const t = TOPIC_OF.get(code);
  return !!t && hoursDoneOf(code) >= t.hours - 0.001;
};

/** ความแม่นของหัวข้อ จากข้อสอบที่เคยทำในหัวข้อนั้น (ยังไม่เคยทำ = ค่าตั้งต้น) */
function masteryOf(code) {
  let seen = 0, ok = 0;
  for (const q of DATA.questions) {
    if (q.topic !== code) continue;
    const r = S.q[q.qid];
    if (r) { seen += r.seen; ok += r.ok; }
  }
  return seen ? (100 * ok / seen) : ST.baselineMastery;
}

/* ── เวลาว่างในแต่ละวัน ───────────────────────────────────── */
function hoursFor(isoStr) {
  if (ST.daysOff.includes(isoStr)) return 0;
  return Number(ST.hoursByWeekday[DOW_KEY[d(isoStr).getDay()]] || 0);
}

/** ชั่วโมงอ่าน "ของใหม่" ที่เหลือระหว่างสองวัน (หักส่วนที่กันไว้ทบทวน) */
function learnHoursBetween(fromISO, toISO) {
  const learnShare = 1 - ST.reviewShare;
  let total = 0, cur = d(fromISO), end = d(toISO), guard = 0;
  while (cur <= end && guard++ < 800) {
    total += hoursFor(iso(cur)) * learnShare;
    cur.setDate(cur.getDate() + 1);
  }
  return total;
}

/** น้ำหนักของวิชาในคะแนนรวม 100 (กลุ่มวิทย์ 3 วิชาหารเท่ากัน) */
const SUBJ_WEIGHT = (() => {
  const perGroup = {};
  for (const s of Object.values(SUBJ)) perGroup[s.group] = (perGroup[s.group] || 0) + 1;
  const out = {};
  for (const [code, s] of Object.entries(SUBJ))
    out[code] = (DATA.weights[s.group] || 1) / (perGroup[s.group] || 1);
  return out;
})();

/* ── ตัวจัดตาราง ───────────────────────────────────────────
   จัดใหม่ทุกครั้งที่เปิดหน้า โดยเริ่มจาก "วันนี้" และ "สิ่งที่ยังไม่ได้ทำจริง"
   ข้ามไปกี่วันก็ตาม งานที่ค้างจะถูกดันมาข้างหน้าเสมอ ไม่หายไปตามปฏิทิน
   สูตรเดียวกับฝั่ง Python: น้ำหนักหัวข้อ × น้ำหนักวิชา × (1−ความแม่น) × ความเร่งด่วน */
function buildPlan(fromISO, nDays) {
  const pending = [];
  for (const [sc, s] of Object.entries(SUBJ))
    for (const t of s.topics) {
      const left = hoursLeftOf(t);
      if (left >= 0.25)
        pending.push({ subject: sc, code: t.code, name: t.name, weight: t.weight, left });
    }

  // คิวทบทวน — จำลองต่อไปข้างหน้าโดยถือว่าทบทวนผ่าน
  const sim = new Map();
  for (const [code, rec] of Object.entries(S.topics))
    if (rec.next && TOPIC_OF.has(code)) sim.set(code, { next: rec.next, rep: rec.rep || 0 });

  const days = [];
  const cur = d(fromISO);

  for (let i = 0; i < nDays; i++) {
    const dayISO = iso(cur);
    // หักเวลาที่ทำไปแล้ววันนั้นออก — ทำครึ่งวันแล้วตารางจะเหลือแค่ส่วนที่ค้าง
    const logged = (S.log[dayISO] || []).reduce((a, x) => a + x.hours, 0);
    const capacity = Math.max(0, hoursFor(dayISO) - logged);
    const day = { date: dayISO, blocks: [],
                  note: hoursFor(dayISO) <= 0 ? "วันพัก" : (capacity <= 0 ? "ทำครบแล้ว" : "") };

    if (capacity > 0) {
      let usedReview = 0;
      const reviewBudget = capacity * ST.reviewShare;

      // 1) ทบทวนก่อน — ค้างนานสุดขึ้นก่อน
      const due = [...sim.entries()].filter(([, r]) => r.next <= dayISO)
        .sort((a, b) => (a[1].next < b[1].next ? -1 : 1));
      for (const [code, r] of due) {
        const t = TOPIC_OF.get(code);
        if (!t) continue;
        let need = Math.max(0.25, Math.round(t.hours * 0.25 * Math.pow(0.7, r.rep) * 4) / 4);
        need = Math.min(need, capacity - usedReview);
        if (need < 0.25) break;
        if (usedReview + need > reviewBudget && usedReview > 0) break;
        day.blocks.push({ kind: "review", subject: t.subject, topic: code,
                          topicName: t.name, hours: need, repetition: r.rep + 1 });
        usedReview += need;
        const gap = ST.reviewIntervals[Math.min(r.rep + 1, ST.reviewIntervals.length - 1)];
        const nx = d(dayISO); nx.setDate(nx.getDate() + gap);
        sim.set(code, { next: iso(nx), rep: r.rep + 1 });
      }

      // 2) อ่านใหม่ตามลำดับความคุ้ม
      let budget = capacity - usedReview;
      if (pending.length) {
        const remain = {}, urgency = {};
        for (const p of pending) remain[p.subject] = (remain[p.subject] || 0) + p.left;
        for (const sc of Object.keys(remain)) {
          const avail = learnHoursBetween(dayISO, ST.deadlines[sc] || dayISO);
          urgency[sc] = Math.min(5, Math.max(0.1, remain[sc] / Math.max(avail, 1)));
        }
        const score = p => p.weight * SUBJ_WEIGHT[p.subject] *
          (1 - masteryOf(p.code) / 100) * (urgency[p.subject] || 1);
        pending.sort((a, b) => score(b) - score(a));

        // หัวข้อที่ลงมือไปแล้ววันนี้ ให้ไปต่อคิวท้าย — จะได้ไม่เด้งกลับมาซ้ำ
        // ทันทีที่ติ๊กเสร็จ (มันยัง priority สูงสุดอยู่ เพราะยังอ่านไม่จบ)
        const workedToday = new Set((S.log[dayISO] || []).map(e => e.topic));
        if (workedToday.size) {
          const front = pending.filter(x => !workedToday.has(x.code));
          const back = pending.filter(x => workedToday.has(x.code));
          pending.length = 0;
          pending.push(...front, ...back);
        }
      }
      while (budget >= 0.25 && pending.length) {
        const p = pending[0];
        const chunk = Math.round(Math.min(ST.blockHours, p.left, budget) * 4) / 4;
        if (chunk < 0.25) break;
        day.blocks.push({ kind: "learn", subject: p.subject, topic: p.code,
                          topicName: p.name, hours: chunk, repetition: 0 });
        budget -= chunk;
        p.left = Math.round((p.left - chunk) * 4) / 4;
        pending.shift();
        if (p.left >= 0.25) {
          pending.push(p);          // เหลืออีก -> ต่อวันหลัง ไม่กองซ้ำวันเดียว
        } else {
          const nx = d(dayISO); nx.setDate(nx.getDate() + ST.reviewIntervals[0]);
          sim.set(p.code, { next: iso(nx), rep: 0 });
        }
      }
    }
    days.push(day);
    cur.setDate(cur.getDate() + 1);
  }
  return days;
}

/* ── ยังทันไหม ─────────────────────────────────────────────
   เทียบชั่วโมงที่ยังต้องอ่าน กับชั่วโมงว่างที่เหลือจริงก่อนถึงวันสอบแต่ละสนาม */
function outlook() {
  const byDeadline = {};
  for (const [sc, s] of Object.entries(SUBJ)) {
    const dl = ST.deadlines[sc];
    if (!dl) continue;
    byDeadline[dl] = (byDeadline[dl] || 0) + s.topics.reduce((a, t) => a + hoursLeftOf(t), 0);
  }
  return Object.entries(byDeadline).sort().map(([dl, need]) => {
    const avail = learnHoursBetween(TODAY, dl);
    const exam = DATA.exams.find(e => e.date === dl);
    const ratio = avail > 0 ? need / avail : (need > 0 ? 99 : 0);
    return {
      deadline: dl, need, avail, slack: avail - need,
      name: exam ? exam.name : dl,
      status: need <= 0 ? "done" : ratio <= 0.85 ? "ok" : ratio <= 1 ? "tight" : "over",
    };
  });
}

/* ── streak ───────────────────────────────────────────────── */
function streak() {
  let n = 0;
  const cur = d(TODAY);
  // วันนี้ยังไม่ได้ทำก็ยังไม่ตัด streak — เริ่มนับจากเมื่อวานแทน
  if (!(S.days[iso(cur)] > 0)) cur.setDate(cur.getDate() - 1);
  for (let i = 0; i < 400; i++) {
    if (!(S.days[iso(cur)] > 0)) break;
    n++; cur.setDate(cur.getDate() - 1);
  }
  return n;
}

function subjectStats() {
  const out = [];
  for (const [code, s] of Object.entries(SUBJ)) {
    const total = s.topics.length;
    const dn = s.topics.filter(t => isLearned(t.code)).length;
    const hoursDone = s.topics.reduce((a, t) => a + Math.min(hoursDoneOf(t.code), t.hours), 0);
    let seen = 0, ok = 0;
    for (const q of DATA.questions) {
      if (q.subject !== code) continue;
      const r = S.q[q.qid];
      if (r) { seen += r.seen; ok += r.ok; }
    }
    out.push({
      code, name: s.name, total, done: dn,
      pct: total ? (100 * dn / total) : 0,
      hoursDone, hoursTotal: s.hours,
      accuracy: seen ? (100 * ok / seen) : null, seen,
      topics: s.topics,
    });
  }
  return out.sort((a, b) => b.pct - a.pct);
}

/* ─────────────────────────────────────────────────────────────
   COUNTDOWN BAR
   ───────────────────────────────────────────────────────────── */
function renderTop() {
  const name = (DATA.student && DATA.student.name) ? DATA.student.name : "";
  $("#brandName").textContent = name ? "TCAS70 · " + name : "TCAS70 · เตรียมสอบแพทย์";
  const e = nextExam(true);
  if (!e) {
    $("#cdNum").textContent = "—";
    $("#cdUnit").textContent = "";
    $("#cdWhat").textContent = "สอบครบทุกสนามแล้ว";
    return;
  }
  const n = daysBetween(TODAY, e.date);
  $("#cdNum").textContent = n;
  $("#cdUnit").textContent = n === 0 ? "สอบวันนี้" : "วัน";
  $("#cdWhat").textContent = e.name + (e.verified ? "" : " ⚠︎");

  const st = streak();
  const box = $("#streakBox");
  box.hidden = st < 1;
  $("#streakN").textContent = st;
}

/* ─────────────────────────────────────────────────────────────
   VIEW: วันนี้
   ───────────────────────────────────────────────────────────── */
/* ทำบล็อกเสร็จ: ลงชั่วโมงให้หัวข้อ บันทึกลงล็อกของวัน แล้วขยับคิวทบทวน
   ตารางที่เหลือจะถูกคำนวณใหม่เองจากชั่วโมงที่เหลือ ไม่ต้องแตะปฏิทิน */
function completeBlock(dayISO, b) {
  const rec = S.topics[b.topic] || {};

  if (b.kind === "learn") {
    rec.hoursDone = Number(rec.hoursDone || 0) + b.hours;
    const t = TOPIC_OF.get(b.topic);
    if (t && rec.hoursDone >= t.hours - 0.001 && !rec.learnedOn) {
      rec.learnedOn = dayISO;
      rec.rep = 0;
      const nx = d(dayISO); nx.setDate(nx.getDate() + ST.reviewIntervals[0]);
      rec.next = iso(nx);
    }
  } else {
    rec.rep = Number(rec.rep || 0) + 1;
    const gap = ST.reviewIntervals[Math.min(rec.rep, ST.reviewIntervals.length - 1)];
    const nx = d(dayISO); nx.setDate(nx.getDate() + gap);
    rec.next = iso(nx);
  }

  S.topics[b.topic] = rec;
  (S.log[dayISO] = S.log[dayISO] || []).push(
    { topic: b.topic, kind: b.kind, hours: b.hours, rep: b.repetition, subject: b.subject });
  S.days[dayISO] = Number(S.days[dayISO] || 0) + b.hours;
  Store.save();
}

function undoLogged(dayISO, index) {
  const entries = S.log[dayISO] || [];
  const e = entries[index];
  if (!e) return;
  const rec = S.topics[e.topic] || {};
  if (e.kind === "learn") {
    rec.hoursDone = Math.max(0, Number(rec.hoursDone || 0) - e.hours);
    const t = TOPIC_OF.get(e.topic);
    if (t && rec.hoursDone < t.hours - 0.001) { delete rec.learnedOn; delete rec.next; delete rec.rep; }
  } else {
    rec.rep = Math.max(0, Number(rec.rep || 0) - 1);
  }
  S.topics[e.topic] = rec;
  entries.splice(index, 1);
  S.days[dayISO] = Math.max(0, Number(S.days[dayISO] || 0) - e.hours);
  if (!S.days[dayISO]) delete S.days[dayISO];
  Store.save();
}

function blockRow(dayISO, b, opts) {
  const o = opts || {};
  const kindChip = b.kind === "review"
    ? '<span class="chip review">ทบทวน #' + b.repetition + "</span>"
    : '<span class="chip learn">อ่านใหม่</span>';
  const btn = el(
    '<button class="blk ' + (b.kind === "review" ? "review " : "") + (o.done ? "done" : "") + '">' +
      '<span class="blk-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg></span>' +
      '<span class="blk-body">' +
        '<span class="blk-name">' + esc(b.topicName) + "</span>" +
        '<span class="blk-meta">' + kindChip +
          '<span class="chip">' + esc(subjLabel(b.subject)) + "</span>" +
          '<span class="chip">' + fmtHours(b.hours) + "</span>" +
        "</span>" +
      "</span>" +
    "</button>"
  );
  btn.setAttribute("aria-pressed", o.done ? "true" : "false");
  if (o.readonly) { btn.disabled = true; btn.style.cursor = "default"; return btn; }

  btn.addEventListener("click", () => {
    if (o.done) undoLogged(dayISO, o.index);
    else {
      completeBlock(dayISO, b);
      celebrate(dayISO);
    }
    render();
  });
  return btn;
}

/* ฟีดแบ็กตอนทำเสร็จ — เงียบ ๆ ตอนทำได้ทีละบล็อก และชัดขึ้นเมื่อครบทั้งวัน */
let toastTimer = null;
function celebrate(dayISO) {
  const left = buildPlan(dayISO, 1)[0].blocks.length;
  const st = streak();
  const msg = left === 0
    ? { big: "ครบแล้ววันนี้", sub: st > 1 ? "ต่อเนื่อง " + st + " วันติด 🔥" : "เริ่มนับ streak แล้ว" }
    : { big: "บันทึกแล้ว", sub: "เหลืออีก " + left + " บล็อก" };

  const old = $("#toast"); if (old) old.remove();
  const node = el(
    '<div id="toast" class="toast' + (left === 0 ? " toast-big" : "") + '">' +
      '<span class="toast-big-t">' + esc(msg.big) + "</span>" +
      '<span class="toast-sub">' + esc(msg.sub) + "</span>" +
    "</div>");
  document.body.appendChild(node);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.remove(), left === 0 ? 3200 : 1700);
}

let quiz = null;

function startQuiz(opts) {
  const pool = DATA.questions.filter(q =>
    (!opts.subject || q.subject === opts.subject) && (!opts.topic || q.topic === opts.topic));

  // เรียงลำดับความสำคัญ: ข้อที่เคยตอบผิด -> ยังไม่เคยทำ -> ที่เหลือ
  const rank = q => {
    const r = S.q[q.qid];
    if (!r) return 1;
    return r.ok < r.seen ? 0 : 2;
  };
  const shuffled = pool.slice().sort(() => Math.random() - 0.5).sort((a, b) => rank(a) - rank(b));
  const items = shuffled.slice(0, opts.count || 10);

  quiz = { items, i: 0, answers: new Array(items.length).fill(null), done: false, subject: opts.subject || null };
}

function answerQuiz(choiceIndex) {
  if (!quiz || quiz.answers[quiz.i] !== null) return;
  const q = quiz.items[quiz.i];
  quiz.answers[quiz.i] = choiceIndex;
  const ok = choiceIndex === q.answer;
  const rec = S.q[q.qid] || { seen: 0, ok: 0 };
  rec.seen += 1; if (ok) rec.ok += 1;
  S.q[q.qid] = rec;
  Store.save();
  render();
}

function viewQuiz() {
  const root = $("#v-quiz");
  root.innerHTML = "";
  const wrap = el('<div class="stack"></div>');

  /* ---- picker */
  if (!quiz) {
    const pick = el('<div class="card card-pad stack"></div>');
    pick.appendChild(el('<div class="section-title"><h2>เลือกชุดข้อสอบ</h2></div>'));
    pick.appendChild(el('<p class="muted" style="margin:-8px 0 0">ข้อที่เคยตอบผิดจะถูกดันขึ้นมาถามก่อนเสมอ ' +
      "คลังตอนนี้มี " + DATA.questions.length + " ข้อ</p>"));

    const grid = el('<div class="tiles"></div>');
    Object.entries(SUBJ).forEach(([code, s]) => {
      const n = DATA.questions.filter(q => q.subject === code).length;
      if (!n) return;
      let seen = 0, ok = 0;
      DATA.questions.filter(q => q.subject === code).forEach(q => {
        const r = S.q[q.qid]; if (r) { seen += r.seen; ok += r.ok; }
      });
      const acc = seen ? Math.round(100 * ok / seen) : null;
      const b = el(
        '<button class="tile" style="cursor:pointer;text-align:left">' +
          '<div class="tile-n">' + n + '<span style="font-size:13px;color:var(--text-3)"> ข้อ</span></div>' +
          '<div class="tile-l">' + esc(s.name) + "</div>" +
          '<div class="tiny" style="margin-top:3px">' + (acc === null ? "ยังไม่เคยทำ" : "เคยถูก " + acc + "%") + "</div>" +
        "</button>"
      );
      b.addEventListener("click", () => { startQuiz({ subject: code, count: Math.min(10, n) }); render(); });
      grid.appendChild(b);
    });
    pick.appendChild(grid);

    const all = el('<button class="btn btn-pri">สุ่มทุกวิชา 15 ข้อ</button>');
    all.addEventListener("click", () => { startQuiz({ count: 15 }); render(); });
    pick.appendChild(all);
    wrap.appendChild(pick);

    /* history */
    if (S.runs.length) {
      const h = el('<div class="card card-pad"></div>');
      h.appendChild(el('<div class="section-title"><h2>ผลย้อนหลัง</h2></div>'));
      S.runs.slice(-8).reverse().forEach(r => h.appendChild(el(
        '<div style="display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line-soft)">' +
          '<span class="num" style="font-size:14px;min-width:52px;color:' +
            (r.pct >= 80 ? "var(--ok)" : r.pct >= 60 ? "var(--warn)" : "var(--brick)") + '">' + r.pct + "%</span>" +
          "<span style=\"font-size:13.5px\">" + esc(r.subject || "รวมทุกวิชา") + "</span>" +
          '<span class="tiny" style="margin-left:auto">' + r.correct + "/" + r.total + " · " + esc(thaiDate(r.date)) + "</span>" +
        "</div>"
      )));
      wrap.appendChild(h);
    }

    root.appendChild(wrap);
    return;
  }

  /* ---- results */
  if (quiz.done) {
    const correct = quiz.items.filter((q, i) => quiz.answers[i] === q.answer).length;
    const pct = Math.round(100 * correct / quiz.items.length);
    const verdict = pct >= 80 ? "แม่นแล้ว" : pct >= 60 ? "ผ่านเกณฑ์ แต่ยังมีจุดรั่ว" : "ต้องกลับไปทบทวน";

    const res = el('<div class="card card-pad stack"></div>');
    res.appendChild(el(
      '<div><div class="eyebrow">ผลการทำชุดนี้</div>' +
      '<div class="tile-n" style="font-size:42px;color:' +
        (pct >= 80 ? "var(--ok)" : pct >= 60 ? "var(--warn)" : "var(--brick)") + '">' + pct + "%</div>" +
      '<div class="muted">ถูก ' + correct + " จาก " + quiz.items.length + " ข้อ — " + verdict + "</div></div>"
    ));

    const wrong = quiz.items.filter((q, i) => quiz.answers[i] !== q.answer);
    if (wrong.length) {
      res.appendChild(el('<hr class="rule">'));
      res.appendChild(el('<div class="section-title"><h2>ข้อที่ยังพลาด</h2></div>'));
      wrong.forEach(q => {
        const t = TOPIC_OF.get(q.topic);
        res.appendChild(el(
          '<div style="padding:9px 0;border-bottom:1px solid var(--line-soft)">' +
            '<div style="font-size:13.5px;line-height:1.65">' + esc(q.stem) + "</div>" +
            '<div style="font-size:13.5px;margin-top:5px"><b>เฉลย:</b> ' +
              esc(CHOICE_LETTERS[q.answer] + ". " + q.choices[q.answer]) + "</div>" +
            (t ? '<div class="tiny" style="margin-top:3px">หัวข้อ: ' + esc(t.name) + "</div>" : "") +
          "</div>"
        ));
      });
    }

    const row = el('<div class="btn-row"></div>');
    const again = el('<button class="btn btn-pri">ทำชุดใหม่</button>');
    again.addEventListener("click", () => { quiz = null; render(); });
    row.appendChild(again);
    if (wrong.length) {
      const retry = el('<button class="btn">ทำเฉพาะข้อที่ผิด (' + wrong.length + ")</button>");
      retry.addEventListener("click", () => {
        quiz = { items: wrong, i: 0, answers: new Array(wrong.length).fill(null), done: false, subject: quiz.subject };
        render();
      });
      row.appendChild(retry);
    }
    res.appendChild(row);
    wrap.appendChild(res);
    root.appendChild(wrap);
    return;
  }

  /* ---- runner */
  const q = quiz.items[quiz.i];
  const given = quiz.answers[quiz.i];
  const answered = given !== null;
  const subj = SUBJ[q.subject];
  const topic = TOPIC_OF.get(q.topic);

  const pips = el('<div class="q-progress"></div>');
  quiz.items.forEach((it, i) => {
    const a = quiz.answers[i];
    const cls = i === quiz.i ? "now" : a === null ? "" : (a === it.answer ? "ok" : "bad");
    pips.appendChild(el('<span class="q-pip ' + cls + '"></span>'));
  });

  const card = el('<div class="card"></div>');
  card.appendChild(el(
    '<div class="card-hd">' +
      '<h2 class="num" style="font-size:14px">ข้อ ' + (quiz.i + 1) + " / " + quiz.items.length + "</h2>" +
      '<span class="spacer chip">' + esc(subjLabel(q.subject)) + "</span>" +
    "</div>"
  ));

  const body = el('<div class="card-pad"></div>');
  body.appendChild(pips);
  body.appendChild(el('<p class="q-stem">' + esc(q.stem) + "</p>"));

  q.choices.forEach((c, i) => {
    let cls = "", bub = "bub";
    if (answered) {
      if (i === q.answer) { cls = "is-ok"; bub += " ok"; }
      else if (i === given) { cls = "is-bad"; bub += " bad"; }
    }
    const b = el(
      '<button class="q-choice ' + cls + '">' +
        '<span class="' + bub + '">' + CHOICE_LETTERS[i] + "</span>" +
        '<span class="q-choice-t">' + esc(c) + "</span>" +
      "</button>"
    );
    if (answered) b.disabled = true;
    else b.addEventListener("click", () => answerQuiz(i));
    body.appendChild(b);
  });

  if (answered) {
    if (q.explanation) body.appendChild(el('<div class="q-explain">' + esc(q.explanation) + "</div>"));
    if (topic) body.appendChild(el('<p class="tiny" style="margin:8px 0 0">หัวข้อ: ' + esc(topic.name) + "</p>"));

    const nav = el('<div class="btn-row" style="margin-top:14px"></div>');
    const last = quiz.i === quiz.items.length - 1;
    const next = el('<button class="btn btn-pri">' + (last ? "ดูผลรวม" : "ข้อถัดไป") + "</button>");
    next.addEventListener("click", () => {
      if (last) {
        const correct = quiz.items.filter((it, i) => quiz.answers[i] === it.answer).length;
        S.runs.push({
          date: TODAY, subject: quiz.subject ? subjLabel(quiz.subject) : null,
          total: quiz.items.length, correct, pct: Math.round(100 * correct / quiz.items.length),
        });
        Store.save();
        quiz.done = true;
      } else quiz.i += 1;
      render();
    });
    nav.appendChild(next);
    const quit = el('<button class="btn">ออก</button>');
    quit.addEventListener("click", () => { quiz = null; render(); });
    nav.appendChild(quit);
    body.appendChild(nav);
  }

  card.appendChild(body);
  wrap.appendChild(card);
  root.appendChild(wrap);
}

/* ─────────────────────────────────────────────────────────────
   VIEW: ความคืบหน้า
   ───────────────────────────────────────────────────────────── */
function viewProgress() {
  const root = $("#v-progress");
  root.innerHTML = "";
  const wrap = el('<div class="stack"></div>');

  const st = subjectStats();
  const doneTopics = st.reduce((a, s) => a + s.done, 0);
  const allTopics = st.reduce((a, s) => a + s.total, 0);
  const hoursDone = st.reduce((a, s) => a + s.hoursDone, 0);
  const hoursAll = st.reduce((a, s) => a + s.hoursTotal, 0);
  let seen = 0, ok = 0;
  Object.values(S.q).forEach(r => { seen += r.seen; ok += r.ok; });

  wrap.appendChild(el(
    '<div class="tiles">' +
      '<div class="tile"><div class="tile-n">' + Math.round(100 * doneTopics / allTopics) + '%</div><div class="tile-l">เนื้อหาที่อ่านจบ</div></div>' +
      '<div class="tile"><div class="tile-n">' + Math.round(hoursDone) + '</div><div class="tile-l">ชม. จาก ' + Math.round(hoursAll) + "</div></div>" +
      '<div class="tile"><div class="tile-n">' + (seen ? Math.round(100 * ok / seen) + "%" : "—") + '</div><div class="tile-l">ความแม่นข้อสอบ</div></div>' +
      '<div class="tile"><div class="tile-n">' + seen + '</div><div class="tile-l">ข้อที่ทำไปแล้ว</div></div>' +
    "</div>"
  ));

  const card = el('<div class="card card-pad"></div>');
  card.appendChild(el('<div class="section-title"><h2>รายวิชา</h2></div>'));
  card.appendChild(el('<p class="tiny" style="margin:-6px 0 8px">แต่ละวงกลมคือหนึ่งหัวข้อ — เติมเมื่ออ่านครบทุกบล็อกของหัวข้อนั้น</p>'));

  st.forEach(s => {
    const row = el('<div class="srow"></div>');
    row.appendChild(el(
      '<div class="srow-hd">' +
        '<span class="srow-name">' + esc(s.name) + "</span>" +
        (s.accuracy !== null
          ? '<span class="chip ' + (s.accuracy >= 70 ? "ok" : "review") + '">แม่น ' + Math.round(s.accuracy) + "%</span>"
          : "") +
        '<span class="srow-pct">' + s.done + "/" + s.total + "</span>" +
      "</div>"
    ));
    const dots = el('<div class="dots"></div>');
    s.topics.forEach(t => {
      const on = isLearned(t.code);
      const dot = el('<span class="dot' + (on ? " on" : "") + '"></span>');
      dot.title = t.name + (on ? " — อ่านจบแล้ว" : "");
      dots.appendChild(dot);
    });
    row.appendChild(dots);
    card.appendChild(row);
  });
  wrap.appendChild(card);

  /* programs */
  if (DATA.programs && DATA.programs.length) {
    const pc = el('<div class="card card-pad"></div>');
    pc.appendChild(el('<div class="section-title"><h2>คะแนนต่ำสุดที่ต้องไปให้ถึง</h2></div>'));
    pc.appendChild(el('<p class="tiny" style="margin:-6px 0 9px">คาดการณ์จากสถิติย้อนหลัง ' +
      "ทุกตัวเลขยังไม่ได้ยืนยันกับประกาศจริง</p>"));
    DATA.programs.slice(0, 10).forEach(p => pc.appendChild(el(
      '<div style="display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line-soft)">' +
        '<span class="num" style="font-size:14px;min-width:52px;color:var(--marigold)">' +
          (p.projected !== null ? p.projected.toFixed(1) : "—") + "</span>" +
        '<span style="font-size:13.5px">' + esc(p.name) + "</span>" +
        '<span class="tiny" style="margin-left:auto;white-space:nowrap">' +
          (p.seats ? p.seats + " ที่นั่ง" : "") + "</span>" +
      "</div>"
    )));
    wrap.appendChild(pc);
  }

  /* backup / restore / reset */
  const rc = el('<div class="card card-pad stack"></div>');
  rc.appendChild(el('<div class="section-title"><h2>ข้อมูลที่บันทึกไว้</h2></div>'));
  rc.appendChild(el('<p class="tiny" style="margin:-8px 0 0">' +
    (Store.persistent
      ? "ความคืบหน้าเก็บไว้ในเครื่องนี้เท่านั้น ไม่ได้ส่งขึ้นเซิร์ฟเวอร์ — ย้ายเครื่องให้กด " +
        "<b>สำรองข้อมูล</b> แล้วเอาไฟล์ไป <b>กู้คืน</b> ที่อีกเครื่อง"
      : "⚠️ เบราว์เซอร์นี้ไม่ยอมให้บันทึกถาวร ความคืบหน้าจะหายเมื่อปิดหน้า") + "</p>"));

  const nBlocks = Object.values(S.log).reduce((a, v) => a + v.length, 0);
  const nTopics = Object.keys(S.topics).length;
  const nQ = Object.keys(S.q).length;
  rc.appendChild(el('<p class="tiny" style="margin:0">ตอนนี้เก็บไว้: บล็อกที่ทำแล้ว ' + nBlocks +
    " · หัวข้อที่มีความคืบหน้า " + nTopics + " · ข้อสอบที่เคยทำ " + nQ +
    " · ชุดที่ทำจบ " + S.runs.length + "</p>"));

  const row = el('<div class="btn-row"></div>');

  const backup = el('<button class="btn btn-sm">สำรองข้อมูล</button>');
  backup.addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ app: "tcas70", saved: TODAY, data: S }, null, 2)],
      { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "tcas70-progress-" + TODAY + ".json";
    // ต้องอยู่ใน DOM จริงก่อน ไม่งั้นบางเบราว์เซอร์เมิน click()
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  row.appendChild(backup);

  const restore = el('<button class="btn btn-sm">กู้คืนจากไฟล์</button>');
  const picker = el('<input type="file" accept="application/json,.json" style="display:none">');
  restore.addEventListener("click", () => picker.click());
  picker.addEventListener("change", ev => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (e) { alert("อ่านไฟล์ไม่ได้ — ไฟล์นี้ไม่ใช่ JSON ที่ถูกต้อง"); return; }
      const dd = parsed && parsed.data;
      const looksOurs = dd && typeof dd === "object" && dd.q &&
                        (dd.topics || dd.done);   // dd.done = ไฟล์สำรองรุ่นเก่า
      if (!looksOurs) {
        alert("ไฟล์นี้ไม่ใช่ไฟล์สำรองของ TCAS70 — เลือกไฟล์ที่ได้จากปุ่ม สำรองข้อมูล");
        return;
      }
      if (!confirm("ทับความคืบหน้าปัจจุบันด้วยไฟล์นี้? (ของเดิมจะหาย)")) return;

      S.q = dd.q || {}; S.tests = dd.tests || {}; S.runs = dd.runs || [];
      S.topics = dd.topics || {}; S.log = dd.log || {}; S.days = dd.days || {};

      if (!dd.topics && dd.done) {
        // ไฟล์สำรองรุ่นเก่าเก็บเป็น "วันที่|หัวข้อ" — แปลงเป็นชั่วโมงต่อหัวข้อ
        const hoursOf = new Map();
        for (const day of DATA.plan)
          for (const b of day.blocks)
            if (b.kind === "learn") hoursOf.set(day.date + "|" + b.topic, b.hours);
        for (const key of Object.keys(dd.done)) {
          const [, topic] = key.split("|");
          const h = hoursOf.get(key) || 0;
          if (!topic || !h) continue;
          const rec = S.topics[topic] || { hoursDone: 0 };
          rec.hoursDone = (rec.hoursDone || 0) + h;
          S.topics[topic] = rec;
        }
      }
      S.migrated = true;
      Store.save(); quiz = null; render();
      alert("กู้คืนเรียบร้อย");
    };
    reader.readAsText(file);
    ev.target.value = "";
  });
  row.appendChild(restore);
  row.appendChild(picker);

  const rb = el('<button class="btn btn-sm">ล้างทั้งหมด</button>');
  rb.addEventListener("click", () => {
    if (!confirm("ล้างบล็อกที่เช็คไว้ ผลข้อสอบ และประวัติทั้งหมด?")) return;
    S.topics = {}; S.log = {}; S.days = {};
    S.q = {}; S.tests = {}; S.runs = [];
    Store.save(); quiz = null; render();
  });
  row.appendChild(rb);
  rc.appendChild(row);
  wrap.appendChild(rc);

  root.appendChild(wrap);
}

/* ─────────────────────────────────────────────────────────────
   ROUTER
   ───────────────────────────────────────────────────────────── */
let current = "today";
const VIEWS = { today: viewToday, plan: viewPlan, tests: viewTests, quiz: viewQuiz, progress: viewProgress };

function go(name) {
  current = name;
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", t.dataset.view === name ? "true" : "false"));
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  $("#v-" + name).classList.add("on");
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

document.querySelectorAll(".tab").forEach(t =>
  t.addEventListener("click", () => go(t.dataset.view)));

function render() {
  renderTop();
  VIEWS[current]();
}

  '<hr class="rule" style="margin-bottom:14px">' +
  '<p class="tiny">วันสอบ เกณฑ์ กสพท และคะแนนต่ำสุดของทุกคณะในหน้านี้เป็น<b>ค่าประมาณ</b> ' +
  "ยังไม่ได้ยืนยันกับประกาศจริง (เครื่องที่สร้างต่อ mytcas.com ไม่ได้) — " +
  "ก่อนใช้ตัดสินใจจริงต้องตรวจกับ mytcas.com และประกาศ กสพท ปีการศึกษา 2570</p>" +
  '<p class="tiny" style="margin-top:6px">สร้างจากข้อมูล ณ ' + esc(thaiDate(DATA.generatedAt)) +
  " · ตารางอ่าน " + DATA.plan.length + " วัน · ตารางทดสอบ " + DATA.tests.length +
  " ครั้ง · ข้อสอบ " + DATA.questions.length + " ข้อ</p>";

render();
</script>
