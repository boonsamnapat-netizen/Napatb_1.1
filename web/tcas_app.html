/* ═══════════════════════════════════════════════════════════════
   TOKENS
   พื้นเป็นเทาอุ่น ไม่ใช่เทาอมฟ้า — เทาเย็นทำให้หน้าอ่านเป็น
   "แดชบอร์ดบริษัท" ส่วนสีหมึกเป็นม่วงเข้ม ไม่ใช่กรมท่า
   เพื่อให้สีเหลืองมะลิบนแถบบนดูอุ่นขึ้นและไม่เหมือนแอปธนาคาร
   ═══════════════════════════════════════════════════════════════ */
:root {
  --ink:        #2a1d2e;
  --ink-2:      #46283f;
  --ink-3:      #3a2440;
  --paper:      #ece6df;
  --surface:    #fffcf9;
  --surface-2:  #f7f2ec;
  --line:       #ddd4c9;
  --line-soft:  #ebe4db;
  --text:       #1c1714;
  --text-2:     #564f49;
  --text-3:     #6e645c;

  --indigo:     #33477e;
  --indigo-dim: #e3e6f2;
  --marigold:   #96660f;
  --marigold-f: #f0ab2c;
  --brick:      #a83e2b;
  --brick-dim:  #fae2dc;
  --ok:         #286d49;
  --ok-dim:     #dcefe2;
  --warn:       #845709;
  --warn-dim:   #f8ecd6;

  /* IBM Plex Sans Thai — ฟอนต์หลัก ฝังมาในไฟล์ ไม่ต้องพึ่ง CDN
     เดิมใช้ Sarabun ซึ่งเป็นฟอนต์เอกสารราชการ หน้าตาเลยเป็น "ใบงาน" */
  --sans: "Plex Thai", "IBM Plex Sans Thai", "Noto Sans Thai",
          "Leelawadee UI", "Thonburi", system-ui, -apple-system, sans-serif;
  /* ทั้งแอปใช้ฟอนต์เดียว — Plex Thai มีเลขแบบ tabular ในตัวอยู่แล้ว
     การผสม ui-monospace เข้ามาทำให้เลขกับตัวหนังสือไทยเป็นคนละฟอนต์
     ในบรรทัดเดียวกัน ซึ่งเห็นชัดมากบนชิปอย่าง "1 ชม. 30 น." */

  /* มุมโค้งจริง ๆ ไม่ใช่ 3px ที่คมเท่าตาราง */
  --r:    14px;
  --r-sm: 10px;
  --r-xs: 6px;
  --pill: 99px;

  --shadow: 0 1px 2px rgba(44, 30, 22, .05), 0 6px 20px rgba(44, 30, 22, .07);
  --shadow-lift: 0 2px 4px rgba(44, 30, 22, .07), 0 12px 28px rgba(44, 30, 22, .11);

  --spring: cubic-bezier(.22, 1, .28, 1);
}

/* โทเคนธีมมืดประกาศครั้งเดียวแล้วใช้ซ้ำสามที่ (media query, data-theme สองค่า)
   เพื่อให้ปุ่มสลับธีมชนะ prefers-color-scheme ได้ทั้งสองทิศ */
@media (prefers-color-scheme: dark) {
  :root {
    --paper:      #14100f;
    --surface:    #221d21;
    --surface-2:  #2c2529;
    --line:       #3e353a;
    --line-soft:  #302930;
    --text:       #f2ede9;
    --text-2:     #b9afaa;
    --text-3:     #9c928a;
    --indigo:     #9db4ea;
    --indigo-dim: #1e2438;
    --marigold:   #f0ab2c;
    --marigold-f: #f7bc4b;
    --brick:      #e5866f;
    --brick-dim:  #382019;
    --ok:         #6ec392;
    --ok-dim:     #172c21;
    --warn:       #e0ae53;
    --warn-dim:   #2e2413;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .45), 0 14px 30px rgba(0, 0, 0, .4);
  }
}

  --paper:      #14100f;
  --surface:    #221d21;
  --surface-2:  #2c2529;
  --line:       #3e353a;
  --line-soft:  #302930;
  --text:       #f2ede9;

  --text-3:     #9c928a;

  --marigold:   #f0ab2c;

  --brick:      #e5866f;
  --brick-dim:  #382019;
  --ok:         #6ec392;
  --ok-dim:     #172c21;
  --warn:       #e0ae53;
  --warn-dim:   #2e2413;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, .45), 0 14px 30px rgba(0, 0, 0, .4);
}

:root[data-theme="light"] {
  --paper:      #ece6df;
  --surface:    #fffcf9;
  --surface-2:  #f7f2ec;
  --line:       #ddd4c9;
  --line-soft:  #ebe4db;

  --shadow: 0 1px 2px rgba(44, 30, 22, .05), 0 6px 20px rgba(44, 30, 22, .07);

/* ═══════════════════════════════════════════════════════════════
   BASE
   ═══════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  /* Thai vowel marks sit above and below — tight leading clips them */
  line-height: 1.75;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
  /* clear the fixed bottom tab bar (~62px) plus the home indicator on iOS */
  padding-bottom: calc(78px + env(safe-area-inset-bottom, 0px));
}

@media (min-width: 720px) { body { padding-bottom: 0; } }

h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; line-height: 1.45; }

button { font-family: inherit; font-size: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--marigold-f);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* กดแล้วต้องรู้สึกว่ากดติด — ทุกอย่างที่กดได้ยุบลงเล็กน้อย
   ระยะ 0.97 เล็กกว่านี้ไม่รู้สึก ใหญ่กว่านี้เหมือนของเสีย */
button, a.res { -webkit-tap-highlight-color: transparent; }
.press { transition: transform .1s var(--spring), box-shadow .12s; }
.press:active { transform: scale(.972); }

/* .num อยู่ในประโยคที่มีภาษาไทยปนเสมอ ("579 / 613 ชม.") จึงใช้ฟอนต์เดียวกัน
   ทั้งบรรทัด แล้วบังคับตัวเลขให้กว้างเท่ากันด้วย tabular-nums แทน
   ส่วน --mono สงวนไว้ให้ช่องที่เป็นตัวเลขล้วนจริง ๆ เท่านั้น */
.num { font-variant-numeric: tabular-nums; letter-spacing: -.005em; }

.eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  color: var(--text-3);
  line-height: 1.5;
}

.shell { max-width: 940px; margin: 0 auto; padding: 0 16px; }

/* ═══════════════════════════════════════════════════════════════
   COUNTDOWN BAR — the one thing that is always true
   ═══════════════════════════════════════════════════════════════ */
/* แถบบนเป็นไล่สีม่วงเข้ม + ลายวงฝนคำตอบจาง ๆ
   ลายนี้คือลายเดียวกับกระดาษคำตอบที่เด็กไทยทุกคนรู้จัก
   ใช้เป็นพื้นผิว ไม่ใช่ภาพประกอบ จึงไม่รบกวนการอ่านตัวเลข */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--ink);
  background:
    radial-gradient(circle at center, rgba(255,255,255,.055) 3.4px, transparent 3.9px)
      0 0 / 21px 21px,
    linear-gradient(107deg, var(--ink) 0%, var(--ink-3) 52%, var(--ink-2) 100%);
  color: #f1eaef;
  border-bottom: 1px solid rgba(255,255,255,.09);
}

/* สองแถว: ชื่อ+ปุ่มตั้งค่าอยู่บน ตัวนับถอยหลังอยู่ล่าง
   เดิมทั้งสามอย่างอยู่แถวเดียวแล้ว flex-wrap ดันตัวนับตกบรรทัด
   ทำให้เลขที่ควรเด่นที่สุดไปเบียดอยู่ใต้ปุ่มเฟือง */
.topbar-in {
  max-width: 940px; margin: 0 auto;
  /* status-bar-style ของ iOS เป็น black-translucent + viewport-fit=cover
     หน้าเว็บจึงไหลขึ้นไปใต้นาฬิกา/แบต ต้องเผื่อ safe area เองไม่งั้นหัวแอปทับกัน */
  padding: calc(11px + env(safe-area-inset-top, 0px)) 16px 12px;
  display: flex; flex-direction: column; gap: 9px;
}
.topbar-row { display: flex; align-items: center; gap: 12px; }

.brand { display: flex; flex-direction: column; gap: 0; margin-right: auto; min-width: 0; }
.brand-name { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
.brand-sub { font-size: 11.5px; color: #b49bad; }

.cd { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0; }
.cd-n { font-variant-numeric: tabular-nums; font-size: 34px; font-weight: 600; line-height: 1; color: var(--marigold-f); letter-spacing: -.03em;
  text-shadow: 0 0 22px rgba(240, 171, 44, .35); }
.cd-meta { display: flex; flex-direction: column; line-height: 1.3; }
.cd-unit { font-size: 12px; color: #d6c8d2; }
.cd-what { font-size: 11.5px; color: #b49bad; }

.streak{display:flex;align-items:baseline;gap:5px;padding:5px 12px;border-radius:var(--pill);
  background:linear-gradient(140deg, rgba(240,171,44,.30), rgba(224,110,60,.22));
  border:1px solid rgba(247,188,75,.45)}
/* display:flex ชนะ [hidden] ของเบราว์เซอร์ ต้องประกาศทับเอง */
.streak[hidden]{display:none}
.streak-n{font-size:17px;font-weight:700;color:#ffd27a;line-height:1;font-variant-numeric:tabular-nums}
.streak-l{font-size:11px;color:#e2d0dc}

.gear{appearance:none;border:0;background:rgba(255,255,255,.10);color:#e0d2dc;cursor:pointer;
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;
  transition:background .15s, color .15s, transform .25s var(--spring)}
.gear:hover{background:rgba(255,255,255,.2);color:#fff;transform:rotate(45deg)}
.gear svg{width:17px;height:17px}

/* ── settings ─────────────────────────────────────────────── */
.field{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.field:last-child{border-bottom:0}
.field-l{font-size:14.5px;flex:1;min-width:0}
/* ครอบทุกช่องกรอกในแอป ไม่ใช่เฉพาะที่อยู่ใน .field —
   ช่องชื่อกับช่องวันที่เคยหลุดออกไปใช้กรอบเริ่มต้นของเบราว์เซอร์ */
input[type=text],input[type=date]{font-family:inherit;font-size:14px;color:var(--text);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px}
.field input[type=text]{width:100%}
input[type=text]:focus,input[type=date]:focus{border-color:var(--marigold-f);outline:none}
.hours-in{font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:600;
  width:66px;text-align:center;color:var(--text);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 4px}
.hours-in:focus{border-color:var(--marigold-f);outline:none}
.week-total{display:flex;align-items:baseline;gap:8px;padding-top:11px;font-size:13.5px;color:var(--text-2)}
.week-total b{font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;color:var(--text)}

/* ── where to read ────────────────────────────────────────── */
.blk-row{position:relative}
.blk-row .blk{padding-right:48px}
.blk-res{position:absolute;right:8px;top:11px;appearance:none;cursor:pointer;
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  border:1px solid color-mix(in oklab,var(--sc,var(--line)) 35%,var(--line));
  background:var(--surface);color:var(--text-2);
  transition:color .14s,border-color .14s,transform .12s var(--spring)}
.blk-res:hover{border-color:var(--sc,var(--indigo));color:var(--sc,var(--indigo))}
.blk-res:active{transform:scale(.9)}
.blk-res svg{width:15px;height:15px}

.sheet-back{position:fixed;inset:0;z-index:85;background:rgba(8,12,20,.55);
  display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.sheet-back{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:86vh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:18px 17px calc(20px + env(safe-area-inset-bottom,0px));
  animation:sheetIn .2s ease-out}
@media (min-width:720px){.sheet{border-radius:var(--r);max-height:80vh}}
@keyframes sheetIn{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet-hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
.sheet-hd h2{font-size:17px;flex:1;min-width:0}
.sheet-x{appearance:none;border:0;background:none;cursor:pointer;color:var(--text-3);
  font-size:22px;line-height:1;padding:0 2px}

.res{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;margin-bottom:7px;
  border:1px solid var(--line-soft);border-radius:var(--r-sm);background:var(--surface);
  text-decoration:none;color:inherit}
.res:hover{border-color:var(--indigo)}
.res-ico{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:var(--indigo-dim);color:var(--indigo);font-size:13px}
.res-b{flex:1;min-width:0}
.res-b b{display:block;font-size:14px;font-weight:600}
.res-b span{display:block;font-size:12.5px;color:var(--text-2);line-height:1.6}
.res-del{appearance:none;border:0;background:none;cursor:pointer;color:var(--text-3);
  font-size:17px;line-height:1;padding:2px 4px;flex:none}
.res-del:hover{color:var(--brick)}

/* ── first run + focus timer ──────────────────────────────── */
.intro{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--marigold-f);
  border-radius:var(--r);padding:15px 17px}
.intro h2{font-size:16px;margin-bottom:6px}
.intro ol{margin:8px 0 0;padding-left:20px}
.intro li{font-size:14px;color:var(--text-2);margin-bottom:5px;line-height:1.7}
.intro li b{color:var(--text)}

/* ปุ่มหลักของทั้งแอป — ไล่สีส้มทอง เป็นจุดที่ร้อนที่สุดบนหน้าจอ
   สีนี้ไม่ซ้ำกับสีวิชาใด ๆ จึงอ่านว่า "ลงมือเดี๋ยวนี้" ได้เสมอ */
.start{display:flex;align-items:center;gap:13px;width:100%;cursor:pointer;text-align:left;
  border:0;color:#33210a;
  background:linear-gradient(115deg,#f7bc4b 0%,#f0ab2c 46%,#e08434 100%);
  box-shadow:0 2px 3px rgba(160,95,20,.22),0 10px 24px rgba(200,125,30,.28);
  border-radius:var(--r);padding:15px 17px}
.start:hover{filter:brightness(1.05)}
.start:active{box-shadow:0 1px 2px rgba(160,95,20,.28)}
.start-ico{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:rgba(51,33,10,.16)}
.start-ico svg{width:16px;height:16px}
.start-t{flex:1;min-width:0}
.start-t b{display:block;font-size:15px}
.start-t span{font-size:12.5px;opacity:.72;display:block}

/* จอจับเวลาใช้สีของวิชานั้นเป็นพื้น — นั่งอ่านเคมีกับนั่งอ่านชีวะ
   ควรรู้สึกต่างกัน ไม่ใช่จอดำเหมือนกันหมด */
.timer{position:fixed;inset:0;z-index:80;color:#fdf7fa;
  background:var(--ink);
  background:
    radial-gradient(circle at center, rgba(255,255,255,.05) 4px, transparent 4.6px) 0 0 / 26px 26px,
    linear-gradient(155deg, var(--sc, var(--ink-2)) -40%, var(--ink) 58%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
  animation:timerIn .28s var(--spring)}
@keyframes timerIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.timer-topic{font-size:15px;color:#dcc9d6;text-align:center;max-width:32ch}
.timer-n{font-variant-numeric:tabular-nums;font-size:66px;font-weight:700;
  letter-spacing:-.04em;line-height:1.1;color:var(--marigold-f);
  text-shadow:0 0 40px rgba(240,171,44,.4)}
.timer-sub{font-size:13px;color:#b49bad;margin-bottom:16px}
.timer-btns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.timer .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fdf7fa}
.timer .btn:hover{background:rgba(255,255,255,.22)}
.timer .btn-pri{background:linear-gradient(118deg,#f7bc4b,#f0ab2c 55%,#e08434);border:0;color:#33210a}
.timer-ring{width:180px;height:180px;margin-bottom:14px;transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:5}
.timer-ring .bg{stroke:rgba(255,255,255,.12)}
.timer-ring .fg{stroke:var(--marigold-f);stroke-linecap:round;transition:stroke-dashoffset 1s linear}

/* ═══════════════════════════════════════════════════════════════
   ON-TRACK STATUS
   ═══════════════════════════════════════════════════════════════ */
/* แถบ "ยังทันไหม" — พื้นมีสีตามสถานะ ไม่ใช่เส้นขอบ 3px ที่มองข้ามได้ */
.status{border-radius:var(--r-sm);padding:11px 14px;border:1px solid var(--line);
  background:var(--surface-2)}
.status.ok{border-color:color-mix(in oklab,var(--ok) 45%,transparent);background:var(--ok-dim)}
.status.tight{border-color:color-mix(in oklab,var(--warn) 45%,transparent);background:var(--warn-dim)}
.status.over{border-color:color-mix(in oklab,var(--brick) 50%,transparent);background:var(--brick-dim)}
.status-hd{display:flex;align-items:baseline;gap:8px;font-size:14px}
.status-hd .spacer{margin-left:auto;font-size:13px;color:var(--text-2)}
.status-dot{display:none}
.status.ok .status-hd b{color:var(--ok)}
.status.tight .status-hd b{color:var(--warn)}
.status.over .status-hd b{color:var(--brick)}

/* ═══════════════════════════════════════════════════════════════
   DAY COMPLETE + TOAST
   ═══════════════════════════════════════════════════════════════ */
.done-hero{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:28px 16px;text-align:center}
.done-hero b{font-size:17px}
.done-mark{width:54px;height:54px;border-radius:50%;color:#fff;
  background:linear-gradient(140deg,color-mix(in oklab,var(--ok) 75%,#7fd9a6),var(--ok));
  box-shadow:0 6px 20px color-mix(in oklab,var(--ok) 45%,transparent);
  display:grid;place-items:center;margin-bottom:5px;
  animation:markIn .5s var(--spring)}
@keyframes markIn{from{transform:scale(.4) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.done-mark svg{width:27px;height:27px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:70;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  background:var(--ink);color:#f0f2f6;padding:10px 18px;border-radius:99px;
  box-shadow:0 6px 24px rgba(0,0,0,.28);animation:toastIn .22s ease-out}
.toast-big-t{font-size:14px;font-weight:600}
.toast-sub{font-size:11.5px;color:#a9b3c2}
.toast.toast-big{padding:14px 26px;border-radius:var(--r);color:#fff;
  background:linear-gradient(125deg,#33865c,#2c7750 55%,#256b58);
  box-shadow:0 10px 34px rgba(20,80,50,.42)}
.toast.toast-big .toast-sub{color:rgba(255,255,255,.85)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(7px)}
                   to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media (min-width:720px){.toast{bottom:26px}}

/* ═══════════════════════════════════════════════════════════════
   TABS
   ═══════════════════════════════════════════════════════════════ */
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface);
  border-top: 1px solid var(--line);
  box-shadow: 0 -4px 18px rgba(44, 30, 22, .06);
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  padding: 7px 2px 9px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--text-3);
  transition: color .16s;
}
/* ไอคอนของแท็บที่เลือกอยู่นั่งอยู่บนเม็ดสีส้ม — เห็นว่าอยู่ตรงไหน
   ได้จากหางตา ไม่ต้องอ่านตัวหนังสือ */
.tab-ico-wrap {
  width: 44px; height: 27px; border-radius: var(--pill);
  display: grid; place-items: center;
  transition: background .2s var(--spring), transform .2s var(--spring);
}
.tab-ico { width: 19px; height: 19px; display: block; }
.tab-label { font-size: 10.5px; line-height: 1.2; }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"] .tab-ico-wrap {
  background: linear-gradient(130deg, var(--marigold-f), #e08434);
  color: #33210a;
  box-shadow: 0 2px 8px rgba(224,132,52,.35);
}
.tab[aria-selected="true"] .tab-label { font-weight: 600; color: var(--marigold); }
.tab:hover { color: var(--text-2); }
.tab:active .tab-ico-wrap { transform: scale(.9); }

@media (min-width: 720px) {
  .tabs {
    position: sticky; top: 57px; bottom: auto;
    max-width: 940px; margin: 0 auto;
    grid-template-columns: repeat(5, auto);
    justify-content: start; gap: 2px;
    background: var(--paper); border-top: 0;
    border-bottom: 1px solid var(--line);
    padding: 0;
  }
  .tab {
    flex-direction: row; gap: 8px; padding: 9px 7px;
  }
  .tab-ico-wrap { width: 30px; height: 30px; border-radius: 50%; }
  .tab-label { font-size: 13px; }
}

/* ═══════════════════════════════════════════════════════════════
   CARDS / PANELS
   ═══════════════════════════════════════════════════════════════ */
main { padding-top: 26px; }
.view { display: none; }
.view.on { display: block; }

.stack { display: flex; flex-direction: column; gap: 14px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
}
.card-pad { padding: 15px 16px; }

.card-hd {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 13px 16px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line-soft);
}
.card-hd h2 { font-size: 15px; }
.card-hd .spacer { margin-left: auto; }

.section-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; }
.section-title h2 { font-size: 13px; letter-spacing: .03em; font-weight: 700; color: var(--text-2); }

/* ═══════════════════════════════════════════════════════════════
   OMR BUBBLE — the motif. Every Thai student knows this grid.
   ═══════════════════════════════════════════════════════════════ */
.bub {
  flex: none;
  width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid var(--line);
  display: grid; place-items: center;
  font-size: 12.5px; font-weight: 600;
  color: var(--text-3);
  background: var(--surface);
  transition: background .12s, border-color .12s, color .12s;
}
.bub.fill { background: var(--marigold-f); border-color: var(--marigold-f); color: #2a1e06; }
.bub.ok   { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.bub.bad  { background: var(--brick); border-color: var(--brick); color: var(--surface); }

/* tiny bubbles used as progress dots */
.dots { display: flex; flex-wrap: wrap; gap: 5px; }
.dot {
  width: 13px; height: 13px; border-radius: 50%;
  border: 1.5px solid color-mix(in oklab, var(--sc, var(--line)) 40%, var(--line));
  background: transparent;
  transition: transform .18s var(--spring);
}
.dot.on { background: var(--sc, var(--ok)); border-color: var(--sc, var(--ok));
  box-shadow: 0 1px 4px color-mix(in oklab, var(--sc, var(--ok)) 45%, transparent); }
.dot:hover { transform: scale(1.3); }

/* แถบสัดส่วนวิชาในสัปดาห์ — เห็นส่วนผสมของสัปดาห์ได้ในแวบเดียว
   เว้นช่อง 2px ระหว่างช่วงตามสเปกของ mark ไม่ให้สองสีเชื่อมกันจนอ่านผิด */
.mix { display: flex; gap: 2px; height: 8px; margin: 9px 0 7px; }
.mix span { border-radius: var(--pill); background: var(--sc, var(--line)); min-width: 4px; }
.mix-key { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 4px; }
.mix-key i {
  display: inline-flex; align-items: center; gap: 5px;
  font-style: normal; font-size: 11.5px; color: var(--text-2);
}
.mix-key i::before {
  content: ""; width: 10px; height: 10px; border-radius: 50%;
  background: var(--sc, var(--line)); flex: none;
}

/* หัวสัปดาห์ — ทำให้ตารางยาว ๆ สแกนได้ แทนที่จะเป็นแถวเรียงไม่จบ */
.wk {
  position: sticky; top: var(--stick, 58px); z-index: 20;
  display: flex; align-items: baseline; gap: 9px;
  margin: 0 -16px; padding: 9px 16px;
  /* เป็น <button> จึงต้องล้างขอบซ้าย/ขวาของเบราว์เซอร์เอง
     ไม่งั้นเหลือ 2px outset สีดำโผล่เป็นแท่งอยู่สองข้าง */
  background: var(--surface-2); border: 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line-soft);
  cursor: pointer; width: calc(100% + 32px);
  text-align: left; font: inherit; color: inherit;
}
.wk:first-child { border-top: 0; }
.wk-t { font-size: 13px; font-weight: 700; }
.wk-m { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-3); }
.wk-c { font-size: 11px; color: var(--text-3); transition: transform .15s; }
.wk[aria-expanded="false"] .wk-c { transform: rotate(-90deg); }
.wk-body[hidden] { display: none; }

/* ═══════════════════════════════════════════════════════════════
   DATE SPINE — dates are a real sequence, so a spine is honest
   ═══════════════════════════════════════════════════════════════ */
/* geometry: date column sits at 0-40px, the rule at 48px, blocks from 62px —
   the column and the rule must not overlap or the dates get struck through */
.spine { position: relative; padding-left: 62px; }
.spine::before {
  content: ""; position: absolute; left: 48px; top: 6px; bottom: 6px;
  width: 1px; background: var(--line);
}

.sday { position: relative; padding-bottom: 18px; }
.sday-mark {
  position: absolute; left: -62px; top: 1px;
  width: 40px; text-align: right;
}
.sday-dow { font-size: 10.5px; color: var(--text-3); line-height: 1.3; }
.sday-num {
  font-variant-numeric: tabular-nums;
  font-size: 18px; font-weight: 700; line-height: 1.15; color: var(--text-2);
  letter-spacing: -.03em;
}
.sday-mon { font-size: 10px; color: var(--text-3); line-height: 1.3; }

.sday.today .sday-num { color: var(--marigold); }
.sday.today::after {
  content: ""; position: absolute; left: -19px; top: 9px;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--marigold-f);
  box-shadow: 0 0 0 3px var(--surface);
}
.sday.past { opacity: .5; }


/* ═══════════════════════════════════════════════════════════════
   SUBJECT COLOURS — สีประจำวิชา (categorical)
   แปดเฉดกระจายวงล้อสี ตรวจด้วย validate_palette.js แล้วทั้งสองธีม
   ผ่านทุกข้อ (ธีมมืดเหลือคู่ ΔE 7.9 ซึ่งกติกายอมได้เมื่อมีป้ายชื่อกำกับ —
   ในแอปนี้ชื่อวิชาแสดงเป็นข้อความเสมอ ไม่ได้ใช้สีสื่อความหมายลำพัง)
   สีนี้บอก "วิชาอะไร" ส่วนสีเหลืองยังสงวนไว้บอก "ตอนนี้" เหมือนเดิม
   ═══════════════════════════════════════════════════════════════ */
[data-s="social"] { --sc: #7E9A25; --sc-dim: #f1f4e2; }
[data-s="phys"] { --sc: #2F86C9; --sc-dim: #e7f0fa; }
[data-s="thai"] { --sc: #BF3A2E; --sc-dim: #fbeae8; }
[data-s="eng"] { --sc: #0FA096; --sc-dim: #e0f5f3; }
[data-s="math1"] { --sc: #B5641A; --sc-dim: #f8eee2; }
[data-s="chem"] { --sc: #6D2FA6; --sc-dim: #f0e8fa; }
[data-s="bio"] { --sc: #3F9E54; --sc-dim: #e7f4ea; }
[data-s="tpat1"] { --sc: #A32E68; --sc-dim: #fae9f1; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) [data-s="social"] { --sc: #86A038; --sc-dim: #232a15; }
  :root:not([data-theme="light"]) [data-s="phys"] { --sc: #4593D2; --sc-dim: #16283a; }
  :root:not([data-theme="light"]) [data-s="thai"] { --sc: #D2604F; --sc-dim: #33201d; }
  :root:not([data-theme="light"]) [data-s="eng"] { --sc: #1BAAA1; --sc-dim: #0d2c2a; }
  :root:not([data-theme="light"]) [data-s="math1"] { --sc: #BC6B2F; --sc-dim: #2f2115; }
  :root:not([data-theme="light"]) [data-s="chem"] { --sc: #8C5EC4; --sc-dim: #241634; }
  :root:not([data-theme="light"]) [data-s="bio"] { --sc: #48A961; --sc-dim: #142a1c; }
  :root:not([data-theme="light"]) [data-s="tpat1"] { --sc: #C9548A; --sc-dim: #331726; }
}
[data-theme="dark"] [data-s="social"] { --sc: #86A038; --sc-dim: #232a15; }
[data-theme="dark"] [data-s="phys"] { --sc: #4593D2; --sc-dim: #16283a; }
[data-theme="dark"] [data-s="thai"] { --sc: #D2604F; --sc-dim: #33201d; }
[data-theme="dark"] [data-s="eng"] { --sc: #1BAAA1; --sc-dim: #0d2c2a; }
[data-theme="dark"] [data-s="math1"] { --sc: #BC6B2F; --sc-dim: #2f2115; }
[data-theme="dark"] [data-s="chem"] { --sc: #8C5EC4; --sc-dim: #241634; }
[data-theme="dark"] [data-s="bio"] { --sc: #48A961; --sc-dim: #142a1c; }
[data-theme="dark"] [data-s="tpat1"] { --sc: #C9548A; --sc-dim: #331726; }

/* ═══════════════════════════════════════════════════════════════
   BLOCK ROWS
   หนึ่งกล่องพอ — แถวข้างในไม่มีขอบของตัวเอง ใช้เส้นคั่นบางกับช่องไฟแทน
   ═══════════════════════════════════════════════════════════════ */
/* แถวงานมีพื้นเป็นสีของวิชา ไม่ใช่เส้นขอบ 3px ที่คิดเป็นพื้นที่จอ
   ไม่ถึงหนึ่งเปอร์เซ็นต์ — เปิดตารางมาต้องเห็นทันทีว่าวันนี้มีกี่วิชา */
.blk-row { margin-bottom: 7px; }
.blk-row:last-child { margin-bottom: 0; }

.blk {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 12px 12px 13px;
  border: 1px solid transparent;
  border-left: 4px solid var(--sc, var(--line));
  border-radius: var(--r-sm);
  background: var(--sc-dim, var(--surface-2));
  background: color-mix(in oklab, var(--sc, var(--line)) 12%, var(--surface));
  cursor: pointer; text-align: left; width: 100%;
  transition: opacity .14s, transform .1s var(--spring), box-shadow .16s, filter .14s;
}
.blk:hover { filter: brightness(1.02); box-shadow: var(--shadow); }
.blk:hover .blk-name { color: var(--sc, var(--indigo)); }
.blk:active { transform: scale(.985); }
.blk.done { opacity: .5; background: var(--surface-2); border-left-color: var(--ok); }
.blk.done .blk-name { text-decoration: line-through; text-decoration-thickness: 1px; }

/* ช่องติ๊กใช้ทรงเดียวกับวงฝนคำตอบ — ลายเดียวกันทั้งแอป */
.blk-check {
  flex: none; width: 25px; height: 25px; margin-top: 1px;
  border: 1.5px solid var(--sc, var(--line)); border-radius: 50%;
  display: grid; place-items: center;
  background: var(--surface);
  transition: background .18s var(--spring), border-color .18s;
}
.blk:hover .blk-check { border-color: var(--sc, var(--indigo)); }
.blk.done .blk-check { background: var(--ok); border-color: var(--ok); }
.blk-check svg { width: 13px; height: 13px; opacity: 0; color: #fff; }
.blk.done .blk-check svg { opacity: 1; }

/* ติ๊กเสร็จแล้วเครื่องหมายถูก "ถูกวาด" ไม่ใช่โผล่มาเฉย ๆ
   เล่นเฉพาะแถวที่เพิ่งกด (คลาส just) — แถวที่เสร็จอยู่ก่อนแล้วไม่เล่นซ้ำ */
.blk.done.just .blk-check { animation: checkPop .42s var(--spring); }
.blk.done.just .blk-check svg path {
  stroke-dasharray: 26; stroke-dashoffset: 26;
  animation: checkDraw .34s ease-out .06s forwards;
}
@keyframes checkPop { 0% { transform: scale(1); } 42% { transform: scale(1.28); } 100% { transform: scale(1); } }
@keyframes checkDraw { to { stroke-dashoffset: 0; } }

.blk-body { min-width: 0; flex: 1; }
.blk-name { font-size: 14.5px; line-height: 1.55; transition: color .12s; }
.blk-meta { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 1px; align-items: baseline; }
.blk-sub { font-size: 12px; color: var(--text-3); }

/* เหลือชิปเดียวต่อแถว: เวลา — ที่เหลืออ่านได้จากหัวข้อกลุ่มอยู่แล้ว */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-variant-numeric: tabular-nums; font-size: 11.5px;
  color: var(--text-3); white-space: nowrap;
}
.chip.learn, .chip.review, .chip.mock, .chip.ok {
  padding: 2px 9px; border-radius: var(--pill); font-size: 10.5px;
}
.chip.learn  { background: var(--indigo-dim); color: var(--indigo); }
.chip.review { background: var(--warn-dim);   color: var(--warn); }
.chip.mock   { background: var(--brick-dim);  color: var(--brick); }
.chip.ok     { background: var(--ok-dim);     color: var(--ok); }
.chip.subj   { background: var(--sc-dim); color: var(--sc); padding: 2px 9px; border-radius: var(--pill); }

/* ═══════════════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════════════ */
.btn {
  appearance: none; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--r-sm); padding: 9px 16px;
  font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); border-color: color-mix(in oklab, var(--text-3) 45%, var(--line)); }
.btn:active { transform: scale(.965); }
/* ปุ่มหลักใช้ไล่สีส้มทองชุดเดียวกับปุ่ม "เริ่มอ่าน" ทั้งสองธีม
   เดิมธีมสว่างเป็นปุ่มกรมท่าทึบ ซึ่งอ่านเป็นปุ่มในฟอร์มราชการ */
.btn-pri {
  border: 0; color: #33210a;
  background: linear-gradient(118deg, #f7bc4b, #f0ab2c 55%, #e08434);
  box-shadow: 0 1px 2px rgba(160,95,20,.2), 0 5px 14px rgba(200,125,30,.22);
}
.btn-pri:hover { filter: brightness(1.05); border: 0; }
.btn-sm { padding: 5px 11px; font-size: 12.5px; font-weight: 500; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ═══════════════════════════════════════════════════════════════
   STAT TILES
   ═══════════════════════════════════════════════════════════════ */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
/* ชุดที่มี 4 ใบใช้ 2x2 แทน — auto-fit ทำให้ใบสุดท้ายลอยเดี่ยวเต็มแถว */
.tiles-4 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 560px) { .tiles-4 { grid-template-columns: repeat(4, 1fr); } }

/* แต่ละไทล์มีสีของตัวเอง (--tc) — พื้นอ่อน เลขเข้ม
   ตัวเลขสามใบเรียงกันเป็นสีเดียวกันหมดคือสิ่งที่ทำให้หน้าเดิมจืด */
.tile {
  --tc: var(--text-2);
  background: var(--surface); border: 1px solid var(--line);
  background: color-mix(in oklab, var(--tc) 11%, var(--surface));
  border-color: color-mix(in oklab, var(--tc) 26%, var(--line));
  border-radius: var(--r); padding: 13px 14px;
  position: relative; overflow: hidden;
}
/* ครึ่งวงกลมจาง ๆ มุมขวาบน — ทำให้ไทล์ไม่ใช่แค่กล่องสี่เหลี่ยม */
.tile::after {
  content: ""; position: absolute; right: -22px; top: -22px;
  width: 62px; height: 62px; border-radius: 50%;
  background: color-mix(in oklab, var(--tc) 16%, transparent);
  pointer-events: none;
}
.tile-n { font-variant-numeric: tabular-nums; font-size: 27px;
  font-weight: 700; line-height: 1.15; letter-spacing: -.03em; color: var(--tc); }
.tile-l { font-size: 12px; color: var(--text-2); margin-top: 1px; position: relative; }

/* ═══════════════════════════════════════════════════════════════
   QUIZ
   ═══════════════════════════════════════════════════════════════ */
.q-stem { font-size: 16px; line-height: 1.75; margin: 0 0 14px; }
.q-choice {
  display: flex; align-items: flex-start; gap: 11px; width: 100%;
  padding: 9px 12px; margin-bottom: 7px;
  border: 1px solid var(--line-soft); border-radius: var(--r-sm);
  background: var(--surface); cursor: pointer; text-align: left;
  transition: border-color .12s, background .12s;
}
.q-choice:hover:not(:disabled) { border-color: var(--sc, var(--indigo));
  background: color-mix(in oklab, var(--sc, var(--indigo)) 7%, var(--surface)); }
.q-choice:active:not(:disabled) { transform: scale(.99); }
.q-choice:disabled { cursor: default; }
.q-choice.is-ok  { border-color: var(--ok);    background: var(--ok-dim); }
.q-choice.is-bad { border-color: var(--brick); background: var(--brick-dim); }
.q-choice-t { flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.6; padding-top: 2px; }

.q-explain {
  border-left: 3px solid var(--sc, var(--indigo));
  background: var(--surface-2);
  padding: 12px 14px; border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 13.5px; line-height: 1.7; color: var(--text-2);
  margin-top: 10px;
}

.q-progress { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 3px; }
.q-pip { width: 100%; max-width: 26px; height: 5px; border-radius: var(--pill); background: var(--line); flex: 1;
  transition: background .2s; }
.q-pip.now { box-shadow: 0 0 0 3px color-mix(in oklab, var(--marigold-f) 25%, transparent); }
.q-pip.ok { background: var(--ok); }
.q-pip.bad { background: var(--brick); }
.q-pip.now { background: var(--marigold-f); }

/* ═══════════════════════════════════════════════════════════════
   SUBJECT PROGRESS ROWS
   ═══════════════════════════════════════════════════════════════ */
/* แต่ละวิชาเป็นบล็อกสีของตัวเอง ไม่ใช่แถวในตาราง */
.srow { padding: 11px 13px; margin-bottom: 8px; border-radius: var(--r-sm);
  border-left: 4px solid var(--sc, var(--line));
  background: var(--surface-2);
  background: color-mix(in oklab, var(--sc, var(--line)) 10%, var(--surface)); }
.srow:last-child { margin-bottom: 0; }
.srow-hd { display: flex; align-items: baseline; gap: 9px; margin-bottom: 8px; }
/* ชื่อวิชาไม่ทาสีตัวอักษร — สีวิชาบางสี (เขียวมะกอก เทอร์ควอยซ์) ตัดกับพื้น
   ไม่ถึง 4.5:1 ตัวอักษรเล็กจะอ่านไม่ออก ใช้เม็ดสีนำหน้าแทน */
.srow-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.srow-name::before {
  content: ""; width: 11px; height: 11px; border-radius: 50%; flex: none;
  background: var(--sc, var(--line));
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--sc, var(--line)) 22%, transparent);
}
.srow-pct { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 13.5px; font-weight: 600; color: var(--text-2); }

/* ═══════════════════════════════════════════════════════════════
   แถบหัววันนี้ — พื้นที่สีที่ใหญ่ที่สุดบนหน้าจอ
   สีมาจากวิชาที่กินเวลามากที่สุดของวันนั้น จึงเปลี่ยนไปเรื่อย ๆ
   ตามตารางจริง ไม่ใช่สีตกแต่งที่ตายตัว
   ═══════════════════════════════════════════════════════════════ */
/* โค้งมุมบนของตัวเองแทนที่จะพึ่ง overflow:hidden ของการ์ด —
   overflow:hidden บนการ์ดจะทำให้หัวสัปดาห์ที่เป็น position:sticky พัง */
.dayband {
  position: relative; overflow: hidden;
  border-radius: calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0;
  display: flex; align-items: center; gap: 14px;
  padding: 17px 18px;
  color: #fff;
  background: var(--sc, #4a5b8c);
  background:
    radial-gradient(circle at center, rgba(255,255,255,.10) 3.6px, transparent 4.1px)
      0 0 / 23px 23px,
    linear-gradient(112deg,
      color-mix(in oklab, var(--sc, #4a5b8c) 88%, #ffffff) 0%,
      var(--sc, #4a5b8c) 45%,
      color-mix(in oklab, var(--sc, #4a5b8c) 62%, var(--ink)) 100%);
}
.dayband-t { flex: 1; min-width: 0; }
.dayband-t h2 { font-size: 18px; color: #fff; letter-spacing: -.015em; }
.dayband-sub { font-size: 12.5px; color: rgba(255,255,255,.86); line-height: 1.55; }
.dayband .ring-n { color: #fff; }
.dayband .ring-bg { stroke: rgba(255,255,255,.28); }
.dayband .ring-fg { stroke: #fff; }

/* ═══════════════════════════════════════════════════════════════
   การ์ดคะแนน
   ═══════════════════════════════════════════════════════════════ */
/* แถบหัวเปลี่ยนสีตามระยะห่างจากเป้า — ยังไม่กรอกเป็นสีหมึก
   ใกล้ถึงเป็นเหลือง ถึงแล้วเป็นเขียว ห่างมากเป็นแดง */
.scoreband {
  position: relative; overflow: hidden;
  border-radius: calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0;
  display: flex; align-items: center; gap: 14px;
  padding: 17px 18px; color: #fff;
  background:
    radial-gradient(circle at center, rgba(255,255,255,.10) 3.6px, transparent 4.1px)
      0 0 / 23px 23px,
    linear-gradient(112deg, var(--ink-2), var(--ink) 70%);
}
.scoreband.ok   { background:
    radial-gradient(circle at center, rgba(255,255,255,.12) 3.6px, transparent 4.1px) 0 0 / 23px 23px,
    linear-gradient(112deg, #3d9c6f, #256b4c 70%); }
.scoreband.near { background:
    radial-gradient(circle at center, rgba(255,255,255,.12) 3.6px, transparent 4.1px) 0 0 / 23px 23px,
    linear-gradient(112deg, #d99a2b, #a5651a 70%); }
.scoreband.far  { background:
    radial-gradient(circle at center, rgba(255,255,255,.12) 3.6px, transparent 4.1px) 0 0 / 23px 23px,
    linear-gradient(112deg, #c25a45, #8e3524 70%); }
.scoreband-n {
  flex: none; text-align: right; line-height: 1;
  font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 700;
  letter-spacing: -.03em;
}
.scoreband-n small { display: block; font-size: 11.5px; font-weight: 500;
  opacity: .8; letter-spacing: 0; margin-top: 3px; }

/* ช่องกรอกคะแนน — สองคอลัมน์บนมือถือ สี่บนจอกว้าง */
.sgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 620px) { .sgrid { grid-template-columns: repeat(4, 1fr); } }
.scell {
  display: flex; align-items: center; gap: 6px;
  padding: 9px 10px; border-radius: var(--r-sm);
  border-left: 4px solid var(--sc, var(--line));
  background: var(--surface-2);
  background: color-mix(in oklab, var(--sc, var(--line)) 10%, var(--surface));
  cursor: text;
}
.scell-l { font-size: 12px; flex: 1; min-width: 0; line-height: 1.35; }
.scell input {
  width: 62px; text-align: right; padding: 6px 7px; font-size: 14px;
  font-variant-numeric: tabular-nums; font-weight: 600;
  border: 1px solid var(--line); border-radius: var(--r-xs);

/* แถบสัดส่วนคะแนนรายกลุ่ม */

/* ═══════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════ */
/* ตัวกรอง: คณะเป็นชิปเพราะมีแค่สี่ค่า เห็นครบในบรรทัดเดียว

}

/* หัวข้อแถบโอกาส — กดพับได้ เพราะ "ยังห่าง" มักยาวที่สุดและอยากดูน้อยที่สุด */

/* ═══════════════════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════════════════
   CONFETTI — เล่นเฉพาะตอนปิดครบทั้งวัน ไม่ใช่ทุกครั้งที่ติ๊ก
   ถ้าเล่นทุกครั้งมันจะกลายเป็นเสียงรบกวน แล้วตอนที่ควรดีใจจริง

@media (prefers-reduced-motion: reduce) {

/* ═══════════════════════════════════════════════════════════════
   VIEW TRANSITIONS — สลับแท็บแล้วเนื้อหาไขว้กันสั้น ๆ
   เบราว์เซอร์ที่ไม่รองรับจะข้ามไปเองโดยไม่พัง (ดู go() ในสคริปต์)

<script>
const DATA = /*__TCAS_DATA__*/null;

/* ─────────────────────────────────────────────────────────────
   storage — sandboxed frames can refuse localStorage, so never
   let a throw take the page down; fall back to memory for the session
   ───────────────────────────────────────────────────────────── */
const Store = (() => {
  const KEY = "tcas70.v1";
  let mem = null, usable = true;
  const listeners = [];
  try {
    const probe = "__t";
    localStorage.setItem(probe, "1");
    localStorage.removeItem(probe);
  } catch (e) { usable = false; }

  function read() {
    if (mem) return mem;
    if (usable) {
      try { mem = JSON.parse(localStorage.getItem(KEY) || "{}"); }
      catch (e) { mem = {}; }
    } else mem = {};

    // topicCode -> {hoursDone, learnedOn, rep, ease, next}
    // ความคืบหน้าผูกกับ "หัวข้อ" ไม่ใช่ "วันที่" — ข้ามวันแล้วงานจึงไม่หาย
    if (!mem.topics) mem.topics = {};
    if (!mem.q) mem.q = {};              // qid -> {seen, ok}
    if (!mem.tests) mem.tests = {};      // "YYYY-MM-DD|kind" -> true
    if (!mem.runs) mem.runs = [];        // quiz history
    if (!mem.days) mem.days = {};        // "YYYY-MM-DD" -> ชั่วโมงที่ทำวันนั้น (ใช้นับ streak)
    if (!mem.settings) mem.settings = {};
    if (!mem.links) mem.links = {};    // topicCode -> [{url,title,saved}]
    if (!mem.log) mem.log = {};          // "YYYY-MM-DD" -> [{topic,kind,hours,rep}] ที่ทำเสร็จวันนั้น
    return mem;
  }
  function save() {
    if (usable) {
      try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { usable = false; }
    }
    // แจ้งผู้ฟัง (ไฟล์สำรองอัตโนมัติ) แม้ localStorage จะเขียนไม่ได้ —
    // โหมดส่วนตัวยังเขียนไฟล์สำรองได้อยู่ ซึ่งดีกว่าไม่เหลืออะไรเลย
    listeners.forEach(fn => { try { fn(mem); } catch (e) {} });
  }
  return {
    read, save,
    get persistent() { return usable; },
    subscribe(fn) { listeners.push(fn); },
    notify() { listeners.forEach(fn => { try { fn(mem); } catch (e) {} }); },
  };
})();

const S = Store.read();

/* ─────────────────────────────────────────────────────────────
   ความปลอดภัยของข้อมูลในเครื่อง

   ทุกอย่างเก็บใน localStorage ของเบราว์เซอร์นี้เครื่องเดียว ไม่มีเซิร์ฟเวอร์
   นั่นแปลว่ามีสามทางที่ข้อมูลหายได้: เบราว์เซอร์ไล่ที่คืน (eviction),
   ผู้ใช้ล้างข้อมูลเว็บ, และเปลี่ยนเครื่อง โค้ดชุดนี้จัดการทั้งสามทาง
   โดยไม่ต้องมีบัญชีผู้ใช้
   ───────────────────────────────────────────────────────────── */
const Vault = (() => {
  let persisted = null;      // ผลของ storage.persist() — null = ยังไม่รู้
  let quota = null;

  /* ขอให้เบราว์เซอร์ "ปักหมุด" ข้อมูลไว้ ไม่ไล่ที่คืนตอนพื้นที่ใกล้เต็ม
     Safari/iOS จะลบข้อมูลเว็บที่ไม่ได้เปิด 7 วันถ้าไม่ได้ปักหมุด
     เบราว์เซอร์ส่วนใหญ่ให้อัตโนมัติเมื่อผู้ใช้ติดตั้งเป็นแอปหรือใช้บ่อยพอ */
  async function requestPersist() {
    if (!navigator.storage || !navigator.storage.persist) return null;
    try {
      persisted = await navigator.storage.persisted();
      if (!persisted) persisted = await navigator.storage.persist();
    } catch (e) { persisted = null; }
    return persisted;
  }

  async function measure() {
    if (!navigator.storage || !navigator.storage.estimate) return null;
    try { quota = await navigator.storage.estimate(); } catch (e) { quota = null; }
    return quota;
  }

  /* ── ไฟล์สำรองอัตโนมัติ ─────────────────────────────────
     ถ้าเบราว์เซอร์รองรับ File System Access (Chrome/Edge บนคอม)
     ให้ผู้ใช้เลือกไฟล์ครั้งเดียว แล้วเขียนทับทุกครั้งที่ข้อมูลเปลี่ยน
     ตัว handle เก็บใน IndexedDB เพราะ localStorage เก็บ object ไม่ได้ */
  const IDB_DB = "tcas70", IDB_STORE = "kv", IDB_KEY = "backupHandle";
  const canAutoBackup = () => typeof window.showSaveFilePicker === "function";

  function idb(mode, fn) {
    return new Promise((resolve, reject) => {
      const open = indexedDB.open(IDB_DB, 1);
      open.onupgradeneeded = () => open.result.createObjectStore(IDB_STORE);
      open.onerror = () => reject(open.error);
      open.onsuccess = () => {
        const tx = open.result.transaction(IDB_STORE, mode);
        const req = fn(tx.objectStore(IDB_STORE));
        tx.oncomplete = () => { open.result.close(); resolve(req && req.result); };
        tx.onerror = () => { open.result.close(); reject(tx.error); };
      };
    });
  }
  const getHandle = () => idb("readonly", st => st.get(IDB_KEY)).catch(() => null);
  const putHandle = h => idb("readwrite", st => st.put(h, IDB_KEY)).catch(() => null);
  const dropHandle = () => idb("readwrite", st => st.delete(IDB_KEY)).catch(() => null);

  async function chooseBackupFile() {
    const h = await window.showSaveFilePicker({
      suggestedName: "tcas70-progress.json",
      types: [{ description: "ไฟล์สำรอง TCAS70", accept: { "application/json": [".json"] } }],
    });
    await putHandle(h);
    await writeTo(h);
    return h;
  }

  async function writeTo(handle) {
    const w = await handle.createWritable();
    await w.write(backupBlob());
    await w.close();
    S.lastBackup = todayISO();
    Store.save();
  }

  /* เขียนไฟล์สำรองแบบเงียบ ๆ ทุกครั้งที่ข้อมูลเปลี่ยน
     ถ้าสิทธิ์หมดอายุ (ผู้ใช้ปิดแท็บไปนาน) จะไม่ขอใหม่เอง — เงียบไว้
     แล้วปล่อยให้หน้าตั้งค่าบอกว่าต้องเลือกไฟล์ใหม่ */
  let writing = false;
  async function autoBackup() {
    if (writing || !canAutoBackup()) return;
    const h = await getHandle();
    if (!h) return;
    try {
      const perm = await h.queryPermission({ mode: "readwrite" });
      if (perm !== "granted") return;
      writing = true;
      await writeTo(h);
    } catch (e) { /* ไฟล์ถูกย้าย/ลบ — ปล่อยผ่าน */ }
    finally { writing = false; }
  }

  return {
    requestPersist, measure, canAutoBackup, chooseBackupFile, autoBackup,
    getHandle, dropHandle,
    get persisted() { return persisted; },
    get quota() { return quota; },
  };
})();

/* ย้ายข้อมูลจากรูปแบบเดิม (v1) ที่เก็บเป็น "วันที่|หัวข้อ" มาเป็นชั่วโมงต่อหัวข้อ
   ทำครั้งเดียวแล้วทิ้งของเดิม — ผู้ใช้เดิมจึงไม่เสียความคืบหน้าที่เคยติ๊กไว้ */
(function migrateFromDateKeyedProgress() {
  if (!S.done || S.migrated) return;
  const hoursOf = new Map();
  for (const day of DATA.plan)
    for (const b of day.blocks)
      if (b.kind === "learn") hoursOf.set(day.date + "|" + b.topic, b.hours);

  for (const key of Object.keys(S.done)) {
    const [, topic] = key.split("|");
    const h = hoursOf.get(key) || 0;
    if (!topic || !h) continue;
    const rec = S.topics[topic] || { hoursDone: 0 };
    rec.hoursDone = (rec.hoursDone || 0) + h;
    S.topics[topic] = rec;
  }
  delete S.done;
  S.migrated = true;
  Store.save();
})();

const DOW_FULL = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
const MON = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

function d(iso) { const [y, m, dd] = iso.split("-").map(Number); return new Date(y, m - 1, dd); }
function iso(dt) {

function daysBetween(a, b) { return Math.round((d(b) - d(a)) / 86400000); }
function fmtHours(h) {

  if (H && M) return H + " ชม. " + M + " น.";
  if (H) return H + " ชม.";

/* ─────────────────────────────────────────────────────────────
   helpers
   ───────────────────────────────────────────────────────────── */
const $ = (sel, root) => (root || document).querySelector(sel);
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

/* ─────────────────────────────────────────────────────────────
   ลูกเล่น — ทุกอันเช็ค prefers-reduced-motion ก่อนเสมอ
   คนที่ตั้งค่าไว้ว่าไม่เอาการเคลื่อนไหวต้องได้ตัวเลขจริงทันที
   ไม่ใช่ค่าที่กำลังวิ่งอยู่
   ───────────────────────────────────────────────────────────── */
const reduced = () =>
  window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ตัวเลขวิ่งขึ้น — ใช้กับทุก element ที่มี data-count
   easeOutCubic ทำให้ช้าลงตอนท้าย เหมือนมาตรวัดจริงมากกว่าเชิงเส้น
   ค่าล่าสุดของแต่ละตัวถูกจำไว้ด้วย data-key เพราะทั้งหน้าถูกสร้างใหม่
   ทุกครั้งที่ render — ถ้าไม่จำ ตัวเลขจะเด้งกลับไป 0 ทุกครั้งที่ติ๊กงาน */
const lastCount = Object.create(null);

function runCounters(root) {
  (root || document).querySelectorAll("[data-count]").forEach(node => {
    const to = Number(node.dataset.count);
    if (!isFinite(to)) return;
    const dec = Number(node.dataset.dec || 0);
    const suf = node.dataset.suf || "";
    const key = node.dataset.key || "";
    const from = key && key in lastCount ? lastCount[key] : 0;
    if (key) lastCount[key] = to;

    const write = v => { node.textContent = v.toFixed(dec) + suf; };
    if (reduced() || Math.abs(to - from) < Math.pow(10, -dec) / 2) { write(to); return; }

    const dur = 380 + Math.min(420, Math.abs(to - from) * 11);
    const t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      write(from + (to - from) * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    };
    write(from);
    requestAnimationFrame(step);
  });
}

/* วงแหวนความคืบหน้า — คืน HTML ล้วน ให้ CSS วาดเส้นเอง
   dash-from/dash-to เป็นตัวแปร CSS เพื่อให้ media query reduced-motion
   กระโดดไปค่าปลายทางได้โดยไม่ต้องแตะ JS */
function ringHTML(pct, size, stroke, label) {
  const r = (size - stroke) / 2;
  const C = 2 * Math.PI * r;
  const off = C * (1 - Math.max(0, Math.min(1, pct)));
  return (
    '<div class="ring" style="width:' + size + "px;height:" + size + "px;" +
      "--dash-from:" + C.toFixed(1) + "px;--dash-to:" + off.toFixed(1) + 'px">' +
      '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + " " + size + '" aria-hidden="true">' +
        '<circle class="ring-bg" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r.toFixed(1) +
          '" stroke-width="' + stroke + '"/>' +
        '<circle class="ring-fg" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r.toFixed(1) +
          '" stroke-width="' + stroke + '" stroke-dasharray="' + C.toFixed(1) + '"/>' +
      "</svg>" +
      (label === false ? "" :
        '<span class="ring-n" style="font-size:' + Math.round(size * 0.27) + 'px" ' +
          'data-key="' + esc(label || "ring") + '" ' +
          'data-count="' + Math.round(pct * 100) + '" data-suf="%">0%</span>') +
    "</div>"
  );
}

/* กระดาษสีที่ปลิว — เรียกได้จากที่เดียวคือตอนปิดครบทั้งวัน
   ใช้สีประจำวิชาเป็นสีเศษกระดาษ จะได้เป็นสีของแอปนี้ ไม่ใช่สีสุ่ม */
const CONFETTI_COLORS = ["#f0ab2c", "#e08434", "#3F9E54", "#2F86C9", "#A32E68", "#6D2FA6", "#BF3A2E", "#0FA096"];

function confetti() {
  if (reduced()) return;
  const old = document.getElementById("confetti");
  if (old) old.remove();
  const cv = document.createElement("canvas");
  cv.id = "confetti";
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);

  // ยิงจากสองมุมล่างเข้าหากลางจอ เหมือนปืนยิงคอนเฟตตีจริง
  // dir = +1 คือกระบอกซ้าย (เอียงไปทางขวา) และ -1 คือกระบอกขวา
  const bits = [];
  [[0.12, 1], [0.88, -1]].forEach(([x0, dir]) => {
    for (let i = 0; i < 55; i++) {
      const a = (-Math.PI / 2) + dir * (Math.random() * 0.62 + 0.12);
      const sp = 9 + Math.random() * 11;
      bits.push({
        x: W * x0, y: H * 0.96,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        w: 5 + Math.random() * 5, h: 8 + Math.random() * 7,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.32,
        c: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
      });
    }
  });

  const t0 = performance.now();
  const frame = now => {
    const age = now - t0;
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const b of bits) {
      b.vy += 0.34;            // แรงโน้มถ่วง
      b.vx *= 0.992;           // แรงต้านอากาศ
      b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      if (b.y > H + 40) continue;
      alive++;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      // บีบความกว้างตามการหมุน ทำให้ดูเป็นแผ่นบางที่พลิกไปมา
      ctx.globalAlpha = Math.max(0, 1 - age / 2600);
      ctx.fillStyle = b.c;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w * Math.abs(Math.cos(b.rot)), b.h);
      ctx.restore();
    }
    if (alive && age < 2600) requestAnimationFrame(frame);
    else cv.remove();
  };
  requestAnimationFrame(frame);
}

const CHOICE_LETTERS = ["ก", "ข", "ค", "ง", "จ"];

/* ชิปในตารางมีที่แคบ — ใช้ชื่อสั้น ("ชีววิทยา") ไม่ใช่ชื่อเต็ม ("A-Level ชีววิทยา") */
const subjLabel = code => (SUBJ[code] && (SUBJ[code].short || SUBJ[code].name)) || code;
const subjName  = code => (SUBJ[code] && SUBJ[code].name) || code;
/* ค่าที่ผู้ใช้ตั้งเองในแอปทับ config ที่ฝังมาตอน build
   เก็บใน localStorage เท่านั้น — แก้บนมือถือแล้วตารางคำนวณใหม่ทันที ไม่ต้อง deploy */
const ST = (() => {
  const base = JSON.parse(JSON.stringify(DATA.study));
  const ov = S.settings || {};
  if (ov.hoursByWeekday) Object.assign(base.hoursByWeekday, ov.hoursByWeekday);
  if (Array.isArray(ov.daysOff)) base.daysOff = ov.daysOff;
  return base;
})();
const studentName = () => (S.settings && S.settings.name) || (DATA.student && DATA.student.name) || "";
const DOW_KEY = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];

/** ตัวนับถอยหลังหลักยึดเฉพาะสนามที่มีน้ำหนักใน กสพท — TGAT ไม่นับ */
function nextExam(countingOnly) {
  for (const e of DATA.exams) {
    if (daysBetween(TODAY, e.date) < 0) continue;
    if (countingOnly && e.counts === false) continue;
    return e;
  }
  return null;
}

/* ── สถานะรายหัวข้อ ───────────────────────────────────────── */
const topicRec = code => S.topics[code] || {};
const hoursDoneOf = code => Number(topicRec(code).hoursDone || 0);
const hoursLeftOf = t => Math.max(0, Math.round((t.hours - hoursDoneOf(t.code)) * 4) / 4);
const isLearned = code => {
  const t = TOPIC_OF.get(code);
  return !!t && hoursDoneOf(code) >= t.hours - 0.001;
};

/** ความแม่นของหัวข้อ จากข้อสอบที่เคยทำในหัวข้อนั้น (ยังไม่เคยทำ = ค่าตั้งต้น) */
function masteryOf(code) {
  let seen = 0, ok = 0;
  for (const q of DATA.questions) {
    if (q.topic !== code) continue;
    const r = S.q[q.qid];
    if (r) { seen += r.seen; ok += r.ok; }
  }
  return seen ? (100 * ok / seen) : ST.baselineMastery;
}

/* ── เวลาว่างในแต่ละวัน ───────────────────────────────────── */
function hoursFor(isoStr) {
  if (ST.daysOff.includes(isoStr)) return 0;
  return Number(ST.hoursByWeekday[DOW_KEY[d(isoStr).getDay()]] || 0);
}

/** ชั่วโมงอ่าน "ของใหม่" ที่เหลือระหว่างสองวัน (หักส่วนที่กันไว้ทบทวน) */
function learnHoursBetween(fromISO, toISO) {
  const learnShare = 1 - ST.reviewShare;
  let total = 0, cur = d(fromISO), end = d(toISO), guard = 0;
  while (cur <= end && guard++ < 800) {
    total += hoursFor(iso(cur)) * learnShare;
    cur.setDate(cur.getDate() + 1);
  }
  return total;
}

/** น้ำหนักของวิชาในคะแนนรวม 100 (กลุ่มวิทย์ 3 วิชาหารเท่ากัน) */
const SUBJ_WEIGHT = (() => {
  const perGroup = {};
  for (const s of Object.values(SUBJ)) perGroup[s.group] = (perGroup[s.group] || 0) + 1;
  const out = {};
  for (const [code, s] of Object.entries(SUBJ))
    out[code] = (DATA.weights[s.group] || 1) / (perGroup[s.group] || 1);
  return out;
})();

/* ── ตัวจัดตาราง ───────────────────────────────────────────
   จัดใหม่ทุกครั้งที่เปิดหน้า โดยเริ่มจาก "วันนี้" และ "สิ่งที่ยังไม่ได้ทำจริง"
   ข้ามไปกี่วันก็ตาม งานที่ค้างจะถูกดันมาข้างหน้าเสมอ ไม่หายไปตามปฏิทิน
   สูตรเดียวกับฝั่ง Python: น้ำหนักหัวข้อ × น้ำหนักวิชา × (1−ความแม่น) × ความเร่งด่วน */
function buildPlan(fromISO, nDays) {
  const pending = [];
  for (const [sc, s] of Object.entries(SUBJ)) {
    // สอบวิชานี้ไปแล้วก็ไม่ต้องอ่านต่อ — ไม่งั้นความเร่งด่วนจะพุ่งค้างตลอดกาล
    // (เวลาว่างก่อนเส้นตายเป็น 0 ทำให้ตัวหารเล็กจนดันวิชานั้นขึ้นบนสุดเสมอ)
    if (ST.deadlines[sc] && ST.deadlines[sc] < fromISO) continue;
    for (const t of s.topics) {
      const left = hoursLeftOf(t);
      if (left >= 0.25)
        pending.push({ subject: sc, code: t.code, name: t.name, weight: t.weight, left });
    }
  }

  // คิวทบทวน — จำลองต่อไปข้างหน้าโดยถือว่าทบทวนผ่าน
  const sim = new Map();
  for (const [code, rec] of Object.entries(S.topics))
    if (rec.next && TOPIC_OF.has(code)) sim.set(code, { next: rec.next, rep: rec.rep || 0 });

  const days = [];
  const cur = d(fromISO);

  for (let i = 0; i < nDays; i++) {
    const dayISO = iso(cur);
    // หักเวลาที่ทำไปแล้ววันนั้นออก — ทำครึ่งวันแล้วตารางจะเหลือแค่ส่วนที่ค้าง
    const logged = (S.log[dayISO] || []).reduce((a, x) => a + x.hours, 0);
    const capacity = Math.max(0, hoursFor(dayISO) - logged);
    const day = { date: dayISO, blocks: [],
                  note: hoursFor(dayISO) <= 0 ? "วันพัก" : (capacity <= 0 ? "ทำครบแล้ว" : "") };

    if (capacity > 0) {
      let usedReview = 0;
      const reviewBudget = capacity * ST.reviewShare;

      // 1) ทบทวนก่อน — ค้างนานสุดขึ้นก่อน
      const due = [...sim.entries()].filter(([, r]) => r.next <= dayISO)
        .sort((a, b) => (a[1].next < b[1].next ? -1 : 1));
      for (const [code, r] of due) {
        const t = TOPIC_OF.get(code);
        if (!t) continue;
        let need = Math.max(0.25, Math.round(t.hours * 0.25 * Math.pow(0.7, r.rep) * 4) / 4);
        need = Math.min(need, capacity - usedReview);
        if (need < 0.25) break;
        if (usedReview + need > reviewBudget && usedReview > 0) break;
        day.blocks.push({ kind: "review", subject: t.subject, topic: code,
                          topicName: t.name, hours: need, repetition: r.rep + 1 });
        usedReview += need;
        const gap = ST.reviewIntervals[Math.min(r.rep + 1, ST.reviewIntervals.length - 1)];
        const nx = d(dayISO); nx.setDate(nx.getDate() + gap);
        sim.set(code, { next: iso(nx), rep: r.rep + 1 });
      }

      // 2) อ่านใหม่ตามลำดับความคุ้ม
      let budget = capacity - usedReview;
      if (pending.length) {
        const remain = {}, urgency = {};
        for (const p of pending) remain[p.subject] = (remain[p.subject] || 0) + p.left;
        for (const sc of Object.keys(remain)) {
          const avail = learnHoursBetween(dayISO, ST.deadlines[sc] || dayISO);
          urgency[sc] = Math.min(5, Math.max(0.1, remain[sc] / Math.max(avail, 1)));
        }
        const score = p => p.weight * SUBJ_WEIGHT[p.subject] *
          (1 - masteryOf(p.code) / 100) * (urgency[p.subject] || 1);
        pending.sort((a, b) => score(b) - score(a));

        // หัวข้อที่ลงมือไปแล้ววันนี้ ให้ไปต่อคิวท้าย — จะได้ไม่เด้งกลับมาซ้ำ
        // ทันทีที่ติ๊กเสร็จ (มันยัง priority สูงสุดอยู่ เพราะยังอ่านไม่จบ)
        const workedToday = new Set((S.log[dayISO] || []).map(e => e.topic));
        if (workedToday.size) {
          const front = pending.filter(x => !workedToday.has(x.code));
          const back = pending.filter(x => workedToday.has(x.code));
          pending.length = 0;
          pending.push(...front, ...back);
        }
      }
      while (budget >= 0.25 && pending.length) {
        const p = pending[0];
        const chunk = Math.round(Math.min(ST.blockHours, p.left, budget) * 4) / 4;
        if (chunk < 0.25) break;
        day.blocks.push({ kind: "learn", subject: p.subject, topic: p.code,
                          topicName: p.name, hours: chunk, repetition: 0 });
        budget -= chunk;
        p.left = Math.round((p.left - chunk) * 4) / 4;
        pending.shift();
        if (p.left >= 0.25) {
          pending.push(p);          // เหลืออีก -> ต่อวันหลัง ไม่กองซ้ำวันเดียว
        } else {
          const nx = d(dayISO); nx.setDate(nx.getDate() + ST.reviewIntervals[0]);
          sim.set(p.code, { next: iso(nx), rep: 0 });
        }
      }
    }
    days.push(day);
    cur.setDate(cur.getDate() + 1);
  }
  return days;
}

/* ── ยังทันไหม ─────────────────────────────────────────────
   เทียบชั่วโมงที่ยังต้องอ่าน กับชั่วโมงว่างที่เหลือจริงก่อนถึงวันสอบแต่ละสนาม */
function outlook() {
  const byDeadline = {};
  for (const [sc, s] of Object.entries(SUBJ)) {
    const dl = ST.deadlines[sc];
    if (!dl || dl < TODAY) continue;   // สนามที่สอบไปแล้วไม่ต้องเตือนอีก
    byDeadline[dl] = (byDeadline[dl] || 0) + s.topics.reduce((a, t) => a + hoursLeftOf(t), 0);
  }
  return Object.entries(byDeadline).sort().map(([dl, need]) => {
    const avail = learnHoursBetween(TODAY, dl);
    const exam = DATA.exams.find(e => e.date === dl);
    const ratio = avail > 0 ? need / avail : (need > 0 ? 99 : 0);
    return {
      deadline: dl, need, avail, slack: avail - need,
      name: exam ? exam.name : dl,
      status: need <= 0 ? "done" : ratio <= 0.85 ? "ok" : ratio <= 1 ? "tight" : "over",
    };
  });
}

/* ── streak ───────────────────────────────────────────────── */
function streak() {
  let n = 0;
  const cur = d(TODAY);
  // วันนี้ยังไม่ได้ทำก็ยังไม่ตัด streak — เริ่มนับจากเมื่อวานแทน
  if (!(S.days[iso(cur)] > 0)) cur.setDate(cur.getDate() - 1);
  for (let i = 0; i < 400; i++) {
    if (!(S.days[iso(cur)] > 0)) break;
    n++; cur.setDate(cur.getDate() - 1);
  }
  return n;
}

function subjectStats() {
  const out = [];
  for (const [code, s] of Object.entries(SUBJ)) {
    const total = s.topics.length;
    const dn = s.topics.filter(t => isLearned(t.code)).length;
    const hoursDone = s.topics.reduce((a, t) => a + Math.min(hoursDoneOf(t.code), t.hours), 0);
    let seen = 0, ok = 0;
    for (const q of DATA.questions) {
      if (q.subject !== code) continue;
      const r = S.q[q.qid];
      if (r) { seen += r.seen; ok += r.ok; }
    }
    out.push({
      code, name: s.name, total, done: dn,
      pct: total ? (100 * dn / total) : 0,
      hoursDone, hoursTotal: s.hours,
      accuracy: seen ? (100 * ok / seen) : null, seen,
      topics: s.topics,
    });
  }
  return out.sort((a, b) => b.pct - a.pct);
}

/* ─────────────────────────────────────────────────────────────
   VIEW: วันนี้
   ───────────────────────────────────────────────────────────── */
/* ทำบล็อกเสร็จ: ลงชั่วโมงให้หัวข้อ บันทึกลงล็อกของวัน แล้วขยับคิวทบทวน
   ตารางที่เหลือจะถูกคำนวณใหม่เองจากชั่วโมงที่เหลือ ไม่ต้องแตะปฏิทิน */
function completeBlock(dayISO, b) {
  const rec = S.topics[b.topic] || {};

  if (b.kind === "learn") {
    rec.hoursDone = Number(rec.hoursDone || 0) + b.hours;
    const t = TOPIC_OF.get(b.topic);
    if (t && rec.hoursDone >= t.hours - 0.001 && !rec.learnedOn) {
      rec.learnedOn = dayISO;
      rec.rep = 0;
      const nx = d(dayISO); nx.setDate(nx.getDate() + ST.reviewIntervals[0]);
      rec.next = iso(nx);
    }
  } else {
    rec.rep = Number(rec.rep || 0) + 1;
    const gap = ST.reviewIntervals[Math.min(rec.rep, ST.reviewIntervals.length - 1)];
    const nx = d(dayISO); nx.setDate(nx.getDate() + gap);
    rec.next = iso(nx);
  }

  S.topics[b.topic] = rec;
  (S.log[dayISO] = S.log[dayISO] || []).push(
    { topic: b.topic, kind: b.kind, hours: b.hours, rep: b.repetition, subject: b.subject });
  S.days[dayISO] = Number(S.days[dayISO] || 0) + b.hours;
  Store.save();
}

function undoLogged(dayISO, index) {
  const entries = S.log[dayISO] || [];
  const e = entries[index];
  if (!e) return;
  const rec = S.topics[e.topic] || {};
  if (e.kind === "learn") {
    rec.hoursDone = Math.max(0, Number(rec.hoursDone || 0) - e.hours);
    const t = TOPIC_OF.get(e.topic);
    if (t && rec.hoursDone < t.hours - 0.001) { delete rec.learnedOn; delete rec.next; delete rec.rep; }
  } else {
    rec.rep = Math.max(0, Number(rec.rep || 0) - 1);
  }
  S.topics[e.topic] = rec;
  entries.splice(index, 1);
  S.days[dayISO] = Math.max(0, Number(S.days[dayISO] || 0) - e.hours);
  if (!S.days[dayISO]) delete S.days[dayISO];
  Store.save();
}

/* แถวที่เพิ่งถูกติ๊กในรอบ render นี้ — ใช้สั่งให้เครื่องหมายถูกวาดตัวเอง
   เก็บเป็นคีย์ธรรมดา ไม่ผูกกับ index เพราะรายการเรียงใหม่ทุกครั้งที่ render */
let justTicked = null;

function blockRow(dayISO, b, opts) {
  const o = opts || {};
  // ชื่อวิชาโผล่เฉพาะตอนที่ต่างจากแถวก่อนหน้า — ไม่งั้นชิป "TPAT1" จะซ้ำติดกัน 40 แถว
  const showSubj = o.showSubject !== false;
  const meta =
    (showSubj ? '<span class="blk-sub">' + esc(subjLabel(b.subject)) + "</span>" : "") +
    '<span class="chip">' + fmtHours(b.hours) + "</span>" +
    (b.kind === "review" && b.repetition > 1
      ? '<span class="chip">ครั้งที่ ' + b.repetition + "</span>" : "");

  const isJust = o.done && justTicked === dayISO + "|" + b.topic + "|" + b.kind;
  const btn = el(
    '<button class="blk ' + (o.done ? "done" : "") + (isJust ? " just" : "") + '">' +
      '<span class="blk-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg></span>' +
      '<span class="blk-body">' +
        '<span class="blk-name">' + esc(b.topicName) + "</span>" +
        '<span class="blk-meta">' + meta + "</span>" +
      "</span>" +
    "</button>"
  );
  btn.setAttribute("aria-pressed", o.done ? "true" : "false");
  if (o.readonly) { btn.disabled = true; btn.style.cursor = "default"; }
  else {
    btn.addEventListener("click", () => {
      if (o.done) { justTicked = null; undoLogged(dayISO, o.index); }
      else {
        justTicked = dayISO + "|" + b.topic + "|" + b.kind;
        completeBlock(dayISO, b);
        celebrate(dayISO);
      }
      render();
      justTicked = null;   // เล่นครั้งเดียว render รอบหน้าไม่ต้องเล่นซ้ำ
    });
  }

  const row = el('<div class="blk-row"></div>');
  btn.setAttribute("data-s", b.subject || "");
  row.appendChild(btn);
  const res = el('<button class="blk-res" aria-label="หาอ่านหัวข้อนี้">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9a3 3 0 0 1 3 3v11a2.5 2.5 0 0 0-2.5-2.5H4z"/><path d="M20 5h-2a3 3 0 0 0-3 3v11a2.5 2.5 0 0 1 2.5-2.5H20z"/></svg></button>');
  res.addEventListener("click", ev => { ev.stopPropagation(); openResources(b.topic); });
  row.appendChild(res);
  return row;
}

/* ── "จะไปอ่านที่ไหน" ──────────────────────────────────────
   ปุ่มค้นหายิงคำค้นจากชื่อหัวข้อจริง จึงไม่มีวันเสียแม้ลิงก์ใน config จะตาย
   ส่วนลิงก์ที่ผู้ใช้บันทึกเอง ผูกกับหัวข้อไปตลอด เจอของดีครั้งเดียวไม่ต้องหาซ้ำ */
const RES = DATA.resources || {};

function searchUrlsFor(topicName, subjectCode) {
  const engines = (RES.search && RES.search.engines) || [];
  const exam = (SUBJ[subjectCode] || {}).exam || "alevel";
  const suffix = ((RES.search || {}).suffix_by_exam || {})[exam] || "";
  const q = encodeURIComponent((topicName + " " + suffix).trim());
  return engines.map(e => ({ name: e.name, icon: e.icon || "🔍", url: e.url.replace("{q}", q) }));
}

function hubsFor(subjectCode) {
  return (RES.hubs || []).filter(h => {
    const subs = h.subjects || ["all"];
    return subs.includes("all") || subs.includes(subjectCode);
  });
}

const savedLinks = code => (S.links && S.links[code]) || [];

function resourceRow(icon, title, sub, href, onDelete) {
  const node = el(
    '<a class="res" target="_blank" rel="noopener noreferrer" href="' + esc(href) + '">' +
      '<span class="res-ico">' + esc(icon) + "</span>" +
      '<span class="res-b"><b>' + esc(title) + "</b>" +
        (sub ? "<span>" + esc(sub) + "</span>" : "") + "</span>" +
    "</a>");
  if (onDelete) {
    const del = el('<button class="res-del" aria-label="ลบลิงก์">×</button>');
    del.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); onDelete(); });
    node.appendChild(del);
  }
  return node;
}

function openResources(topicCode) {
  const t = TOPIC_OF.get(topicCode);
  if (!t) return;
  const old = $("#sheet"); if (old) old.remove();

  const back = el('<div class="sheet-back" id="sheet"></div>');
  const sheet = el('<div class="sheet"></div>');
  back.addEventListener("click", ev => { if (ev.target === back) back.remove(); });

  const hd = el('<div class="sheet-hd"><h2>' + esc(t.name) + "</h2></div>");
  const x = el('<button class="sheet-x" aria-label="ปิด">×</button>');
  x.addEventListener("click", () => back.remove());
  hd.appendChild(x);
  sheet.appendChild(hd);
  sheet.appendChild(el('<p class="tiny" style="margin:0 0 13px">' +
    esc(subjName(t.subject)) + " · " + t.hours + " ชม. · น้ำหนักออกสอบ " + t.weight + "/5</p>"));

  /* ค้นหา — ใช้ได้เสมอ */
  sheet.appendChild(el('<div class="section-title"><h2>ค้นหาหัวข้อนี้</h2></div>'));
  searchUrlsFor(t.name, t.subject).forEach(e =>
    sheet.appendChild(resourceRow(e.icon, "ค้นบน " + e.name, t.name, e.url)));

  /* ลิงก์ที่บันทึกเอง */
  sheet.appendChild(el('<div class="section-title" style="margin-top:15px"><h2>ลิงก์ของฉัน</h2></div>'));
  const mine = savedLinks(topicCode);
  if (mine.length) {
    mine.forEach((lk, i) => sheet.appendChild(
      resourceRow("★", lk.title || lk.url, lk.url, lk.url, () => {
        S.links[topicCode].splice(i, 1);
        if (!S.links[topicCode].length) delete S.links[topicCode];
        Store.save(); openResources(topicCode);
      })));
  } else {
    sheet.appendChild(el('<p class="tiny" style="margin:-2px 0 8px">เจอคลิปหรือสรุปที่ดี ' +
      "บันทึกไว้ตรงนี้ ครั้งหน้าไม่ต้องหาใหม่</p>"));
  }

  const addRow = el('<div class="btn-row" style="margin-top:6px"></div>');
  const urlIn = el('<input type="text" placeholder="วางลิงก์ที่นี่" ' +
    'style="flex:1;min-width:140px;font-family:inherit;font-size:13.5px;color:var(--text);' +
    'background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px">');
  const addBtn = el('<button class="btn btn-sm">บันทึก</button>');
  const add = () => {
    let v = urlIn.value.trim();
    if (!v) return;
    if (!/^https?:\/\//i.test(v)) v = "https://" + v;
    try { new URL(v); } catch (e) { alert("ลิงก์ไม่ถูกต้อง"); return; }
    S.links = S.links || {};
    (S.links[topicCode] = S.links[topicCode] || []).push({ url: v, title: "", saved: TODAY });
    Store.save(); openResources(topicCode);
  };
  addBtn.addEventListener("click", add);
  urlIn.addEventListener("keydown", ev => { if (ev.key === "Enter") add(); });
  addRow.appendChild(urlIn); addRow.appendChild(addBtn);
  sheet.appendChild(addRow);

  /* แหล่งรวม */
  const hubs = hubsFor(t.subject);
  if (hubs.length) {
    sheet.appendChild(el('<div class="section-title" style="margin-top:16px"><h2>แหล่งรวมของวิชานี้</h2></div>'));
    hubs.forEach(h => sheet.appendChild(
      resourceRow(h.verified ? "✓" : "↗", h.name, h.note || "", h.url)));
    sheet.appendChild(el('<p class="tiny" style="margin:6px 0 0">ลิงก์เหล่านี้มาจากการค้นเว็บ ' +
      "แต่ยังไม่ได้เปิดยืนยันทีละอัน ถ้าเจอลิงก์เสียแก้ได้ที่ config/tcas_resources.yaml</p>"));
  }

  back.appendChild(sheet);
  document.body.appendChild(back);
}

/* ── ตัวจับเวลาอ่านหนังสือ ─────────────────────────────────
   กดเริ่มแล้วเต็มจอ นับถอยหลังตามเวลาของบล็อกนั้น
   ครบเวลา (หรือกดจบก่อน) = ติ๊กบล็อกให้อัตโนมัติ */
let timerState = null;

function startTimer(b) {
  const secs = Math.round(b.hours * 3600);
  timerState = { block: b, total: secs, left: secs, paused: false, tick: null };
  renderTimer();
  timerState.tick = setInterval(() => {
    if (!timerState || timerState.paused) return;
    timerState.left -= 1;
    if (timerState.left <= 0) finishTimer(true);
    else updateTimerFace();
  }, 1000);
}

function finishTimer(complete) {
  if (!timerState) return;
  const b = timerState.block;
  clearInterval(timerState.tick);
  const node = $("#timer"); if (node) node.remove();
  timerState = null;
  if (complete) {
    justTicked = TODAY + "|" + b.topic + "|" + b.kind;
    completeBlock(TODAY, b);
    celebrate(TODAY);
  }
  render();
  justTicked = null;
}

function fmtClock(s) {
  const m = Math.floor(s / 60), r = s % 60;
  return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
}

function updateTimerFace() {
  if (!timerState) return;
  const n = $("#timerN"); if (n) n.textContent = fmtClock(Math.max(0, timerState.left));
  const ring = $("#timerFg");
  if (ring) {
    const C = 2 * Math.PI * 82;
    ring.style.strokeDasharray = C;
    ring.style.strokeDashoffset = C * (1 - timerState.left / timerState.total);
  }
}

function renderTimer() {
  const b = timerState.block;
  const node = el(
    '<div class="timer" id="timer" role="dialog" aria-label="กำลังจับเวลา" ' +
      'data-s="' + esc(b.subject || "") + '">' +
      '<div class="timer-topic">' + esc(b.topicName) + "</div>" +
      '<svg class="timer-ring" viewBox="0 0 180 180" aria-hidden="true">' +
        '<circle class="bg" cx="90" cy="90" r="82"/>' +
        '<circle class="fg" id="timerFg" cx="90" cy="90" r="82"/>' +
      "</svg>" +
      '<div class="timer-n" id="timerN">' + fmtClock(timerState.left) + "</div>" +
      '<div class="timer-sub">' + (b.kind === "review" ? "ทบทวน" : "อ่านใหม่") +
        " · " + esc(subjLabel(b.subject)) + "</div>" +
      '<div class="timer-btns">' +
        '<button class="btn" id="tPause">พัก</button>' +
        '<button class="btn btn-pri" id="tDone">ทำเสร็จแล้ว</button>' +
        '<button class="btn" id="tQuit">ยกเลิก</button>' +
      "</div>" +
    "</div>");
  document.body.appendChild(node);
  updateTimerFace();

  $("#tPause").addEventListener("click", () => {
    timerState.paused = !timerState.paused;
    $("#tPause").textContent = timerState.paused ? "ไปต่อ" : "พัก";
  });
  $("#tDone").addEventListener("click", () => finishTimer(true));
  $("#tQuit").addEventListener("click", () => finishTimer(false));
}

/* ฟีดแบ็กตอนทำเสร็จ — เงียบ ๆ ตอนทำได้ทีละบล็อก และชัดขึ้นเมื่อครบทั้งวัน */
let toastTimer = null;
function celebrate(dayISO) {
  const left = buildPlan(dayISO, 1)[0].blocks.length;
  const st = streak();
  const msg = left === 0
    ? { big: "ครบแล้ววันนี้", sub: st > 1 ? "ต่อเนื่อง " + st + " วันติด 🔥" : "เริ่มนับ streak แล้ว" }
    : { big: "บันทึกแล้ว", sub: "เหลืออีก " + left + " บล็อก" };

  const old = $("#toast"); if (old) old.remove();
  const node = el(
    '<div id="toast" class="toast' + (left === 0 ? " toast-big" : "") + '">' +
      '<span class="toast-big-t">' + esc(msg.big) + "</span>" +
      '<span class="toast-sub">' + esc(msg.sub) + "</span>" +
    "</div>");
  document.body.appendChild(node);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.remove(), left === 0 ? 3200 : 1700);
  // กระดาษปลิวเฉพาะตอนปิดครบทั้งวัน — ปิดบล็อกเดียวได้แค่ toast
  if (left === 0) confetti();
}

/* ─────────────────────────────────────────────────────────────
   เปิดใช้ครั้งแรก — สามคำถาม ไม่ใช่การ์ดอธิบายใบเดียว

   คำถามถูกเลือกจากสิ่งที่ตารางต้องใช้จริง: เป้าหมายกำหนดว่าต้องได้กี่คะแนน
   เวลาว่างกำหนดว่าตารางยาวแค่ไหน และจุดที่อ่านถึงแล้วกันไม่ให้แอปสั่งอ่านซ้ำ
   ทุกข้อข้ามได้ เพราะการบังคับกรอกตั้งแต่วินาทีแรกทำให้คนปิดแอปหนี
   ───────────────────────────────────────────────────────────── */
let onbStep = 0;
const onbDraft = { target: "", hours: null, done: {} };

function onbNext() { onbStep += 1; render(); }

function onbFinish() {
  if (onbDraft.target)
    S.settings = Object.assign({}, S.settings, { targetProgram: onbDraft.target });
  if (onbDraft.hours)
    S.settings = Object.assign({}, S.settings, { hoursByWeekday: onbDraft.hours });

  // แปลง "อ่านไปแล้วกี่ %" ของแต่ละวิชา เป็นชั่วโมงที่ลงให้หัวข้อต้น ๆ ของวิชานั้น
  // ไล่จากหัวข้อแรกไปเรื่อย ๆ เพราะหลักสูตรเรียงตามลำดับการสอนอยู่แล้ว
  for (const [code, pct] of Object.entries(onbDraft.done)) {
    const subj = SUBJ[code];
    if (!subj || !pct) continue;
    let budget = subj.hours * pct / 100;
    for (const t of subj.topics) {
      if (budget <= 0) break;
      const give = Math.min(t.hours, budget);
      const rec = S.topics[t.code] || {};
      rec.hoursDone = Number(rec.hoursDone || 0) + give;
      if (rec.hoursDone >= t.hours - 0.001 && !rec.learnedOn) {
        rec.learnedOn = TODAY;
        rec.rep = 0;
        const nx = d(TODAY); nx.setDate(nx.getDate() + ST.reviewIntervals[0]);
        rec.next = iso(nx);
      }
      S.topics[t.code] = rec;
      budget -= give;
    }
  }

  S.seenIntro = true;
  Store.save();
  location.reload();   // ST คำนวณตอนโหลด — โหลดใหม่ให้ตารางคิดจากค่าที่เพิ่งตั้ง
}

function onbShell(step, title, sub, bodyNode, opts) {
  const o = opts || {};
  const card = el('<div class="card"></div>');
  card.appendChild(el(
    '<div class="dayband" data-s="' + esc(o.tint || "tpat1") + '">' +
      '<div class="dayband-t">' +
        '<div class="dayband-sub">ขั้นที่ ' + (step + 1) + " จาก 3</div>" +
        "<h2>" + esc(title) + "</h2>" +
        '<div class="dayband-sub">' + esc(sub) + "</div>" +
      "</div>" +
    "</div>"));
  const body = el('<div class="card-pad stack"></div>');
  body.appendChild(bodyNode);

  const row = el('<div class="btn-row" style="margin-top:4px"></div>');
  const next = el('<button class="btn btn-pri">' +
    (step === 2 ? "เริ่มใช้เลย" : "ถัดไป") + "</button>");
  next.addEventListener("click", step === 2 ? onbFinish : onbNext);
  row.appendChild(next);
  const skip = el('<button class="btn">ข้าม</button>');
  skip.addEventListener("click", step === 2 ? onbFinish : onbNext);
  row.appendChild(skip);
