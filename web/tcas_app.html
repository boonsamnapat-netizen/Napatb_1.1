      "ไฟล์นั้นจะถูกเขียนทับให้เอง ไม่ต้องกดสำรองอีก</p>"));
    const ab = el('<div class="btn-row"></div>');
    const pick = el('<button class="btn btn-sm">เลือกไฟล์สำรองอัตโนมัติ</button>');
    pick.addEventListener("click", async () => {
      try { await Vault.chooseBackupFile(); alert("ตั้งไฟล์สำรองอัตโนมัติแล้ว"); render(); }
      catch (e) { /* ผู้ใช้กดยกเลิก */ }
    });
    ab.appendChild(pick);
    Vault.getHandle().then(h => {
      if (!h) return;
      const off = el('<button class="btn btn-sm">เลิกสำรองอัตโนมัติ</button>');
      off.addEventListener("click", async () => { await Vault.dropHandle(); render(); });
      ab.appendChild(off);
    });
    vault.appendChild(ab);
  } else {
    vault.appendChild(el('<p class="tiny" style="margin:4px 0 0">เบราว์เซอร์นี้ ' +
      "(Safari บน iPhone รวมอยู่ด้วย) ยังเขียนไฟล์สำรองอัตโนมัติไม่ได้ " +
      "ต้องกดสำรองเองเป็นระยะ — ตั้งเตือนในปฏิทินเดือนละครั้งก็พอ</p>"));
  }
  wrap.appendChild(vault);

  /* ---- ธีม */
  const th = el('<div class="card card-pad stack"></div>');
  th.appendChild(el('<div class="section-title"><h2>ธีมสี</h2></div>'));
  th.appendChild(el('<p class="tiny" style="margin:-8px 0 0">อ่านหนังสือกลางคืนแล้วจอสว่างแสบตา ' +
    "เลือกมืดค้างไว้ได้ ไม่ต้องรอให้ระบบสลับให้</p>"));
  const thRow = el('<div class="btn-row"></div>');
  const cur = (S.settings || {}).theme || "system";
  [["system", "ตามระบบ"], ["light", "สว่าง"], ["dark", "มืด"]].forEach(([val, label]) => {
    const btn = el('<button class="btn btn-sm' + (cur === val ? " btn-pri" : "") + '">' +
      esc(label) + "</button>");
    btn.addEventListener("click", () => {
      S.settings = Object.assign({}, S.settings, { theme: val });
      Store.save();
      applyTheme();
      render();
    });
    thRow.appendChild(btn);
  });
  th.appendChild(thRow);
  wrap.appendChild(th);

  /* ---- คืนค่าเริ่มต้น */
  const rst = el('<div class="card card-pad stack"></div>');
  rst.appendChild(el('<p class="tiny" style="margin:0">ค่าที่ตั้งที่นี่เก็บในเครื่องนี้เท่านั้น ' +
    "และทับค่าที่มากับตัวแอป</p>"));
  const rb = el('<button class="btn btn-sm">คืนค่าเริ่มต้น</button>');
  rb.addEventListener("click", () => {
    if (!confirm("คืนค่าเวลาว่างและวันหยุดกลับเป็นค่าเริ่มต้น?")) return;
    S.settings = {}; Store.save(); location.reload();
  });
  rst.appendChild(rb);
  wrap.appendChild(rst);

  root.appendChild(wrap);
}

/* ─────────────────────────────────────────────────────────────
   ROUTER
   ───────────────────────────────────────────────────────────── */
let current = "today";
const VIEWS = { today: viewToday, plan: viewPlan, tests: viewTests,
                quiz: viewQuiz, progress: viewProgress, settings: viewSettings };

function swapView(name) {
  current = name;
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", t.dataset.view === name ? "true" : "false"));
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  $("#v-" + name).classList.add("on");
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

function go(name) {
  // View Transitions ทำให้เนื้อหาไขว้กันสั้น ๆ แทนที่จะกระตุกเปลี่ยนทันที
  // เบราว์เซอร์ที่ยังไม่รองรับ (Firefox ก่อน 144, Safari ก่อน 18.2) ตกมาทางปกติ
  if (document.startViewTransition && !reduced()) {
    document.startViewTransition(() => swapView(name));
  } else {
    swapView(name);
  }
}

document.querySelectorAll(".tab").forEach(t =>
  t.addEventListener("click", () => go(t.dataset.view)));
$("#gearBtn").addEventListener("click", () => go(current === "settings" ? "today" : "settings"));

function syncStickyOffset() {
  const bar = document.querySelector(".topbar");
  const tabs = document.querySelector(".tabs");
  let top = bar ? bar.getBoundingClientRect().height : 58;
  // บนจอกว้าง แท็บเป็น sticky ต่อจากแถบบน จึงต้องบวกความสูงแท็บด้วย
  if (tabs && getComputedStyle(tabs).position === "sticky")
    top += tabs.getBoundingClientRect().height;
  document.documentElement.style.setProperty("--stick", Math.round(top) + "px");
}

/* ผูกไฟล์สำรองอัตโนมัติเข้ากับทุกครั้งที่ข้อมูลเปลี่ยน
   ทำหลัง Vault ถูกประกาศครบแล้ว จึงอยู่ตรงนี้ไม่ใช่ในตัว Store */
/* ธีมที่ผู้ใช้เลือกทับค่าของระบบ — data-theme บน <html> ชนะ media query
   (สคริปต์เล็ก ๆ ใน <head> ตั้งค่านี้ไว้ก่อนวาดหน้าแรกแล้ว กันหน้าขาววาบ) */
function applyTheme() {
  const t = (S.settings || {}).theme;
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}
applyTheme();

Store.subscribe(() => { Vault.autoBackup(); });

function render() {
  renderTop();
  VIEWS[current]();
  syncStickyOffset();
  runCounters();
}
