# Config for the affiliate clip bot (affiliate_bot.py / src/affiliate/).
# Nothing here is a secret: ${VAR} placeholders are resolved from the
# environment at runtime, so keys live in GitHub Actions secrets.

affiliate:
  # Telegram user ids allowed to drive the bot. EMPTY = anyone who finds the
  # bot can trigger a (paid) render — send it any message and it replies with
  # your id, then paste it here.
  allowed_user_ids: []
  # Hard stop on renders per UTC day. The point is the paid path: an
  # image-to-video vendor bills per generation.
  daily_render_limit: 50

  work_dir: "data/affiliate"              # per-job photo + rendered clip
  state_path: "data/affiliate_state.json" # job state, committed between runs
  http_timeout_s: 60

  vision:
    # Reads the product name off the photo. Needs ANTHROPIC_API_KEY;
    # without it the bot asks you to type the product name instead.
    model: "claude-sonnet-4-6"

  video:
    # "ffmpeg" is free and instant — good for drafting. Switch to "ai" for the
    # clip you actually intend to post; it bills per generation.
    provider: "ffmpeg"    # "ai" | "ffmpeg"
    duration: 8

    ffmpeg:
      burn_text: true
      # Thai needs a Thai-capable font; leave null to auto-detect a known one.
      font_path: null

    ai:
      # --- Replicate: fits this adapter with no code changes ---------------
      # One POST, and a single GET poll that carries BOTH status and output.
      # Swap models by editing `model:` alone. Set REPLICATE_API_TOKEN and
      # flip provider to "ai" above.
      # UNVERIFIED: the model slug and its exact input schema (duration vs
      # duration_seconds, allowed aspect_ratio values) were not confirmed
      # against the model page — check before spending money.
      submit_url: "https://api.replicate.com/v1/predictions"
      headers:
        Authorization: "Bearer ${REPLICATE_API_TOKEN}"
        Prefer: "wait=60"     # if it finishes inside 60s the poll loop is skipped
      payload:
        model: "google/veo-3.1-fast"
        input:
          image: "data:image/jpeg;base64,{image_b64}"
          prompt: "{prompt}"
          duration: 8         # literal int — "{duration}" would send a string
          aspect_ratio: "9:16"
          resolution: "720p"
      prompt: >-
        8-second vertical (9:16) product video: {hook}. Slow cinematic push-in
        on the product, soft studio light, clean background, no text overlay.
      result_path: "output"   # a model returning a list needs "output.0"
      job_id_path: "id"
      poll_url: "https://api.replicate.com/v1/predictions/{job_id}"
      poll_status_path: "status"
      poll_done_values: ["succeeded"]
      poll_failed_values: ["failed", "canceled", "cancelled"]
      poll_interval_s: 5
      poll_timeout_s: 420     # image-to-video runs 1-4 min; 300 is too tight
      http_timeout_s: 120
      max_image_bytes: 1000000    # downscale bigger photos before base64
      authenticated_download: false   # true for vendors that gate the mp4 (Veo direct)
      # result_url: ""        # only for queue APIs whose /status omits the
                              # output (fal.ai): a second GET after success.

  finders:
    # All disabled: none of these are implemented yet, and until one is the bot
    # asks you to paste the listings you want compared.
    #
    # Start with the NETWORKS, not the platforms: a free publisher account at
    # Involve Asia or ACCESSTRADE TH issues an API key without a registered
    # company, and both carry Lazada Thailand and TikTok Shop Thailand offers.
    # Lazada Open Platform wants a business licence, and a public "Lazada
    # affiliate API" could not be confirmed to exist at all.
    involve_asia:
      enabled: false
      api_key: "${INVOLVE_API_KEY}"
      api_secret: "${INVOLVE_API_SECRET}"
      endpoint: ""
    accesstrade:
      enabled: false
      api_key: "${ACCESSTRADE_API_KEY}"
      api_secret: "${ACCESSTRADE_API_SECRET}"
      endpoint: ""

    lazada:
      enabled: false
      app_key: "${LAZADA_APP_KEY}"
      app_secret: "${LAZADA_APP_SECRET}"
      endpoint: ""
    tiktok:
      enabled: false
      app_key: "${TIKTOK_APP_KEY}"
      app_secret: "${TIKTOK_APP_SECRET}"
      endpoint: ""
