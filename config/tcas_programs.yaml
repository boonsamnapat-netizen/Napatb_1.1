# คณะในระบบ กสพท — ใช้จัดอันดับและประเมินโอกาส
#
# ✅ คะแนนต่ำสุดในไฟล์นี้เป็น **ข้อมูลจริง** ถอดจากประกาศ
#    "สถิติการคัดเลือกกลางบุคคลเข้าศึกษาในสถาบันอุดมศึกษา (TCAS)
#     ปีการศึกษา 2569 รอบที่ 3 การประมวลผลครั้งที่ 1"
#    ข้อมูล ณ วันที่ 20 พ.ค. 2569 (ปรับปรุง 19/5/2569 23.00 น.)
#    ผู้ใช้เป็นผู้ส่งภาพประกาศมาให้ ไม่ใช่ค่าที่ระบบเดาขึ้นเอง
#
# รายชื่อสาขาครบทั้ง **58 สาขา** ตามประกาศ กสพท ฉบับที่ 1 ปีการศึกษา 2569
# (แพทย์ 24 · ทันตแพทย์ 13 · สัตวแพทย์ 10 · เภสัช 11 — รวมรับ 2,315 ที่นั่ง)
#
# ⚠️ ข้อควรรู้ก่อนใช้ตัดสินใจ
#    1. เป็นสถิติของ **ปีการศึกษา 2569** ไม่ใช่ 2570 ที่กำลังจะสอบ
#       คะแนนแต่ละปีขยับได้ตามความยากข้อสอบและจำนวนผู้สมัคร
#    2. เป็น **การประมวลผลครั้งที่ 1** ของรอบ 3 ตัวเลขหลังประมวลผล
#       ครั้งที่ 2 (รับตรงอิสระ/สละสิทธิ์) อาจต่างไปจากนี้
#    3. คณะที่ยังไม่มี cutoffs คือแถวที่อยู่ในหน้าที่ยังไม่ได้ส่งภาพมา
#       ไม่ใช่ว่าไม่ได้เข้าร่วม กสพท — ดูหมายเหตุท้ายไฟล์
#    4. รายชื่อสถาบันที่เข้าร่วม กสพท เปลี่ยนได้ทุกปี
#
# cutoffs    = คะแนนรวม กสพท เต็ม 100 ของ "คนสุดท้ายที่ผ่าน"
# top        = คะแนนสูงสุดของผู้ผ่านในคณะนั้น (ไว้ดูช่วงคะแนน ไม่ได้ใช้คำนวณ)
# seats      = จำนวนที่ประกาศรับ · applicants = จำนวนผู้สมัคร
# university = ชื่อสถาบัน แยกจาก faculty เพื่อให้กรองในแอปได้ทั้งสองแกน
#              ("อยากเข้าทันตะ" กับ "อยากอยู่ ม.ธรรมศาสตร์" เป็นคนละคำถาม)

