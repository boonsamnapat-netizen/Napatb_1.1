# โครงสร้างข้อสอบจริง — ใช้กำหนดว่าคลังข้อสอบควรมีสัดส่วนแบบไหน
#
# ⚠️ ทุกค่าในไฟล์นี้ verified: false
#    เก็บจากผลค้นเว็บ (สรุปเป็นข้อความ) ไม่ได้เปิดเอกสารต้นทางเอง —
#    เครื่องที่สร้างไฟล์นี้เข้า mytcas.com ไม่ได้ (egress proxy บล็อก)
#    ตัวเลขพวกนี้จึงเป็น "ของมือสอง" ใช้เป็นเข็มทิศจัดสัดส่วนคลังข้อสอบได้
#    แต่ห้ามเอาไปโชว์ในแอปว่าเป็นข้อเท็จจริงที่ยืนยันแล้ว
#
#    วิธียืนยัน: เปิด https://www.mytcas.com/blueprint/ แล้วเทียบทีละวิชา
#    (URL ของแต่ละวิชาอยู่ในช่อง source ด้านล่าง) เจอค่าที่ต่างให้แก้ตรงนี้
#    แล้วเปลี่ยน verified เป็น true พร้อมใส่ verified_on
#
# โครงสร้างนี้ไม่ได้ถูกอ่านโดยตัวแอป — เป็นเอกสารอ้างอิงสำหรับคนเขียนข้อสอบ
# ว่าควรเพิ่มข้อในวิชา/หัวข้อไหน ดู `python tcas_cli.py bank` ประกอบ

source_note: >-
  เก็บเมื่อ 2026-09-03 จากผลค้นเว็บ ไม่ใช่จากเอกสาร ทปอ. โดยตรง
  ปีที่อ้างถึงคือ TCAS68 (ปีการศึกษา 2568) เป็นหลัก ซึ่งเป็นชุดล่าสุด
  ที่หาข้อมูลได้ — โครงสร้างของปี 2570 ที่กำลังจะสอบยังไม่ประกาศ

