# ── สิ่งที่ตัวเลขข้างบนบอกเกี่ยวกับคลังข้อสอบของเรา ────────────────
#
# เทียบ "จำนวนข้อในข้อสอบจริง" กับ "จำนวนข้อในคลัง" ณ 2026-09-03:
#
#   วิชา        ข้อสอบจริง   คลังมี   น้ำหนัก กสพท
#   อังกฤษ          80         44         14%      ← ข้อสอบใหญ่สุด แต่คลังน้อยเป็นอันดับสอง
#   TPAT1          100         73         30%      ← น้ำหนักสูงสุด แต่คลังน้อยกว่าชีวะเกือบครึ่ง
#   ไทย             50         41          7%
#   ชีววิทยา         40        134         ~9%      ← คลังเกินรูปข้อสอบไปมาก
#   เคมี            35         82         ~9%
#   สังคม           35         39          7%
#   ฟิสิกส์          30         96         ~9%      ← เกินเช่นกัน
#   คณิต 1          30         83         14%
#
# ข้อสรุป: คลังเบ้ไปทางวิทยาศาสตร์ ทั้งที่อังกฤษกับ TPAT1 รวมกันคือ 44%
# ของคะแนน กสพท และเป็นสองสนามที่ข้อสอบยาวที่สุด — เติมสองอันนี้ก่อน
