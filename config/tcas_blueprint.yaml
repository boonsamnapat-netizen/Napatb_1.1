        questions: 1         # 1 บทความ (นับเป็นชุด ไม่ใช่ข้อเดี่ยว)
        minutes: 60
        answer_symbols: [A, D, F, H]
        answer_format: "รหัส 3 ตัวอักษร เช่น 03A · 04D · 07F ระบายลงกระดาษคำตอบ"
