    weight_pct: 30          # น้ำหนักในคะแนนรวม กสพท
    verified: false
    source: https://www.ondemand.in.th/tpat1-2/
    source_year: 2568
    parts:
      - name: เชาวน์ปัญญา
        questions: 45
        minutes: 75
      - name: จริยธรรมทางการแพทย์
        questions: 55
        minutes: 60
