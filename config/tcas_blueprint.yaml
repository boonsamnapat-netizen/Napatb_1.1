# ── สิ่งที่ตัวเลขข้างบนบอกเกี่ยวกับคลังข้อสอบของเรา ────────────────
#
# ⚠️ ตารางรุ่นแรกของบล็อกนี้ใช้ "สังคม 35 ข้อ" ซึ่งผิด (ที่ถูกคือ 50) และเขียนว่า
#    อังกฤษ "คลังน้อยเป็นอันดับสอง" ซึ่งก็ผิด (เป็นอันดับสาม) แก้แล้ว 2026-09-03
#
#   วิชา        ข้อสอบจริง   คลังก่อน  คลังหลัง   น้ำหนัก กสพท
#   อังกฤษ          80         44        84        14%
#   TPAT1          100*        73       105        30%    ← น้ำหนักสูงสุด
#   ไทย             50         41        59         7%
#   สังคม           50         39        55         7%
#   ชีววิทยา         40        134       140        ~9%
#   เคมี            35         82        91        ~9%
#   ฟิสิกส์          30         96        96        ~9%
#   คณิต 1          30         83        83        14%
#
#   * TPAT1 "100 ข้อ" นับเฉพาะเชาวน์ 45 + จริยธรรม 55 — พาร์ตเชื่อมโยงเป็น
#     1 บทความ (ราว 20 รหัสคำตอบ) และคิดเป็น 100 จาก 300 คะแนน ตัวเลข 100
#     จึงต่ำกว่าปริมาณงานจริงอยู่หนึ่งในสาม อย่าใช้เทียบตรง ๆ
#
# ── ข้อควรระวังเรื่องวิธีวัด ──────────────────────────────────────
#
# "จำนวนข้อในข้อสอบจริง" เป็นเข็มทิศหยาบ ๆ ของ *ความกว้างของเนื้อหา* เท่านั้น
# ไม่ใช่เกณฑ์ที่ถูกต้องสำหรับจัดสัดส่วนคลังฝึก เพราะ
#   - น้ำหนักคะแนนสำคัญกว่าความยาวข้อสอบ (TPAT1 30% ปะทะ ฟิสิกส์ ~9%)
#   - หนึ่งข้อฟิสิกส์กินเวลาฝึกมากกว่าหนึ่งช่องว่าง cloze อังกฤษหลายเท่า
#   - พาร์ตเชื่อมโยงพิสูจน์ว่าการนับ "ข้อ" ใช้ไม่ได้กับทุกพาร์ต
#
# **เกณฑ์ที่ควรใช้จริงคือ weight_pct** ซึ่งให้ข้อสรุปเดียวกันแต่ไม่ต้องพึ่ง
# ตัวเลขมือสอง: ก่อนเติม TPAT1 มี 30% ของคะแนนแต่มีแค่ 12% ของคลัง
