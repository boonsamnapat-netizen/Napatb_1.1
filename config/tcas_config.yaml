# TCAS70 — ระบบเตรียมสอบแพทย์ (กสพท)
#
# ค่าที่มี `verified: true` ถอดมาจากเอกสารจริงที่ผู้ใช้ส่งภาพมาให้ ไม่ใช่ค่าที่ระบบเดา
# ค่าที่ยัง `verified: false` เป็นการประมาณจากรูปแบบปีก่อน ต้องเทียบกับประกาศจริงก่อนใช้
# ไล่ดูทั้งหมดได้ด้วย  python tcas_cli.py verify
#
# `source_year` = ปีการศึกษาของเอกสารที่ใช้ยืนยัน ถ้าไม่เท่ากับ target_year แปลว่า
# ยืนยันแล้วจริง แต่เป็นเกณฑ์ของปีที่แล้ว ซึ่ง กสพท เปลี่ยนได้ — verify จะเตือนไว้

# ปีการศึกษาที่กำลังเตรียมสอบ (พ.ศ.)
target_year: 2570

student:
  name: "Napat"
  # ระดับชั้นปัจจุบัน (ใช้เตือนว่าเหลือเวลากี่เทอม)
  grade: "ม.6"
  # เป้าหมายอันดับ 1 (รหัสจาก config/tcas_programs.yaml)
  target_program: "cu_med"

# ---------------------------------------------------------------- ปฏิทินสอบ
# ✅ วันสอบทั้งหมดถอดจาก "ปฏิทินการสมัครสอบและปฏิทินการสอบ TCAS70" ของ ทปอ./mytcas.com
# counts_toward_kaspot: สนามนี้มีน้ำหนักในคะแนน กสพท หรือไม่
#   true  = ตัวนับถอยหลังหลักของแอปจะยึดสนามนี้
#   false = ยังแสดงในปฏิทิน แต่ไม่ใช่เป้าหมายหลัก (เช่น TGAT ใช้ยื่นรอบอื่น
#           ไม่ได้อยู่ในสูตร กสพท ซึ่งคิดจาก TPAT1 30% + A-Level 70% เท่านั้น)
exams:
  tgat_tpat:
    # 30 ม.ค. TPAT3+TGAT · 31 ม.ค. TPAT5+TPAT2 · 1 ก.พ. TPAT4 — สอบด้วยกระดาษเท่านั้น
    name: "TGAT / TPAT2-5 (กระดาษ)"
    date: "2027-01-30"
    verified: true
    source: "ปฏิทิน TCAS70 (ทปอ. / mytcas.com)"
    source_year: 2570
    counts_toward_kaspot: false
  tpat1:
    name: "TPAT1 วิชาเฉพาะ กสพท (กระดาษ)"
    date: "2027-02-13"
    verified: true
    source: "ปฏิทิน TCAS70 — สอบ 13 ก.พ. 70 จัดสอบโดย กสพท"
    source_year: 2570
    counts_toward_kaspot: true
  alevel:
    # กสพท ใช้ 7 วิชา ซึ่งสอบวันที่ 13-14 มี.ค. (15 มี.ค. เป็น Math2/Sci/ภาษาต่างประเทศ)
    name: "A-Level (7 วิชาที่ กสพท ใช้)"
    date: "2027-03-13"
    verified: true
    source: "ปฏิทิน TCAS70 — สอบ 13-15 มี.ค. 70"
    source_year: 2570
    counts_toward_kaspot: true

# ตารางสอบรายวิชา — ใช้แทนวันสอบรวมของสนามนั้นเมื่อคำนวณเส้นตาย
# ทำให้ตารางอ่านแม่นขึ้น: ชีวะ/ฟิสิกส์/ไทย/สังคม ต้องพร้อมก่อนคณิต/อังกฤษ/เคมี หนึ่งวัน
subject_schedule:
  tpat1:  {date: "2027-02-13", time: "08.30-12.30"}
  bio:    {date: "2027-03-13", time: "08.30-10.00"}
  phys:   {date: "2027-03-13", time: "11.00-12.30"}
  thai:   {date: "2027-03-13", time: "13.30-15.00"}
  social: {date: "2027-03-13", time: "15.30-17.00"}
  math1:  {date: "2027-03-14", time: "08.30-10.00"}
  eng:    {date: "2027-03-14", time: "11.00-12.30"}
  chem:   {date: "2027-03-14", time: "13.30-15.00"}

# วันสมัคร/ยื่นคะแนนแต่ละรอบ (ใช้เตือนล่วงหน้า + ลงปฏิทิน .ics)
# verified: true = อยู่ในปฏิทิน TCAS70 ที่ประกาศแล้ว
milestones:
  - date: "2026-07-15"
    label: "เปิดลงทะเบียน student.mytcas.com + TCASFolio"
    verified: true
  - date: "2026-11-04"
    label: "สมัครสอบ TGAT/TPAT2-5 (4-10 พ.ย. 69)"
    verified: true
  - date: "2026-12-07"
    label: "พิมพ์บัตรที่นั่งสอบ TGAT/TPAT2-5 (ถึง 1 ก.พ. 70)"
    verified: true
  - date: "2027-01-14"
    label: "สมัครสอบ A-Level (14-20 ม.ค. 70)"
    verified: true
  - date: "2027-01-21"
    label: "วันสุดท้ายรับคำร้องสมัครสอบ A-Level ล่าช้า (21-22 ม.ค. 70)"
    verified: true
  - date: "2027-02-15"
    label: "พิมพ์บัตรที่นั่งสอบ A-Level (ถึง 15 มี.ค. 70)"
    verified: true
  - date: "2027-02-28"
    label: "ประกาศผลคะแนน TGAT/TPAT2-5"
    verified: true
  - date: "2027-03-26"
    label: "ประกาศเฉลยคำตอบ A-Level"
    verified: true
  # ── ยังไม่ประกาศ: ประมาณจากปฏิทินปี 2569 ────────────────────────
  # ปี 2569 สมัคร TPAT1 วันที่ 1-20 ต.ค. 2568 (ราว 4 เดือนก่อนสอบ)
  - date: "2026-10-01"
    label: "สมัครสอบ TPAT1 กสพท (คาดการณ์ — รอประกาศ กสพท)"
    verified: false
  - date: "2027-05-06"
    label: "รอบ 3 Admission ยื่นคะแนน (คาดการณ์)"
    verified: false
  - date: "2027-05-20"
    label: "ประกาศผลรอบ 3 ครั้งที่ 1 (คาดการณ์)"
    verified: false

# ------------------------------------------------------------ เกณฑ์ กสพท
# ✅ ถอดจาก "ประกาศกลุ่มสถาบันแพทยศาสตร์แห่งประเทศไทย ฉบับที่ 1 เรื่อง หลักเกณฑ์
#    การคัดเลือกบุคคลเข้าศึกษา ... ปีการศึกษา 2569" (ประกาศ ณ 2 ก.ย. 2568) ข้อ 4
#
# ⚠️ เป็นเกณฑ์ของ **ปีการศึกษา 2569** — ประกาศฉบับที่ 1 ของปี 2570 ยังไม่ออก
#    ตัวเลขชุดนี้นิ่งมาหลายปีแล้ว แต่ กสพท เปลี่ยนได้ทุกปี
#
# น้ำหนักคะแนนรวม 100% : TPAT1 30% + A-Level 70%
# ตัวเลข alevel_split เป็น "สัดส่วนภายใน 70%" (รวมกันต้องได้ 100)
# => น้ำหนักจริงเทียบ 100: TPAT1 30 · วิทย์ 28 · คณิต1 14 · อังกฤษ 14 · ไทย 7 · สังคม 7
kaspot:
  verified: true
  source: "ประกาศ กสพท ฉบับที่ 1 ปีการศึกษา 2569 (2 ก.ย. 2568) ข้อ 4"
  source_year: 2569
  tpat1_weight: 30.0
  alevel_weight: 70.0
  alevel_split:
    science: 40.0      # ฟิสิกส์ + เคมี + ชีววิทยา (เฉลี่ยเท่ากัน)
    math1: 20.0        # คณิตศาสตร์ประยุกต์ 1
    english: 20.0
    thai: 10.0
    social: 10.0

  # เกณฑ์ขั้นต่ำ — ต่ำกว่านี้ถือว่า "ตกเกณฑ์" ไม่ว่าคะแนนรวมจะสูงแค่ไหน
  #
  # ประกาศเขียนไว้ว่า "ต้องได้คะแนนไม่น้อยกว่า 30% ของคะแนนเต็ม**ในแต่ละวิชา**"
  # คำว่า *แต่ละวิชา* สำคัญมาก: ฟิสิกส์ 20 / เคมี 40 / ชีวะ 40 เฉลี่ยกลุ่มได้ 33%
  # ดูเหมือนผ่าน แต่ความจริงตกเพราะฟิสิกส์ไม่ถึง 30 — จึงต้องเช็ครายวิชา
  #
  # ช่องเงื่อนไขของ TPAT1 ในประกาศระบุแค่ว่าใช้คะแนนของวันสอบวันนั้นเท่านั้น
  # **ไม่มีเกณฑ์ขั้นต่ำของ TPAT1** จึงตั้งเป็น null ไม่ใช่ 30
  minimums:
    verified: true
    source: "ประกาศ กสพท ฉบับที่ 1 ปีการศึกษา 2569 ข้อ 4 (ช่องเงื่อนไข)"
    source_year: 2569
    tpat1_pct: null              # ประกาศไม่ได้กำหนดเกณฑ์ขั้นต่ำของ TPAT1
    alevel_each_subject_pct: 30.0   # A-Level ทุกวิชา ต้องได้ ≥ 30% ของคะแนนเต็ม
    english_pct: null            # ไม่มีเกณฑ์อังกฤษแยกต่างหาก (ใช้ 30% เท่าวิชาอื่น)

# ------------------------------------------------------- เวลาอ่านหนังสือ
study:
  # ชั่วโมงที่อ่านได้จริงต่อวัน (0 = วันหยุดพัก)
  hours_by_weekday:
    mon: 3.0
    tue: 3.0
    wed: 3.0
    thu: 3.0
    fri: 2.0
    sat: 6.0
    sun: 5.0

  # ความยาวหนึ่งบล็อกอ่าน (ชั่วโมง) — planner จะซอยตามนี้
  block_hours: 1.5

  # กันเวลาไว้ทบทวน (spaced repetition) กี่ % ของเวลาแต่ละวัน
  review_share: 0.25

  # ช่วงทบทวนหลังเรียนจบหัวข้อ (วัน) — SM-2 แบบย่อ
  review_intervals_days: [1, 3, 7, 16, 35]

  # เว้นวันพักเต็มวัน (ไม่จัดตาราง) — YYYY-MM-DD
  days_off: []

# ระดับความแม่น 0-100 ของแต่ละวิชา (อัปเดตอัตโนมัติจากผล quiz)
# ใช้เป็นค่าเริ่มต้นเมื่อยังไม่มีสถิติ
baseline_mastery: 35.0

# ---------------------------------------------------------------- quiz
quiz:
  questions_dir: "data/tcas/questions"
  default_count: 10
  # ถ้าตอบผิด ให้ดันกลับมาถามใหม่ในอีกกี่วัน (index 0 ของ review_intervals)
  reset_on_wrong: true

# ---------------------------------------------------------------- storage
storage:
  progress_file: "data/tcas/progress.json"

# ---------------------------------------------------------------- telegram
telegram:
  # อ่านจาก env: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
  # ไม่มี secret = dry-run (พิมพ์ข้อความออกจอเฉย ๆ)
  enabled: true
  parse_mode: "HTML"
