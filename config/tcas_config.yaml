# TCAS70 — ระบบเตรียมสอบแพทย์ (กสพท)
#
# ⚠️ ตัวเลขวันสอบ / เกณฑ์ขั้นต่ำ / สัดส่วนคะแนน ในไฟล์นี้ตั้งตามรูปแบบ TCAS68-69
#    ซึ่งเป็นค่าตั้งต้นที่สมเหตุสมผล แต่ **ต้องยืนยันกับประกาศจริงของ กสพท / ทปอ.
#    ปีการศึกษา 2570** (mytcas.com และเว็บ กสพท) ก่อนใช้ตัดสินใจจริง
#    ทุกค่าปรับได้จากไฟล์นี้ ไม่ต้องแก้โค้ด

student:
  name: "Napat"
  # ระดับชั้นปัจจุบัน (ใช้เตือนว่าเหลือเวลากี่เทอม)
  grade: "ม.6"
  # เป้าหมายอันดับ 1 (รหัสจาก config/tcas_programs.yaml)
  target_program: "cu_med"

# ---------------------------------------------------------------- ปฏิทินสอบ
# วันสอบ TCAS70 (ปีการศึกษา 2570 / สอบปลายปี 2569 - ต้นปี 2570)
# ⚠️ ประมาณการจากรูปแบบปีก่อน — ยืนยันกับ mytcas.com
exams:
  tgat_tpat:
    name: "TGAT / TPAT2-5 (คอมพิวเตอร์)"
    date: "2026-12-05"
    verified: false
  tpat1:
    name: "TPAT1 วิชาเฉพาะ กสพท (กระดาษ)"
    date: "2026-12-19"
    verified: false
  alevel:
    name: "A-Level ทุกวิชา"
    date: "2027-03-13"
    verified: false

# วันสมัคร/ยื่นคะแนนแต่ละรอบ (ใช้เตือนล่วงหน้า)
milestones:
  - date: "2026-08-15"
    label: "เปิดลงทะเบียน mytcas.com"
  - date: "2026-10-01"
    label: "สมัครสอบ TGAT/TPAT (รวม TPAT1 กสพท)"
  - date: "2026-11-01"
    label: "รอบ 1 Portfolio — ปิดรับสมัครหลายที่"
  - date: "2027-02-01"
    label: "รอบ 2 โควตา"
  - date: "2027-05-06"
    label: "รอบ 3 Admission — ยื่นคะแนน กสพท"
  - date: "2027-06-01"
    label: "รอบ 4 Direct Admission"

# ------------------------------------------------------------ เกณฑ์ กสพท
# น้ำหนักคะแนนรวม 100% : TPAT1 30% + A-Level 70%
# ตัวเลข alevel_split เป็น "สัดส่วนภายใน 70%" (รวมกันต้องได้ 100)
kaspot:
  tpat1_weight: 30.0
  alevel_weight: 70.0
  alevel_split:
    science: 40.0      # ฟิสิกส์ + เคมี + ชีววิทยา (เฉลี่ยเท่ากัน)
    math1: 20.0        # คณิตศาสตร์ประยุกต์ 1
    english: 20.0
    thai: 10.0
    social: 10.0

  # เกณฑ์ขั้นต่ำ — ต่ำกว่านี้ถือว่า "ตกเกณฑ์" ไม่ว่าคะแนนรวมจะสูงแค่ไหน
  # ⚠️ ยืนยันกับประกาศ กสพท ปี 70 (บางปีมีเกณฑ์อังกฤษสูงกว่าวิชาอื่น)
  minimums:
    tpat1_pct: 30.0          # TPAT1 รวม 3 พาร์ท ต้องได้ ≥ 30%
    alevel_each_group_pct: 30.0   # A-Level แต่ละกลุ่มสาระ ต้องได้ ≥ 30%
    english_pct: 30.0        # เกณฑ์เฉพาะภาษาอังกฤษ (ตั้ง 40 ถ้าประกาศกำหนด)

# ------------------------------------------------------- เวลาอ่านหนังสือ
study:
  # ชั่วโมงที่อ่านได้จริงต่อวัน (0 = วันหยุดพัก)
  hours_by_weekday:
    mon: 3.0
    tue: 3.0
    wed: 3.0
    thu: 3.0
    fri: 2.0
    sat: 6.0
    sun: 5.0

  # ความยาวหนึ่งบล็อกอ่าน (ชั่วโมง) — planner จะซอยตามนี้
  block_hours: 1.5

  # กันเวลาไว้ทบทวน (spaced repetition) กี่ % ของเวลาแต่ละวัน
  review_share: 0.25

  # ช่วงทบทวนหลังเรียนจบหัวข้อ (วัน) — SM-2 แบบย่อ
  review_intervals_days: [1, 3, 7, 16, 35]

  # เว้นวันพักเต็มวัน (ไม่จัดตาราง) — YYYY-MM-DD
  days_off: []

# ระดับความแม่น 0-100 ของแต่ละวิชา (อัปเดตอัตโนมัติจากผล quiz)
# ใช้เป็นค่าเริ่มต้นเมื่อยังไม่มีสถิติ
baseline_mastery: 35.0

# ---------------------------------------------------------------- quiz
quiz:
  questions_dir: "data/tcas/questions"
  default_count: 10
  # ถ้าตอบผิด ให้ดันกลับมาถามใหม่ในอีกกี่วัน (index 0 ของ review_intervals)
  reset_on_wrong: true

# ---------------------------------------------------------------- storage
storage:
  progress_file: "data/tcas/progress.json"

# ---------------------------------------------------------------- telegram
telegram:
  # อ่านจาก env: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
  # ไม่มี secret = dry-run (พิมพ์ข้อความออกจอเฉย ๆ)
  enabled: true
  parse_mode: "HTML"
